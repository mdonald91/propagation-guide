409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"ANPSA – Kennedia prostrata profile","url":"anpsa.org.au/plant_profiles/kennedia-prostrata/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Firm current season's growth strikes well.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Hot water + smoke water; about 8 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"lechenaultia-linarioides","sci":"Lechenaultia linarioides","common":"Yellow Leschenaultia","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species-specific cutting data found. Based on the genus, whose cuttings strike very easily.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Sprawling, open shrub to 1.5 m, with narrow, linear leaves."],["Flowering","Can flower in any month. Flowers yellow with red or pink tones, sometimes cream."],["Habitat","Sand (often over limestone) and sandy clay; sandplains, low dunes, ridges and winter-wet flats."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> (late summer to autumn) while it is warm. One grower reports roots in 4–6 weeks from late-February leschenaultia cuttings. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> tips. This species can flower in any month, so check each cutting and remove buds."],["Pre-treatment","• Strip leaves from the lower half (narrow leaves strip easily).<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Very free-draining – leschenaultias dislike wet roots."],["Environment","Humid frame, bottom heat, bright shade. Keep the mix moist, never wet."],["Expected strike time","About <b>4–6 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; water sparingly.<br/>• Tip-prune to counter the sprawling habit."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Lechenaultia<\/i> cuttings generally strike very easily; seed is difficult.","problems":[["Base rotting","Overwatering. Water less often; add coarse sand or perlite to the mix."],["Wilting in the frame","Material too soft or humidity too low. Use slightly firmer tips; keep the frame closed."],["Cuttings flowering","Remove buds; pick vegetative shoots."]],"other":"Seed – slow and unreliable. The Geraldton community nursery soaked seed in smoke water, saw germination at about 46 days, and kept trays for a second year. Division – some leschenaultias sucker; pot up rooted suckers.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Lechenaultia biloba profile (cuttings strike very easily; seed difficult)","url":"anpsa.org.au/plant_profiles/lechenaultia-biloba/"},{"title":"Better Homes and Gardens – fastest and easiest native plants to propagate (leschenaultia timing)","url":"bhg.com.au/how-to-propagate-natives"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Cuttings strike easily in this genus.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Slow; trays may need a second season.","guide":null},{"method":"Division","suitability":"Possible","note":"Some leschenaultias sucker – pot up rooted suckers.","guide":null}]},{"id":"leucophyta-brownii","sci":"Leucophyta brownii","common":"Cushion Bush","family":"Asteraceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"ANBG growing notes say semi-hardened cuttings are the preferred method; timing and details follow general daisy practice.","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May; Sep – Oct"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["-","P","B","B","B","P","-","P","B","B","P","-"],"snapshot":[["Habit","Compact, rounded shrub to about 1 m, densely covered in silvery-white woolly hairs."],["Flowering","Dec or Jan – Feb (small yellow button heads)."],["Habitat","Coastal foredunes and cliffs."],["Local note","Recorded in the Wanneroo LGA. Very salt-tolerant; grows poorly in high humidity."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, after flowering, and <b>Sep – Oct<\/b> as spring growth firms. Feb, Jun, Aug and Nov are workable. Avoid Dec – Jan (flowering and heat) and Jul (cold)."],["Wood type","<b>Semi-hardwood<\/b> – ANBG notes cuttings should come from semi-hardened branches."],["Cutting size","50–75 mm tip cuttings."],["Selecting material","Non-flowering tips from compact, healthy plants. Avoid soft, sappy growth."],["Pre-treatment","• Rub the small leaves off the lower half.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for firm tips; 3 g/L for firmer material."],["Propagation mix","Very free-draining – add extra coarse sand or perlite."],["Environment","<b>Keep it airy.<\/b> The woolly foliage rots in humidity: use a well-ventilated frame in bright light with little or no mist. Bottom heat helps. Keep the mix only just moist."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Harden off promptly and grow on in full sun.<br/>• Free-draining mix; never let pots sit wet – plants die easily if waterlogged.<br/>• Tip-prune for a dense cushion."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Cuttings are the preferred method; the main risk is rot from too much moisture or humidity.","problems":[["Cuttings turn grey-brown and mushy","Too humid or wet. Reduce mist, open the frame, improve airflow."],["Slow to root in winter","Use bottom heat, or wait for the autumn or spring window."],["Loses its dense shape","Tip-prune young plants."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Leucophyta brownii (semi-hardened cuttings; dislikes humidity)","url":"anbg.gov.au/gnp/interns-2014/leucophyta-brownii.html"},{"title":"ANPSA – Australian Daisies (perennial stem cuttings strike quickly; 3:1 sand:peat mix)","url":"anpsa.org.au/genera/daisies/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANBG growing notes give treatment and germination time; no nursery test data.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","Surface – light cover"],["Typical germination","Not recorded"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Compact, rounded shrub to about 1 m, densely covered in silvery-white woolly hairs."],["Flowering","Dec or Jan – Feb (small yellow button heads)."],["Habitat","Coastal foredunes and cliffs."],["Local note","Recorded in the Wanneroo LGA. Grows poorly in high humidity and dies easily if waterlogged."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the dry flower heads in late summer, once they turn brown and papery."],["Extraction & cleaning","Rub heads gently over a sieve to free the small seeds."],["Seed quality","Many florets may be empty – sow generously."],["Storage life","Not well documented. Sow in the first autumn after collection."],["Typical germination","Not recorded. ANBG notes seed germinates 10–30 days after sowing."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","<b>None needed<\/b> (ANBG)."],["Sowing depth & method","Surface-sow and cover very lightly with fine sand – daisy-family seed often needs light."],["After sowing","Water in with a fine spray; keep just moist. Good airflow."],["Germination time","About <b>10–30 days<\/b>."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off or too humid. Sow thinly, water less, more airflow."],["Seed buried too deep","Needs light. Surface-sow."],["Plants die in pots","Waterlogging. Very free-draining mix; don't overwater."]],"other":"Semi-hardened cuttings are the preferred method (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (annuals from seed, light, smoke and GA; perennial cuttings)","url":"anpsa.org.au/genera/daisies/"},{"title":"Australian National Botanic Gardens – Leucophyta brownii (no pre-treatment; 10–30 days)","url":"anbg.gov.au/gnp/interns-2014/leucophyta-brownii.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Semi-hardened cuttings are the preferred method.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"No pre-treatment; 10–30 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"macrozamia-fraseri","sci":"Macrozamia fraseri","common":"Sandplain Zamia","family":"Zamiaceae (cycads)","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific seed storage and germination research published in 2023. Germination figure is from the related <i>M. riedlei<\/i>.","facts":[["Pre-treatment","Remove fleshy coat; float test"],["Best sowing","Feb – Mar (fresh seed)"],["Sowing depth","Surface"],["Typical germination","~34% (related M. riedlei)"]],"calendar":["P","B","B","P","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Cycad with a trunk that can exceed 1 m. Male and female cones on separate plants (dioecious)."],["Flowering","Cones, not flowers. Seeds with a bright red fleshy coat are shed in late summer to early autumn."],["Habitat","Sand, in heath. Swan Coastal Plain and Geraldton Sandplains."],["Local note","Recorded in the Wanneroo LGA. <b>All parts, especially the seeds, are poisonous<\/b> – wear gloves, wash hands, and keep seed away from pets and stock."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fallen seed, or seed from cones as they break apart, in <b>late summer to early autumn<\/b> (February in the 2023 study)."],["Extraction & cleaning","Remove the red fleshy coat (sarcotesta). Researchers used a cement mixer with water and 10–30 mm aggregate; small lots can be scrubbed by hand in gloves."],["Seed quality","<b>Float test:<\/b> soak in water for about 5 minutes – seeds that sink are viable; floaters are dead."],["Storage life","<b>Short – sow fresh.<\/b> Seeds are shed moist (about 46% moisture) with an unfinished embryo. Standard cold, dry seed-bank storage (5°C, ~20% RH) damages them: viability was still over 50% at about 6 months but fell to 0–29% after 30+ months."],["Typical germination","No figure for this species. The related <i>M. riedlei<\/i> averaged about <b>34%<\/b> untreated in Alcoa tests (10 tests). Seeds are large – sow individually."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>As soon as seed is cleaned<\/b> – usually Feb – Mar. Jan and Apr – May are workable."],["Seed mix","Coarse, free-draining, sand-based mix in <b>deep containers<\/b> – cycads have a long root."],["Pre-treatment","None beyond removing the fleshy coat and float testing."],["Sowing depth & method","<b>Surface-sow:<\/b> lay seeds on the mix and press them in slightly; don't bury. Sow one seed per deep tube or pot, or in deep trays."],["After sowing","Keep outdoors under natural temperatures and rainfall, as the researchers recommend. Water lightly in dry spells – avoid heavy irrigation."],["Germination time","Slow. The embryo keeps developing after the seed falls; the first root appears after about 5 months and full germination takes <b>more than 12 months<\/b>."],["Pricking out","Avoid if possible – sow direct into deep containers. If tray-sown, pot each seed on once its root appears, keeping the root intact."],["Shade house & hardening","Grow on in light shade and harden off to full sun over several weeks once the first leaf is firm."],["Time to planting size","Very slow – allow 1–2 years or more from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seed rots","Too wet, or damaged when the fleshy coat was removed. Water lightly; handle gently."],["No sign of life after 6 months","Normal – germination takes over a year. Keep trays going."],["Poor results from stored seed","Seed dried or cold-stored. Sow fresh, within a few months of collection."]],"other":"Poisonous: label trays clearly and keep seed and seedlings out of reach of children, pets and stock.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Conservation Physiology (2023) – Are current seed storage approaches suitable for Macrozamia fraseri?","url":"academic.oup.com/conphys/article/11/1/coad096/7471550"},{"title":"Wikipedia – Macrozamia fraseri (description, distribution, toxicity)","url":"en.wikipedia.org/wiki/Macrozamia_fraseri"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Cycad – no cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Sow fresh seed; takes over a year to germinate.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Not documented.","guide":null}]},{"id":"melaleuca-huegelii","sci":"Melaleuca huegelii","common":"Chenille Honeymyrtle","family":"Myrtaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"Based on ANPSA <i>Melaleuca<\/i> genus guidance – cuttings are reliable in the genus.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["P","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Shrub or small tree, 0.5–5 m."],["Flowering","Sep – Dec or Jan (pink, white or pink-purple)."],["Habitat","Sand; limestone cliffs, coastal plains and dunes."],["Local note","Recorded in Joondalup and Wanneroo. Cuttings keep a chosen flower colour."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b>, after flowering, once new growth has firmed. Jan, May and Dec are workable. Avoid Jun – Nov."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm (ANPSA)."],["Selecting material","Non-flowering tips. Take from a plant with the flower colour you want."],["Pre-treatment","• Strip leaves from the lower half to two-thirds.<br/>• Wound the base on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Typically <b>4–8 weeks<\/b> in warm weather. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; tip-prune for bushiness."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> Melaleucas are generally reliable from cuttings.","problems":[["Callus, no roots","Trim and re-set; lower the hormone strength next batch."],["Leaves drop in the frame","Too dry or too hot. Shade more and keep humidity steady."],["Base rotting","Mix too wet. Water less."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Melaleuca genus page (75–100 mm cuttings, strip, wound, hormone)","url":"anpsa.org.au/genera/melaleuca/"}]},"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data, WA community-nursery method and ANPSA genus notes agree.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","58%"],["Seed per 100 plants","0.1 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Shrub or small tree, 0.5–5 m."],["Flowering","Sep – Dec or Jan (pink, white or pink-purple)."],["Habitat","Sand; limestone cliffs, coastal plains and dunes."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed stays in the woody capsules indefinitely, so capsules can be collected at any time. Use capsules <b>at least 12 months old<\/b>."],["Extraction & cleaning","Place capsules in an open container somewhere warm; fine seed is released in 2–3 days."],["Seed quality","Extremely fine seed with chaff; no need to separate."],["Storage life","<b>Long<\/b> if kept dry and cool; seed also keeps on the plant in closed capsules."],["Typical germination","About <b>58%<\/b> (untreated, Alcoa nursery average). About <b>775 seedlings per gram<\/b> – a pinch is plenty."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix with dry, sterile yellow sand and sprinkle from a spice jar. <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist (Geraldton), or stand pots in a saucer of water until germination (bog method)."],["Germination time","About <b>9 days<\/b> at Geraldton; 14–30 days is typical for the genus."],["Pricking out","When the second pair of leaves appears. Handle tiny seedlings by the leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings too crowded","Dilute seed more with sand."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix. Thin sowing, airflow."]],"other":"Cuttings are also reliable if a particular form is wanted.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Reliable in this genus; keeps a chosen form.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Surface-sow fine seed; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"melaleuca-systena","sci":"Melaleuca systena","common":"Coastal Honeymyrtle","family":"Myrtaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"Based on ANPSA <i>Melaleuca<\/i> genus guidance – cuttings are reliable in the genus.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Jan; Apr – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","P","P","B","B","P","-","-","-","-","P","B"],"snapshot":[["Habit","Erect to spreading shrub, usually 0.5–2 m."],["Flowering","Feb – Mar or Aug – Dec (yellow-cream)."],["Habitat","Sand over laterite or limestone; stabilised coastal dunes and rocky limestone."],["Local note","Recorded in Joondalup and Wanneroo. Seed germination is low (about 14% in nursery tests), so cuttings are worth using."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Jan<\/b> and <b>Apr – May<\/b> – the gaps between its two flowering periods. Feb – Mar, Jun and Nov are workable with non-flowering shoots. Avoid Jul – Oct."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm (ANPSA)."],["Selecting material","Non-flowering tips from healthy plants."],["Pre-treatment","• Strip leaves from the lower half to two-thirds.<br/>• Wound the base on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat. Autumn batches root more slowly."],["Expected strike time","Typically <b>4–8 weeks<\/b> in warm weather; longer in May. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> Melaleucas are generally reliable from cuttings.","problems":[["Callus, no roots","Trim and re-set; lower the hormone strength next batch."],["Cuttings flower","Taken from flowering shoots. Use non-flowering tips, between flowering periods."],["Base rotting","Mix too wet. Water less."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Melaleuca genus page (75–100 mm cuttings, strip, wound, hormone)","url":"anpsa.org.au/genera/melaleuca/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Few nursery tests (3); WA community-nursery method and ANPSA genus notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","14%"],["Seed per 100 plants","0.3 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Erect to spreading shrub, usually 0.5–2 m."],["Flowering","Feb – Mar or Aug – Dec (yellow-cream)."],["Habitat","Sand over laterite or limestone; stabilised coastal dunes and rocky limestone."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect capsules at least 12 months old from older stems at any time; seed is retained in closed capsules."],["Extraction & cleaning","Place capsules somewhere warm in an open container; seed is released in 2–3 days."],["Seed quality","Fine seed with chaff. Germination in nursery tests was low – sow generously."],["Storage life","<b>Long<\/b> if kept dry and cool."],["Typical germination","About <b>14%<\/b> (untreated, Alcoa average of only 3 tests). About <b>301 seedlings per gram<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix with dry sand and sprinkle from a spice jar. <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist, or use the bog method."],["Germination time","About <b>7 days<\/b> at Geraldton; allow up to 4 weeks."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Empty or old seed. Use older capsules (12+ months) from vigorous plants; sow more."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix."]],"other":"Cuttings are a reliable alternative for this genus.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Reliable in this genus; a good option given low seed germination.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Surface-sow fine seed; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"myoporum-insulare","sci":"Myoporum insulare","common":"Blueberry Tree / Common Boobialla","family":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree it strikes readily from firm young growth.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Dense, low spreading to erect shrub or small tree, 0.25–5 m, with thick, fleshy leaves."],["Flowering","Jul – Dec, also Jan – Feb (white, purple-spotted), followed by purple berries."],["Habitat","White or grey sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Forms range from prostrate to tree-like – take cuttings from a plant with the form you want."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the main flowering. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b> – firm young growth."],["Cutting size","75–100 mm."],["Selecting material","Firm, <b>non-flowering<\/b> young shoots from a stock plant with the growth form you need (prostrate for groundcover, erect for screening)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Reduce the remaining thick leaves by about one-third.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>). Strikes readily without it, but hormone gives faster, more even rooting."],["Propagation mix","Standard sand/coir cutting mix."],["Environment","Standard humid frame with bottom heat. Hairless leaves tolerate normal misting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Fast-growing – pot on promptly before roots circle.<br/>• Tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy.<\/b> Firm young growth roots readily; even branchlets placed straight into soil can strike.","problems":[["Leaf drop in the frame","Too dark or too wet. Give brighter shade and water less."],["Roots circling in tubes","Pot on sooner – it grows quickly."],["Plants not the expected shape","Seed-grown or mixed stock. Propagate from a known-form stock plant."]],"other":"Seed – the Geraldton community nursery ferments ripe (darkest purple) berries for 4–5 days, washes off the pulp and soaks in smoke water; germination took 15–30 days. Seedlings vary in form.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Australian National Botanic Gardens – Myoporum insulare","url":"anbg.gov.au/gnp/interns-2010/myoporum-insulare.html"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method available; no nursery test data.","facts":[["Pre-treatment","Ferment berries; smoke-water soak"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","Not recorded"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Dense, low spreading to erect shrub or small tree, 0.25–5 m, with thick, fleshy leaves."],["Flowering","Jul – Dec, also Jan – Feb (white, purple-spotted), followed by purple berries."],["Habitat","White or grey sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Forms range from prostrate to tree-like; seedlings vary."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pick the <b>darkest purple<\/b>, fully ripe berries."],["Extraction & cleaning","<b>Ferment:<\/b> soak the berries in water for 4–5 days, then wash off the pulp through a sieve and dry the stones."],["Seed quality","Hard stones; cut-test a few to check they are filled."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","After fermenting, <b>soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method)."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow in trays or 2–3 stones per tube."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>15–30 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Unripe berries or pulp left on. Use the darkest berries and ferment fully."],["Mould on trays","Pulp residue. Wash stones well before sowing."],["Plants not the form you wanted","Seedlings vary. Use cuttings for a particular form."]],"other":"Cuttings are the main method and keep the parent's form (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Firm young growth roots readily.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Ferment berries, smoke water; 15–30 days. Seedling form varies.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"nuytsia-floribunda","sci":"Nuytsia floribunda","common":"WA Christmas Tree / Moodjar","family":"Loranthaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (6 tests) and grower methods published; host-plant research available. Germinating seed is easy – keeping seedlings alive is the hard part.","facts":[["Pre-treatment","None – sow fresh"],["Best sowing","Feb – Apr (fresh seed)"],["Sowing depth","Surface, upright"],["Typical germination","29%"],["Seed per 100 plants","2.4 g"]],"calendar":["P","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Tree or shrub to 10 m. A <b>root parasite<\/b> – it taps the roots of nearby plants for water and nutrients."],["Flowering","Oct – Dec or Jan (brilliant yellow-orange)."],["Habitat","Sand, sandy loam, gravel over clay, granite, laterite and limestone; sandplains and slopes."],["Local note","Recorded in the Wanneroo LGA. Takes about 7–10 years to flower from seed."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the papery winged seed as it matures on the tree, within a few weeks of flowering."],["Extraction & cleaning","Little cleaning needed – remove twigs and old flower parts."],["Seed quality","Use freshly collected seed."],["Storage life","Not well documented. Growers rely on fresh seed – sow as soon as it is collected."],["Typical germination","About <b>29%<\/b> (untreated, Alcoa nursery average, 6 tests). About <b>41 seedlings per gram<\/b> – roughly 2.4 g of seed per 100 seedlings. Most growers find fresh seed easy to germinate."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>As soon as seed is collected<\/b> – usually Feb – Apr. Jan, May and Dec are workable."],["Seed mix","Standard sterile native seed mix. <b>No fertiliser<\/b> – it is adapted to poor soils."],["Pre-treatment","None."],["Sowing depth & method","Stand the papery seed <b>upright on the surface<\/b> of the mix and keep moist."],["After sowing","Keep moist, not wet (about 18–22°C suits it)."],["Germination time","About <b>10–35 days<\/b>."],["Pricking out","Move seedlings into forestry tubes to grow on, then pot each into a pot <b>with a host plant<\/b> once big enough. Hosts that have worked: dichondra, native grasses, kangaroo paw, even carrot seedlings; research found <i>Acacia<\/i> hosts passed nitrogen to the seedlings."],["Shade house & hardening","Grow on in light shade with the host, then harden off gradually to full sun."],["Time to planting size","Slow and unpredictable – allow 12 months or more (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings stall or die after a year or two","No host, or a poor one. Pot up with a host plant early."],["Poor germination","Old seed. Sow fresh."],["Yellowing after feeding","Fertiliser. Don't feed."]],"other":"Growers warn tube stock is hard to produce – set more than you need and plant out with a nearby host. It can also parasitise underground cables and pipes, so choose planting sites with care.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"The Wetlands Centre Cockburn – Growing Moodjar (Nuytsia floribunda): fresh seed, upright sowing, host plants","url":"thewetlandscentre.org.au/blog/growing-moodjar/"},{"title":"ANPSA – Nuytsia floribunda profile (seed and cuttings; plants rarely survive without a host)","url":"anpsa.org.au/plant_profiles/nuytsia-floribunda/"},{"title":"Calladine A. et al. (2000) Annals of Botany 85 – host plants for Nuytsia floribunda seedlings","url":"sciencedirect.com/science/article/abs/pii/S0305736400911296"},{"title":"Kings Park Guides – The West Australian Christmas Tree (suckering; 7–10 years to flower)","url":"kingsparkguides.com.au"},{"title":"The Seed Collection – WA Christmas Tree (germination 10–35 days at 18–22°C; pot with a host)","url":"theseedcollection.com.au/western-australian-christmas-tree"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Reported to strike, but plants rarely survive without a host.","guide":null},{"method":"Seed","suitability":"Main method","note":"Fresh seed germinates readily; seedlings need a host plant.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Old trees sucker from the roots; not a nursery method.","guide":null}]},{"id":"olearia-axillaris","sci":"Olearia axillaris","common":"Coastal Daisybush","family":"Asteraceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"ANPSA: stem cuttings of most perennial Australian daisies strike quickly from vigorous growth.","facts":[["Wood type","Semi-hardwood"],["Best months","Aug – Oct"],["Cutting length","75–100 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["-","-","P","P","-","-","P","B","B","B","P","-"],"snapshot":[["Habit","Erect, much-branched grey shrub, 0.2–3 m."],["Flowering","Jan – Jul or Nov – Dec (small white to yellow daisies)."],["Habitat","White, grey or red sand and loam; coastal limestone, sand dunes and rocky hillsides."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Aug – Oct<\/b>, on vigorous spring growth between flowering periods. Mar – Apr, Jul and Nov are workable with non-flowering shoots. Avoid Dec – Feb and May – Jun."],["Wood type","<b>Semi-hardwood<\/b> – vigorous current growth that has begun to firm."],["Cutting size","75–100 mm."],["Selecting material","Vigorous, healthy, non-flowering shoots (ANPSA)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for softer tips; 3 g/L for firmer material."],["Propagation mix","Free-draining: about 3 parts sand to 1 part peat or coir (ANPSA daisy mix)."],["Environment","Humid frame, bright shade, bottom heat. The grey, hairy leaves rot if kept wet – mist lightly."],["Expected strike time","Usually quick – check from about 3–4 weeks."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; tip-prune for a compact plant."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> Perennial daisies usually strike quickly and easily.","problems":[["Leaves go grey-brown and soft","Too wet or humid. Mist less, improve airflow."],["Cuttings flower","Taken from flowering shoots. Use vigorous non-flowering growth."],["Leggy plants","Too much shade. Move to full sun after hardening off."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Australian Daisies (perennial stem cuttings strike quickly; 3:1 sand:peat mix)","url":"anpsa.org.au/genera/daisies/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery data and a detailed WA community-nursery method available.","facts":[["Pre-treatment","Air-dry 3 months; smoke water"],["Best sowing","Aug – Sep"],["Sowing depth","Surface"],["Typical germination","21%"],["Seed per 100 plants","1.4 g"]],"calendar":["-","-","P","P","P","P","P","B","B","P","-","-"],"snapshot":[["Habit","Erect, much-branched grey shrub, 0.2–3 m."],["Flowering","Jan – Jul or Nov – Dec (small white to yellow daisies)."],["Habitat","White, grey or red sand and loam; coastal limestone, sand dunes and rocky hillsides."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed usually ripens around <b>April – May<\/b>, but plants can set seed about <b>6 weeks after a big rain<\/b>, so watch for opportunistic crops (e.g. after summer storms)."],["Extraction & cleaning","Collect the fluffy seed heads into paper bags."],["Seed quality","Germination in nursery tests was moderate (about 21%)."],["Storage life","<b>Short – needs fresh seed each year.<\/b> Seed must be <b>aired for about 3 months<\/b> before storing or sowing."],["Typical germination","About <b>21%<\/b> (untreated, Alcoa nursery average). About <b>73 seedlings per gram<\/b> – roughly 1.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Aug – Sep<\/b> – about 3 months after an autumn collection. Mar – Jul and Oct workable depending on when seed was collected. Avoid Nov – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Air the seed for about 3 months after collection. Water trays with smoke water after sowing (Geraldton method)."],["Sowing depth & method","<b>Sow on the surface<\/b> and press in lightly – daisy-family seed often needs light to germinate."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>7–16 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Old seed or not aired. Use this season's seed, aired for 3 months."],["Seed buried too deep","Needs light. Surface sow."],["Leggy seedlings","Too much shade. Move to full sun sooner."]],"other":"Also strikes readily from cuttings.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Perennial daisies strike quickly from vigorous growth.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Fresh seed, aired 3 months; surface-sow.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"petrophile-linearis","sci":"Petrophile linearis","common":"Pixie Mops","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery tests show very low untreated germination; method follows WA Petrophile seed notes.","facts":[["Pre-treatment","Remove hairs, nick coat; smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","<1% untreated"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect shrub, 0.2–1 m."],["Flowering","Aug – Dec (pink and white ‘mops’)."],["Habitat","White, grey or yellow sand, often over laterite; sandplains."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones are usually ripe about <b>six months after flowering<\/b>, when they turn grey to grey-brown and lose their old floral parts."],["Extraction & cleaning","Seed does not come out easily in <i>Petrophile<\/i> – you may need to pull the hairy nuts out of the cone with forceps."],["Seed quality","Very low germination untreated (0.17% in Alcoa tests). Many nuts may be empty – cut-test."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Untreated: <b>under 1%<\/b> (Alcoa, 6 tests). Treated seed should do much better – record your results."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool autumn). Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>Remove the hairs and nick a small section of the seed coat<\/b> to reveal the white seed (without damaging it). Smoke water (24 h soak) may also help."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes to avoid root damage."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","Can take <b>several months<\/b> – keep trays going."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–8 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not nicked, or empty seed. Nick carefully; cut-test."],["Seed damaged by nicking","Cut too deep. Remove just enough coat to see white seed."],["Seedlings die in pots","Phosphorus toxicity or root rot. Low-P mix and fertiliser."]],"other":"A slow, fiddly species from seed – set larger batches and keep good records.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 18 – Isopogon and Petrophile. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02005.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Difficult","note":"Nick the seed coat; slow.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"petrophile-macrostachya","sci":"Petrophile macrostachya","common":"","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No species data found. Method based on WA Petrophile seed notes and <i>P. linearis<\/i> results – trial protocol.","facts":[["Pre-treatment","Remove hairs, nick coat; smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","Not recorded"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, compact or spreading, prickly shrub, 0.3–1.2 m."],["Flowering","Jul – Nov (yellow-cream)."],["Habitat","White or yellow-brown sand and gravel; sandplains."],["Local note","Recorded in the Wanneroo LGA. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones are usually ripe about six months after flowering, when grey to grey-brown and the old floral parts have gone."],["Extraction & cleaning","Pull the hairy nuts from the cones with forceps."],["Seed quality","Cut-test a sample – expect many empty nuts."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded. Expect low germination unless the seed coat is treated."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, low-phosphorus mix."],["Pre-treatment","Remove the hairs and nick a small section of the seed coat; smoke water may also help."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","Can take <b>several months<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–8 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not nicked, or empty seed."],["Seed damaged by nicking","Cut less deeply."],["Seedlings die in pots","Phosphorus toxicity or root rot."]],"other":"Treat as a trial – record results so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 18 – Isopogon and Petrophile. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02005.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Difficult","note":"Nick the seed coat; slow (trial).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"phyllanthus-calycinus","sci":"Phyllanthus calycinus","common":"False Boronia","family":"Phyllanthaceae","alt":"Current WA Herbarium name: <i>Lysiandra calycina<\/i>","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Treat as a trial protocol and record results.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["P","B","B","B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Small erect shrub, 0.2–1.2 m, with smooth branchlets."],["Flowering","Jun – Dec or Jan (white-cream to pink). Sepals enlarge to enclose the fruit."],["Habitat","Usually sandy soils, including coastal alkaline sands."],["Name note","FloraBase now lists this plant as <i>Lysiandra calycina<\/i>; many nurseries still sell it as <i>Phyllanthus calycinus<\/i>. Kept under <i>Phyllanthus<\/i> here to match your plant list."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the long flowering season ends. Jan and May are workable. Avoid Jun – Dec (flowering, and cool in winter)."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>); trial 1.5 g/L (<b>Clonex Green<\/b>) on softer tips."],["Propagation mix","Free-draining sand-based mix."],["Environment","Standard humid frame, bottom heat, bright shade."],["Expected strike time","Not documented – start checking from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> No cutting data found for this species; the rating is a cautious starting point.","problems":[["No roots after 10+ weeks","Try a different hormone strength or timing on the next batch; record what you tried."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering shoots only."]],"other":"Seed – the method most guides mention; use fresh seed. Few published details on pre-treatment.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Geographe Community Landcare Nursery – Phyllanthus calycinus (Lysiandra calycina)","url":"gcln.org.au/product/phyllanthus-calycinus/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Trial","note":"No published cutting data; trial protocol.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Fresh seed is recommended; little published detail.","guide":null},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"pithocarpa-cordata","sci":"Pithocarpa cordata","common":"Tangle Daisy","family":"Asteraceae","alt":"Previously <i>Ozothamnus cordatus<\/i> / <i>Helichrysum cordatum<\/i>","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Low","confidence_note":"No published propagation data. Based on perennial Australian daisies, which usually strike quickly – trial protocol.","facts":[["Wood type","Semi-hardwood tips"],["Best months","Sep – Nov; May"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["-","-","-","P","B","P","-","P","B","B","B","P"],"snapshot":[["Habit","Scrambling, tangled shrub, 1–2 m, with small heart-shaped leaves."],["Flowering","Jan – Apr (white to yellow)."],["Habitat","Coastal limestone and dunes."],["Local note","Recorded in the Wanneroo LGA. Older books list it as <i>Ozothamnus cordatus<\/i> or <i>Helichrysum cordatum<\/i>."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b> on vigorous spring growth, and <b>May<\/b> after flowering. Apr, Jun, Aug and Dec are workable. Avoid Jan – Mar (flowering and heat) and Jul (cold)."],["Wood type","<b>Semi-hardwood tips<\/b> – vigorous growth that has started to firm."],["Cutting size","50–75 mm."],["Selecting material","Vigorous, healthy, non-flowering shoots."],["Pre-treatment","• Strip leaves from the lower half.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>); 3 g/L for firmer stems."],["Propagation mix","Free-draining: about 3 parts sand to 1 part peat or coir."],["Environment","Humid frame, bright shade, bottom heat. Moist, not wet."],["Expected strike time","Not documented – check from about 3–4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; tip-prune to control the scrambling habit."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Most perennial daisies strike quickly from vigorous growth, but this species is untested. Start with a trial batch.","problems":[["Cuttings rot","Too wet or humid. Mist less, improve airflow."],["No roots after 8 weeks","Try firmer tips, a stronger hormone, or a different season, and record the result."],["Tangled, sprawling tubes","Tip-prune and space tubes."]],"other":"Seed – not documented. Daisy-family seed often needs light, so surface-sow if trialling.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (perennial stem cuttings strike quickly; 3:1 sand:peat mix)","url":"anpsa.org.au/genera/daisies/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Perennial daisy – expected to strike well (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Not documented; daisy seed often needs light.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"podotheca-gnaphalioides","sci":"Podotheca gnaphalioides","common":"Golden Long-heads","family":"Asteraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (8 tests); sowing follows standard practice for annual everlastings.","facts":[["Pre-treatment","Smoke water (optional)"],["Best sowing","Apr – May"],["Sowing depth","Surface – light cover"],["Typical germination","7%"],["Seed per 100 plants","1.2 g"]],"calendar":["-","-","P","B","B","P","-","-","-","-","-","-"],"snapshot":[["Habit","Annual herb, 0.02–0.6 m."],["Flowering","Aug – Nov (golden-yellow, long narrow heads)."],["Habitat","Sandy soils."],["Local note","Recorded in Joondalup and Wanneroo. An annual – it flowers the spring after sowing, then dies."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect heads in late spring–early summer once they dry and the fluffy seed starts to lift."],["Extraction & cleaning","Rub heads gently over a sieve. The seed can be sown with its fluff."],["Seed quality","Germination in nursery tests was low (about 7%) – sow generously."],["Storage life","Store dry and cool and sow the following autumn."],["Typical germination","About <b>7%<\/b> (untreated, Alcoa nursery average, 8 tests). About <b>84 seedlings per gram<\/b> – roughly 1.2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b>, after the first autumn rains. Mar and Jun are workable. Later sowings flower poorly."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","None required. Smoke water in the first watering may help (it helps many annual daisies)."],["Sowing depth & method","Surface-sow and cover very lightly – daisy seed often needs light. Sowing a pinch straight into each tube or cell avoids pricking out."],["After sowing","Water in with a fine spray; keep moist."],["Germination time","About <b>2–4 weeks<\/b>."],["Pricking out","If tray-sown, prick out small, at the second-leaf stage. Thin direct-sown cells to 1–3 seedlings."],["Shade house & hardening","Short – a week or so in the shade house, then full sun."],["Time to planting size","Plant out small, about <b>6–10 weeks<\/b> after sowing, so plants establish in winter and flower in spring."]]}],"difficulty_note":"","problems":[["Very low germination","Normal for this species. Sow thickly; try smoke water."],["Leggy seedlings","Too much shade. Move to full sun early."],["Plants flower in the tube","Held too long. Plant out while small."]],"other":"Often direct-seeded into revegetation sites after the first autumn rains.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (annuals from seed, light, smoke and GA; perennial cuttings)","url":"anpsa.org.au/genera/daisies/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Annual.","guide":null},{"method":"Seed","suitability":"Main method","note":"Annual everlasting – sow after the first autumn rains.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Annual.","guide":null}]},{"id":"ptilotus-drummondii","sci":"Ptilotus drummondii","common":"Narrowleaf Mulla Mulla","family":"Amaranthaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery test data (29 tests) show low untreated germination; treatment is based on research with <i>P. exaltatus<\/i>.","facts":[["Pre-treatment","Remove woolly floral parts; smoke"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","4%"],["Seed per 100 plants","8.4 g"]],"calendar":["-","P","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Perennial herb, 0.05–0.8 m."],["Flowering","Mar, May and Jul – Dec (white, cream or pink woolly spikes)."],["Habitat","Sandy soils."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed is held inside the woolly flowers. Collect spikes when the flowers are <b>papery and very dry<\/b> and rub off easily."],["Extraction & cleaning","Rub spikes over a sieve to separate the individual flowers – each holds at most one seed."],["Seed quality","Many flowers are empty. Check a few by rubbing off the wool."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Untreated: about <b>4%<\/b> (Alcoa, 29 tests), about 12 seedlings per gram of whole flowers. In the related <i>P. exaltatus<\/i>, removing the woolly floral parts raised germination to 60–80%."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Feb and Jun – Sep are workable. Avoid Oct – Jan."],["Seed mix","Standard sterile seed mix, extra free-draining."],["Pre-treatment","<b>Remove the woolly floral parts<\/b> by rubbing the flowers gently on a sieve or between rough boards to free the seed. Heat and cold treatments did not help in <i>P. exaltatus<\/i>. Water in with smoke water (Geraldton method for <i>Ptilotus<\/i>)."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>. Sow cleaned seed thinly, or 2–3 seeds direct into tubes."],["After sowing","Keep just moist – <i>Ptilotus<\/i> rot easily if wet or humid."],["Germination time","About <b>6–10 days<\/b> for other <i>Ptilotus<\/i> at Geraldton; untreated seed is slow and erratic."],["Pricking out","Early and carefully, at the first true leaves – or sow direct into tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Wool left on, or empty flowers. Clean the seed; sow more."],["Seedlings collapse","Too wet. Water less; good drainage and airflow."],["Plants short-lived in pots","Humidity and wet mix. Full sun, very free-draining mix."]],"other":"Cuttings have been successful in the genus (ANPSA) – worth trialling from non-flowering shoots.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Scientia Horticulturae (1989) – Cultivation of the pink mulla mulla, Ptilotus exaltatus. 1. Seed germination and dormancy","url":"sciencedirect.com/science/article/abs/pii/0304423889901192"},{"title":"ANPSA – Ptilotus exaltatus profile (seed slow and unreliable; cuttings successful)","url":"anpsa.org.au/plant_profiles/ptilotus-exaltatus/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Cuttings have worked in the genus; not documented for this species.","guide":null},{"method":"Seed","suitability":"Main method","note":"Remove the woolly floral parts to lift germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"ptilotus-manglesii","sci":"Ptilotus manglesii","common":"Pom Poms","family":"Amaranthaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery test data (11 tests) show low untreated germination; treatment is based on research with <i>P. exaltatus<\/i>.","facts":[["Pre-treatment","Remove woolly floral parts; smoke"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","3%"],["Seed per 100 plants","18 g"]],"calendar":["-","P","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Low perennial herb, 0.05–0.3 m."],["Flowering","Sep – Dec or Jan (pink to magenta pom-pom heads)."],["Habitat","Sandy and gravelly soils."],["Local note","Recorded in Joondalup and Wanneroo. Showy, but often short-lived in cultivation."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect heads when the flowers are <b>papery and very dry<\/b> (early summer)."],["Extraction & cleaning","Rub heads over a sieve to separate the individual flowers."],["Seed quality","Many flowers are empty. Check a few by rubbing off the wool."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Untreated: about <b>3%<\/b> (Alcoa, 11 tests), about 6 seedlings per gram of whole flowers. Removing the woolly floral parts raised germination to 60–80% in the related <i>P. exaltatus<\/i>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Feb and Jun – Sep are workable. Avoid Oct – Jan."],["Seed mix","Standard sterile seed mix, extra free-draining."],["Pre-treatment","<b>Remove the woolly floral parts<\/b> to free the seed, then water in with smoke water after sowing."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>. Sow cleaned seed thinly, or direct into tubes."],["After sowing","Keep just moist; good airflow."],["Germination time","About <b>6–10 days<\/b> for other <i>Ptilotus<\/i> at Geraldton; untreated seed is slow and erratic."],["Pricking out","Early and carefully, at the first true leaves – or sow direct into tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Wool left on, or empty flowers. Clean the seed; sow more."],["Seedlings collapse","Too wet. Water less; improve drainage."],["Plants die after potting on","Overwatering or humidity. Full sun, free-draining mix."]],"other":"Cuttings have been successful in the genus (ANPSA) – worth trialling.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Scientia Horticulturae (1989) – Cultivation of the pink mulla mulla, Ptilotus exaltatus. 1. Seed germination and dormancy","url":"sciencedirect.com/science/article/abs/pii/0304423889901192"},{"title":"ANPSA – Ptilotus exaltatus profile (seed slow and unreliable; cuttings successful)","url":"anpsa.org.au/plant_profiles/ptilotus-exaltatus/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Cuttings have worked in the genus; not documented for this species.","guide":null},{"method":"Seed","suitability":"Main method","note":"Remove the woolly floral parts to lift germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"ptilotus-polystachyus","sci":"Ptilotus polystachyus","common":"Prince of Wales Feather","family":"Amaranthaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No species data found. Method follows other <i>Ptilotus<\/i> and research with <i>P. exaltatus<\/i> – trial protocol.","facts":[["Pre-treatment","Remove woolly floral parts; smoke"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","Not recorded"]],"calendar":["-","P","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Annual or short-lived perennial herb, 0.15–1.5 m."],["Flowering","May – Nov or Jan (green, white or yellow feathery spikes)."],["Habitat","Sandy soils."],["Local note","Recorded in the Perth area (Queens Park). Short-lived – sow each year."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect spikes when the flowers are papery and very dry and rub off easily."],["Extraction & cleaning","Rub spikes over a sieve to separate the individual flowers."],["Seed quality","Expect many empty flowers – check a few."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded. Untreated <i>Ptilotus<\/i> seed usually germinates poorly."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Feb and Jun – Sep are workable."],["Seed mix","Standard sterile seed mix, extra free-draining."],["Pre-treatment","<b>Remove the woolly floral parts<\/b> to free the seed; water in with smoke water."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>, or sow direct into tubes."],["After sowing","Keep just moist; good airflow."],["Germination time","About <b>6–10 days<\/b> for other <i>Ptilotus<\/i>; record your own."],["Pricking out","Early and carefully, or sow direct into tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Wool left on, or empty flowers."],["Seedlings collapse","Too wet. Water less."],["Weak, floppy plants","Too much shade. Full sun."]],"other":"Treat as a trial and record results so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Scientia Horticulturae (1989) – Cultivation of the pink mulla mulla, Ptilotus exaltatus. 1. Seed germination and dormancy","url":"sciencedirect.com/science/article/abs/pii/0304423889901192"},{"title":"ANPSA – Ptilotus exaltatus profile (seed slow and unreliable; cuttings successful)","url":"anpsa.org.au/plant_profiles/ptilotus-exaltatus/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Cuttings have worked in the genus; not documented for this species.","guide":null},{"method":"Seed","suitability":"Main method","note":"Remove the woolly floral parts to lift germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Annual or short-lived.","guide":null}]},{"id":"rhagodia-baccata","sci":"Rhagodia baccata","common":"Berry Saltbush","family":"Amaranthaceae (chenopods)","alt":"Also listed as <i>Chenopodium baccatum<\/i>","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Method follows related saltbushes – trial protocol.","facts":[["Wood type","Semi-hardwood tips"],["Best months","Sep – Nov"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["P","P","P","-","-","-","-","P","B","B","B","P"],"snapshot":[["Habit","Spreading shrub, 0.3–2 m, with grey-green leaves."],["Flowering","Variable – Feb, Apr – May or Oct – Dec (tiny), followed by red berries eaten by birds and bobtails."],["Habitat","Sand dunes and coastal rock."],["Local note","Recorded in Joondalup and Wanneroo. Salt-tolerant; a breeding plant for the saltbush blue butterfly."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b>, in active spring growth. Aug and Dec – Mar are workable with non-flowering shoots. Avoid Apr – Jul."],["Wood type","<b>Semi-hardwood tips<\/b> of current season's growth."],["Cutting size","75–100 mm."],["Selecting material","Vigorous tips without flowers or berries."],["Pre-treatment","• Strip leaves from the l
