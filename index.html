<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cuttings and seed sowing guide for WA native plants, Joondalup nursery. Works offline.">
<meta name="theme-color" content="#2E4A36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Propagation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>try{var t=localStorage.getItem("npg.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Native Plant Propagation Guide</title>
<style>
:root {
  --bg: #F4F7F2;
  --surface: #FFFFFF;
  --surface-2: #EEF3EB;
  --ink: #1F2A22;
  --muted: #5B6B5F;
  --rule: #D5DDD2;
  --brand: #2E4A36;
  --brand-ink: #FFFFFF;
  --leaf: #4F7A5A;
  --leaf-soft: #DCE8D8;
  --focus: #2F6FB0;
  --cal-best: #3E7A4E;
  --cal-best-ink: #FFFFFF;
  --cal-ok: #C4DDBC;
  --cal-ok-ink: #24452E;
  --cal-no: #ECEFEA;
  --cal-no-ink: #9AA59C;
  --d-easy: #3F7F4A;
  --d-easymod: #6B8726;
  --d-mod: #A2740F;
  --d-moddiff: #B0561F;
  --d-diff: #A3382E;
  --s-main: #2E6B3E;
  --s-good: #4F8A48;
  --s-poss: #8A7414;
  --s-diff: #B0561F;
  --warn-bg: #FFF4DB;
  --warn-ink: #6A4A00;
  --shadow: 0 1px 2px rgba(31, 42, 34, .08), 0 2px 8px rgba(31, 42, 34, .06);
  --radius: 12px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
    --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
    --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
    --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
    --s-main: #3F8A52; --s-good: #5E9A57; --s-poss: #9C8526; --s-diff: #C4692F;
    --warn-bg: #3A3016; --warn-ink: #F2D993;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
  --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
  --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
  --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
  --s-main: #3F8A52; --s-good: #5E9A57; --s-poss: #9C8526; --s-diff: #C4692F;
  --warn-bg: #3A3016; --warn-ink: #F2D993;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
i, em { font-style: italic; }
a { color: var(--leaf); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding-block: 10px; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { font-size: .8rem; opacity: .8; font-weight: 500; display: block; }
.icon-btn {
  background: transparent; border: 0; color: inherit; width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 24px; height: 24px; }

.update-bar {
  background: var(--warn-bg); color: var(--warn-ink); padding-block: 10px; padding-inline: 16px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: .95rem;
}
.update-bar button { background: var(--warn-ink); color: var(--warn-bg); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

/* ---------- main ---------- */
main {
  padding-inline: 16px; padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  max-width: 760px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
}
.view-title { font-size: 1.45rem; font-weight: 750; }
.lede { color: var(--muted); margin: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; }
.count { color: var(--muted); font-size: .85rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- bottom nav ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(6, 1fr);
}
.tabbar button {
  background: none; border: 0; min-height: var(--nav-h); padding: 6px 0; cursor: pointer; min-width: 0; white-space: nowrap; letter-spacing: -.01em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: .72rem; font-weight: 600;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--leaf); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.4; }

/* ---------- controls ---------- */
.month-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month-strip button {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; min-height: 44px;
  font-weight: 650; cursor: pointer; font-size: .92rem;
}
.month-strip button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.month-strip button.is-now { box-shadow: inset 0 -3px 0 var(--leaf); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  flex: 1; border: 0; background: transparent; min-height: 42px; border-radius: 9px; font-weight: 650; cursor: pointer; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button { min-width: 0; padding-inline: 4px; }
.seg.many { gap: 2px; padding: 3px; }
.seg.many button { font-size: .8rem; padding-inline: 2px; letter-spacing: -.01em; }
.search {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface);
  padding-inline: 14px 14px; font-size: 1rem;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding-inline: 18px;
  border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--d-diff); border-color: var(--d-diff); }
.btn.danger.armed { background: var(--d-diff); color: #fff; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- lists ---------- */
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--rule); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px;
  width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit;
}
.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sci { font-style: italic; font-weight: 700; }
.common { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chev { color: var(--muted); flex: none; }
.letter { background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 700; padding: 4px 14px; letter-spacing: .06em; }
.letter.fam { display: flex; justify-content: space-between; gap: 8px; letter-spacing: .02em; font-size: .82rem; color: var(--ink); }
.letter.fam .num { color: var(--muted); font-weight: 650; }

/* species: family filter */
.fam-bar { display: flex; flex-direction: column; gap: 8px; }
.fam-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.subhead { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.fam-bar select { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); padding: 8px 12px; color: var(--ink); }
.mini-seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.mini-seg button { border: 0; background: transparent; min-height: 38px; padding: 0 12px; border-radius: 8px; font-weight: 650; font-size: .85rem;
  color: var(--muted); cursor: pointer; }
.mini-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--leaf); font: inherit; font-weight: 650; text-decoration: underline; cursor: pointer; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700;
  color: #fff; white-space: nowrap; line-height: 1.6;
}
.chip.wrap { white-space: normal; line-height: 1.35; padding: 4px 10px; border-radius: 12px; }
.chip.neutral { background: var(--surface-2); color: var(--ink); }
.chip.best { background: var(--cal-best); color: var(--cal-best-ink); }
.chip.ok { background: var(--cal-ok); color: var(--cal-ok-ink); }
.d-easy { background: var(--d-easy); } .d-easymod { background: var(--d-easymod); } .d-mod { background: var(--d-mod); }
.d-moddiff { background: var(--d-moddiff); } .d-diff { background: var(--d-diff); }
.s-main { background: var(--s-main); } .s-good { background: var(--s-good); } .s-poss { background: var(--s-poss); }
.s-diff { background: var(--s-diff); } .s-none { background: var(--surface-2); color: var(--muted); }
.empty { color: var(--muted); padding: 16px; text-align: center; background: var(--surface); border-radius: var(--radius); }

/* ---------- species detail ---------- */
.sp-head { background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.sp-head h2 { padding-right: 44px; }
.sp-head h2 { font-size: 1.55rem; font-style: italic; font-weight: 750; }
.sp-head .common { color: var(--brand-ink); opacity: .85; font-size: .98rem; }
.sp-head .fam { font-size: .82rem; opacity: .75; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.fact .k { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fact .v { font-weight: 700; }
.fact.diff { color: #fff; }
.fact.d-easy { background: var(--d-easy); } .fact.d-easymod { background: var(--d-easymod); } .fact.d-mod { background: var(--d-mod); }
.fact.d-moddiff { background: var(--d-moddiff); } .fact.d-diff { background: var(--d-diff); }
.fact.diff .k { color: rgba(255,255,255,.85); }
.cal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 6px; }
.cal div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .75rem; font-weight: 700; color: var(--muted); }
.cal span { display: grid; place-items: center; width: 100%; height: 32px; border-radius: 7px; font-size: .78rem; }
.cal .B { background: var(--cal-best); color: var(--cal-best-ink); }
.cal .P { background: var(--cal-ok); color: var(--cal-ok-ink); }
.cal .N { background: var(--cal-no); color: var(--cal-no-ink); }
.cal .now span { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 1.02rem; font-weight: 700; color: var(--leaf); }
.dl { display: flex; flex-direction: column; }
.dl > div { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.dl > div:first-child { border-top: 0; padding-top: 0; }
.dl dt { font-weight: 700; font-size: .86rem; color: var(--muted); }
.dl dd { margin: 0; }
.note { font-size: .88rem; color: var(--muted); margin: 0; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.sources, .dl dd, .mrow .kv { overflow-wrap: anywhere; }
.sources { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.back { align-self: flex-start; }

/* propagation options on a species page */
.opt { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 4px 10px; padding-block: 10px; border-top: 1px solid var(--rule); align-items: center; }
.opt:first-child { border-top: 0; padding-top: 0; }
.opt .m { font-weight: 700; }
.opt .chip { justify-self: start; }
.opt .n { grid-column: 2; font-size: .92rem; }
.opt .here { grid-column: 2; font-size: .8rem; font-weight: 700; color: var(--leaf); }
.opt .go { grid-column: 2; justify-self: start; border: 0; background: none; padding: 4px 0; min-height: 32px; color: var(--leaf);
  font-weight: 700; font-size: .9rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* methods: table rows rendered as stacked items */
.mrow { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.mrow:first-child { border-top: 0; padding-top: 0; }
.mrow .t { font-weight: 700; }
.mrow .kv { font-size: .92rem; }
.mrow .kv b.lbl { color: var(--muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; display: block; }

/* ---------- records ---------- */
form.card label { font-weight: 650; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
form.card input, form.card select, form.card textarea {
  min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); padding: 8px 12px; width: 100%;
}
form.card textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.radio-row { display: flex; gap: 8px; }
.radio-row label { flex: 1; flex-direction: row !important; align-items: center; justify-content: center; gap: 8px !important;
  border: 1px solid var(--rule); border-radius: 10px; min-height: 46px; cursor: pointer; background: var(--bg); }
.radio-row input { width: auto !important; min-height: 0 !important; accent-color: var(--leaf); }
.result { font-weight: 750; font-size: 1.05rem; }
.rec { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.rec:hover { background: var(--surface-2); }
.rec .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.rec .meta { color: var(--muted); font-size: .86rem; }
.pct { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 650; z-index: 40; max-width: calc(100% - 32px);
  pointer-events: none;
}
.about p { margin: 0; }
.about ol, .about ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- species notes ---------- */
.nlist { display: flex; flex-direction: column; }
.nitem { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule);
  padding: 10px 0; color: inherit; cursor: pointer; font: inherit; }
.nitem:first-child { border-top: 0; padding-top: 0; }
.nitem .meta, .rec .meta { color: var(--muted); font-size: .82rem; }
.ntext { font-size: .92rem; color: var(--ink); overflow-wrap: anywhere; }
.rec .ntext { color: var(--muted); }
.recorder .note { margin: 0; }
.recorder-line { color: var(--muted); font-size: .92rem; }
.recorder-line b { color: var(--ink); }
.recorder-row { display: flex; gap: 8px; align-items: flex-end; }
.recorder-row label { flex: 1; }
.fill-btn { align-self: flex-start; }
.filter select { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); padding: 8px 12px; color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- photos ---------- */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ph { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ph button { padding: 0; border: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; cursor: zoom-in; aspect-ratio: 1 / 1; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph figcaption { font-size: .72rem; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 9, .92); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.lightbox img { max-width: 100%; max-height: 70vh; border-radius: 10px; object-fit: contain; }
.lightbox .lb-cap { color: #E3EBE4; font-size: .88rem; text-align: center; overflow-wrap: anywhere; }
.lightbox .btn { background: #19221C; color: #E3EBE4; border-color: #2E3B32; }
.lightbox .btn.primary { background: #4F7A5A; border-color: #4F7A5A; color: #fff; }
.lightbox .btn.danger { color: #F0A58F; border-color: #8C4A3A; }
.lightbox .btn.danger.armed { background: #B9553F; color: #fff; }

/* ---------- seed ID ---------- */
.seedcard .bag { font-size: 1.28rem; font-weight: 750; line-height: 1.25; margin-top: 2px; }
.seedcard .bagsize { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.seed-diag { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.sd-panel { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px;
  background: #F3F0E7; color: #45433C; border: 1px solid rgba(0, 0, 0, .07); border-radius: 12px; }
.sd-label { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #6F6B60; }
.sd-art { display: block; min-width: 0; overflow-x: auto; padding: 4px 0; }
.sd-row { display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 6px; min-width: 0; }
.sd-row .sd-art { flex: 0 1 auto; max-width: 100%; }
.sd-row .sd-art > .seed-svg { margin: 0; }
.sd-small { padding-bottom: 10px; }
.sd-art > .seed-svg { display: block; margin: 0 auto; }
.sbar { display: inline-flex; flex-direction: column; gap: 2px; font-size: .74rem; font-weight: 650; color: #5E5B52; }
.sbar svg { display: block; }
.sd-note { margin-top: 10px; }

824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Australian National Botanic Gardens – Acacia truncata (scarified seed or boiling water; salt tolerant)","url":"anbg.gov.au/acacia/species/A-truncata.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Not documented for this species; many acacias strike from 75–100 mm cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s or scarify.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","P","B","B"],"basis":"genus","any":false,"note":"Pods split quickly once dry – bag branches or check often."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Oblong to elliptic, shiny brown seed with a club-shaped aril. Pods blackish, curved, to 6.5 cm, with thick yellowish edges.","size":"3–3.5 mm long","tell":"Float test: whole seed sinks, light or damaged seed floats. Discard seed with insect holes; ripe seed is hard (Seed Notes 9).","level":"species","d":{"shape":"oval","L":3.25,"W":null,"col":"brown","shiny":true,"aril":"cream"},"sources":[["WorldWideWattle – species factsheets (seed descriptions)","https://worldwidewattle.com"],["Seed Notes 9 – Acacia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"]],"photos":[],"sosa":false}},{"id":"acanthocarpus-preissii","sci":"Acanthocarpus preissii","common":"Prickle Lily","family":"Asparagaceae (Lomandroideae)","fam":"Asparagaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific dormancy research (Turner et al. 2006) plus a WA community-nursery method.","facts":[["Pre-treatment","Warm stratify 7+ weeks, then cool"],["Best sowing","Dec – Feb"],["Sowing depth","3–5 mm"],["Typical germination","80%+ after warm stratification"]],"check":[28,56],"stats":{"germ_pct":null,"per_gram":null},"grow":[6.0,9.0],"storage":{"kind":"ripen","months":12,"text":"Dry storage helps (after-ripening)"},"calendar":["B","B","P","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.2–0.7 (–2) m, with stiff, prickly leaves."],["Flowering","Apr – May (white)."],["Habitat","White, grey, red or brown sand, sandstone and limestone; coastal dunes."],["Local note","Recorded in Joondalup and Wanneroo. Breeding plant for the silver-spotted ochre butterfly."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fruits once they ripen and dry after the April – May flowering."],["Extraction & cleaning","Clean away any fruit material and dry the seed."],["Seed quality","Fresh seed viability is high (over 90% in research), but it is dormant."],["Storage life","Stores dry; the seed after-ripens in dry storage, which loosens dormancy."],["Typical germination","Fresh seed germinated <b>under 8%<\/b> even with smoke or gibberellic acid, but <b>over 80%<\/b> after at least 7 weeks warm and moist (18/33°C) followed by cool conditions (7/18°C) (Turner et al. 2006). Alcoa's single untreated test gave 0%."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Dec – Feb<\/b>, so the trays get the summer warmth they need, then germinate as it cools in autumn. Mar – Apr and Nov workable."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","<b>Warm stratification:<\/b> sow into moist mix and keep the trays warm (a sunny, sheltered bench or a warm glasshouse) for at least 7 weeks, then move them somewhere cool. Smoke-water soak (24 h, 1:9) is the Geraldton nursery method."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow in deep trays or 2–3 seeds per deep tube."],["After sowing","Keep the mix moist the whole time – dry trays won't stratify."],["Germination time","Geraldton recorded <b>28–56 days<\/b>; with summer sowing expect emergence as autumn cools."],["Pricking out","Early, at the first leaf, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–9 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination by autumn","Trays too dry or too cool in summer. Keep moist and warm for 7+ weeks, then cool."],["Seedlings rot","Too wet once cool. Water less; good drainage."],["Slow growth","Normal. Deep tubes and patience."]],"other":"Rhizomatous – division of clumps may also work but isn't documented.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Turner S.R. et al. (2006) Annals of Botany 98 – seed dormancy in Acanthocarpus preissii (warm stratification)","url":"pmc.ncbi.nlm.nih.gov/articles/PMC2803588/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Warm-stratify 7+ weeks, then cool: over 80% in research.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Rhizomatous clumps; division not documented.","guide":null}],"collect":{"cal":["-","-","-","-","-","P","P","P","P","-","-","-"],"basis":"estimate","any":false,"note":"Fruits ripen and dry after the Apr – May flowering."},"conservation":"","seedid":{"unit":"Seed","look":"Round, slightly wrinkled seed with a waxy coat, yellow to brown (family). It comes from a 5–8 mm capsule covered in hooked bumps.","size":"4–5 mm across","tell":"Dry fruits for about 2 weeks to split, then clean out the seed – the hooked, warty capsule pieces are chaff. Cut test: a filled seed has white endosperm and an embryo.","level":"species","d":{"shape":"round","L":4.5,"W":4.3,"col":"lightbrown","texture":"wrinkled"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Turner S.R. et al. (2006) Annals of Botany 98 – seed dormancy in Acanthocarpus preissii","https://pmc.ncbi.nlm.nih.gov/articles/PMC2803588/"],["Seed families identification tool (idtools.org) – family seed descriptions","https://idtools.org/seed_families/"]],"photos":[],"sosa":false}},{"id":"allocasuarina-fraseriana","sci":"Allocasuarina fraseriana","common":"Sheoak / Western Sheoak","family":"Casuarinaceae","fam":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and WA seed-handling notes are available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","37%"],["Seed per 100 plants","1.3 g"]],"check":[14,35],"stats":{"germ_pct":37,"per_gram":76},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once out of cone – keep dry & cool"},"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect tree, 5–15 m. Male and female flowers usually on separate trees (dioecious)."],["Flowering","May – Oct. Woody cones up to 40 mm long follow on female trees."],["Habitat","Lateritic soils and white, grey or yellow sand; jarrah forest and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Only female trees bear cones – note which trees you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones mature within about a year of flowering. Collect cones that have turned pale to dark brown <b>with the valves still closed<\/b>. Use secateurs or a pole pruner."],["Extraction & cleaning","Place cones in a paper bag or tray in a warm, dry spot – they open readily and drop the winged seeds (samaras). Sieve off cone debris."],["Seed quality","Many seeds look sound but are empty. <b>Cut-test<\/b> a sample before sowing and discard lots with empty or shrivelled seed."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store dried seed sealed in the fridge, or keep seed in closed cones until the sowing season."],["Typical germination","About <b>37%<\/b> (untreated, Alcoa nursery average). About <b>76 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cooling autumn weather, 15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan (heat)."],["Seed mix","Standard sterile native seed mix (see Standard method)."],["Pre-treatment","<b>None needed.<\/b> Seed becomes sticky (mucilaginous) when wet – mix dry seed with a little dry, sterile yellow sand so it spreads evenly and can be seen."],["Sowing depth & method","Scatter thinly and cover lightly with about <b>2–3 mm<\/b> of fine sand or vermiculite. <b>Direct sowing into tubes or cells<\/b> (a few seeds each, thinned later) reduces losses – sheoak seedlings are prone to damping off after pricking out."],["After sowing","Water in with a fine spray (smoke water is optional – aerosol smoke gave similar results to untreated seed in Alcoa trials). Keep moist, not wet. Watch for damping off."],["Germination time","Seedlings emerge after about <b>2–5 weeks<\/b>."],["Pricking out","If sown in trays, prick out early – once seedlings are about 2–3 cm tall and can be handled – disturbing roots as little as possible."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out or thinning, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, use sterile mix, water from below where possible, direct sow into tubes."],["Very low germination","Seed lot mostly empty. Cut-test before sowing; collect from closed, mature cones."],["Seed clumps together","Mucilage. Mix dry seed with dry sand before sowing; don't pre-soak."]],"other":"Cuttings are rarely used. Seed from several trees keeps genetic diversity in revegetation stock.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; 2–5 weeks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect mature brown cones with the valves still closed (female trees)."},"conservation":"","seedid":{"unit":"Winged samara (the seed)","look":"Samara with a shiny brown to black seed body (genus) and a papery wing, shed from cones 15–40 mm long when they're kept warm and dry.","size":"9–10 mm long","tell":"Many samaras look intact but are empty – cut-test a sample: firm white endosperm is good, missing or shrivelled is not. Collect only unopened cones (Seed Notes 7).","level":"species","d":{"shape":"samara","L":9.5,"W":null,"col":"darkbrown","body":0.55},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 7 – Allocasuarina (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"]],"photos":[],"sosa":false}},{"id":"allocasuarina-humilis","sci":"Allocasuarina humilis","common":"Dwarf Sheoak","family":"Casuarinaceae","fam":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and WA seed-handling notes are available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","25%"],["Seed per 100 plants","1.3 g"]],"check":[14,35],"stats":{"germ_pct":25,"per_gram":77},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once out of cone – keep dry & cool"},"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect or spreading shrub, 0.2–2 m. Dioecious or monoecious."],["Flowering","May – Nov."],["Habitat","Sand (often over laterite), sandy clay and gravel on sandplains and dunes."],["Local note","Widespread in the South West. Collect from local-provenance plants and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect mature brown cones <b>with valves still closed<\/b>, usually within a year of flowering. On dioecious plants only female plants bear cones."],["Extraction & cleaning","Dry cones in a paper bag in a warm, dry place until they open; sieve out the small winged seeds."],["Seed quality","Germination is often low – <b>cut-test<\/b> a sample. Many seeds can be empty."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store sealed in the fridge, or keep in closed cones until needed."],["Typical germination","About <b>25%<\/b> (untreated, Alcoa nursery average). About <b>77 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Mix dry seed with dry, sterile sand for even spreading (seed turns sticky when wet)."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube/cell and thin, or sow thinly in trays. Sow more generously than for <i>A. fraseriana<\/i> to allow for lower germination."],["After sowing","Water in with a fine spray; keep moist, not wet. Good airflow to limit damping off."],["Germination time","About <b>2–5 weeks<\/b>."],["Pricking out","Prick out early, at about 2–3 cm tall, with minimal root disturbance."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, sterile mix, avoid overwatering."],["Very low germination","Empty seed. Cut-test; collect from closed, fully mature cones."],["Seed clumps together","Mix dry seed with dry sand; don't pre-soak."]],"other":"Slower-growing shrub – allow extra time to reach planting size.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; sow generously.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect mature brown cones with the valves still closed (female plants)."},"conservation":"","seedid":{"unit":"Winged samara (the seed)","look":"Smooth samara with a short, square-ended wing that's shorter than the body. Body shiny brown to black (genus).","size":"5–6 mm long (seed bank: about 4.9 × 3.8 mm)","tell":"Many samaras look intact but are empty – cut-test a sample: firm white endosperm is good, missing or shrivelled is not. Collect only unopened cones (Seed Notes 7).","level":"species","d":{"shape":"samara","L":5,"W":3.8,"col":"darkbrown","body":0.62},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"],["Seed Notes 7 – Allocasuarina (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"]],"photos":[{"id":"ab56ec79-7978-48e6-b7e4-99c43e8e4a52","nsb":420,"by":"B. Clinton"},{"id":"fb7544de-ac38-4d30-a1b3-8a849235907a","nsb":421,"by":"B. Clinton"}],"sosa":false}},{"id":"allocasuarina-lehmanniana","sci":"Allocasuarina lehmanniana","common":"Dune Sheoak","family":"Casuarinaceae","fam":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (3 tests); handling follows the other <i>Allocasuarina<\/i> in this guide.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","19%"],["Seed per 100 plants","0.5 g"]],"check":[14,35],"stats":{"germ_pct":19,"per_gram":193},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once out of cone – keep dry & cool"},"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Shrub, 0.5–4 m. Male and female flowers on separate plants (dioecious)."],["Flowering","Sep – Dec (female flowers red)."],["Habitat","Coastal sites and winter-wet areas."],["Local note","Recorded in Joondalup and Wanneroo. Only female plants bear cones – note which plants you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect mature brown cones <b>with the valves still closed<\/b>, usually within a year of flowering. Use secateurs."],["Extraction & cleaning","Dry cones in a paper bag in a warm, dry spot until they open; sieve out the small winged seeds."],["Seed quality","Many seeds can be empty – <b>cut-test<\/b> a sample before sowing."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store sealed in the fridge, or keep seed in closed cones until needed."],["Typical germination","About <b>19%<\/b> (untreated, Alcoa nursery average, 3 tests). About <b>193 seedlings per gram<\/b> – roughly 0.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Mix dry seed with dry, sterile sand for even spreading (seed turns sticky when wet)."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube or cell and thin, or sow thinly in trays."],["After sowing","Water in with a fine spray; keep moist, not wet. Good airflow to limit damping off."],["Germination time","About <b>2–5 weeks<\/b>."],["Pricking out","Prick out early, at about 2–3 cm tall, with minimal root disturbance."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, sterile mix, avoid overwatering."],["Very low germination","Empty seed. Cut-test; collect from closed, fully mature cones."],["Seed clumps together","Mix dry seed with dry sand; don't pre-soak."]],"other":"A good choice for damp, low-lying coastal sites. Collect from several female plants to keep genetic diversity.","sources":[{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; like other sheoaks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect mature brown cones with the valves still closed."},"conservation":"","seedid":{"unit":"Winged samara (the seed)","look":"Small black samara with a papery wing, from cones 12–35 mm long.","size":"4–5.5 mm long","tell":"Many samaras look intact but are empty – cut-test a sample: firm white endosperm is good, missing or shrivelled is not. Collect only unopened cones (Seed Notes 7).","level":"species","d":{"shape":"samara","L":4.75,"W":null,"col":"black","body":0.58},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 7 – Allocasuarina (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"]],"photos":[],"sosa":false}},{"id":"ammothryon-grandiflorum","sci":"Ammothryon grandiflorum","common":"Large-flowered Bog Rush","family":"Cyperaceae (sedges)","fam":"Cyperaceae","alt":"Previously <i>Schoenus grandiflorus<\/i>","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No reliable seed method published: 0% in the only nursery test. Commercial stock is produced by tissue culture. Trial protocol.","facts":[["Pre-treatment","Heat + smoke (trial)"],["Best sowing","Apr – May"],["Sowing depth","2–3 mm"],["Typical germination","0% untreated (1 test)"]],"check":[28,56],"stats":{"germ_pct":null,"per_gram":null},"grow":null,"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","P","B","B","P","P","-","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial sedge, 0.4–1.5 m."],["Flowering","Jan or Apr – Jul (brown)."],["Habitat","White, grey, brown or yellow sand and sandy clay; coastal dunes and sandplains."],["Local note","Grows on the local coastal dunes (Cottesloe Coastcare). Renamed from <i>Schoenus grandiflorus<\/i> in 2021."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe nutlets when the heads dry and they come away easily."],["Extraction & cleaning","Rub heads over a sieve."],["Seed quality","Expect many empty nutlets – cut-test a sample (common in sedges)."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","0% untreated in the only Alcoa nursery test."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b> (trial). Mar, Jun – Jul workable."],["Seed mix","Free-draining, sterile mix."],["Pre-treatment","<b>Trial only:<\/b> no treatment has been published for this species. Research on a related sedge (<i>Lepidosperma scabrum<\/i>) found a heat shock (100°C for 10 minutes) plus smoke water worked best – a reasonable trial here."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow generously."],["After sowing","Keep moist, not wet. Keep trays going for months."],["Germination time","Not recorded."],["Pricking out","At the first leaf, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – record your own."]]}],"difficulty_note":"","problems":[["No germination","Expected. Try heat plus smoke water, older seed, and larger sowings."],["Empty seed","Cut-test before sowing; collect only fully ripe heads."],["Seedlings rot","Too wet. Water less."]],"other":"Tube stock is usually bought in from tissue-culture labs. Record any trial results so this page can be updated.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Turner S.R. et al. (2013) Aust. J. Botany 61 – heat shock and smoke break dormancy in Lepidosperma scabrum","url":"connectsci.au/bt/article-abstract/61/8/643/115316/"},{"title":"Barrett R.L., Wilson K.L. & Bruhl J.J. (2021) Telopea – Ammothryon, new genus for Schoenus grandiflorus","url":"openjournals.library.sydney.edu.au/TEL/article/view/14844"},{"title":"Croxford B. (2021) RIAWA presentation – tissue culture of WA sedges for restoration","url":"riawa.com.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Sedge.","guide":null},{"method":"Seed","suitability":"Difficult","note":"0% in the only test; heat + smoke is a trial.","guide":"seed"},{"method":"Division","suitability":"Trial","note":"Rhizomatous; division not documented. Tube stock is usually tissue-cultured.","guide":null}],"collect":{"cal":["-","-","-","-","-","-","P","P","P","P","-","-"],"basis":"estimate","any":false,"note":"Collect when heads are dry and nutlets come away easily."},"conservation":"","seedid":{"unit":"Nutlet (single seed)","look":"Egg-shaped nutlet with a narrowed base and three white ribs that widen towards the tip. Body colour isn't published. Spikelets are brown, 12–22 mm long.","size":"3.2–3.8 × 1.8–2.2 mm","tell":"The brown glumes are chaff. Only the top 2–4 flowers of each spikelet are fertile, so expect only a few nutlets per spikelet.","level":"species","d":{"shape":"nutlet","L":3.5,"W":2.0,"col":"unknown","ribs":"white"},"sources":[["Barrett R.L. et al. (2021) Telopea – Ammothryon, new genus for Schoenus grandiflorus","https://openjournals.library.sydney.edu.au/TEL/article/view/14844"]],"photos":[],"sosa":false}},{"id":"anigozanthos-humilis","sci":"Anigozanthos humilis","common":"Catspaw","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says it grows from untreated seed; nursery tests (2) were low; a smoke compound raised germination in research.","facts":[["Pre-treatment","Smoke water (optional)"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","4%"],["Seed per 100 plants","1.9 g"]],"check":[7,28],"stats":{"germ_pct":4,"per_gram":53},"grow":[4.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Stores dry at room temperature"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Low rhizomatous herb, 0.1–1 m (usually 0.1–0.3 m for the local subspecies). Often short-lived."],["Flowering","Jul – Oct (yellow, orange and red furry paws)."],["Habitat","Sand, sandy loam, clay, laterite and limestone; from well-drained ground to winter-wet swamps."],["Local note","Recorded in Joondalup and Wanneroo (subsp. <i>humilis<\/i>). Subsp. <i>chrysanthus<\/i> is Priority Four and not local – label seed by subspecies. Prone to rust."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Capsules ripen a few months after flowering (late spring–summer). Collect as they dry and brown, before they split."],["Extraction & cleaning","Dry in paper bags; rub and sieve out the small seed."],["Seed quality","Cut-test a few seeds."],["Storage life","Stores dry. For the related <i>A. manglesii<\/i>, Geraldton sows seed kept at room temperature for several years, as aged seed germinates better."],["Typical germination","Low in nursery tests: about <b>4%<\/b> untreated (Alcoa, 2 tests), about 53 seedlings per gram. Glyceronitrile, a smoke compound, significantly increased germination in research – so smoke water is worth using."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix, very free-draining."],["Pre-treatment","None needed (ANPSA), but <b>smoke water<\/b> (24 h soak or first watering) is likely to lift germination. Dry heat and aged seed help the related <i>A. manglesii<\/i> – worth trialling."],["Sowing depth & method","Sow thinly; cover about <b>1–2 mm<\/b>."],["After sowing","Keep moist, not wet. Protect from snails."],["Germination time","Not recorded for this species. Check trays from 3 weeks and record yours."],["Pricking out","At the second-leaf stage, gently."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months. Can flower in its first year."]]}],"difficulty_note":"","problems":[["Almost no germination","Dormant seed. Use smoke water; trial aged or heat-treated seed."],["Orange pustules on leaves","Rust – this species is particularly prone. Remove affected leaves; good airflow; keep foliage dry."],["Plants die after a year or two","Normal – often short-lived. Keep sowing each year."]],"other":"Vigorous clumps can be divided after flowering (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Kangaroo Paws & Relatives (smoke for Conostylis; Conostylis division)","url":"anpsa.org.au/genera/kangaroo-paw-family/"},{"title":"Flematti G.R. et al. (2011) Nature Communications 2:360 – smoke cyanohydrins (glyceronitrile) stimulate germination (incl. Anigozanthos humilis, Conostylis candicans)","url":"nature.com/articles/ncomms1356"},{"title":"ANPSA – Anigozanthos humilis profile (seed without pre-treatment; division after flowering; short-lived)","url":"anpsa.org.au/plant_profiles/anigozanthos-humilis/"}]},"division":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"ANPSA: divide after flowering and only if the plant is vigorous. Timing and size follow the kangaroo paw genus method.","facts":[["Division type","Rhizome clump division"],["Best months","Oct – Nov"],["Division size","3+ shoots with roots"],["Time to establish","4–6 weeks sheltered"]],"check":[28,42],"calendar":["-","-","P","P","-","-","-","-","-","B","B","-"],"snapshot":[["Habit","Low rhizomatous herb, usually 0.1–0.3 m locally. Often short-lived – about five years at most in humid-summer areas."],["Flowering","Jul – Oct (yellow, orange and red furry paws)."],["Habitat","Sand, sandy loam, clay, laterite and limestone; well-drained ground to winter-wet swamps."],["Local note","Recorded in Joondalup and Wanneroo (subsp. <i>humilis<\/i>). Prone to rust."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Oct – Nov<\/b>, <b>just after flowering<\/b> (ANPSA). Mar – Apr is workable, as for other kangaroo paws. Avoid Dec – Feb (heat) and May – Sep (plants are growing and flowering)."],["Division type","<b>Rhizome clump division.<\/b>"],["Division size","At least <b>3 shoots<\/b> with a piece of rhizome and roots. Plants are small, so you may only get two or three pieces."],["Selecting stock","<b>Only vigorous plants<\/b> – weak or older plants rarely recover. Choose plants free of rust."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump and cut the rhizome apart with a clean, sharp knife.<br/>• Trim the leaves back by about a third."],["Potting","Pot into a very free-draining mix at the original depth."],["Environment","Sheltered, shaded spot until new growth starts. Keep the leaves dry – water the mix, not the plant."],["Time to establish","About <b>4–6 weeks<\/b> (record yours)."],["Aftercare","• Harden off gradually.<br/>• Grow on in full sun with good airflow."]]}],"difficulty_note":"<b>Moderate–Difficult (provisional).<\/b> Works on vigorous plants, but the species is small and short-lived. Seed is the main method.","problems":[["Divisions fail","Stock plant too weak. Divide only vigorous plants."],["Orange pustules on leaves","Rust. Remove affected leaves; keep foliage dry; don't divide infected plants."],["Base rots","Too wet. Very free-draining mix; water less."]],"other":"","sources":[{"title":"ANPSA – Kangaroo Paws & Relatives: propagation by division (autumn, 3+ shoots, trim leaves by a third)","url":"anpsa.org.au/genera/kangaroo-paw-family/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Anigozanthos humilis profile (divide after flowering, only vigorous plants; short-lived; rust)","url":"anpsa.org.au/plant_profiles/anigozanthos-humilis/"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Kangaroo paws are not grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment needed; smoke lifts germination.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"After flowering, vigorous plants only.","guide":"division"}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect capsules as they dry and brown, before they split."},"conservation":"","seedid":{"unit":"Seed","look":"Tiny black seed, round to lens-shaped (the family's seeds are dull and leathery).","size":"0.5–1 mm long","tell":"Good seed is plump and firm, and white inside when cut; seed that floats is probably empty (Seed Notes 3).","level":"species","d":{"shape":"round","L":0.75,"W":null,"col":"black"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed families identification tool (idtools.org) – family seed descriptions","https://idtools.org/seed_families/"],["Seed Notes 3 – Seed quality and germination (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01990.pdf"]],"photos":[],"sosa":false}},{"id":"anigozanthos-manglesii","sci":"Anigozanthos manglesii","common":"Red and Green Kangaroo Paw","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Well researched: dormancy, heat, smoke and storage responses are published.","facts":[["Pre-treatment","Dry heat 100°C 3 h, or aged seed"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","70%"],["Seed per 100 plants","0.5 g"]],"check":[21,42],"stats":{"germ_pct":70,"per_gram":211},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Several years at room temp – do not freeze"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous perennial herb, 0.2–1.1 m (flower stems). Often short-lived – best treated as a 2–3 year plant."],["Flowering","Aug – Nov (green and red). WA's floral emblem."],["Habitat","White, yellow or grey sand and sandy loam."],["Local note","Recorded in the Wanneroo LGA. Also called Mangles Kangaroo Paw."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens roughly three months after flowering (about Nov – Feb). Collect when capsules dry and brown, before they split and shed."],["Extraction & cleaning","Dry capsules in paper bags; rub and sieve to separate the small seed."],["Seed quality","Fresh seed is strongly dormant – untreated germination can be very low (about 1% in one Alcoa trial)."],["Storage life","<b>Stores well for several years<\/b> dry at room temperature, and germination <b>improves with age<\/b> (after-ripening). Research found <b>freezing (–18°C) reduced germination<\/b> – store dry at 23°C or cooler, not in the freezer."],["Typical germination","About <b>70%<\/b> after heat treatment (Alcoa nursery average). About <b>211 seedlings per gram<\/b> – roughly 0.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – germinates in cool conditions (tested at 15–20°C). Jun – Aug workable (slower). Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix; very free-draining."],["Pre-treatment","Choose one:<br/>• <b>Dry heat:<\/b> spread seed on a tray in an oven at <b>100°C for 3 hours<\/b> (Geraldton community nursery; Alcoa).<br/>• <b>Aged seed:<\/b> use seed stored at room temperature for a few years.<br/>• <b>Smoke water<\/b> (e.g. 24 h soak at 1:9) – response improves the longer seed has been stored."],["Sowing depth & method","Sow thinly on the surface of trays and cover very lightly, about <b>1–2 mm<\/b> of fine sand or vermiculite."],["After sowing","Water in with a fine spray (smoke water optional). Keep moist but not wet. Protect from snails and slugs."],["Germination time","About <b>3–6 weeks<\/b> (around 20 days in the Geraldton nursery)."],["Pricking out","When the <b>second leaf<\/b> appears and seedlings can be handled (about 2–3 cm). Lift gently with a narrow spatula."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks. Keep foliage dry and airflow good."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Seed still dormant. Heat-treat, use older seed, or add smoke water."],["Black spots spreading on leaves","Ink disease (fungal). Remove affected plants, improve airflow, avoid wetting foliage."],["Seedlings chewed","Snails and slugs. Bait or hand-remove."]],"other":"Division of clumps also works. Seed-grown plants vary slightly; keep local provenance for revegetation.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 3 – Seed quality and germination. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01990.pdf"},{"title":"Seed Science Research – Seed ageing of four Western Australian species in relation to storage environment (incl. A. manglesii)","url":"cambridge.org (Seed Science Research)"},{"title":"AoB PLANTS (2018) – Seed dormancy regulates germination response to smoke and temperature (Anigozanthos)","url":"academic.oup.com/aobpla/article/10/4/ply042/5048955"},{"title":"Wikipedia – Anigozanthos manglesii (cultivation, ink disease)","url":"en.wikipedia.org/wiki/Anigozanthos_manglesii"}]},"division":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"ANPSA publishes a detailed division method for kangaroo paws.","facts":[["Division type","Rhizome clump division"],["Best months","Mar – May"],["Division size","3+ shoots with roots"],["Time to establish","4–6 weeks sheltered"]],"check":[28,42],"calendar":["-","P","B","B","B","P","-","-","P","P","-","-"],"snapshot":[["Habit","Rhizomatous perennial herb, 0.2–1.1 m (flower stems). Often short-lived – best treated as a 2–3 year plant."],["Flowering","Aug – Nov (green and red). WA's floral emblem."],["Habitat","White, yellow or grey sand and sandy loam."],["Local note","Recorded in the Wanneroo LGA. Less vigorous and shorter-lived than most garden hybrids."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b> – ANPSA says clumps are best divided in autumn, though other times also work. Feb, Jun and Sep – Oct are workable; summer divisions need protection until re-established. Avoid Jul – Aug (cold, wet) and Nov – Jan (heat)."],["Division type","<b>Rhizome clump division<\/b> – the clump is cut into pieces of rhizome, each with leaf shoots and roots."],["Division size","<b>At least three large shoots<\/b> per piece gives the best chance of success (ANPSA). Single-shoot pieces with some roots can work but need a humid glasshouse until new roots form."],["Selecting stock","Vigorous, healthy clumps, ideally in their second year – this species is often short-lived. Don't divide plants with black leaf spotting (ink disease)."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump (or knock it out of its pot) and shake or wash off the mix so you can see the rhizome.<br/>• Cut through the rhizome with a clean, sharp knife.<br/>• Trim damaged roots.<br/>• <b>Cut all leaves back by about one-third<\/b> to reduce water loss (ANPSA)."],["Potting","Pot into a well-drained potting mix with the shoots <b>at the same level as before<\/b> (ANPSA). Don't bury the crown. Water in."],["Environment","Sheltered, shaded spot until new leaf growth is well advanced and roots show at the drainage holes. Small divisions go in a humid house."],["Time to establish","Small divisions need about <b>4–6 weeks<\/b> in humid conditions (ANPSA); larger pieces re-establish in the shelter over a similar time."],["Aftercare","• Harden off gradually – about a week with nights exposed, then a week in a sheltered spot, then into the open.<br/>• Keep foliage dry and airflow good to limit ink disease.<br/>• Pot on once roots fill the pot."]]}],"difficulty_note":"<b>Moderate.<\/b> Kangaroo paws divide well, but this species is shorter-lived than many hybrids, so divide young, healthy clumps. Seed is the main method.","problems":[["Division rots at the base","Too wet, too cold, or planted too deep. Pot at the original level; water less; divide in autumn."],["Black spots spreading on leaves","Ink disease. Discard affected pieces; keep foliage dry; improve airflow."],["Division wilts and dies","Too few roots or leaves not trimmed. Use larger pieces, trim leaves by a third, keep sheltered."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"ANPSA – Kangaroo Paws & Relatives: propagation by division (autumn, 3+ shoots, trim leaves by a third)","url":"anpsa.org.au/genera/kangaroo-paw-family/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Wikipedia – Anigozanthos manglesii (short-lived habit, ink disease)","url":"en.wikipedia.org/wiki/Anigozanthos_manglesii"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Clumping herb – no stems to cut.","guide":null},{"method":"Seed","suitability":"Main method","note":"Dry heat or aged seed; autumn sowing.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Split vigorous clumps into rhizome pieces with shoots and roots.","guide":"division"}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"About three months after flowering – before capsules split."},"conservation":"","seedid":{"unit":"Seed","look":"Small grey seed, round to lens-shaped.","size":"1–1.5 mm long","tell":"Good seed is plump and firm, and white inside when cut; seed that floats is probably empty (Seed Notes 3).","level":"species","d":{"shape":"round","L":1.25,"W":null,"col":"grey"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed families identification tool (idtools.org) – family seed descriptions","https://idtools.org/seed_families/"],["Seed Notes 3 – Seed quality and germination (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01990.pdf"]],"photos":[],"sosa":false}},{"id":"anthocercis-littorea","sci":"Anthocercis littorea","common":"Yellow Tailflower","family":"Solanaceae","fam":"Solanaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says cuttings of hardened current season's growth should strike reasonably well; details follow standard practice.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,42],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Erect, rarely sprawling shrub, 0.6–3 (–4) m."],["Flowering","All year, mainly Jun – Nov (yellow, star-like with long narrow petals)."],["Habitat","Calcareous sand; coastal limestone, sand dunes and sandplains."],["Local note","Recorded in the Wanneroo LGA. <b>Poisonous<\/b> – all <i>Anthocercis<\/i> contain tropane alkaloids. Wear gloves and wash hands after handling."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b>, after the main flowering, once new growth has hardened. Nov and May are workable. Avoid Jun – Oct (main flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth (ANPSA)."],["Cutting size","75–100 mm."],["Selecting material","Non-flowering shoots; the plant flowers most of the year, so snip off buds."],["Pre-treatment","• Wear gloves.<br/>• Strip leaves from the lower half; reduce large leaves by a third.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 4–6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy–Moderate.<\/b> Cuttings should strike reasonably well; seed is hard to obtain and slow.","problems":[["Cuttings flower","Material taken from flowering shoots. Remove buds; pick non-flowering growth."],["Base rotting","Mix too wet. Water less; improve drainage."],["Skin irritation","Handle with gloves – the plant is toxic."]],"other":"Seed – gibberellic acid, smoke water or karrikinolide substantially increased germination in research; untreated seed gave 0% in the only Alcoa test.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – Anthocercis littorea profile (cuttings of hardened growth strike reasonably well)","url":"anpsa.org.au/plant_profiles/anthocercis-littorea/"},{"title":"Wikipedia – Anthocercis (tropane alkaloids; poisoning)","url":"en.wikipedia.org/wiki/Anthocercis"},{"title":"Commander L.E. et al. (2009) Journal of Arid Environments – GA, smoke water and karrikinolide raise germination (incl. Anthocercis littorea)","url":"sciencedirect.com/science/article/abs/pii/S0140196309000287"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Hardened current season's growth strikes reasonably well.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"GA, smoke or karrikinolide raise germination (research).","guide":null},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed","look":"Roughly kidney-shaped seed with a net-patterned, honeycomb-pitted coat (genus). A related species has brown seed to 3 mm long. The capsule opens from the tip by two valves.","size":"Not published for this species (related species to 3 mm)","tell":"Dry capsules for a week, rub and sieve – the papery capsule pieces are chaff (related species).","level":"related","d":{"shape":"kidney","L":2.5,"W":null,"col":"brown","texture":"pitted"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"atriplex-isatidea","sci":"Atriplex isatidea","common":"Coast Saltbush","family":"Amaranthaceae (chenopods)","fam":"Amaranthaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"No species-specific cutting data. Method follows published results for related saltbushes (<i>A. nummularia<\/i>, <i>A. halimus<\/i>).","facts":[["Wood type","Semi-hardwood tips"],["Best months","Sep – Nov"],["Cutting length","100–150 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[100.0,150.0],"check":[56,84],"calendar":["P","P","-","-","-","-","-","P","B","B","B","P"],"snapshot":[["Habit","Grey-leaved, spreading shrub, 0.5–2.5 m. Male and female flowers on the same plant."],["Flowering","Mainly Mar – Jun (small, inconspicuous)."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Very salt- and wind-tolerant – a useful dune stabiliser."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b>, in active spring growth (the time recommended for the related Old Man Saltbush). Aug and Dec – Feb are workable. Avoid Mar – Jul (flowering, then cool, slow growth)."],["Wood type","<b>Semi-hardwood terminal (tip) cuttings<\/b> of current season's growth."],["Cutting size","100–150 mm. Terminal cuttings of about 15 cm are used for <i>A. nummularia<\/i>."],["Selecting material","Vigorous, non-flowering tips from healthy plants. Avoid old, woody stems."],["Pre-treatment","• Strip leaves from the lower half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood to semi-hardwood strength (1.5–3 g/L IBA, <b>Clonex Green<\/b> or <b>Purple<\/b>). Related saltbushes root without hormone, so it mainly evens out the batch."],["Propagation mix","Free-draining mix of sand and potting mix."],["Environment","<b>Good ventilation and no mist<\/b> – misting encourages a leaf-spotting fungus on saltbush cuttings (ANBG, <i>A. nummularia<\/i>). Bottom heat helps; keep the mix just moist."],["Expected strike time","Not documented for this species. In one trial, 20 cm unrooted <i>A. halimus<\/i> cuttings with no hormone gave about <b>49% survival at 8 weeks<\/b>. Check from about 4 weeks and record your result."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Water sparingly once established.<br/>• Tip-prune for a bushier tube."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Saltbushes generally strike readily from tip cuttings; the main risk is leaf disease under mist. Seed is the more common nursery method.","problems":[["Leaf spots, leaves dropping","Too humid or misted. Stop misting, open the frame, improve airflow."],["Base rotting","Mix too wet. Use a sandier mix and water less."],["Leggy, pale growth","Not enough light. Grow on in full sun."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 76
