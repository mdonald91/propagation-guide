 follow ANPSA <i>Grevillea<\/i> guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Dense, much-branched shrub, (0.3–) 0.6–2 m. Compact shrub and low groundcover forms exist."],["Flowering","Jun or Aug – Nov (white to white-pink). Some people dislike the scent."],["Habitat","White or yellow sand over limestone; dunes, hillslopes and sandplains."],["Local note","Recorded in the City of Joondalup. Dieback susceptible. Keep the shrub and groundcover forms separate."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b>, after flowering, once new growth has firmed. Nov and May are workable. Avoid Jun – Oct (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm (ANPSA <i>Grevillea<\/i> guidance)."],["Selecting material","Non-flowering shoots from a plant of the form you want (shrub or groundcover)."],["Pre-treatment","• Strip leaves from the lower half to two-thirds (cut, don't tear).<br/>• Wound the base – a thin sliver of bark from the bottom 15–20 mm.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>). Wounding and hormone improve strike in grevilleas."],["Propagation mix","Free-draining, clean cutting mix. Strict hygiene – the species is dieback susceptible."],["Environment","Humid frame, bright shade, bottom heat. Be patient – roots can be slow."],["Expected strike time","Not documented, but reported slow – allow at least <b>8–12 weeks<\/b> before discarding. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a <b>low-phosphorus<\/b> native mix; feed only with low-P fertiliser."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Cuttings are the usual method but may be slow to produce roots.","problems":[["No roots after 8 weeks","Normal for this species – keep them going. Next time wound and use hormone."],["Heavy callus, no roots","Trim the callus and re-set; try a lower hormone strength."],["Plants yellow or die after potting","Phosphorus or dieback. Low-P mix, clean pots off the ground."]],"other":"Seed – poor: about 9% in a single Alcoa nursery test; a seed supplier recommends smoke treatment.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"Australian Plants Society NSW – Grevillea crithmifolia (cuttings may be slow to root; shrub and groundcover forms)","url":"resources.austplants.com.au/plant/grevillea-crithmifolia/"},{"title":"APACE WA – Grevillea crithmifolia (dieback susceptible)","url":"apacewa.org.au/plant/grevillea-crithmifolia/"},{"title":"ANPSA – Grevillea genus page (75–100 mm cuttings, strip lower half to two-thirds, wounding, hormone; phosphorus)","url":"anpsa.org.au/genera/grevillea/"},{"title":"Nindethana Australian Seed – Grevillea crithmifolia and G. preissii seed (smoke treatment recommended)","url":"nindethana.net.au"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"The usual method, but may be slow to root.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"About 9% in one nursery test; smoke recommended.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"grevillea-preissii","sci":"Grevillea preissii","common":"Spider-net Grevillea","family":"Proteaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"ANPSA gives species-specific cutting advice; size follows ANPSA <i>Grevillea<\/i> guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Nov – Mar"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","P","-","-","-","-","-","P","B","B"],"snapshot":[["Habit","Shrub, 0.15–1.7 m."],["Flowering","Jun – Sep (red spider flowers; attract honeyeaters)."],["Habitat","White, grey or yellow sand, sandy clay and limestone; ridges, outcrops and seasonally wet areas."],["Local note","Recorded in Joondalup and Wanneroo. The former subsp. <i>glabrilimba<\/i> (including ‘Magic Lantern’) is now a separate species, <i>G. glabrilimba<\/i> – keep it apart from local stock."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Mar<\/b>, after flowering, once the current season's growth has firmed. Oct and Apr are workable. Avoid May – Sep (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","75–100 mm (ANPSA <i>Grevillea<\/i> guidance)."],["Selecting material","Non-flowering shoots from healthy, local-provenance plants."],["Pre-treatment","• Strip leaves from the lower half to two-thirds.<br/>• Wound the base on firmer stems.<br/>• Dip the base in rooting hormone – ANPSA notes it clearly improves success."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining, clean cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented, but reported slow – allow at least <b>8–12 weeks<\/b> before discarding. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a <b>low-phosphorus<\/b> native mix."]]}],"difficulty_note":"<b>Moderate.<\/b> Cuttings of firm growth can be slow to strike; hormone improves success.","problems":[["Slow to strike","Normal. Use hormone and bottom heat; be patient."],["Heavy callus, no roots","Trim and re-set; try a lower hormone strength."],["Yellowing after potting on","Phosphorus in mix or fertiliser. Use low-P products."]],"other":"Seed – nick the seed coat before sowing (ANPSA); a seed supplier recommends smoke treatment.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Grevillea preissii profile (cuttings slow; hormone improves success; nick seed)","url":"anpsa.org.au/plant_profiles/grevillea-preissii/"},{"title":"ANPSA – Grevillea genus page (75–100 mm cuttings, strip lower half to two-thirds, wounding, hormone; phosphorus)","url":"anpsa.org.au/genera/grevillea/"},{"title":"Olde P.M. (2022) Telopea – Grevillea preissii subsp. glabrilimba raised to species rank as G. glabrilimba","url":"openjournals.library.sydney.edu.au/TEL/article/view/15872"},{"title":"Nindethana Australian Seed – Grevillea crithmifolia and G. preissii seed (smoke treatment recommended)","url":"nindethana.net.au"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Firm growth; slow, hormone improves strike.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Nick the seed coat; smoke water.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"grevillea-vestita","sci":"Grevillea vestita","common":"","family":"Proteaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Species-specific propagation information is published and consistent across sources.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","80–120 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[80.0,120.0],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Erect, spreading, prickly shrub, usually 0.5–3 m. Hairy branchlets; lobed leaves with sharp-pointed tips."],["Flowering","Mainly Jun – Nov (white to cream, often pink-tinged, scented). Odd flowers Jan – Apr."],["Habitat","Sandy soils over limestone or granite. Occurs on the Swan Coastal Plain, including the Perth area."],["Local note","Two subspecies exist (subsp. <i>vestita<\/i> and subsp. <i>isopogoides<\/i>). Label stock plants by subspecies and provenance."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b> (late spring to autumn), once the spring flush has firmed and flowering has finished. Nov and May are workable. Avoid Jun – Oct: plants are flowering, new growth is soft and cool weather slows rooting."],["Wood type","<b>Semi-hardwood<\/b> – firm, current season's growth. It should bend about 60° and spring back."],["Cutting size","80–120 mm long with 3–5 nodes. Tip or sub-tip pieces; two cuttings can often be taken from one shoot."],["Selecting material","Healthy, vigorous, <b>non-flowering<\/b> shoots. Skip shoots carrying buds, old woody stems and soft new tips."],["Pre-treatment","• Wear gloves: leaves are prickly and grevillea sap can irritate skin.<br/>• Remove any flowers or buds.<br/>• Strip leaves from the lower half to two-thirds (cut, don't tear the bark).<br/>• Trim remaining lobed leaves by about one-third.<br/>• Wound: remove a thin sliver of bark from the bottom 15–20 mm.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>. If cuttings form a heavy callus but no roots, trim the callus back to clean wood and re-set; try a lower strength on the next batch."],["Propagation mix","Free-draining, low nutrient: about 75–80% washed coarse river sand + 20–25% coir or peat (or a perlite/coir mix)."],["Environment","Humid propagation house or frame in bright shade. Bottom heat with the base of the cutting 5–10°C warmer than the air. Light misting only – the hairy foliage can rot if kept constantly wet."],["Expected strike time","About <b>6–8 weeks<\/b> in warm weather. Slower in the cooler months."],["Post-treatment / aftercare","• Harden off: ~2 weeks with cover closed by day and open at night, then ~2 weeks in shade before full sun.<br/>• Pot on when roots show at the drainage holes, into a <b>low-phosphorus<\/b> native mix.<br/>• Feed only with a low-phosphorus native fertiliser (Proteaceae are phosphorus-sensitive).<br/>• Responds well to pruning – tip-prune young plants for a bushier tube."]]}],"difficulty_note":"<b>Easy.<\/b> Cuttings from firm current season's growth usually strike reliably.","problems":[["Heavy callus, no roots","Trim callus back and re-set. Lower the hormone strength next time."],["Base rotting","Mix too wet or material too soft. Use firmer wood and water less often."],["Leaf yellowing or scorch after potting on","Check phosphorus in the potting mix and fertiliser."]],"other":"Seed – grows reasonably easily from seed, but seedlings are not identical to the parent. Grafting onto <i>G. robusta<\/i> is used on the humid east coast; not needed locally.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"ANPSA – Grevillea vestita plant profile","url":"anpsa.org.au/plant_profiles/grevillea-vestita/"},{"title":"Australian Plants Society NSW – Grevillea vestita","url":"resources.austplants.com.au/plant/grevillea-vestita/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Minimalist Gardener – Propagating Australian natives from cuttings (grevillea strike times, sap irritant)","url":"minimalistgardener.com.au"},{"title":"CompleteGrow – How to propagate Grevillea (low-phosphorus feeding)","url":"completegrow.com.au"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says it grows reasonably easily from seed; treatment follows WA <i>Grevillea<\/i> seed notes.","facts":[["Pre-treatment","Nick seed coat; smoke water"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","Not recorded"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, spreading, prickly shrub, usually 0.5–3 m."],["Flowering","Mainly Jun – Nov (white to cream, often pink-tinged, scented)."],["Habitat","Sandy soils over limestone or granite on the Swan Coastal Plain."],["Local note","Two subspecies exist – label seed by subspecies and provenance. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles split and drop seed soon after ripening. <b>Tie fine mesh or stocking bags over maturing follicles<\/b> and collect once they open."],["Extraction & cleaning","Seed usually falls into the bag; remove follicle debris."],["Seed quality","Cut-test a few seeds – good seed is firm and white inside."],["Storage life","Not well documented. Store dry, sealed and cool."],["Typical germination","Not recorded. Untreated seed can take 1–2 years to germinate."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool autumn). Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>Nick the seed coat<\/b> with a scalpel (or peel it off after a short soak), then soak in smoke water for 24 hours. Gibberellic acid (GA) can also help (WA <i>Grevillea<\/i> seed notes)."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes – seedlings have a taproot."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","A few weeks for treated seed; untreated seed can take <b>1–2 years<\/b>."],["Pricking out","If tray-sown, prick out early at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination after months","Seed coat not treated. Nick or peel, then smoke water."],["Seedlings yellow or die","Phosphorus toxicity or root rot. Low-P mix and feed; good hygiene."],["Seedlings differ from parent","Normal for seed. Use cuttings to keep a particular form."]],"other":"Cuttings are the main method and keep the parent's form (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 11 – Grevillea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01998.pdf"},{"title":"ANPSA – Grevillea vestita profile (grows reasonably easily from seed)","url":"anpsa.org.au/plant_profiles/grevillea-vestita/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Firm current season's growth strikes reliably.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Grows reasonably easily from seed; seedlings vary from the parent.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Can sucker – lift rooted suckers.","guide":null}]},{"id":"hakea-lissocarpha","sci":"Hakea lissocarpha","common":"Honey Bush","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (41 tests) and WA <i>Hakea<\/i> seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","66%"],["Seed per 100 plants","2.0 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Erect to sprawling, prickly shrub, 0.4–1.5 (–3) m."],["Flowering","May – Sep (scented white-cream, yellow or pink)."],["Habitat","White, grey or yellow sand, sandy loam, granitic soils and laterite."],["Local note","Recorded in the Wanneroo LGA. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Woody fruits usually hold their seed for at least a year. Collect mature, closed fruits."],["Extraction & cleaning","Keep fruits in a paper bag in a warm, dry place – they open after several days to several weeks. If they won't open, oven at about <b>125°C for 1 hour<\/b>. Each fruit holds two winged seeds."],["Seed quality","Cut-test a few seeds."],["Storage life","<b>Long<\/b> – viable for many years stored dry and cool."],["Typical germination","About <b>66%<\/b> (untreated, Alcoa nursery average, 41 tests). About <b>50 seedlings per gram<\/b> – roughly 2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Direct sow 1–2 seeds per tube, covered about <b>3–5 mm<\/b>."],["After sowing","Water in; keep moist, not wet. Watch for damping off."],["Germination time","About <b>3–6 weeks<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, good airflow, bottom watering."],["Yellowing seedlings","Phosphorus toxicity. Very low-P feed only."],["Fruits won't open","Warm them longer, or use the oven method."]],"other":"Hakea cuttings are harder than seed; seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 66% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"hakea-prostrata","sci":"Hakea prostrata","common":"Harsh Hakea","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data from 30 tests and WA <i>Hakea<\/i> seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","79%"],["Seed per 100 plants","4.9 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Erect to spreading or prostrate shrub, 1–3 m, with stiff, prickly-edged leaves. No lignotuber."],["Flowering","Jul – Oct (white-cream)."],["Habitat","Sandy soils, often over laterite; hillslopes, granite outcrops and coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Extremely phosphorus-sensitive. Prostrate coastal forms exist – label by form."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","<b>Unlike most hakeas, it releases seed when the fruit ripens<\/b> (WA Hakea seed notes). Bag maturing fruits with mesh, or pick them just before they split."],["Extraction & cleaning","Keep fruits in a paper bag in a warm, dry place until they open; each holds two winged seeds."],["Seed quality","Cut-test a few seeds."],["Storage life","<b>Long<\/b> – viable for many years stored dry and cool."],["Typical germination","About <b>79%<\/b> (untreated, Alcoa nursery average, 30 tests). About <b>21 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free mix with <b>no added phosphorus<\/b>."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Direct sow 1–2 seeds per tube, covered about <b>3–5 mm<\/b>."],["After sowing","Water in; keep moist, not wet. Watch for damping off."],["Germination time","About <b>3–6 weeks<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings yellow and die","Phosphorus toxicity – this species is extremely sensitive. No P in mix or feed."],["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Fruits empty when collected","Seed already shed. Bag fruits earlier."]],"other":"Bird and bee attracting. Hakea cuttings are harder than seed.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"},{"title":"Shane M.W. et al. (2004) Plant, Cell & Environment – A root trait accounting for the extreme phosphorus sensitivity of Hakea prostrata","url":"onlinelibrary.wiley.com/doi/full/10.1111/j.1365-3040.2004.01204.x"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; bag fruit – it sheds seed when ripe.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"hakea-trifurcata","sci":"Hakea trifurcata","common":"Two-leaf Hakea","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data from 26 tests and WA <i>Hakea<\/i> seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","69%"],["Seed per 100 plants","1.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Rounded or open shrub, 1.5–3 m high and to 3.5 m wide. Two leaf shapes: needle-like and flat."],["Flowering","Apr – Oct (white to cream-pink)."],["Habitat","White, grey or brown sand over limestone or laterite, loam and gravel."],["Local note","Recorded in Joondalup and Wanneroo. Doesn't resprout after fire."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruits <b>stay green when mature<\/b> and look like the flat leaves, so they're easy to miss. Collect full-sized, closed fruits."],["Extraction & cleaning","Keep fruits in a paper bag in a warm, dry place until they open (several days to weeks), or oven at about 125°C for 1 hour."],["Seed quality","Cut-test a few seeds."],["Storage life","<b>Long<\/b> – viable for many years stored dry and cool."],["Typical germination","About <b>69%<\/b> (untreated, Alcoa nursery average, 26 tests). About <b>58 seedlings per gram<\/b> – roughly 1.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Direct sow 1–2 seeds per tube, covered about <b>3–5 mm<\/b>."],["After sowing","Water in; keep moist, not wet. Watch for damping off."],["Germination time","About <b>3–6 weeks<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Yellowing seedlings","Phosphorus toxicity. Very low-P feed only."],["Can't find fruit","They're green and leaf-like – check along the stems among the flat leaves."]],"other":"Bird and bee attracting. Hakea cuttings are harder than seed.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"},{"title":"Wikipedia – Hakea trifurcata (green fruit at maturity; no resprouting)","url":"en.wikipedia.org/wiki/Hakea_trifurcata"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 69% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"hardenbergia-comptoniana","sci":"Hardenbergia comptoniana","common":"Native Wisteria","family":"Fabaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA reports cuttings of firm current season's growth strike well; size follows ANPSA pea-family guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Vigorous twining climber or scrambling shrub."],["Flowering","Jul – Oct (blue-purple, occasionally white)."],["Habitat","Sandy soils; coastal limestone, sandplains and dunes."],["Local note","Recorded in Joondalup and Wanneroo. More vigorous than <i>H. violacea<\/i> – can smother small shrubs."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b>, once the current season's growth has firmed after spring flowering. Nov and Apr are workable. Avoid May – Oct (cool, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","<b>50–75 mm<\/b>, the length ANPSA suggests for pea-family cuttings. One runner gives several pieces."],["Selecting material","Healthy runners without flowers or pods."],["Pre-treatment","• Remove the leaves from the lower two-thirds.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Stake or trim runners so tubes don't tangle; pot on promptly."]]}],"difficulty_note":"<b>Easy–Moderate.<\/b> Cuttings strike well. Seed is also easy after hot-water treatment.","problems":[["Cuttings wilt","Material too soft. Use firmer growth; keep humidity up until rooted."],["Runners tangle between tubes","Space tubes; trim or stake runners."],["Base rotting","Mix too wet. Water less."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Pea family (Fabaceae) genus page (50–75 mm cuttings, leaves off the lower two-thirds)","url":"anpsa.org.au/genera/pea-family/"},{"title":"ANPSA – Hardenbergia comptoniana profile (cuttings of firm current season's growth strike well)","url":"anpsa.org.au/plant_profiles/hardenbergia-comptoniana/"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (34 tests) plus a WA community-nursery method.","facts":[["Pre-treatment","Hot water (or boil 30 s); smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","31%"],["Seed per 100 plants","5.3 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Vigorous twining climber or scrambling shrub."],["Flowering","Jul – Oct (blue-purple, occasionally white)."],["Habitat","Sandy soils; coastal limestone, sandplains and dunes."],["Local note","Recorded in Joondalup and Wanneroo. More vigorous than <i>H. violacea<\/i> – can smother small shrubs."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen and split in late spring–summer. Bag developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded – the impervious coat must be broken. Float test: discard seed that floats."],["Storage life","<b>Long<\/b> – seed keeps its viability for many years (ANPSA)."],["Typical germination","About <b>31%<\/b> after boiling-water treatment (Alcoa nursery average, 34 tests). About <b>19 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer at 95°C for 2 minutes, pour over the seed and soak 24 hours, then <b>soak 24 hours in smoke water<\/b> (Geraldton method). Alcoa used a 30 s boil instead. Sow the swollen seed."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months. Give tubes a short stake or trim runners so they don't tangle."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Mix too wet. Water less."],["Tangled seedlings","Space tubes and trim or stake runners."]],"other":"Cuttings of firm current season's growth also strike well (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Hardenbergia comptoniana profile (easy from treated seed; long-lived seed; cuttings)","url":"anpsa.org.au/plant_profiles/hardenbergia-comptoniana/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Firm current season's growth strikes well.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Hot water + smoke water; about 10 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"hemiandra-pungens","sci":"Hemiandra pungens","common":"Snakebush","family":"Lamiaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says it is relatively easy from cuttings; timing and size follow standard practice.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Oct – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","P","-","-","-","-","P","B","B","B"],"snapshot":[["Habit","Prostrate to ascending shrub, 0.05–1 m, with sharp, prickly leaves."],["Flowering","Throughout the year (white, blue-purple or pink)."],["Habitat","Sand, clay, loam, gravel, laterite and granite; rock outcrops."],["Local note","Recorded in Joondalup and Wanneroo. Resistant to dieback. Wear gloves when collecting."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Oct – Mar<\/b>, in the warm months while plants are growing actively. Sep and Apr are workable. Avoid May – Aug (slow rooting)."],["Wood type","<b>Softwood to semi-hardwood<\/b> tips."],["Cutting size","50–75 mm tip cuttings."],["Selecting material","Plants flower all year – choose tips without open flowers and snip off any buds."],["Pre-treatment","• Wear gloves – the leaves are prickly.<br/>• Strip leaves from the lower half.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer ones."],["Propagation mix","Very free-draining mix."],["Environment","Bright shade and bottom heat, with light misting and good airflow – plants are unreliable in humid conditions."],["Expected strike time","Not documented – check from about 3–4 weeks and record the result."],["Post-treatment / aftercare","• Harden off promptly; grow on in full sun.<br/>• Free-draining mix; don't overwater."]]}],"difficulty_note":"<b>Easy.<\/b> ANPSA describes it as relatively easy to propagate from cuttings.","problems":[["Cuttings rot","Too humid or wet. Mist less and improve airflow."],["Cuttings flower","Taken from flowering tips. Snip off buds and choose non-flowering shoots."],["Slow in winter","Use bottom heat, or wait for the warm window."]],"other":"Seed – rarely available and germinates poorly (about 4% untreated in Alcoa nursery tests). Grafting onto <i>Westringia fruticosa<\/i> is used where plants struggle.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – Hemiandra pungens profile (relatively easy from cuttings; unreliable in humid conditions; grafting)","url":"anpsa.org.au/plant_profiles/hemiandra-pungens/"},{"title":"Gardening With Angus – Hemiandra pungens (softwood and semi-hardwood cuttings)","url":"gardeningwithangus.com.au/hemiandra-pungens-snake-plant/"},{"title":"APACE WA – Hemiandra pungens (dieback resistant)","url":"apacewa.org.au/plant/hemiandra-pungens/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Relatively easy from soft to semi-hardwood tips.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Rarely available; about 4% germination in nursery tests.","guide":null},{"method":"Division","suitability":"Not used","note":"Not documented.","guide":null}]},{"id":"hibbertia-cuneiformis","sci":"Hibbertia cuneiformis","common":"Cutleaf Hibbertia","family":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Commonly propagated from cuttings in the nursery trade; little published detail on timing or strike rate.","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["P","P","B","B","B","-","-","-","-","P","P","P"],"snapshot":[["Habit","Erect or sprawling shrub, 0.5–3 m (usually 1–2 m). Wedge-shaped leaves, toothed near the tip."],["Flowering","Jan – Mar or Jun – Nov (yellow)."],["Habitat","Coastal sand dunes and swampy places near the coast."],["Local note","Recorded in the City of Joondalup. One of the more vigorous hibbertias – useful for screening."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, between the summer and winter flowering periods, once new growth has firmed. Oct – Feb is workable using non-flowering shoots. Avoid Jun – Sep (cool, and plants are flowering)."],["Wood type","<b>Semi-hardwood<\/b> – current season's growth that has begun to firm."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants. Snip off any buds."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Reduce large leaves by about one-third.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Very free-draining, sand-based mix. Use fresh mix and clean tubes – hibbertias are prone to <i>Phytophthora<\/i>."],["Environment","Humid frame, bright shade, bottom heat. Moist, never wet; good airflow."],["Expected strike time","Roughly <b>4–8 weeks<\/b> in warm weather (typical for the genus). Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; avoid overwatering.<br/>• Tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Commonly grown from cuttings. Hibbertias usually strike well, but <i>H. hypericoides<\/i> shows not every WA species does – set extra cuttings until your strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage, use clean mix, remove affected cuttings."],["Cuttings flower instead of rooting","Material taken from flowering shoots. Use non-flowering shoots."],["Slow to strike","Cool weather. Use bottom heat or wait for the Mar – May window."]],"other":"Seed – 0% germination in the one Alcoa nursery test; <i>Hibbertia<\/i> seed has complex dormancy. Layering – check low, sprawling stems for roots.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"Peppy Plants – Hibbertia cuneiformis (propagated by cuttings)","url":"peppyplants.com.au/hibbertia-cuneiformis-unveiling-the-charms-of-the-cutleaf-hibbertia/"},{"title":"Wikipedia – Hibbertia cuneiformis (description, flowering, habitat)","url":"en.wikipedia.org/wiki/Hibbertia_cuneiformis"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Commonly propagated by cuttings.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"0% in a nursery test; Hibbertia seed is dormant.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"hibbertia-hypericoides","sci":"Hibbertia hypericoides","common":"Yellow Buttercups","family":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Difficult","provisional":false,"confidence":"Low","confidence_note":"Its difficulty is well documented (DBCA; specialist WA nurseries), but no detailed cutting protocol is published. Treat the method below as a trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Feb"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA (trial range)"]],"length_mm":[50.0,75.0],"calendar":["B","B","P","-","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Spreading shrub, 0.3–0.8 m. Densely hairy branches; small leaves with rolled edges and white-hairy undersides."],["Flowering","Apr – Nov (bright yellow, notched petals)."],["Habitat","Sandy soils in Banksia woodland and shrubland; one of the most common understorey plants between Perth and Albany. Resprouts from its rootstock after fire."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Feb<\/b>, after flowering finishes and once the new flush has started to firm. Nov and Mar are workable. Avoid Apr – Oct (flowering period)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that is just firming. Soft tips wilt quickly; old wood rarely roots."],["Cutting size","50–75 mm."],["Selecting material","Vigorous <b>non-flowering<\/b> shoots. Well-watered, actively growing stock plants (e.g. nursery-held stock) usually give better material than stressed bushland plants."],["Pre-treatment","• Strip lower leaves by cutting, not pulling.<br/>• Light wound on the firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Start with 3 g/L IBA (<b>Clonex Purple<\/b>). Because results are unreliable, split trial batches across 1.5, 3 and 8 g/L (Green, Purple, Red) and record which works best."],["Propagation mix","Very free-draining, fresh, clean mix. Strict hygiene – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bottom heat, bright shade. Mist lightly – the hairy leaf undersides hold water. Good airflow."],["Expected strike time","Slow and variable – allow <b>8–16 weeks<\/b>. Leave cuttings in as long as they stay green and healthy."],["Post-treatment / aftercare","• Harden off slowly (extend each stage if cuttings wilt).<br/>• Pot on gently, disturbing roots as little as possible.<br/>• Avoid overwatering; keep benches clean."]]}],"difficulty_note":"<b>Difficult.<\/b> DBCA notes it is difficult to grow from seed or cuttings, and specialist Perth nurseries describe it as a species other producers often fail with. Set large batches and keep detailed records.","problems":[["Cuttings stay green but don't root","Leave longer; check for heavy callus and trim it; try a different hormone strength."],["Cuttings collapse or rot","Too wet or root rot. Improve drainage and hygiene; remove affected cuttings."],["Rooted cuttings die after potting on","Roots damaged or hardening too fast. Use single tubes and harden off more slowly."]],"other":"Seed – also difficult: WA <i>Hibbertia<\/i> seed has complex dormancy, and treatments are still the subject of research. If numbers are needed quickly, consider buying in tubestock from a specialist grower.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"},{"title":"Natural Area Nursery – WA native plant propagation (H. hypericoides difficult to propagate)","url":"naturalarea.com.au/revegetation-plant-production/wa-native-plant-propagation/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"},{"title":"PMC – Sympatric species of Hibbertia vary in dormancy break and germination requirements","url":"pmc.ncbi.nlm.nih.gov/articles/PMC3336950"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Known to be difficult; trial protocol on the cuttings page.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Complex seed dormancy; rarely practical.","guide":null},{"method":"Division","suitability":"Not used","note":"Resprouts from a rootstock; not practical to divide.","guide":null}]},{"id":"hibbertia-racemosa","sci":"Hibbertia racemosa","common":"Stalked Guinea Flower","family":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on how the genus behaves and this species' growth cycle.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Small erect or ascending, spreading shrub, 0.1–0.75 m."],["Flowering","Jul – Dec (yellow, on long stalks)."],["Habitat","Grey, white or yellow sand in coastal areas: dunes, plains and limestone."],["Local note","Recorded in the City of Joondalup. Grey-leaved and prostrate forms are sold in the trade – keep forms separate and labelled."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, after flowering finishes and new growth has begun to firm. Dec and May are workable. Avoid Jun – Nov (cool weather, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that has started to harden. Firm tip cuttings also work."],["Cutting size","50–75 mm long. Stems are fine and leaves small, so keep cuttings short."],["Selecting material","<b>Non-flowering<\/b> side shoots from healthy plants. Snip off any flower stalks or buds."],["Pre-treatment","• Strip leaves from the lower half (cut rather than pull on fine stems).<br/>• Wounding not needed on fine stems; a light wound is optional on firmer material.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength (3 g/L IBA, e.g. <b>Clonex Purple<\/b>). For softer tips use softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>)."],["Propagation mix","Very free-draining, sand-based mix. Use fresh, clean mix and clean tubes – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bright shade, bottom heat. Keep the mix moist but never wet; good airflow."],["Expected strike time","Roughly <b>4–8 weeks<\/b> in warm weather; may be slower. Record your results."],["Post-treatment / aftercare","• Standard hardening off (2 weeks closed by day/open at night, then 2 weeks shade).<br/>• Pot on into a free-draining native mix; avoid overwatering.<br/>• Keep good hygiene on benches to limit root rot."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Hibbertias are generally easy from cuttings, but some WA species (e.g. <i>H. hypericoides<\/i>) are known to be difficult. Set larger batches until your own strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage, use clean mix, remove affected cuttings."],["Few roots, cuttings flower","Material was taken from flowering shoots. Use non-flowering side shoots."],["Slow to strike in winter","Use bottom heat, or wait for the Jan – Apr window."]],"other":"Seed – generally unreliable in <i>Hibbertia<\/i> (complex dormancy). Layering – several hibbertias root where stems touch the ground; check low stems on prostrate forms and pot up any rooted pieces.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Hibbertia vestita profile (genus note: easy from cuttings, seed unreliable)","url":"anpsa.org.au/plant_profiles/hibbertia-vestita/"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Semi-hardwood cuttings (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Hibbertia seed is dormant and unreliable.","guide":null},{"method":"Division","suitability":"Possible","note":"Low stems may root where they touch the soil (layering).","guide":null}]},{"id":"hovea-pungens","sci":"Hovea pungens","common":"Devil's Pins","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data available for this species; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","4–6 mm"],["Typical germination","41%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, prickly, broom-like shrub, 0.2–1.8 m."],["Flowering","May – Nov (blue-purple)."],["Habitat","Wide range: shallow soils on rock, sand, laterite, gravel, clay and loam; granite outcrops, coastal limestone and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Sharp leaves – wear gloves when collecting."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in late spring to summer and <b>eject seed when ripe<\/b>. Bag developing pods with stockings or muslin."],["Extraction & cleaning","Collect seed from the bags; sieve out pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps for many years when dry (typical of hard-coated pea-family seed)."],["Typical germination","About <b>41%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over the seed and soak overnight. Sow swollen seed; re-treat any that haven't swollen."],["Sowing depth & method","Larger seed – cover about <b>4–6 mm<\/b> (roughly twice its thickness). Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","If tray-sown, prick out at the cotyledon stage – early, as the taproot grows fast."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or mix too wet. Keep to 30 s; water less."],["Taproot damage at pricking out","Pricked out too late. Direct sow into tubes instead."]],"other":"Wear gloves – the pungent (sharp) leaves make handling seedlings and stock plants prickly.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"hovea-trisperma","sci":"Hovea trisperma","common":"Common Hovea","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 25 tests; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","31%"],["Seed per 100 plants","4.4 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Straggling, weak to ascending shrub, 0.1–0.7 m."],["Flowering","May – Nov (purple-blue)."],["Habitat","Sandy soils, laterite, gravel and clay loam."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods shed seed as soon as they are ripe (late spring–summer). Bag developing pods with fine mesh."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","About <b>31%<\/b> after boiling-water treatment (Alcoa nursery average, 25 tests). About <b>23 seedlings per gram<\/b> – roughly 4.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. Sow the swollen seed; re-treat the rest."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Grows well under taller shrubs – a good understorey plant.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Pea family (Fabaceae) genus page: boiling-water pre-treatment, cuttings","url":"anpsa.org.au/genera/pea-family/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"hypocalymma-robustum","sci":"Hypocalymma robustum","common":"Swan River Myrtle","family":"Myrtaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says cuttings are the preferred method and strike readily; size and treatment follow the related Geraldton wax group.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Mar"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Erect shrub, 0.4–1 (–1.5) m."],["Flowering","Jun – Nov (pink to pink-red, along the stems)."],["Habitat","Gravelly lateritic soils and sandy soils; undulating ground and ridges."],["Local note","Recorded in Joondalup and Wanneroo. Prune yearly for a dense, bushy plant."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b> (January is suggested for the Geraldton wax group), once the current season's growth has hardened. Nov and Apr are workable. Avoid May – Oct (cool, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth (ANPSA)."],["Cutting size","75–100 mm."],["Selecting material","Non-flowering tips from healthy plants."],["Pre-treatment","• Carefully remove the leaves from the lower two-thirds.<br/>• Wound the base.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>) – wounding and hormone both improve results."],["Propagation mix","Standard free-draining cutting mix. Clean mix and tubes – the genus includes dieback-affected species."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – usually quick; check from about 4 weeks."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; tip-prune for bushiness."]]}],"difficulty_note":"<b>Easy.<\/b> Cuttings are the preferred method and strike readily (ANPSA).","problems":[["Cuttings brown off","Too soft or too dry. Use hardened growth; keep humidity up."],["Base rotting","Mix too wet. Water less, improve drainage."],["Leggy plants","Not pruned. Tip-prune young plants."]],"other":"Seed – possible; smoke water is likely to help (about 35% in a single Alcoa test with smoke).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – Hypocalymma robustum profile (cuttings preferred, strike readily from hardened growth)","url":"anpsa.org.au/plant_profiles/hypocalymma-robustum/"},{"title":"ANPSA – Geraldton wax and relatives (75–100 mm cuttings in January, strip lower two-thirds, wound, hormone)","url":"anpsa.org.au/genera/geraldton-wax-and-relatives/"},{"title":"Gardening With Angus – Hypocalymma robustum (softwood and semi-hardwood cuttings)","url":"gardeningwithangus.com.au/hypocalymma-robustum-swan-river-myrtle/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Strikes readily from hardened current season's growth.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Smoke water likely helps; about 35% in one test.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"jacksonia-furcellata","sci":"Jacksonia furcellata","common":"Grey Stinkwood","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 11 tests; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","34%"],["Seed per 100 plants","2.1 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Prostrate to weeping, erect shrub, 0.4–4 (–6) m, with grey, leafless-looking stems."],["Flowering","Oct – Dec or Jan – Mar (yellow and orange-red)."],["Habitat","Sandy soils; sandplains, rises, swampy depressions and river banks."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pea pods can burst open when ripe, leaving only a short window. Bag developing pods with fine mesh and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","About <b>34%<\/b> after boiling-water treatment (Alcoa nursery average, 11 tests). About <b>48 seedlings per gram<\/b> – roughly 2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. A 24 h smoke-water soak afterwards is used for another WA <i>Jacksonia<\/i> at Geraldton. Sow the swollen seed."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"No cutting data found for WA Jacksonia – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, lcoa, only 1 test). About <b>84 seedlings per gram<\/b> – roughly 1.2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. Sow the swollen seed."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Record every batch – the germination figure is from a single test.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Cottesloe Coastcare Association – plant pages (Rhagodia baccata, Spinifex longifolius, Jacksonia sericea)","url":"cottesloecoastcare.org"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented for WA species.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"jacksonia-sternbergiana","sci":"Jacksonia sternbergiana","common":"Stinkwood / Green Stinkwood","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 9 tests; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","33%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, weeping shrub or small tree, 1.5–5 m."],["Flowering","Throughout the year (yellow-orange)."],["Habitat","Sandy soils along rivers and creeks, near swamps, flats and dunes."],["Local note","Recorded in the Wanneroo LGA. Food plant for several butterfly larvae."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods can burst open when ripe. Bag developing pods with fine mesh and collect once they split. Plants flower through the year, so check for ripe pods often."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","About <b>33%<\/b> after boiling-water treatment (Alcoa nursery average, 9 tests). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. Sow the swollen seed."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"No cutting data found for WA Jacksonia – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented for WA species.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"kennedia-prostrata","sci":"Kennedia prostrata","common":"Scarlet Runner / Running Postman","family":"Fabaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA reports cuttings of firm current season's growth strike well; timing and size follow standard practice.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Mar"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Prostrate or twining groundcover, spreading to about 2.5 m."],["Flowering","Apr – Nov (red pea flowers)."],["Habitat","Usually sandy, gravelly soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b>, when the current season's runners have firmed. Nov and Apr are workable. Avoid May – Oct (flowering and cool weather)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","75–100 mm with 2–3 nodes. One runner can be cut into several pieces."],["Selecting material","Healthy runners without flowers or pods."],["Pre-treatment","• Remove the leaves from the lower nodes; cut remaining leaflets back by about half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on promptly – runners tangle across the bench. Trim runners to keep tubes tidy."]]}],"difficulty_note":"<b>Easy–Moderate.<\/b> Cuttings of firm growth strike well. Seed is quick and is the usual nursery method.","problems":[["Cuttings wilt and collapse","Material too soft. Use firmer runners and keep humidity up."],["Runners tangled between tubes","Space tubes out and trim runners regularly."],["Base rotting","Mix too wet. Water less, improve drainage."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Kennedia prostrata profile (cuttings of firm current season's growth)","url":"anpsa.org.au/plant_profiles/kennedia-prostrata/"}]},"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data, WA community-nursery method and ANPSA notes agree.","facts":[["Pre-treatment","Hot water + smoke water"],["Best sowing","Mar – May"],["Sowing depth","About 5 mm"],["Typical germination","30%"],["Seed per 100 plants","8.3 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Prostrate or twining groundcover, spreading to about 2.5 m."],["Flowering","Apr – Nov (red pea flowers)."],["Habitat","Usually sandy, gravelly soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods (about 50 mm) ripen in late spring to summer and split when ripe – bag them or collect as they turn brown."],["Extraction & cleaning","Dry pods in paper bags and collect the seed."],["Seed quality","Impervious seed coat – dormant until treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Seed maintains viability for extended periods."],["Typical germination","About <b>30%<\/b> after dry heat (100°C, 3 h; Alcoa). About <b>12 seedlings per gram<\/b> – roughly 8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer water at 95°C for 2 minutes, pour over the seed (at least 10:1 water to seed) and soak 24 hours, then soak 24 hours in smoke water (Geraldton method). Alternatives: boiling water, abrasion, or dry heat 100°C for 3 hours."],["Sowing depth & method","Larger seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>8 days<\/b> (Geraldton nursery)."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Runners tangle in the nursery","Space tubes out; trim runners before dispatch."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Cuttings of firm current season's growth also strike well.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3
