sistent."],["<b>Medium<\/b>","Built from genus-level information plus the species' own traits (habit, leaf type, flowering time). Sound starting point – verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard cutting method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Collect<\/b>","Take material early in the morning from healthy, pest-free, well-watered, <b>non-flowering<\/b> stock. Seal in a moist plastic bag and keep in an esky out of the sun. Process the same day."],["<b>2. Prepare<\/b>","Use a sharp, clean blade (wipe with alcohol between stock plants). Cut just below a node. Strip leaves from the lower half to two-thirds without tearing the bark. Reduce large leaves by about one-third. Remove flowers and buds."],["<b>3. Wound (optional)<\/b>","On firmer stems, remove a thin sliver of bark from the bottom 15–20 mm to expose more rooting area."],["<b>4. Hormone<\/b>","Decant a small amount into a clean container, dip the base to about 1 cm, and discard what's left. Store hormone in the fridge – it has a limited shelf life."],["<b>5. Set<\/b>","Make a hole with a dibber so the hormone isn't wiped off, insert to the bottom of the hole, and firm the mix. Single tubes make potting on easier than community pots."],["<b>6. Environment<\/b>","Water in and place in a humid frame or propagation house in bright shade. Bottom heat so the base is 5–10°C warmer than the air. Keep the mix moist, not wet. Mist sparingly on hairy-leaved species."],["<b>7. Check<\/b>","Most cuttings strike in 4–8 weeks in warm weather. Look for roots at the drainage holes. Remove any rotting cuttings promptly."],["<b>8. Harden off<\/b>","About 2 weeks with cover closed by day and open at night, then about 2 weeks in shade, then into the open. Many struck cuttings are lost by skipping this step."],["<b>9. Pot on<\/b>","After 1–3 months, pot on into larger containers. Don't let roots become pot-bound."]]}]},{"title":"Rooting hormone guide","level":2,"blocks":[{"type":"table","rows":[["Product (example)","IBA strength","Use for"],["Clonex Green","1.5 g/L","Softwood and soft tip cuttings"],["Clonex Purple","3 g/L","Semi-hardwood – the general all-rounder"],["Clonex Red","8 g/L","Hardwood cuttings"]]},{"type":"p","html":"Equivalent powders or liquids work too – match the strength to the wood type. Callus forming without roots usually means the hormone is too strong for that material.","small":true}]},{"title":"Mix, hygiene and collecting","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>Propagation mix<\/b>","About 75–80% washed coarse river sand with 20–25% coir or peat. Add extra perlite or coarse sand for rot-prone species."],["<b>Hygiene<\/b>","Fresh mix, clean tubes and benches. Many WA natives (including <i>Hibbertia<\/i> and <i>Grevillea<\/i>) are susceptible to <i>Phytophthora<\/i>. Discard diseased cuttings; use fungicide only if a problem persists."],["<b>Collecting<\/b>","Collecting from bushland generally requires a DBCA flora licence and landholder permission. Use local-provenance stock and label every batch with its source."]]}]}],"seed":[{"title":"Pre-treatments explained","level":1,"blocks":[{"type":"p","html":"Many WA species have seed dormancy that must be broken before they will germinate. The species pages say which treatment to use.","small":false},{"type":"table","rows":[["Treatment","How to do it","Used for"],["<b>None<\/b>","Sow untreated seed. Remove from cones or follicles first where needed.","<i>Allocasuarina<\/i>, <i>Banksia<\/i>"],["<b>Boiling water (30 s)<\/b>","Drop seed into boiling water for 30 seconds, then drain and cool (Alcoa Marrinup method).","Hard-seeded peas, e.g. <i>Daviesia<\/i>, <i>Hovea<\/i>"],["<b>Hot water soak<\/b>","Pour near-boiling water over the seed (at least 10 parts water to 1 part seed) and leave to cool and soak overnight. Sow the seed that has swollen (1.5–2× its size); re-treat the rest.","Hard-seeded peas"],["<b>Dry heat<\/b>","Spread seed on a tray in a pre-heated oven. Peas: 80–120°C for 10 min to 1 hour. Kangaroo paw: 100°C for 3 hours.","<i>Gompholobium<\/i>, <i>Anigozanthos<\/i>"],["<b>Smoke water<\/b>","Soak seed for up to 24 hours in diluted smoke water (e.g. 1:9), or water trays with it after sowing. Also has slight antifungal properties.","Fire-responsive species, e.g. <i>Anigozanthos<\/i> (optional for others)"],["<b>Aged seed<\/b>","Store seed dry at room temperature for one or more years before sowing – dormancy fades with time (after-ripening).","<i>Anigozanthos<\/i>"],["<b>Ferment<\/b>","Soak ripe fleshy fruit or berries in water for 4–5 days, wash the pulp off through a sieve, then dry the seed.","<i>Carpobrotus<\/i>, <i>Myoporum<\/i>, <i>Rhagodia<\/i>"],["<b>Long soak<\/b>","Soak for 4 days, changing the water 3 times a day, to wash germination inhibitors out of the fruit.","<i>Atriplex<\/i>"],["<b>Clean or nick<\/b>","Remove whatever blocks germination: the woolly floral parts (<i>Ptilotus<\/i>), the fleshy coat (<i>Macrozamia<\/i>), or nick the seed coat with a scalpel (<i>Grevillea<\/i>, <i>Petrophile<\/i>).","<i>Ptilotus<\/i>, <i>Macrozamia<\/i>, <i>Grevillea<\/i>, <i>Petrophile<\/i>"]]},{"type":"p","html":"<b>Safety:<\/b> boiling water and hot ovens scald – use tongs, strainers, heat-proof containers and gloves.","small":true}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Germinates reliably with the standard method; few losses."],["<b>Easy–Moderate<\/b>","Germinates well, but one factor needs care (e.g. damping off, extraction, low fill)."],["<b>Moderate<\/b>","Needs the right pre-treatment and timing; germination may be low or variable."],["<b>Moderate–Difficult<\/b>","Low or erratic germination; specialist treatment usually needed."],["<b>Difficult<\/b>","Very low germination from seed; cuttings or other methods usually preferred."]]}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific germination data and handling guidance are published."],["<b>Medium<\/b>","Some species data (e.g. few tests) plus genus-level guidance. Verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard sowing method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Seed mix<\/b>","Sterile, free-draining, low-nutrient mix: about <b>80–85% washed river sand + 15–20% coir or peat<\/b>, or a commercial native seed-raising mix. Use fresh mix and clean trays. Pre-moisten before sowing."],["<b>2. Check the seed<\/b>","Label every lot (species, provenance, collection date). Cut-test a few seeds – good seed is firm and white inside. For peas, a float test removes damaged seed."],["<b>3. Pre-treat<\/b>","Use the treatment on the species page (see Pre-treatments explained). Sow soon after hot-water treatment."],["<b>4. Sow<\/b>","Cover to about <b>twice the seed's thickness<\/b>. Fine seed: sprinkle on the surface and press in lightly, or cover with a thin layer of fine sand or vermiculite. Large seed (e.g. <i>Banksia<\/i>, peas): sow direct into tubes to avoid pricking-out damage."],["<b>5. Water in (post-treatment)<\/b>","Water with a fine spray – smoke water is a useful first watering (slight antifungal effect, more even germination). Keep moist, never wet. A capillary bed lets you water from below."],["<b>6. Germinate<\/b>","Shaded, sheltered, protected from rain and drying wind. Check daily. Watch for damping off, snails and slugs."],["<b>7. Prick out<\/b>","When seedlings can be handled – usually when the <b>second pair of leaves<\/b> appears; earlier for taprooted species. Lift with a narrow spatula, hold by the leaves, not the stem, and firm mix around the roots with a gentle spray."],["<b>8. Shade house<\/b>","About <b>2 weeks<\/b> in the shade house after pricking out. Don't let tubes dry out (a capillary bed helps)."],["<b>9. Harden off<\/b>","Move gradually into full sun over <b>2–4 weeks<\/b>. Pot on to larger containers after 1–3 months if needed; don't let roots become pot-bound."]]}]},{"title":"Seed storage","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>General rule<\/b>","Dry the seed (air-dry or desiccator, never an oven), seal it in labelled airtight containers and keep it cool and dark, away from vermin. A sealed fridge is good; freezing suits many species but not all."],["<b>Exceptions<\/b>","<i>Anigozanthos manglesii<\/i> lost germination at –18°C – store at room temperature or cooler, not frozen. <i>Allocasuarina<\/i> and <i>Banksia<\/i> seed is short-lived once out of the cone – store in the cone, or dry and cool. <i>Macrozamia fraseri<\/i> seed is shed moist and is damaged by cold, dry storage – sow it fresh."],["<b>Long-lived<\/b>","Hard-coated pea seed keeps many years dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["<b>Collecting<\/b>","Collecting from bushland generally needs a DBCA licence and landholder permission. Collect only ripe seed from many plants to keep genetic diversity."]]}]},{"title":"Hygiene and damping off","level":2,"blocks":[{"type":"p","html":"Damping off (<i>Pythium<\/i>, <i>Rhizoctonia<\/i>) rots seedlings at soil level, especially in wet, crowded trays. Prevent it with sterile mix, clean trays, thin sowing, good airflow and bottom watering. Remove affected seedlings quickly and use a registered fungicide only if the problem persists. Keep pots off the ground to reduce <i>Phytophthora<\/i> risk.","small":true}]}],"division":[{"title":"Types of division","level":1,"blocks":[{"type":"table","rows":[["Type","What it is","Examples"],["<b>Clump / rhizome<\/b>","Grass-like clumps with a creeping underground stem. Cut into pieces of rhizome, each with shoots and roots.","<i>Anigozanthos<\/i>, <i>Dianella<\/i>, <i>Lomandra<\/i>, <i>Patersonia<\/i>"],["<b>Tussock<\/b>","True grasses. Split a clump into smaller clumps of shoots (tillers) with roots.","<i>Austrostipa<\/i>, <i>Spinifex<\/i>"],["<b>Suckers<\/b>","New shoots arising from roots a short way from the parent. Dig up with roots attached and pot individually.","Some <i>Lechenaultia<\/i>, <i>Scaevola<\/i>, <i>Grevillea<\/i>"],["<b>Layering<\/b>","Stems that root where they touch the soil. Cut into rooted pieces and pot up, or pin a stem into a pot beside the parent.","<i>Hibbertia<\/i>, <i>Carpobrotus<\/i>, spinifex runners"]]},{"type":"p","html":"Based on ANPSA's propagation notes (source 1).","small":true}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Divisions re-establish reliably with the standard method."],["<b>Easy–Moderate<\/b>","Usually re-establish; one factor (e.g. moisture, size of piece) needs care."],["<b>Moderate<\/b>","Re-establish, but results depend on timing, piece size and aftercare."],["<b>Moderate–Difficult<\/b>","Many divisions fail; another method is usually better."],["<b>Difficult<\/b>","Rarely successful; use another method."]]}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","A published division method exists for the species or genus."],["<b>Medium<\/b>","Based on closely related plants or general practice for this plant type. Verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard division method","level":1,"blocks":[{"type":"p","html":"Species pages note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Choose stock<\/b>","Healthy, vigorous, pest- and disease-free nursery plants with plenty of shoots. Label each stock plant's provenance."],["<b>2. Time it<\/b>","Warmer months give the best results; late-summer to autumn divisions root well before winter (ANPSA). Summer divisions need extra shelter."],["<b>3. Water first<\/b>","Water the stock plant the day before so roots and shoots are full of water."],["<b>4. Lift and clean<\/b>","Lift the clump or knock it out of its pot. Shake or wash off the mix so you can see where to cut."],["<b>5. Divide<\/b>","Cut with a clean, sharp knife or spade. Aim for pieces with <b>three or four leaf shoots<\/b>, a good section of rhizome and healthy roots (ANPSA). Smaller pieces need a humid house."],["<b>6. Trim<\/b>","Cut off damaged roots. Cut leaves back by about <b>one-third<\/b> to reduce water loss."],["<b>7. Pot<\/b>","Pot into a free-draining mix with shoots at the <b>same level as before<\/b>. Firm in and water well."],["<b>8. Shelter<\/b>","Keep in a sheltered, shaded spot (or humid house for small pieces) until new leaves grow and roots show at the drainage holes. Small divisions typically need 4–6 weeks."],["<b>9. Harden off<\/b>","About a week with nights exposed, then a week in a sheltered spot, then into the open (ANPSA)."],["<b>10. Pot on<\/b>","Pot on or plant out once roots fill the pot."]]}]},{"title":"Hygiene","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>Tools<\/b>","Clean, sharp knives and spades. Wipe with alcohol between stock plants."],["<b>Disease<\/b>","Don't divide plants showing disease. Kangaroo paws are prone to ink disease (black leaf spots); many WA natives are susceptible to <i>Phytophthora<\/i> – keep pots off the ground and use fresh mix."],["<b>Collecting<\/b>","Digging plants from bushland needs a DBCA licence and landholder permission. Divide nursery stock instead, and label every batch with its source."]]}]},{"title":"Other species that can be divided or layered","level":2,"blocks":[{"type":"p","html":"These have no page in this guide because another method works better, but they can be split, or rooted pieces lifted, when stock plants allow.","small":true},{"type":"table","rows":[["Species","How","Main method"],["<i>Carpobrotus virescens<\/i>","Lift stems that have rooted – treat as cuttings.","Cuttings"],["<i>Grevillea vestita<\/i>","Can sucker – lift rooted suckers.","Cuttings"],["<i>Hibbertia racemosa<\/i>","Low stems may root where they touch the soil (layering).","Cuttings"],["<i>Lechenaultia linarioides<\/i>","Some leschenaultias sucker – pot up rooted suckers.","Cuttings"],["<i>Scaevola canescens<\/i>","Only if stems have rooted or suckered.","Cuttings"],["<i>Scaevola globulifera<\/i>","Check stock plants for rooted stems.","Cuttings"],["<i>Scaevola repens<\/i>","Some scaevolas sucker; check for rooted pieces.","Cuttings"],["<i>Scaevola thesioides<\/i>","Only if stock plants have suckered.","Cuttings"]]}]}]},"pdfs":{"cuttings":"Native_Plant_Cuttings_Guide_v1.4.pdf","seed":"Native_Plant_Seed_Sowing_Guide_v1.4.pdf","division":"Native_Plant_Division_Guide_v1.0.pdf"},"app":{"version":"1.4","revisions":[["1.0","Sep 2026","First release: Cuttings and Seed Sowing guides, This month planner, species search, batch records with CSV export and import. Installs on phones and works offline."],["1.1","Sep 2026","Division guide and Division tabs; Propagation options (cuttings, seed, division) on every species page; division batch records."],["1.2","Sep 2026","Cutting ruler: an on-screen millimetre ruler with the recommended length shaded, set up once per phone with a bank card."],["1.3","Sep 2026","Light and dark mode switch (sun / moon button, or About > Appearance)."],["1.4","Sep 2026","PDF guides now open properly on Android phones. Species notes (Records > Species notes, and on each species page). Gallery tab on every species with photos from the Atlas of Living Australia. App change log and copyright notice."]],"copyright":"© 2026 Mitchell Donald. All rights reserved."}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var APP_VERSION = "1.4 (guides C1.4·S1.4·D1.0)";
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DIFF = { "Easy": "d-easy", "Easy-Moderate": "d-easymod", "Moderate": "d-mod", "Moderate-Difficult": "d-moddiff", "Difficult": "d-diff" };
  var DIFF_ORDER = ["Easy", "Easy-Moderate", "Moderate", "Moderate-Difficult", "Difficult"];
  var GUIDES = ["cuttings", "seed", "division"];
  var G = {
    cuttings: { short: "Cuttings", title: "Cuttings guide", cal: "Cutting calendar", month: "Take cuttings", log: "Log a cutting batch", other: "Other methods", pdf: "Cuttings Guide" },
    seed: { short: "Seed", title: "Seed sowing guide", cal: "Sowing calendar", month: "Sow seed", log: "Log a sowing", other: "Other notes", pdf: "Seed Sowing Guide" },
    division: { short: "Division", title: "Division guide", cal: "Division calendar", month: "Divide clumps", log: "Log a division batch", other: "Other methods", pdf: "Division Guide" }
  };
  var SUIT = { "Main method": "s-main", "Good": "s-good", "Possible": "s-poss", "Trial": "s-poss", "Difficult": "s-diff", "Not used": "s-none" };
  var BY_ID = {};
  DATA.species.forEach(function (s) { BY_ID[s.id] = s; });

  var view = document.getElementById("view");
  var backBtn = document.getElementById("back-btn");
  var state = {
    tab: "month",
    month: new Date().getMonth(),
    query: "",
    filter: "all",
    methodsTab: "cuttings",
    detailGuide: {},
    editing: null,
    recTab: "batches",
    noteEditing: null,
    noteFilter: ""
  };

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(html) { return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
  function dash(s) { return String(s).replace(/-/g, "–"); }
  function diffChip(g, prefix) {
    var label = (prefix ? prefix + " · " : "") + dash(g.difficulty) + (g.provisional ? " *" : "");
    return '<span class="chip ' + DIFF[g.difficulty] + '">' + esc(label) + "</span>";
  }
  function store(key, val) {
    try {
      if (val === undefined) { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      localStorage.setItem(key, JSON.stringify(val)); return true;
    } catch (e) { return val === undefined ? null : false; }
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  var CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

  function calendarHTML(cal) {
    var now = new Date().getMonth();
    var out = '<div class="cal" role="img" aria-label="' + esc(cal.map(function (c, i) {
      return MONTHS[i] + ": " + (c === "B" ? "best" : c === "P" ? "workable" : "avoid");
    }).join(", ")) + '">';
    cal.forEach(function (c, i) {
      var cls = c === "B" ? "B" : c === "P" ? "P" : "N";
      var txt = c === "B" ? "Best" : c === "P" ? "OK" : "–";
      out += '<div class="' + (i === now ? "now" : "") + '">' + MONTHS[i] + '<span class="' + cls + '">' + txt + "</span></div>";
    });
    return out + "</div>" +
      '<div class="legend"><span><i style="background:var(--cal-best)"></i>Best</span>' +
      '<span><i style="background:var(--cal-ok)"></i>Workable</span>' +
      '<span><i style="background:var(--cal-no)"></i>Avoid / poor results</span></div>';
  }

  // ---------- navigation ----------
  function setTitle(title, sub, italic) {
    var t = italic ? "<i>" + esc(title) + "</i>" : esc(title);
    document.getElementById("top-title").innerHTML = t + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "");
  }
  function go(hash) {
    if (location.hash === hash) { render(); } else { location.hash = hash; }
  }
  function parseHash() {
    var h = location.hash.replace(/^#/, "");
    if (h.indexOf("sp-") === 0 && BY_ID[h.slice(3)]) return { tab: "species", id: h.slice(3) };
    if (["month", "species", "methods", "records", "about"].indexOf(h) >= 0) return { tab: h };
    return { tab: "month" };
  }
  document.querySelectorAll(".tabbar button").forEach(function (b) {
    b.addEventListener("click", function () { go("#" + b.dataset.tab); });
  });
  backBtn.addEventListener("click", function () {
    if (history.length > 1) history.back(); else go("#species");
  });
  window.addEventListener("hashchange", render);

  // ---------- views ----------
  function renderMonth() {
    setTitle("This month", "Joondalup / Perth coastal");
    var m = state.month, now = new Date().getMonth();
    var strip = '<div class="month-strip" role="group" aria-label="Choose month">' + MONTHS.map(function (n, i) {
      return '<button type="button" data-month="' + i + '" aria-pressed="' + (i === m) + '" class="' + (i === now ? "is-now" : "") + '">' + n + "</button>";
    }).join("") + "</div>";

    function block(kind, label) {
      var best = [], ok = [];
      DATA.species.forEach(function (s) {
        var g = s[kind]; if (!g) return;
        if (g.calendar[m] === "B") best.push(s); else if (g.calendar[m] === "P") ok.push(s);
      });
      function rows(list, tag) {
        return list.map(function (s) {
          var g = s[kind];
          return '<button type="button" class="row" data-open="' + s.id + '" data-guide="' + kind + '">' +
            '<span class="main"><span class="sci">' + esc(s.sci) + "</span>" +
            (s.common ? '<span class="common">' + esc(s.common) + "</span>" : "") +
            '<span class="chips">' + (tag === "B" ? '<span class="chip best">Best month</span>' : '<span class="chip ok">Workable</span>') +
            diffChip(g) + "</span></span>" + CHEV + "</button>";
        }).join("");
      }
      var total = best.length + ok.length;
      return '<div class="section-head"><h2>' + label + '</h2><span class="count num">' + total + " species</span></div>" +
        (total ? '<div class="list">' + rows(best, "B") + rows(ok, "P") + "</div>"
               : '<div class="empty">Nothing in the guide suits ' + MONTHS_LONG[m] + ".</div>");
    }
    view.innerHTML =
      '<div><div class="eyebrow">Plan for</div><div class="view-title">' + MONTHS_LONG[m] + (m === now ? " (now)" : "") + "</div></div>" +
      strip +
      GUIDES.map(function (k) { return block(k, G[k].month); }).join("");
    view.querySelectorAll("[data-month]").forEach(function (b) {
      b.addEventListener("click", function () { state.month = +b.dataset.month; renderMonth(); });
    });
    bindOpen();
  }

  function renderSpecies() {
    setTitle("Species", DATA.species.length + " species · A–Z");
    var q = state.query.toLowerCase().trim();
    var list = DATA.species.filter(function (s) {
      if (state.filter !== "all" && !s[state.filter]) return false;
      if (!q) return true;
      return (s.sci + " " + s.common + " " + s.family + " " + plain(s.alt)).toLowerCase().indexOf(q) >= 0;
    });
    var html = '<input class="search" id="sp-search" type="search" placeholder="Search name, common name or family" value="' + esc(state.query) + '" aria-label="Search species">' +
      '<div class="seg" role="group" aria-label="Filter">' +

  // ---------- records ----------
  var REC_KEY = "npg.records.v1";
  function loadRecs() { var r = store(REC_KEY); return Array.isArray(r) ? r : []; }
  function saveRecs(r) {
    var ok = store(REC_KEY, r);

    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    return ok;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var RL = {
    cuttings: { date: "Date set", source: "Stock source", srcPh: "e.g. Craigie Bushland", treat: "Treatment (hormone, wood type)",
                treatPh: "e.g. Clonex Purple, semi-hardwood", qty: "Cuttings set", success: "Cuttings struck", noun: "set", result: "strike rate" },
    seed: { date: "Date sown", source: "Seed lot / provenance", srcPh: "e.g. Craigie Bushland", treat: "Pre-treatment",
            treatPh: "e.g. boiling water 30 s", qty: "Amount sown", success: "Seedlings up", noun: "sown", result: "germination" },
    division: { date: "Date divided", source: "Stock plant / source", srcPh: "e.g. stock bed 3", treat: "Division size / method",
                treatPh: "e.g. 3–4 shoots, leaves cut by a third", qty: "Pieces potted", success: "Pieces established", noun: "potted", result: "established" }
  };
  function methodOf(r) { return RL[r.method] ? r.method : "cuttings"; }

    if (!(a > 0) || isNaN(b)) return null;
    if (r.method === "seed" && r.unit === "g") return { value: (b / a).toFixed(1), label: "seedlings per gram" };
    return { value: Math.round((b / a) * 100) + "%", label: RL[methodOf(r)].result };
  }

  function recSeg() {

      var r = ed.draft || (ed.isNew ? { id: "", date: new Date().toISOString().slice(0, 10), species: ed.species || "", method: ed.method || "cuttings", source: "", treatment: "", qty: "", unit: "seeds", success: "", notes: "" }
                       : recs.filter(function (x) { return x.id === ed.id; })[0]);

      html += '<form class="card" id="rec-form" novalidate>' +
        "<h3>" + (ed.isNew ? "New record" : "Edit record") + "</h3>" +

        '<div class="result" id="f-result" aria-live="polite"></div>' +

          '<span class="meta num">' + esc(G[methodOf(x)].short) + " · " + esc(x.date) +
          (x.qty ? " · " + esc(x.qty) + (x.method === "seed" && x.unit === "g" ? " g" : "") + " " + RL[methodOf(x)].noun : "") +
          (x.source ? " · " + esc(x.source) : "") + "</span></button>";
      }).join("") + "</div>";
    }
    html += '<div class="card"><h3>Share records with the team</h3>' +
      '<p class="note">Records stay on this phone. Export them to send to whoever keeps the master list, or import a file from a colleague.</p>' +
      '<div class="btn-row"><button type="button" class="btn" id="rec-export">Export CSV</button>' +
      '<button type="button" class="btn" id="rec-copy">Copy CSV</button>' +
      '<label class="btn" for="rec-import">Import CSV</label><input type="file" id="rec-import" accept=".csv,text/csv" hidden></div></div>';
    view.innerHTML = html;

    var nb = document.getElementById("rec-new");

    });
    document.getElementById("rec-export").addEventListener("click", exportCSV);

    bindRecSeg();

    var form = document.getElementById("rec-form");
    if (!form) return;
    function current() {
      var method = form.querySelector('input[name="f-method"]:checked').value;
      var unitEl = document.getElementById("f-unit");
      return {
        species: document.getElementById("f-species").value, method: method,
        date: document.getElementById("f-date").value, source: document.getElementById("f-source").value.trim(),
        treatment: document.getElementById("f-treat").value.trim(), qty: document.getElementById("f-qty").value,

    }

    }
    form.addEventListener("input", showResult);

    form.querySelectorAll('input[name="f-method"]').forEach(function (rb) {
      rb.addEventListener("change", function () {

    document.getElementById("f-cancel").addEventListener("click", function () { state.editing = null; renderRecords(); });
    var del = document.getElementById("f-delete");
    if (del) del.addEventListener("click", function () {

  var CSV_COLS = ["id", "date", "species", "method", "source", "treatment", "qty", "unit", "success", "result", "notes", "created", "updated"];
  function toCSV() {
    var rows = [CSV_COLS.join(",")];
    loadRecs().forEach(function (r) {
      var res = resultOf(r);
      var row = CSV_COLS.map(function (k) {
        var v = k === "result" ? (res ? res.value : "") : (r[k] == null ? "" : String(r[k]));
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      });
      rows.push(row.join(","));
    });
    return rows.join("\n");
  }
  function exportCSV() {
    var csv = toCSV(), name = "propagation-records-" + new Date().toISOString().slice(0, 10) + ".csv";
    try {
      var file = new File([csv], name, { type: "text/csv" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Propagation records" }).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast("CSV downloaded");
    } catch (e) { toast("Export isn't available here – use Copy CSV"); }
  }
  function copyCSV() {
    var csv = toCSV();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () { toast("CSV copied – paste into an email or sheet"); },
        function () { toast("Copy was blocked by the browser"); });
    } else { toast("Copy isn't available here"); }
  }
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || r[0] !== ""; });
  }
  function importCSV(ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result || ""));
      if (rows.length < 2) { toast("That file has no records"); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      if (head.indexOf("species") < 0) { toast("That doesn't look like a records export"); return; }

  var ALA_SEARCH = ["https://api.ala.org.au/occurrences/occurrences/search", "https://biocache-ws.ala.org.au/ws/occurrences/search"];
  var photoCache = {};
  function alaUrl(base, name, strict) {
    return base + "?q=" + encodeURIComponent('taxa:"' + name + '"') + "&fq=" + encodeURIComponent("multimedia:Image") +

  }

  }
  function photosFrom(json) {
    var seen = {}, out = [], guid = "";
    ((json && json.occurrences) || []).forEach(function (o) {
      guid = guid || o.speciesGuid || o.taxonConceptID || "";
      var idv = o.image || (o.images && o.images[0]) || o.largeImageUrl;
      var large = o.largeImageUrl || o.imageUrl || (o.image ? "https://images.ala.org.au/image/proxyImageThumbnailLarge?imageId=" + o.image : "");
      if (!large || seen[idv]) return;
      seen[idv] = 1;
      var who = o.recordedBy || o.collector || o.collectors || "";
      if (Array.isArray(who)) who = who.join(", ");
      out.push({ large: large, credit: String(who || o.dataResourceName || "ALA contributor"), licence: String(o.license || o.rights || "see record"),
                 source: o.dataResourceName || "", record: o.uuid ? "https://biocache.ala.org.au/occurrences/" + o.uuid : "" });

        var res = photosFrom(j);
        if (!res.photos.length && strict) return attempt(false);

      }).catch(function (err) {

    var cal = currentCal();
    if (!cal) { rulerOff(); openCalibration(); return; }
    var k = cal.pxPerMm, side = ruler.side, range = ruler.ctx.range;
    [rulerEl, markerEl, barEl].forEach(function (el) { el.classList.remove("left", "right"); el.classList.add(side); });
    rulerEl.hidden = false; barEl.hidden = false;
    var H = rulerEl.clientHeight, W = rulerEl.clientWidth || 68;
    var maxMm = Math.floor((H - RULER_OFF - 2) / k);
    var edge = side === "right" ? W : 0, dir = side === "right" ? -1 : 1;
    var out = [];
    if (range) {
      var y1 = RULER_OFF + range[0] * k, y2 = RULER_OFF + Math.min(range[1], maxMm) * k;
      if (range[0] <= maxMm) {
        out.push('<rect class="rg" x="0" y="' + y1.toFixed(2) + '" width="' + W + '" height="' + Math.max(0, y2 - y1).toFixed(2) + '"/>');
        out.push('<line class="rge" x1="0" x2="' + W + '" y1="' + y1.toFixed(2) + '" y2="' + y1.toFixed(2) + '"/>');
        if (range[1] <= maxMm) out.push('<line class="rge" x1="0" x2="' + W + '" y1="' + y2.toFixed(2) + '" y2="' + y2.toFixed(2) + '"/>');
      }
    }
    for (var mm = 0; mm <= maxMm; mm++) {
      var y = (RULER_OFF + mm * k).toFixed(2);
      var len = mm % 10 === 0 ? 30 : (mm % 5 === 0 ? 20 : 11);
      out.push('<line class="' + (mm === 0 ? "zero" : mm % 10 === 0 ? "t10" : mm % 5 === 0 ? "t5" : "t") + '" x1="' + (mm === 0 ? 0 : edge) +
        '" x2="' + (mm === 0 ? W : edge + dir * len) + '" y1="' + y + '" y2="' + y + '"/>');
      if (mm % 10 === 0 && mm > 0) {
        out.push('<text class="lbl" x="' + (edge + dir * 34) + '" y="' + (parseFloat(y) + 4) + '" text-anchor="' + (side === "right" ? "end" : "start") + '">' + mm + "</text>");
      }
    }
    out.push('<text class="lbl0" x="' + (edge + dir * 34) + '" y="' + (RULER_OFF + 14) + '" text-anchor="' + (side === "right" ? "end" : "start") + '">0</text>');
    rulerEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + out.join("") + "</svg>";
    rulerEl.setAttribute("aria-label", "Ruler in millimetres, 0 at the top" + (range ? ", recommended " + range[0] + " to " + range[1] + " mm highlighted" : ""));

    var notes = [];
    if (range && range[1] > maxMm) notes.push("This screen shows up to " + maxMm + " mm, so the top of the range (" + range[1] + " mm) is past the bottom edge.");
    if (window.innerWidth > window.innerHeight) notes.push("Turn the phone upright for the full ruler.");
    if (zoomed()) notes.push("The page is zoomed in – pinch back out or the ruler won't be accurate.");
    barEl.innerHTML =
      '<div class="aim">' + (range ? "Aim for <b>" + range[0] + "–" + range[1] + " mm</b>" : "Cutting ruler") + ' <span class="hint">(' + esc(ruler.ctx.name) + ")</span></div>" +
      '<div class="hint">Base of the cutting on the red 0 line. Touch the ruler at the tip to read its length.</div>' +
      notes.map(function (n) { return '<div class="warn">' + esc(n) + "</div>"; }).join("") +
      '<div class="row3"><button type="button" id="r-side">Swap side</button><button type="button" id="r-cal">Re-check</button><button type="button" id="r-close">Close</button></div>';
    document.getElementById("r-side").addEventListener("click", function () { ruler.side = ruler.side === "right" ? "left" : "right"; markerEl.hidden = true; drawRuler(); });
    document.getElementById("r-cal").addEventListener("click", function () { openCalibration(); });
    document.getElementById("r-close").addEventListener("click", rulerOff);
  }

  function rulerRead(ev) {
    var cal = currentCal(); if (!cal || !ruler.on) return;
    var rect = rulerEl.getBoundingClientRect();
    var y = ev.clientY - rect.top;
    var mm = (y - RULER_OFF) / cal.pxPerMm;
    if (mm < 0) mm = 0;
    var r = ruler.ctx && ruler.ctx.range, verdict = "";
    var shown = Math.round(mm);
    if (r) verdict = shown < r[0] ? '<i class="no"> · too short</i>' : shown > r[1] ? '<i class="no"> · too long</i>' : '<i class="ok"> · in range ✓</i>';
    markerEl.style.top = (rect.top + RULER_OFF + mm * cal.pxPerMm) + "px";
    markerEl.innerHTML = "<span>" + shown + " mm" + verdict + "</span>";
    markerEl.hidden = false;
  }
  rulerEl.addEventListener("pointerdown", function (e) { rulerEl.setPointerCapture && rulerEl.setPointerCapture(e.pointerId); rulerRead(e); e.preventDefault(); });
  rulerEl.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "touch") rulerRead(e); });
  window.addEventListener("resize", function () { if (ruler.on) drawRuler(); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { if (ruler.on) drawRuler(); });

  function openCalibration() {
    var old = rawCal();
    var stale = old && !currentCal();
    var k = old ? old.pxPerMm : 6.2;
    calEl.innerHTML =
      '<div class="ctop"><h2>Set up the ruler for this phone</h2>' +
      (stale ? '<div class="banner">This phone’s display settings have changed since the ruler was set up – please check it again.</div>' : "") +
      "<p>Phone screens differ, so the ruler needs one quick check on each phone. Hold a <b>bank card sideways</b> across the screen " +
      "(it can hang over the edges) with its top edge on the top line of the green band.</p></div>" +
      '<div class="band" id="c-band"><svg id="c-ticks" aria-hidden="true"></svg><div class="mid">Card goes here</div></div>' +
      '<div class="cctl"><p style="margin:0"><b>Adjust until no green shows above or below the card.</b></p>' +
      '<div class="adj"><button type="button" id="c-minus" aria-label="Smaller">−</button>' +
      '<input type="range" id="c-range" min="3.5" max="10" step="0.005" value="' + k + '" aria-label="Band height">' +
      '<button type="button" id="c-plus" aria-label="Bigger">+</button></div>' +
      '<div class="btn-row"><button type="button" class="btn primary" id="c-save">Save</button><button type="button" class="btn" id="c-cancel">Cancel</button></div>' +
      '<p class="note">Driver’s licences and Medicare cards are the same size as bank cards. No card? The band is 54 mm tall – check it with a ruler ' +
      "instead (ticks every 10 mm). Redo this if you change the phone’s display size setting.</p></div>";
    calEl.hidden = false;
    var band = document.getElementById("c-band"), rng = document.getElementById("c-range"), ticks = document.getElementById("c-ticks");
    function upd() {
      var kk = parseFloat(rng.value);
      band.style.height = (CARD_SHORT_MM * kk).toFixed(2) + "px";
      var t = [];
      for (var mm = 10; mm < CARD_SHORT_MM; mm += 10) {
        var y = (mm * kk).toFixed(2);
        t.push('<line class="t" x1="0" x2="18" y1="' + y + '" y2="' + y + '"/><text class="lbl" x="22" y="' + (parseFloat(y) + 4) + '">' + mm + "</text>");
      }
      ticks.innerHTML = t.join("");
    }
    function nudge(d) { rng.value = Math.min(10, Math.max(3.5, parseFloat(rng.value) + d)).toFixed(3); upd(); }
    rng.addEventListener("input", upd);
    document.getElementById("c-minus").addEventListener("click", function () { nudge(-0.01); });
    document.getElementById("c-plus").addEventListener("click", function () { nudge(0.01); });
    document.getElementById("c-cancel").addEventListener("click", function () { calEl.hidden = true; });
    document.getElementById("c-save").addEventListener("click", function () {
      saveCal(parseFloat(rng.value));
      calEl.hidden = true;
      toast("Ruler set for this phone");
      if (ruler.ctx) {
        ruler.on = true; drawRuler();
        var b = document.getElementById("ruler-btn");
        if (b) b.lastChild.textContent = " Hide ruler";
      }
    });
    upd();
    calEl.scrollTop = 0;
  }

  // ---------- light / dark mode ----------
  // "auto" follows the phone's setting; "light" or "dark" overrides it on this device.
  var THEME_KEY = "npg.theme";
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function themeMode() { var t = null; try { t = localStorage.getItem(THEME_KEY); } catch (e) {} return t === "light" || t === "dark" ? t : (themeMode._mem || "auto"); }
  function isDark() { var m = themeMode(); return m === "dark" || (m === "auto" && !!(darkMQ && darkMQ.matches)); }
  function applyTheme() {
    var m = themeMode(), root = document.documentElement;
    if (m === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", m);
    var btn = document.getElementById("theme-btn"), dark = isDark();
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    btn.title = btn.getAttribute("aria-label");
    var brand = getComputedStyle(root).getPropertyValue("--brand").trim();
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta && brand) meta.setAttribute("content", brand);
    if (ruler && ruler.on) drawRuler();
  }
  function setTheme(m) {
    themeMode._mem = m;
    try { if (m === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, m); } catch (e) {}
    applyTheme();
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    setTheme(isDark() ? "light" : "dark");
    toast(isDark() ? "Dark mode on" : "Light mode on");
    if (state.tab === "about" && !location.hash.match(/^#sp-/)) renderAbout();
  });
  if (darkMQ) {
    var onMQ = function () { if (themeMode() === "auto") applyTheme(); };
    if (darkMQ.addEventListener) darkMQ.addEventListener("change", onMQ); else if (darkMQ.addListener) darkMQ.addListener(onMQ);
  }

  // ---------- render ----------
  function render() {
    var r = parseHash();
    state.tab = r.tab;
    document.querySelectorAll(".tabbar button").forEach(function (b) {
      if (b.dataset.tab === r.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    backBtn.hidden = !r.id;
    if (!r.id && ruler.on) rulerOff();
    if (r.id) renderDetail(r.id);
    else if (r.tab === "species") renderSpecies();
    else if (r.tab === "methods") renderMethods();
    else if (r.tab === "records") renderRecords();
    else if (r.tab === "about") renderAbout();
    else renderMonth();
    if (!render._first) window.scrollTo(0, 0);
    render._first = false;
  }
  render._first = true;
  applyTheme();
  render();

  // ---------- offline / updates ----------
  
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function showUpdate(worker) {
          var bar = document.getElementById("update-bar");
          bar.hidden = false;
          document.getElementById("update-btn").onclick = function () { worker.postMessage({ type: "SKIP_WAITING" }); };
        }
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (nw) nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 3600000);
      }).catch(function () {});
      var refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (refreshing) return; refreshing = true; location.reload();
      });
    });
  }

})();
</script>

</body>
</html>
