rom sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings too crowded","Sown too thickly. Dilute seed well with sand."],["Seed washed into clumps","Overhead watering too coarse. Use a fine mist or bottom watering."],["Damping off","Crowding and wet mix. Thin sowing, airflow, sterile mix."]],"other":"Cuttings are worth trialling if a particular form is wanted (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Presumed to strike like related melaleucas (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Easy from seed held in old capsules.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect capsules from wood at least a year old."},"conservation":"","seedid":{"unit":"Seed (released from the woody capsules)","look":"Small, smooth, narrow seed (brown in a related species), shaken from barrel-shaped capsules 6–14 mm long kept warm and dry.","size":"1.4–2 mm long","tell":"Not published for the genus. As for eucalypts, chaff is more brittle and has no white endosperm (Seed Notes 6).","level":"species","d":{"shape":"elongate","L":1.7,"W":0.6,"col":"brown","chaff":true},"sources":[["Records of the WA Museum / DBCA journal – Calothamnus seed (Hawkeswood)","https://library.dbca.wa.gov.au/static/Journals/080057/080057-20.006.pdf"],["Seed Notes 6 – Eucalyptus (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"]],"photos":[{"id":"c331a9f9-3724-4f26-92c4-c95cef65df7b","nsb":2866,"by":"National Seed Bank, ANBG"},{"id":"c61e6bfc-b09a-48ba-ad25-8c0cecfb7b3f","nsb":2865,"by":"National Seed Bank, ANBG"}],"sosa":false}},{"id":"carpobrotus-virescens","sci":"Carpobrotus virescens","common":"Coastal Pigface","family":"Aizoaceae","fam":"Aizoaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"Method from published advice for the closely related <i>C. glaucescens<\/i>; pigface is widely grown from stem pieces.","facts":[["Wood type","Succulent stem pieces"],["Best months","Sep – Nov; Mar – Apr"],["Cutting length","10–15 cm (tubes)"],["Hormone (IBA)","Not needed"]],"length_mm":[100.0,150.0],"check":[21,32],"calendar":["P","P","B","B","P","-","-","P","B","B","B","P"],"snapshot":[["Habit","Prostrate succulent groundcover, 0.1–0.3 m high and 0.5–3 m wide, rooting along the stems."],["Flowering","Jun – Dec or Jan (purple-pink, sometimes white), followed by fleshy fruit."],["Habitat","Coastal limestone and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Collect only from plants you are sure are native – the introduced Hottentot Fig (<i>C. edulis<\/i>) is naturalised on some coasts."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b> and <b>Mar – Apr<\/b>, when plants are actively growing. Aug, Dec – Feb and May are workable. Avoid Jun – Jul (slow growth; cuttings rot in cold, wet mix)."],["Wood type","<b>Succulent stem (runner) pieces<\/b> – not woody cuttings. Use firm stems with plump leaves."],["Cutting size","<b>Tubes:<\/b> 10–15 cm pieces with 2–3 leaf pairs.<br/><b>Direct planting / layering:<\/b> about 30 cm, with at least 5 cm left above the sand (ANBG, <i>C. glaucescens<\/i>)."],["Selecting material","Healthy runners. Pieces that have already rooted at the nodes are ideal. Avoid shrivelled or damaged stems."],["Pre-treatment","• Remove the leaves from the lowest 1–2 nodes.<br/>• Leave the cut ends to dry in the shade for a day or two before setting – this reduces rot.<br/>• No hormone needed."],["Rooting hormone","Not needed – stems root readily at the nodes."],["Propagation mix","Coarse washed sand or a very sandy, free-draining mix."],["Environment","Open bench in bright light or light shade. <b>No mist and no humid frame<\/b> – succulent leaves rot. Water sparingly until rooted."],["Expected strike time","Not documented, but usually quick – check from about 3 weeks."],["Post-treatment / aftercare","• Grow on in full sun.<br/>• Pot on or plant out once roots hold the mix together.<br/>• Water sparingly – overwatering is the main cause of losses."]]}],"difficulty_note":"<b>Easy.<\/b> Pigface roots readily from stem pieces, and rooted runners can simply be cut off and potted up.","problems":[["Stems go soft and rot","Too wet or humid. Dry the cut ends first, water less, move out of the humid frame."],["Leaves shrivel","Too dry for too long. Water lightly once set."],["Pale, stretched growth","Not enough light. Move to full sun."]],"other":"Layering – pin a runner onto a pot of sand beside the parent and cut it free once rooted.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Carpobrotus glaucescens (layering, 30 cm stem pieces, division)","url":"anbg.gov.au/gnp/interns-2005/carpobrotus-glaucescens.html"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (9 tests) and a WA community-nursery method are available.","facts":[["Pre-treatment","Ferment fruit; smoke water"],["Best sowing","Mar – May"],["Sowing depth","Surface"],["Typical germination","21%"],["Seed per 100 plants","0.2 g"]],"check":[6,8],"stats":{"germ_pct":21,"per_gram":454},"grow":[3.0,4.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","P","B","B","B","P","-","-","P","P","-","-"],"snapshot":[["Habit","Prostrate succulent groundcover, 0.1–0.3 m high and 0.5–3 m wide."],["Flowering","Jun – Dec or Jan (purple-pink, sometimes white), followed by fleshy fruit."],["Habitat","Coastal limestone and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Collect only from plants you are sure are native – the introduced Hottentot Fig (<i>C. edulis<\/i>) is naturalised on some coasts."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the fleshy fruits when soft and fully ripe, after flowering."],["Extraction & cleaning","<b>Ferment:<\/b> soak the crushed fruit in water for 4–5 days, then wash the tiny seeds out through a fine sieve and dry them."],["Seed quality","Seed is very fine – each fruit holds many seeds."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>21%<\/b> after a dry-heat treatment (Alcoa nursery average, 9 tests). About <b>454 seedlings per gram<\/b> – roughly 0.2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Feb, Jun and Sep – Oct are workable. Avoid the coldest and hottest months."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","Ferment and wash the seed (above). Alcoa used a dry-heat pulse instead. Water in with smoke water after sowing."],["Sowing depth & method","<b>Surface-sow.<\/b> Mix the fine seed with dry yellow sand in a spice jar and shake it evenly over the tray (Geraldton method). Press in lightly."],["After sowing","Water in with smoke water using a fine mist; keep just moist – succulent seedlings rot if wet."],["Germination time","About <b>6–8 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have two pairs of leaves and can be handled."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings rot","Too wet. Water less, improve drainage and airflow."],["Seed washed into clumps","Use bottom watering or a fine mist."],["Poor germination","Fruit not fully ripe, or seed not cleaned. Collect soft, ripe fruit and ferment fully."]],"other":"Stem cuttings are quicker and very reliable (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Carpobrotus glaucescens (grown from seed or cuttings)","url":"anbg.gov.au/gnp/interns-2005/carpobrotus-glaucescens.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Stem pieces root very easily; rooted runners can be lifted.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Ferment fruit, sow fine seed on the surface; 6–8 days.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Lift stems that have rooted – treat as cuttings.","guide":null}],"collect":{"cal":["P","P","P","P","-","-","-","-","-","-","-","P"],"basis":"estimate","any":false,"note":"Pick soft, fully ripe fleshy fruit."},"conservation":"","seedid":{"unit":"Seed (washed out of the fleshy fruit)","look":"Many small, flattened, oval seeds, light to dark brown, embedded in the fruit pulp (genus).","size":"Not published (related species to 1.5 × 0.8 mm)","tell":"Break ripe fruits open, wash out the seed and dry it on paper towel. Pulp and mucilage are the debris (related species).","level":"related","d":{"shape":"oval","L":1.5,"W":0.8,"col":"lightbrown"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"clematis-linearifolia","sci":"Clematis linearifolia","common":"Slender Clematis / Old Man's Beard","family":"Ranunculaceae","fam":"Ranunculaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method available; the only nursery test (untreated) gave 0%.","facts":[["Pre-treatment","Smoke-water soak 24 h"],["Best sowing","Apr – Jun"],["Sowing depth","Just covered (1–2 mm)"],["Typical germination","0% untreated (1 test)"]],"check":[40,50],"stats":{"germ_pct":null,"per_gram":null},"grow":[4.0,6.0],"storage":{"kind":"short","months":6,"text":"Short – sow within months"},"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Woody climber to about 5 m. <b>Male and female flowers on separate plants<\/b> (dioecious)."],["Flowering","Jul – Oct (white-cream), followed by feathery seed heads on female plants."],["Habitat","Sand; coastal limestone and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Only female plants produce seed – note which plants you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the feathery seed heads from female plants when <b>very dry<\/b> and the seeds come away easily (Geraldton nursery)."],["Extraction & cleaning","Rub off the feathery plumes over a sieve."],["Seed quality","Cut-test a few seeds – look for plump, filled seed."],["Storage life","Probably short: seed of the related <i>C. microphylla<\/i> dropped to about 50% viability after 6 months. Sow the same year."],["Typical germination","Not recorded with treatment. The only Alcoa test, untreated, gave 0%."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – it doesn't germinate until the cooler weather from late April (Geraldton). Mar and Jul workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Soak in smoke water (1:9) for 24 hours<\/b> before sowing (Geraldton method)."],["Sowing depth & method","Just cover the seed, about 1–2 mm. Sow in trays."],["After sowing","Keep moist, not wet, in a cool shaded spot."],["Germination time","About <b>40–50 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months; give each tube a small stake."]]}],"difficulty_note":"","problems":[["No germination","Sown too warm, or old seed. Sow fresh seed in cool weather after a smoke soak."],["Empty seed","Heads from male plants or unpollinated females. Collect from female plants near males."],["Tangled seedlings","Stake and space tubes."]],"other":"Cuttings of semi-hardened stems work for related clematis and let you choose male or female plants – worth trialling.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Greening Australia – Clematis microphylla (seed collection, short-lived seed, cuttings, separate male and female plants)","url":"greeningaustralia.org.au/plants/clematis-microphylla/"},{"title":"Wikipedia – Clematis linearifolia (dioecious climber; synonyms)","url":"en.wikipedia.org/wiki/Clematis_linearifolia"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Semi-hardened cuttings work for related clematis; lets you pick the plant's sex.","guide":null},{"method":"Seed","suitability":"Main method","note":"Smoke-water soak; 40–50 days in cool weather.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Climber.","guide":null}],"collect":{"cal":["-","-","-","-","-","-","-","-","-","P","P","P"],"basis":"estimate","any":false,"note":"Collect feathery heads from female plants when very dry."},"conservation":"","seedid":{"unit":"Achene with its feathery tail","look":"Flattened, curved-oval achene with a long, feathery tail (the old style). A related species has brown achenes with a white plumose tail.","size":"4–6 × 1.5–2 mm, plus a long tail","tell":"No cleaning needed – keep the tail on. Cut-test a few to check they're filled.","level":"species","d":{"shape":"achene","L":5,"W":1.75,"col":"brown","tail":30},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"conostylis-aculeata","sci":"Conostylis aculeata","common":"Prickly Conostylis","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set with smoke (12 tests); smoke response documented for the genus.","facts":[["Pre-treatment","Smoke water"],["Best sowing","Mar – May"],["Sowing depth","Just covered (1–2 mm)"],["Typical germination","19%"],["Seed per 100 plants","0.1 g"]],"check":[21,42],"stats":{"germ_pct":19,"per_gram":712},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Stores dry; response to smoke changes with age"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial, 0.06–0.5 m, with prickly-edged leaves."],["Flowering","Aug – Nov (yellow)."],["Habitat","Sand, loam, clay, gravel, limestone or laterite; winter-wet areas and sand dunes."],["Local note","Recorded in Joondalup and Wanneroo (subsp. <i>cygnorum<\/i> is the local coastal-plain form). There are 10 subspecies – label seed by subspecies. Dieback resistant."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the dry capsules in late spring–early summer, after flowering, before they split."],["Extraction & cleaning","Dry in paper bags; rub and sieve out the fine seed."],["Seed quality","Very fine seed – about 700 seedlings per gram in nursery tests."],["Storage life","Stores dry. <i>Conostylis<\/i> seed has cyclical dormancy – its response to smoke changes as it ages, so results vary between batches."],["Typical germination","About <b>19%<\/b> with smoke (Alcoa nursery average, 12 tests). About <b>712 seedlings per gram<\/b> – roughly 0.14 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Smoke water<\/b> – 24 h soak (1:9) or water trays with it after sowing."],["Sowing depth & method","Mix the fine seed with dry sand and sow thinly; just cover."],["After sowing","Keep moist, not wet."],["Germination time","About <b>3–6 weeks<\/b> (record yours)."],["Pricking out","When seedlings have 2–3 leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Patchy germination between batches","Normal – cyclical dormancy. Try seed of different ages; always use smoke."],["Seedlings collapse","Damping off. Sow thinly; good airflow."],["Seed washed away","Bottom water or use a fine mist."]],"other":"Also propagated by division, and by potting up rooted runners after flowering (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Smoke germination of Australian plants (Dixon; Stirlingia among smoke-responsive recalcitrant genera)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"},{"title":"ANPSA – Kangaroo Paws & Relatives (smoke for Conostylis; Conostylis division)","url":"anpsa.org.au/genera/kangaroo-paw-family/"}]},"division":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA notes <i>Conostylis<\/i> divide less readily than kangaroo paws (larger divisions best); APS NSW describes potting rooted runners.","facts":[["Division type","Clump division / rooted runners"],["Best months","Mar – May"],["Division size","Larger clumps, 5+ shoots"],["Time to establish","4–8 weeks sheltered"]],"check":[28,56],"calendar":["-","P","B","B","B","P","-","-","-","P","P","P"],"snapshot":[["Habit","Rhizomatous, tufted perennial, 0.06–0.5 m, with prickly-edged leaves."],["Flowering","Aug – Nov (yellow)."],["Habitat","Sand, loam, clay, gravel, limestone or laterite; winter-wet areas and sand dunes."],["Local note","Recorded in Joondalup and Wanneroo (subsp. <i>cygnorum<\/i> on the coastal plain). Dieback resistant. Keep subspecies separate."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b> for clump division. Rooted runners are ready <b>just after flowering<\/b> (about Oct – Dec). Feb and Jun workable. Avoid Jul – Sep for clumps (flowering, cold)."],["Division type","<b>Clump division<\/b> of the rhizome, or <b>rooted runners<\/b>: after flowering the runners form aerial roots at the leaf bases."],["Division size","Keep divisions <b>larger than for kangaroo paws<\/b> – ANPSA notes <i>Conostylis<\/i> divide less readily and larger pieces do best. Aim for 5 or more shoots with a good piece of rhizome."],["Selecting stock","Vigorous, established nursery clumps. Watch runners after flowering for new roots."],["Preparation","• Water the stock plant the day before.<br/>• Lift and cut the clump with a sharp knife, keeping pieces large.<br/>• <b>Rooted runners:<\/b> there is only a 2–3 week window after the roots appear – cut and pot them promptly.<br/>• Trim leaves back by about a third."],["Potting","Pot into a free-draining mix at the original depth."],["Environment","Sheltered, shaded spot (humid house for runners and small pieces) until new growth starts."],["Time to establish","About <b>4–8 weeks<\/b> (record yours)."],["Aftercare","• Harden off gradually.<br/>• Grow on in full sun; don't overwater."]]}],"difficulty_note":"<b>Moderate.<\/b> Divides less readily than kangaroo paws; use larger pieces or rooted runners. Seed with smoke is the other option.","problems":[["Small divisions die","Pieces too small. Keep divisions larger."],["Runners don't root in the pot","Cut too late or too early. Take them in the 2–3 weeks after aerial roots appear."],["Base rots","Too wet. Free-draining mix; water less."]],"other":"","sources":[{"title":"ANPSA – Kangaroo Paws & Relatives: propagation by division (autumn, 3+ shoots, trim leaves by a third)","url":"anpsa.org.au/genera/kangaroo-paw-family/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian Plants Society NSW – Conostylis aculeata (rooted runners after flowering; 2–3 week window)","url":"resources.austplants.com.au/plant/conostylis-aculeata/"},{"title":"Gardening With Angus – Conostylis aculeata (division of rhizomes)","url":"gardeningwithangus.com.au/conostylis-aculeata-prickly-conostylis/"},{"title":"Murdoch University CPSM (2009) – Native garden plants resistant to dieback (Conostylis aculeata)","url":"cpsm-phytophthora.org/downloads/CPSM_resistanceBrochures.pdf"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Tufted herb.","guide":null},{"method":"Seed","suitability":"Main method","note":"Smoke water; about 19% in nursery tests.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Larger divisions, or rooted runners after flowering.","guide":"division"}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect dry capsules before they split."},"conservation":"","seedid":{"unit":"Seed","look":"Small seed from a many-seeded capsule. In the family, seeds are round to lens-shaped, dull and leathery, and black, brown, red or white.","size":"Not published (family 0.5–2 mm)","tell":"Not published. Cut-test a few: plump, firm and white inside is good.","level":"family","d":{"shape":"round","L":null,"W":null,"col":"greybrown"},"sources":[["Seed families identification tool (idtools.org) – family seed descriptions","https://idtools.org/seed_families/"]],"photos":[],"sosa":false}},{"id":"conostylis-candicans","sci":"Conostylis candicans","common":"Grey Cottonhead","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"High","confidence_note":"Nursery tests (7) plus research showing smoke compounds and soil burial lift germination.","facts":[["Pre-treatment","Smoke water; aged seed"],["Best sowing","Mar – May"],["Sowing depth","Just covered"],["Typical germination","3%"],["Seed per 100 plants","0.7 g"]],"check":[21,120],"stats":{"germ_pct":3,"per_gram":148},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Stores dry; ageing can help"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous tufted perennial, 0.05–0.4 m, with silvery-grey woolly leaves."],["Flowering","Jul – Nov (yellow, in woolly heads)."],["Habitat","Sand, sandy loam and limestone; coastal and inland sand dunes."],["Local note","Recorded in the Wanneroo LGA. Two former subspecies were raised to species in 2026 (<i>C. calcicola<\/i>, <i>C. procumbens<\/i>) – check labels."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect dry capsules in late spring–early summer, after flowering, before they split."],["Extraction & cleaning","Dry in paper bags; rub the woolly heads over a sieve."],["Seed quality","Cut-test a sample."],["Storage life","Stores dry. In eight <i>Conostylis<\/i> taxa, seed buried in soil for a year germinated better than fresh seed, so older seed may do better."],["Typical germination","Low untreated: about <b>3%<\/b> (Alcoa, 7 tests), about 148 seedlings per gram. Smoke water and the smoke compounds glyceronitrile and karrikinolide significantly increased germination in research."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","<b>Smoke water<\/b> – 24 h soak (1:9) or water trays with it. Use seed that is a year or more old if you have it."],["Sowing depth & method","Sow thinly and just cover."],["After sowing","Keep moist, not wet; keep trays going – germination is spasmodic."],["Germination time","Anywhere from about 3 weeks to 4 months."],["Pricking out","At 2–3 leaves, gently."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very few seedlings","Normal – spasmodic germination. Use smoke, older seed, and larger sowings."],["Seedlings rot","Too wet. Water less; free-draining mix."],["Woolly leaves rot in the shade house","Too humid. More airflow, less overhead watering."]],"other":"Also propagated by division, though less easily than kangaroo paws (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2  plump, firm and white inside is good.","level":"family","d":{"shape":"round","L":null,"W":null,"col":"greybrown"},"sources":[["Seed families identification tool (idtools.org) – family seed descriptions","https://idtools.org/seed_families/"]],"photos":[],"sosa":false}},{"id":"conostylis-setigera","sci":"Conostylis setigera","common":"Bristly Cottonhead","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery data from 4 tests; smoke response documented for the genus.","facts":[["Pre-treatment","None; smoke water helps"],["Best sowing","Mar – May"],["Sowing depth","Just covered"],["Typical germination","31%"],["Seed per 100 plants","0.2 g"]],"check":[7,28],"stats":{"germ_pct":31,"per_gram":410},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Stores dry"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial, 0.05–0.36 m, with bristly-edged leaves."],["Flowering","Aug – Oct (yellow, sometimes red-tinged)."],["Habitat","White, grey or yellow sand, gravel, sandy loam and laterite."],["Local note","Recorded in the Wanneroo LGA (subsp. <i>setigera<\/i>). Subsp. <i>dasys<\/i> is threatened and not local."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect dry capsules in late spring–summer, after flowering, before they split."],["Extraction & cleaning","Dry in paper bags; rub and sieve out the fine seed."],["Seed quality","Fine seed – about 410 seedlings per gram."],["Storage life","Stores dry. In eight <i>Conostylis<\/i> taxa, seed buried in soil for a year germinated better than fresh seed."],["Typical germination","About <b>31%<\/b> untreated (Alcoa nursery average, 4 tests), about 410 seedlings per gram – roughly 0.25 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","None needed, but <b>smoke water<\/b> promotes germination in <i>Conostylis<\/i> – use it on the first watering."],["Sowing depth & method","Mix the fine seed with dry sand, sow thinly and just cover."],["After sowing","Keep moist, not wet."],["Germination time","Not recorded for this species; <i>C. candicans<\/i> takes 3 weeks to 4 months. Check from 3 weeks and record yours."],["Pricking out","At 2–3 leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Patchy germination","Seed age affects dormancy. Always use smoke; try seed of different ages."],["Seedlings collapse","Damping off. Sow thinly; airflow."],["Seed washed away","Bottom water or use a fine mist."]],"other":"Clumps can be divided, but <i>Conostylis<\/i> divide less readily than kangaroo paws – use large pieces.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au" s":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","About 5 mm"],["Typical germination","60%"],["Seed per 100 plants","5.3 g"]],"check":[7,14],"stats":{"germ_pct":60,"per_gram":19},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – dry & cool"},"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree to 40 m (rarely a mallee), with rough, tessellated bark."],["Flowering","Dec or Jan – May (white or pink)."],["Habitat","Wide range: clay loam, sandy clay, gravel, grey sand over limestone, granite and laterite."],["Local note","Recorded in the Wanneroo LGA. Large urn-shaped gumnuts (‘honky nuts’)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown, woody gumnuts when the valves look ready to open."],["Extraction & cleaning","Keep gumnuts warm and dry in a tray or paper bag until the large winged seed is released."],["Seed quality","Large seed – easy to check by cutting a few open."],["Storage life","<b>Long<\/b> if stored cool and dry (eucalypt seed keeps its viability a long time)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>19 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> A dip in dilute bleach (10%) to surface-sterilise the seed can help."],["Sowing depth & method","Large seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube (preferred) or space out in trays."],["After sowing","Water in; keep moist."],["Germination time","Usually within about <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, avoid crowding."],["Leggy seedlings","Too much shade. Move to brighter light once up."],["Roots circling","Kept too long in tubes. Plant out or pot on sooner."]],"other":"Fast-growing – time sowings so trees aren't held in tubes too long.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Eucalypts are very difficult from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 60% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}],"collect":{"cal":["P","P","P","P","P","-","-","-","-","-","-","-"],"basis":"estimate","any":false,"note":"Gumnuts take about a year to mature – collect brown nuts with valves ready to open."},"conservation":"","seedid":{"unit":"Seed (with some chaff)","look":"Large, dull to semi-glossy black seed, boat-shaped, with no wing. From urn-shaped gumnuts 1.9–4.4 cm long.","size":"10–15 mm long","tell":"Chaff is more brittle, has no white endosperm inside and is sometimes a different colour or shape (Seed Notes 6).","level":"species","d":{"shape":"elongate","L":12.5,"W":5,"col":"black","boat":true},"sources":[["EUCLID – Eucalypts of Australia (seed descriptions)","https://apps.lucidcentral.org/euclid/"],["Seed Notes 6 – Eucalyptus (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"]],"photos":[],"sosa":false}},{"id":"daviesia-decurrens","sci":"Daviesia decurrens","common":"Prickly Bitter-pea","family":"Fabaceae","fam":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 9 tests; method follows WA hard-seed guidance (Seed Notes 15).","facts":[["Pre-treatment","Dry heat or hot water"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","25%"],["Seed per 100 plants","11 g"]],"check":[7,28],"stats":{"germ_pct":25,"per_gram":9.4},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, prickly shrub, usually to about 1 m (0.3–1.8 m)."],["Flowering","Jun – Sep (orange and red pea flowers)."],["Habitat","Red-brown loam over clay, gravel and laterite; well-drained slopes, often near rivers."],["Local note","Recorded in the Wanneroo LGA (not listed for Joondalup). Two subspecies (<i>decurrens<\/i> and <i>hamata<\/i>) – keep collections separate. Sharp, pointed leaves – wear gloves. <i>Daviesia<\/i> is susceptible to dieback (<i>Phytophthora<\/i>) – keep nursery hygiene tight."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods (8–13 mm, broadly triangular) ripen 2–3 months after flowering, in late spring–summer, and <b>release seed explosively<\/b>. Tie stocking or muslin bags over developing pods and check every few weeks. Keep ants out of the bags."],["Extraction & cleaning","Rub the pods and sieve or winnow; leave the aril on the seed."],["Seed quality","Hard-seeded. Float test in water with a drop of detergent: discard floaters and seed with insect holes."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps for many years when dry."],["Typical germination","About <b>25%<\/b> after heat treatment (Alcoa nursery average, 9 tests). About <b>9 seedlings per gram<\/b> – roughly 11 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Dry heat<\/b> – the Alcoa nursery heat-treated this species. Seed Notes 15 gives 80–120°C in an oven for 10 minutes to 1 hour. Or pour near-boiling water over the seed, leave it to cool and soak up to 24 hours. Sow the swollen seed; re-treat the rest."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet. Don't let swollen seed dry out."],["Germination time","Not documented for this species – start checking about a week after treatment and record it."],["Pricking out","At the cotyledon to first true leaf stage – early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficult lity","Hard-seeded: nearly all fresh seed is dormant until the seed coat is treated. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea-family seed keeps for many years when dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["Typical germination","About <b>22%<\/b> after boiling-water treatment (Alcoa nursery average, few tests). About <b>57 seedlings per gram<\/b> – roughly 1.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan (heat stress, damping off)."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop seed into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over seed (at least 10 parts water to 1 part seed) and leave to soak overnight. <b>Sow seed that has swollen<\/b>; re-treat seed that hasn't."],["Sowing depth & method","Cover to about twice the seed's thickness, roughly <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet. Sow soon after treatment – don't let swollen seed dry out."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage – early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very low germination","Seed coat not broken. Re-treat unswollen seed; try a dry-heat pulse (80–120°C) on the next batch."],["Swollen seed rots","Mix too wet or seed damaged by overlong boiling. Keep boiling to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow, avoid crowding."]],"other":"Treat wit ily","family":"Asphodelaceae (Hemerocallidoideae)","fam":"Asphodelaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and dormancy research available; nursery results vary widely.","facts":[["Pre-treatment","GA 24 h + smoke water 24 h"],["Best sowing","Mar – Apr"],["Sowing depth","3–5 mm"],["Typical germination","<1% untreated"]],"check":[56,77],"stats":{"germ_pct":null,"per_gram":null},"grow":[5.0,7.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – store dry & cool"},"calendar":["-","P","B","B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.3–1.5 m."],["Flowering","Sep – Dec (blue-purple), followed by blue berries."],["Habitat","White or yellow sand, sandy clay, laterite, loam and clay."],["Local note","Recorded in Joondalup and Wanneroo (var. <i>divaricata<\/i> is common on the coast)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe, deep-blue berries in summer after flowering."],["Extraction & cleaning","Soak berries in water for a few days, then rub and wash off the pulp in a sieve. Dry the shiny black seed before storing."],["Seed quality","Seed is dormant (morphophysiological dormancy): untreated seed gave under 1% in Alcoa tests."],["Storage life","Not well documented. Store cleaned, dried seed sealed and cool."],["Typical germination","Untreated: <b>under 1%<\/b> (Alcoa, 19 tests). Treated seed does much better – record your own results."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> – seed experiences warm conditions, then germinates as the weather cools (Geraldton: not until late April). Feb and May workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Gibberellic acid<\/b> (1 part per thousand) for 24 hours, then <b>smoke water<\/b> (1:9) for 24 hours (Geraldton method). Research shows warm stratification followed by smoke also breaks dormancy."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow in trays or direct into tubes."],["After sowing","Keep moist and be patient – don't discard trays too early."],["Germination time","About <b>58–75 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves and are large enough to handle."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–7 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Nothing after 6 weeks","Normal – germination takes 8–11 weeks. Keep trays moist."],["No germination at all","Seed still dormant. Use GA + smoke water, or keep trays for a second season."],["Pulp left on seed goes mouldy","Clean seed thoroughly before drying and storing."]],"other":"Division of established clumps is a quicker way to produce plants.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"ANPSA lists <i>Dianella<\/i> among the grass-like clumps suited to division; details follow the general method.","facts":[["Division type","Rhizome clump division"],["Best months","Mar – May"],["Division size","3–4 shoots with rhizome"],["Time to establish","4–6 weeks"]],"check":[28,42],"calendar":["-","P","B","B","B","P","-","P","P","P","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.3–1.5 m."],["Flowering","Sep – Dec (blue-purple), followed by blue berries."],["Habitat","White or yellow sand, sandy clay, laterite, loam and clay."],["Local note","Recorded in Joondalup and Wanneroo. Division is much quicker than seed, which is slow and erratic."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, so divisions root before winter. Feb, Jun and Aug – Oct are workable. Avoid Nov – Jan (heat) and Jul (cold)."],["Division type","<b>Rhizome clump division<\/b>."],["Division size","<b>Three or four leaf shoots<\/b> with a good section of rhizome and healthy roots (ANPSA). Single shoots need a humid house."],["Selecting stock","Vigorous clumps with plenty of shoots. Keep forms and provenances separate."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump and shake or wash off the mix.<br/>• Cut the rhizome into pieces with a clean, sharp knife.<br/>• Trim damaged roots and cut leaves back by about one-third to one-half."],["Potting","Pot into a free-draining native mix at the original depth. Water in."],["Environment","Sheltered, shaded spot (humid house for small pieces) until new growth starts."],["Time to establish","About <b>4–6 weeks<\/b> in autumn."],["Aftercare","• Harden off gradually – about a week with nights exposed, then a sheltered week.<br/>• Pot on once roots fill the pot."]]}],"difficulty_note":"<b>Easy.<\/b> Clump-forming lilies divide readily, and this is the quickest way to produce plants.","problems":[["Divisions wilt","Leaves not trimmed or too few roots. Trim harder; use bigger pieces."],["Rhizome rots","Too wet or planted too deep. Water less; pot at the original level."],["Slow to re-shoot","Divided in cold weather. Divide in autumn or spring."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Clumping herb.","guide":null},{"method":"Seed","suitability":"Difficult","note":"GA + smoke water; 8–11 weeks.","guide":"seed"},{"method":"Division","suitability":"Main method","note":"The quickest way to produce plants.","guide":"division"}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","P","B"],"basis":"guide","any":false,"note":"Pick ripe, deep-blue berries."},"conservation":"","seedid":{"unit":"Seed (cleaned from the berries)","look":"Shiny black, egg-shaped seed with a finely pitted coat, from soft purple berries 4–10 mm long.","size":"2.5–5.2 mm long, to about 2 mm wide","tell":"Rub ripe berries in a bucket of water and sieve – skin and pulp are debris. Viability is usually high.","level":"species","d":{"shape":"oval","L":4,"W":2,"col":"black","shiny":true},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[{"id":"3b1dfeb4-bb8a-44ba-b69c-111139614267","nsb":3029,"by":"National Seed Bank, ANBG"},{"id":"e402c8a1-596c-4e43-a229-dad50164ba69","nsb":3028,"by":"National Seed Bank, ANBG"}],"sosa":true}},{"id":"eremaea-pauciflora","sci":"Eremaea pauciflora","common":"Orange-flowered Eremaea","family":"Myrtaceae","fam":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Low","confidence_note":"No species data. A related Eremaea grows easily from untreated seed – treat as a starting point.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","Surface – light cover"],["Typical germination","Not recorded"]],"check":[7,28],"stats":{"germ_pct":null,"per_gram":null},"grow":[4.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Erect to spreading shrub, to 4 m (var. <i>pauciflora<\/i> to about 2 m)."],["Flowering","Jul – Dec or Jan (orange, red or yellow)."],["Habitat","Sand, loam, gravel, laterite, limestone or granite; sandplains, ridges and moist depressions."],["Local note","Recorded in the Wanneroo LGA (var. <i>pauciflora<\/i>). Label seed by variety."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Capsules sit on old stems and are only weakly serotinous. Collect mature, closed capsules from older wood."],["Extraction & cleaning","Keep capsules warm and dry until they release the fine seed; sow with the chaff."],["Seed quality","A seed supplier lists about 75 seeds per gram with chaff."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed<\/b> (as for the related <i>E. beaufortioides<\/i>)."],["Sowing depth & method","Scatter seed and chaff on the surface; cover very lightly."],["After sowing","Water in with a fine spray; keep moist."],["Germination time","Not recorded – check from 2 weeks."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seed washed into clumps","Bottom water or use a fine mist."],["Damping off","Sow thinly; good airflow."],["Few seedlings","Old or empty capsules. Collect from several plants."]],"other":"Cuttings are also reported to be easy for the related <i>E. beaufortioides<\/i> – worth trialling.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"ANPSA – Eremaea beaufortioides profile (easy from seed and cuttings; no pre-treatment)","url":"anpsa.org.au/plant_profiles/eremaea-beaufortioides/"},{"title":"Lamont B.B. et al. (2020) Critical Reviews in Plant Sciences – serotiny, supplementary Table S1 (Eremaea, Petrophile)","url":"uv.es/jgpausas/papers/Lamont-2020-CritRevPlSci_supp.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"Easy for the related E. beaufortioides – worth trialling.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment (related species).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Weakly serotinous – collect mature closed capsules from older wood."},"conservation":"","seedid":{"unit":"Seed (with chaff)","look":"Small obovoid seed, brown or somewhat mottled, finely ridged lengthways with narrow wing-like ridges (genus). Only 1–6 seeds form per capsule; the rest is chaff.","size":"Not published","tell":"Good seed has the ridged, winged surface; chaff is flatter and irregular (genus).","level":"genus","d":{"shape":"dust","L":null,"W":null,"col":"brown","chaff":true},"sources":[["Hnatiuk – Eremaea revision, Nuytsia (seed and chaff)","https://library.dbca.wa.gov.au/static/Journals/080057/080057-09.011.pdf"],["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"]],"photos":[{"id":"0c92a5e5-96a8-4924-a15c-675a6ce8047d","nsb":2575,"by":"National Seed Bank, ANBG"},{"id":"a60d5cad-211b-4690-8e1a-bedb56e8f6a5","nsb":2574,"by":"National Seed Bank, ANBG"}],"sosa":false}},{"id":"eremophila-glabra","sci":"Eremophila glabra","common":"Tar Bush / Common Emu Bush","family":"Scrophulariaceae","fam":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree most forms strike readily from cuttings.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,56],"calendar":["B","B","B","B","P","-","-","-","-","-","P","P"],"snapshot":[["Habit","Very variable, from prostrate to 3 m. Perth coastal plants are mostly subsp. <i>albicans<\/i>: low, spreading, to about 0.4 m high and 2 m wide, with grey, felty leaves."],["Flowering","Species: Mar – Dec. Subsp. <i>albicans<\/i>: May – Jan. Tubular flowers, yellow, orange, red or green."],["Habitat","Sand and limestone; dunes, sandplains and winter-wet flats, sometimes saline."],["Local note","Recorded in the Wanneroo LGA and along the Perth coast. Several subspecies and many forms – label stock by subspecies and form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, using hardened current season's growth while the weather is warm and plants are mostly out of flower. Nov – Dec and May are workable. Avoid Jun – Oct (cool weather, flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips or side shoots. On grey-leaved forms pick clean foliage with no sign of mould."],["Pre-treatment","• Carefully remove leaves from the lower two-thirds.<br/>• Wound: remove a thin sliver of bark from the base.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>."],["Propagation mix","Very free-draining, sand-based mix."],["Environment","<b>Grey, felty-leaved forms rot under heavy mist or high humidity<\/b> – keep foliage as dry as possible, water the mix, give good airflow. Green-leaved forms tolerate normal misting. Bottom heat speeds rooting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix and grow on in full sun.<br/>• Keep water off grey foliage; water in the morning."]]}],"difficulty_note":"<b>Easy.<\/b> Most forms of <i>E. glabra<\/i> strike readily from cuttings.","problems":[["Leaves blacken or grow grey mould","Too humid. Cut back misting, open the frame, remove affected leaves."],["Base rotting","Mix too wet. Water less often and use a sandier mix."],["Cuttings flower instead of rooting","Use non-flowering shoots and pinch off buds."]],"other":"Seed – unreliable in <i>Eremophila<\/i> (hard fruits, slow and erratic germination). Grafting is used for difficult eremophilas but isn't needed for this species.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"},{"title":"ANPSA – Eremophila glabra plant profile","url":"anpsa.org.au/plant_profiles/eremophila-glabra/"},{"title":"Australian Bushfoods – The Eremophila Page (cutting length, wounding, hormone)","url":"ausbushfoods.com/bushfoodsonline/reports/Plants/EREMO.TXT"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Most forms strike readily from semi-hardwood cuttings.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Unreliable – hard fruits; slow, erratic germination.","guide":null},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Whole fruit (sown whole)","look":"Oval to almost round fruit, dark brown when ripe; the papery skin rubs off in the fingers. The seeds sit inside chambers of the woody fruit.","size":"4–9 mm across","tell":"Not every chamber holds a seed – cut open a few fruits; good seed is full and plump (Seed Notes 5).","level":"species","d":{"shape":"stone","L":6.5,"W":5.5,"col":"darkbrown"},"sources":[["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["Seed Notes 5 – Eremophila (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01992.pdf"]],"photos":[],"sosa":false}},{"id":"eucalyptus-decipiens","sci":"Eucalyptus decipiens","common":"Redheart / Redheart Moit","family":"Myrtaceae","fam":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (7 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","1–2 mm"],["Typical germination","46%"],["Seed per 100 plants","0.2 g"]],"check":[7,14],"stats":{"germ_pct":46,"per_gram":481},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – dry & cool"},"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Mallee or tree, 1.5–15 m, with rough, flaky or ribbony bark. Forms a lignotuber."],["Flowering","Aug – Dec or Jan (white)."],["Habitat","White, yellow or grey sand, sandy clay, gravelly loam and laterite; sandplains, hills, swamp margins."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect unopened capsules once the valves look as if they are beginning to open. Ripe seed has a white, firm inside and a brown to black coat."],["Extraction & cleaning","Keep capsules warm and dry for a day to several weeks until they release the seed; sieve out large chaff."],["Seed quality","Seed comes mixed with chaff – that's normal. Cut-test a sample."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>46%<\/b> (untreated, Alcoa nursery average, 7 tests). About <b>481 seedlings per gram<\/b> of seed-and-chaff – roughly 0.2 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach can help (WA eucalypt seed notes)."],["Sowing depth & method","Mix the fine seed with dry sand, sow thinly and cover lightly, about <b>1–2 mm<\/b>. Or sow a pinch per tube and thin."],["After sowing","Water in (smoke water optional); keep moist."],["Germination time","About <b>1–2 weeks<\/b> (typical for WA eucalypts)."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sow thinly; sterile mix; avoid crowding."],["Trays too crowded","Seed is very fine. Dilute it with dry sand before sowing."],["Roots circling","Held too long in tubes."]],"other":"Cuttings are very difficult for eucalypts – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alc :"3–6 mm long","tell":"Bag the seed and chaff together – it's easier to cut-test a sample and record seed per gram than to separate them. Chaff is more brittle, has no white endosperm inside and is sometimes a different colour or shape (Seed Notes 6).","level":"species","d":{"shape":"oval","L":4.5,"W":3,"col":"blackish","chaff":true},"sources":[["EUCLID – Eucalypts of Australia (seed descriptions)","https://apps.lucidcentral.org/euclid/"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"],["Seed Notes 6 – Eucalyptus (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"]],"photos":[{"id":"f4fa1679-385a-47e9-a79c-16677bd63f92","nsb":2188,"by":"B. Clinton"},{"id":"b8ae9fea-83e7-480a-80e0-1165be213ff9","nsb":2189,"by":"B. Clinton"}],"sosa":false}},{"id":"exocarpos-sparteus","sci":"Exocarpos sparteus","common":"Broom Ballart","family":"Santalaceae","fam":"Santalaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Medium","confidence_note":"One published seed trial (SA, 2016) found gibberellic acid gave 36%. Root hemiparasite – needs a host to grow on.","facts":[["Pre-treatment","Gibberellic acid 48 h"],["Best sowing","Apr – Jun"],["Sowing depth","About 5 mm"],["Typical germination","36% with GA (SA trial)"]],"check":[28,56],"stats":{"germ_pct":null,"per_gram":null},"grow":null,"storage":{"kind":"unknown","months":24,"text":"Not well documented"},"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Weeping, broom-like shrub, 1–4 m. A <b>root hemiparasite<\/b> – it taps the roots of nearby plants."],["Flowering","Feb – Oct (tiny, yellow-green), followed by a small nut on a swollen pink-red stalk."],["Habitat","White sand over limestone, red sand and laterite; coastal and inland dunes, sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Hosts in the wild include sheoaks, wattles, myrtles and proteas."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe fruits; the edible red stalk falls away. Keep the <b>shiny brown nuts filled with white endosperm<\/b> – cut some open to check. Viable seed has even been collected from emu droppings."],["Extraction & cleaning","Remove the fleshy stalk and any pulp; dry the nuts."],["Seed quality","Often poor – only 14% of one SA seed lot was viable (about 45 seeds per gram)."],["Storage life","Not well documented. Store dry and cool; sow within the year."],["Typical germination","<b>36%<\/b> after 48 h in gibberellic acid (GA, 400 mg/L) in an SA trial; leaching alone gave 0% and GA plus smoke 18%. Alcoa's single untreated test gave 0%."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – seed germinates in winter. Mar and Jul workable."],["Seed mix","Free-draining, sterile mix."],["Pre-treatment","<b>Soak in gibberellic acid (400 mg/L) for 48 hours<\/b> (SA Seed Conservation Centre trial)."],["Sowing depth & method","Cover about 5 mm. Sow in deep tubes – ideally with a host seedling already growing in the tube."],["After sowing","Keep moist, not wet, in a cool spot over winter."],["Germination time","Slow; expect winter emergence and record the timing."],["Pricking out","Avoid – sow direct into deep tubes with a host."],["Shade house & hardening","Grow on with its host in light shade, then harden off gradually."],["Time to planting size","Slow and unpredictable – record your own."]]}],"difficulty_note":"","problems":[["No germination","Empty seed or no GA. Cut-test; use GA; sow in winter."],["Seedlings stall and die","No host. Pot with a host plant (e.g. a small wattle or sheoak) early."],["Low fill","Normal for this species – collect plenty."]],"other":"Growers find establishment difficult because of its semi-parasitic habit. Plant out next to suitable hosts.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's M ":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep – Oct<\/b>. Feb, Jun – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix; stays a little moister than most."],["Pre-treatment","<b>None needed.<\/b> Water trays in with smoke water (Geraldton method)."],["Sowing depth & method","<b>Surface-sow:<\/b> dilute the seed with sterile yellow sand and shake it from a spice jar (Geraldton method)."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>15–19 days<\/b> (Geraldton nursery)."],["Pricking out","Prick out small clumps of seedlings together once 2–3 cm tall."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Trays too crowded","Seed is very fine – dilute with sand before sowing."],["Seedlings dry out","Tiny seedlings dry quickly. Bottom water or mist often."],["Damping off","Sow thinly; airflow."]],"other":"Also divides easily – the quickest way to multiply existing plants (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Coastal Restoration Trust of NZ – Ficinia nodosa (wīwī) technical note: seed collection and division","url":"coastalrestorationtrust.org.nz/site/assets/files/1185/8.4_wiwi.pdf"}]},"division":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"Coastal restoration guidance for this species (NZ); timing follows ANPSA's general division advice.","facts":[["Division type","Rhizome clump division"],["Best months","Mar – May"],["Division size","6–10 stems with rhizome"],["Time to establish","Plantable in a few months"]],"check":[45,90],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect, clumping, rhizomatous sedge to 1 m high and 0.8 m wide."],["Flowering","Oct – Dec or Jan (brown knot-like heads)."],["Habitat","Calcareous sand and limestone; coastal dunes, seasonally wet swamps and salt-lake shores."],["Local note","Recorded in Joondalup and Wanneroo. Salt tolerant, fast growing, a strong sand binder."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, so divisions root before winter. Feb and Jun – Oct are workable. Avoid Nov – Jan (heat)."],["Division type","<b>Rhizome clump division.<\/b>"],["Division size","Anything from a short piece of rhizome with <b>6–10 stems<\/b> up to a 10 × 10 cm clod (NZ restoration guidance)."],["Selecting stock","Vigorous nursery clumps or tray-grown stock."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump and cut it into pieces with a sharp knife or spade.<br/>• Trim stems back by about a third to cut water loss."],["Potting","Pot into tubes or pots of free-draining mix at the original depth. Water well."],["Environment","Shade house until new stems appear; keep the mix moist – it tolerates wetter mix than most."],["Time to establish","Divisions are ready for planting <b>within a few months<\/b>."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in winter."]]}],"difficulty_note":"<b>Easy.<\/b> Divides readily – transplanted divisions had 100% survival in one NZ planting trial.","problems":[["Divisions brown off","Pieces dried out. Keep moist and shaded while working."],["Slow to re-shoot","Divided in cold weather. Divide in autumn."],["Base rots","Waterlogged in heavy mix. Use a free-draining mix."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Coastal Restoration Trust of NZ – Ficinia nodosa (wīwī) technical note: division size, survival","url":"coastalrestorationtrust.org.nz/site/assets/files/1185/8.4_wiwi.pdf"},{"title":"NZ Plant Conservation Network – Ficinia nodosa (easily grown from seed and division)","url":"nzpcn.org.nz/flora/species/ficinia-nodosa/"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Sedge.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 55% germination.","guide":"seed"},{"method":"Division","suitability":"Main method","note":"Divides readily; plantable in a few months.","guide":"division"}],"collect":{"cal":["P","B","B","B","P","-","-","-","-","-","-","-"],"basis":"guide","any":false,"note":"Hand-collect the dry brown heads."},"conservation":"","seedid":{"unit":"Nut (the seed)","look":"Tiny, hard, glossy nut about the size of a sand grain – dark brown to black (VicFlora) or orange-brown (Seeds of SA). From dense brown ball-shaped heads 7–20 mm across.","size":"About 1–1.25 × 0.7 mm","tell":"Dry the heads, rub and use a fine sieve. The red-brown papery glumes (about twice the nut's length) are chaff.","level":"species","d":{"shape":"nutlet","L":1.1,"W":0.7,"col":"darkbrown","shiny":true},"sources":[["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"]],"photos":[{"id":"507300eb-5471-4d18-827f-17dce50967b2","nsb":319,"by":"B. Clinton"},{"id":"9d06ba9f-ce8b-4659-9b5a-ca83a49804ed","nsb":320,"by":"B. Clinton"}],"sosa":true}},{"id":"frankenia-pauciflora","sci":"Frankenia pauciflora","common":"Seaheath","family":"Frankeniaceae","fam":"Frankeniaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"Seed data are from South Australian material (var. gunnii); WA plants may differ.","facts":[["Pre-treatment","None"],["Best sowing","Apr – Jun"],["Sowing depth","Surface – light cover"],["Typical germination","96% (SA seed bank)"]],"check":[7,14],"stats":{"germ_pct":null,"per_gram":null},"grow":[3.0,4.0],"storage":{"kind":"unknown","months":24,"text":"Dry, airtight, cool"},"calendar":["-","-","P","B","B","B","P","P","P","-","-","-"],"snapshot":[["Habit","Prostrate to ascending small shrub, 0.08–0.5 m, with tiny heath-like leaves."],["Flowering","Jun – Dec or Jan – Feb (pink or white)."],["Habitat","Sandy, often saline soils; coastal limestone, saline flats and salt lakes."],["Local note","Recorded in the City of Joondalup. Very salt tolerant (the genus has salt-excreting leaf glands)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the brown, cylindrical fruiting heads that are slightly swollen at the base."],["Extraction & cleaning","Dry heads for about a week, then rub and sieve."],["Seed quality","Tiny seed – cut-test under a hand lens."],["Storage life","Store with a desiccant in an airtight container, cool and dry."],["Typical germination","Seed is <b>non-dormant<\/b>: South Australian seed germinated <b>96%<\/b> without treatment in winter conditions. No WA nursery data."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> (cool). Mar and Jul – Sep workable."],["Seed mix","Free-draining, sandy seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix the tiny seed with dry sand and surface-sow; cover very lightly."],["After sowing","Keep moist, not wet."],["Germination time","First seedlings from about <b>7 days<\/b>; half up by about 14 days (SA)."],["Pricking out","Prick out small clumps once seedlings can be handled."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings rot","Too wet. Sandy mix; water less."],["Trays too crowded","Seed is tiny – dilute with sand."],["Weak growth","Too much shade. Full sun once established."]],"other":"A related Frankenia is grown from cuttings – worth trialling for this species.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368,
