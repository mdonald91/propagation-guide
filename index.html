k out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Yellowing seedlings","Phosphorus toxicity. Very low-P feed only."],["Can't find fruit","They're green and leaf-like – check along the stems among the flat leaves."]],"other":"Bird and bee attracting. Hakea cuttings are harder than seed.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"},{"title":"Wikipedia – Hakea trifurcata (green fruit at maturity; no resprouting)","url":"en.wikipedia.org/wiki/Hakea_trifurcata"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 69% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Fruits stay green and look like the leaves – collect full-sized closed fruits."},"conservation":"","seedid":{"unit":"Winged seed","look":"Seed body dark brown to black (genus) with the wing at the tip. The fruit stays green when mature and isn't woody.","size":"About 13 mm long including the wing; 5–7 mm wide","tell":"Good seed has a solid white endosperm. Discard flattened or shrivelled seed, and seed with frass or grub holes (Seed Notes 14).","level":"species","d":{"shape":"hakea","L":13,"W":6,"col":"darkbrown"},"sources":[["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"],["Seed Notes 14 – Hakea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"]],"photos":[{"id":"22a41727-a43b-4904-8a8c-90ed54827e68","nsb":722,"by":"B. Clinton"},{"id":"aea14f64-3154-4beb-ab5b-0a852924fee7","nsb":723,"by":"B. Clinton"}],"sosa":false}},{"id":"hardenbergia-comptoniana","sci":"Hardenbergia comptoniana","common":"Native Wisteria","family":"Fabaceae","fam":"Fabaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA reports cuttings of firm current season's growth strike well; size follows ANPSA pea-family guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[28,42],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Vigorous twining climber or scrambling shrub."],["Flowering","Jul – Oct (blue-purple, occasionally white)."],["Habitat","Sandy soils; coastal limestone, sandplains and dunes."],["Local note","Recorded in Joondalup and Wanneroo. More vigorous than <i>H. violacea<\/i> – can smother small shrubs."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b>, once the current season's growth has firmed after spring flowering. Nov and Apr are workable. Avoid May – Oct (cool, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","<b>50–75 mm<\/b>, the length ANPSA suggests for pea-family cuttings. One runner gives several pieces."],["Selecting material","Healthy runners without flowers or pods."],["Pre-treatment","• Remove the leaves from the lower two-thirds.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Stake or trim runners so tubes don't tangle; pot on promptly."]]}],"difficulty_note":"<b>Easy–Moderate.<\/b> Cuttings strike well. Seed is also easy after hot-water treatment.","problems":[["Cuttings wilt","Material too soft. Use firmer growth; keep humidity up until rooted."],["Runners tangle between tubes","Space tubes; trim or stake runners."],["Base rotting","Mix too wet. Water less."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Pea family (Fabaceae) genus page (50–75 mm cuttings, leaves off the lower two-thirds)","url":"anpsa.org.au/genera/pea-family/"},{"title":"ANPSA – Hardenbergia comptoniana profile (cuttings of firm current season's growth strike well)","url":"anpsa.org.au/plant_profiles/hardenbergia-comptoniana/"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (34 tests) plus a WA community-nursery method.","facts":[["Pre-treatment","Hot water (or boil 30 s); smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","31%"],["Seed per 100 plants","5.3 g"]],"check":[10,20],"stats":{"germ_pct":31,"per_gram":19},"grow":[3.0,4.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Vigorous twining climber or scrambling shrub."],["Flowering","Jul – Oct (blue-purple, occasionally white)."],["Habitat","Sandy soils; coastal limestone, sandplains and dunes."],["Local note","Recorded in Joondalup and Wanneroo. More vigorous than <i>H. violacea<\/i> – can smother small shrubs."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen and split in late spring–summer. Bag developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded – the impervious coat must be broken. Float test: discard seed that floats."],["Storage life","<b>Long<\/b> – seed keeps its viability for many years (ANPSA)."],["Typical germination","About <b>31%<\/b> after boiling-water treatment (Alcoa nursery average, 34 tests). About <b>19 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer at 95°C for 2 minutes, pour over the seed and soak 24 hours, then <b>soak 24 hours in smoke water<\/b> (Geraldton method). Alcoa used a 30 s boil instead. Sow the swollen seed."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months. Give tubes a short stake or trim runners so they don't tangle."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Mix too wet. Water less."],["Tangled seedlings","Space tubes and trim or stake runners."]],"other":"Cuttings of firm current season's growth also strike well (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Hardenbergia comptoniana profile (easy from treated seed; long-lived seed; cuttings)","url":"anpsa.org.au/plant_profiles/hardenbergia-comptoniana/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Firm current season's growth strikes well.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Hot water + smoke water; about 10 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Bag developing pods/fruit with stockings or fine mesh – they split and shed seed quickly."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Elliptic to oblong, smooth brown seed with a fleshy rim-aril (genus); the related H. violacea has orange, kidney-shaped seed to 4.2 × 2.2 mm. Pods grey-brown, about 3.5 cm, and pop open when dry.","size":"Not published for this species","tell":"Dry pods under paper – they pop. Collect pods turning brown with hard seed inside. Seed is hard-coated.","level":"genus","d":{"shape":"kidney","L":null,"W":null,"col":"brown","aril":"cream"},"sources":[["Legume seed identification tool (idtools.org) – genus seed descriptions","https://idtools.org/fabaceae/"],["ANPSA – plant profiles","https://anpsa.org.au/plant_profiles/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"hemiandra-pungens","sci":"Hemiandra pungens","common":"Snakebush","family":"Lamiaceae","fam":"Lamiaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says it is relatively easy from cuttings; timing and size follow standard practice.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Oct – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[21,32],"calendar":["B","B","B","P","-","-","-","-","P","B","B","B"],"snapshot":[["Habit","Prostrate to ascending shrub, 0.05–1 m, with sharp, prickly leaves."],["Flowering","Throughout the year (white, blue-purple or pink)."],["Habitat","Sand, clay, loam, gravel, laterite and granite; rock outcrops."],["Local note","Recorded in Joondalup and Wanneroo. Resistant to dieback. Wear gloves when collecting."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Oct – Mar<\/b>, in the warm months while plants are growing actively. Sep and Apr are workable. Avoid May – Aug (slow rooting)."],["Wood type","<b>Softwood to semi-hardwood<\/b> tips."],["Cutting size","50–75 mm tip cuttings."],["Selecting material","Plants flower all year – choose tips without open flowers and snip off any buds."],["Pre-treatment","• Wear gloves – the leaves are prickly.<br/>• Strip leaves from the lower half.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer ones."],["Propagation mix","Very free-draining mix."],["Environment","Bright shade and bottom heat, with light misting and good airflow – plants are unreliable in humid conditions."],["Expected strike time","Not documented – check from about 3–4 weeks and record the result."],["Post-treatment / aftercare","• Harden off promptly; grow on in full sun.<br/>• Free-draining mix; don't overwater."]]}],"difficulty_note":"<b>Easy.<\/b> ANPSA describes it as relatively easy to propagate from cuttings.","problems":[["Cuttings rot","Too humid or wet. Mist less and improve airflow."],["Cuttings flower","Taken from flowering tips. Snip off buds and choose non-flowering shoots."],["Slow in winter","Use bottom heat, or wait for the warm window."]],"other":"Seed – rarely available and germinates poorly (about 4% untreated in Alcoa nursery tests). Grafting onto <i>Westringia fruticosa<\/i> is used where plants struggle.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – Hemiandra pungens profile (relatively easy from cuttings; unreliable in humid conditions; grafting)","url":"anpsa.org.au/plant_profiles/hemiandra-pungens/"},{"title":"Gardening With Angus – Hemiandra pungens (softwood and semi-hardwood cuttings)","url":"gardeningwithangus.com.au/hemiandra-pungens-snake-plant/"},{"title":"APACE WA – Hemiandra pungens (dieback resistant)","url":"apacewa.org.au/plant/hemiandra-pungens/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Relatively easy from soft to semi-hardwood tips.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Rarely available; about 4% germination in nursery tests.","guide":null},{"method":"Division","suitability":"Not used","note":"Not documented.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Nutlets (up to 4 per fruit)","look":"The fruit splits into up to four small nutlets (genus). Seed is rarely available – this species is usually grown from cuttings.","size":"Not published – see the seed bank photos","tell":"Not published.","level":"genus","d":{"shape":"nutlet","L":null,"W":null,"col":"brown"},"sources":[["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"],["ANPSA – plant profiles","https://anpsa.org.au/plant_profiles/"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"]],"photos":[{"id":"7fa42d3c-e4e0-4b40-86f1-d5880174ed2e","nsb":732,"by":"B. Clinton"},{"id":"df8c5114-03d1-4452-ba99-6137aaf24402","nsb":733,"by":"B. Clinton"}],"sosa":false}},{"id":"hibbertia-cuneiformis","sci":"Hibbertia cuneiformis","common":"Cutleaf Hibbertia","family":"Dilleniaceae","fam":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Commonly propagated from cuttings in the nursery trade; little published detail on timing or strike rate.","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,56],"calendar":["P","P","B","B","B","-","-","-","-","P","P","P"],"snapshot":[["Habit","Erect or sprawling shrub, 0.5–3 m (usually 1–2 m). Wedge-shaped leaves, toothed near the tip."],["Flowering","Jan – Mar or Jun – Nov (yellow)."],["Habitat","Coastal sand dunes and swampy places near the coast."],["Local note","Recorded in the City of Joondalup. One of the more vigorous hibbertias – useful for screening."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, between the summer and winter flowering periods, once new growth has firmed. Oct – Feb is workable using non-flowering shoots. Avoid Jun – Sep (cool, and plants are flowering)."],["Wood type","<b>Semi-hardwood<\/b> – current season's growth that has begun to firm."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants. Snip off any buds."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Reduce large leaves by about one-third.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Very free-draining, sand-based mix. Use fresh mix and clean tubes – hibbertias are prone to <i>Phytophthora<\/i>."],["Environment","Humid frame, bright shade, bottom heat. Moist, never wet; good airflow."],["Expected strike time","Roughly <b>4–8 weeks<\/b> in warm weather (typical for the genus). Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; avoid overwatering.<br/>• Tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Commonly grown from cuttings. Hibbertias usually strike well, but <i>H. hypericoides<\/i> shows not every WA species does – set extra cuttings until your strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage, use clean mix, remove affected cuttings."],["Cuttings flower instead of rooting","Material taken from flowering shoots. Use non-flowering shoots."],["Slow to strike","Cool weather. Use bottom heat or wait for the Mar – May window."]],"other":"Seed – 0% germination in the one Alcoa nursery test; <i>Hibbertia<\/i> seed has complex dormancy. Layering – check low, sprawling stems for roots.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"Peppy Plants – Hibbertia cuneiformis (propagated by cuttings)","url":"peppyplants.com.au/hibbertia-cuneiformis-unveiling-the-charms-of-the-cutleaf-hibbertia/"},{"title":"Wikipedia – Hibbertia cuneiformis (description, flowering, habitat)","url":"en.wikipedia.org/wiki/Hibbertia_cuneiformis"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Commonly propagated by cuttings.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"0% in a nursery test; Hibbertia seed is dormant.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Shiny orange-brown, almost round seed, mostly covered by a fleshy yellow-orange aril.","size":"About 3 × 2.5 mm","tell":"Good seed is plump, rounded, very hard and often darker; smaller seed is unlikely to be viable. Discard damaged or brittle seed (Seed Notes 17). Bag fruits with stockings or muslin.","level":"species","d":{"shape":"round","L":3,"W":2.5,"col":"orangebrown","shiny":true,"aril":"orange","arilpos":"cover"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 17 – Hibbertia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02004.pdf"]],"photos":[],"sosa":false}},{"id":"hibbertia-hypericoides","sci":"Hibbertia hypericoides","common":"Yellow Buttercups","family":"Dilleniaceae","fam":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Difficult","provisional":false,"confidence":"Low","confidence_note":"Its difficulty is well documented (DBCA; specialist WA nurseries), but no detailed cutting protocol is published. Treat the method below as a trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Feb"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA (trial range)"]],"length_mm":[50.0,75.0],"check":[56,112],"calendar":["B","B","P","-","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Spreading shrub, 0.3–0.8 m. Densely hairy branches; small leaves with rolled edges and white-hairy undersides."],["Flowering","Apr – Nov (bright yellow, notched petals)."],["Habitat","Sandy soils in Banksia woodland and shrubland; one of the most common understorey plants between Perth and Albany. Resprouts from its rootstock after fire."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Feb<\/b>, after flowering finishes and once the new flush has started to firm. Nov and Mar are workable. Avoid Apr – Oct (flowering period)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that is just firming. Soft tips wilt quickly; old wood rarely roots."],["Cutting size","50–75 mm."],["Selecting material","Vigorous <b>non-flowering<\/b> shoots. Well-watered, actively growing stock plants (e.g. nursery-held stock) usually give better material than stressed bushland plants."],["Pre-treatment","• Strip lower leaves by cutting, not pulling.<br/>• Light wound on the firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Start with 3 g/L IBA (<b>Clonex Purple<\/b>). Because results are unreliable, split trial batches across 1.5, 3 and 8 g/L (Green, Purple, Red) and record which works best."],["Propagation mix","Very free-draining, fresh, clean mix. Strict hygiene – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bottom heat, bright shade. Mist lightly – the hairy leaf undersides hold water. Good airflow."],["Expected strike time","Slow and variable – allow <b>8–16 weeks<\/b>. Leave cuttings in as long as they stay green and healthy."],["Post-treatment / aftercare","• Harden off slowly (extend each stage if cuttings wilt).<br/>• Pot on gently, disturbing roots as little as possible.<br/>• Avoid overwatering; keep benches clean."]]}],"difficulty_note":"<b>Difficult.<\/b> DBCA notes it is difficult to grow from seed or cuttings, and specialist Perth nurseries describe it as a species other producers often fail with. Set large batches and keep detailed records.","problems":[["Cuttings stay green but don't root","Leave longer; check for heavy callus and trim it; try a different hormone strength."],["Cuttings collapse or rot","Too wet or root rot. Improve drainage and hygiene; remove affected cuttings."],["Rooted cuttings die after potting on","Roots damaged or hardening too fast. Use single tubes and harden off more slowly."]],"other":"Seed – also difficult: WA <i>Hibbertia<\/i> seed has complex dormancy, and treatments are still the subject of research. If numbers are needed quickly, consider buying in tubestock from a specialist grower.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"},{"title":"Natural Area Nursery – WA native plant propagation (H. hypericoides difficult to propagate)","url":"naturalarea.com.au/revegetation-plant-production/wa-native-plant-propagation/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"},{"title":"PMC – Sympatric species of Hibbertia vary in dormancy break and germination requirements","url":"pmc.ncbi.nlm.nih.gov/articles/PMC3336950"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Known to be difficult; trial protocol on the cuttings page.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Complex seed dormancy; rarely practical.","guide":null},{"method":"Division","suitability":"Not used","note":"Resprouts from a rootstock; not practical to divide.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Glossy red-brown, round seed; a translucent aril with a torn edge covers about half of it.","size":"About 4 mm long","tell":"Good seed is plump, rounded, very hard and often darker; smaller seed is unlikely to be viable. Discard damaged or brittle seed (Seed Notes 17).","level":"species","d":{"shape":"round","L":4,"W":null,"col":"redbrown","shiny":true,"aril":"clear","arilpos":"half"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 17 – Hibbertia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02004.pdf"]],"photos":[],"sosa":false}},{"id":"hibbertia-racemosa","sci":"Hibbertia racemosa","common":"Stalked Guinea Flower","family":"Dilleniaceae","fam":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on how the genus behaves and this species' growth cycle.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[28,56],"calendar":["B","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Small erect or ascending, spreading shrub, 0.1–0.75 m."],["Flowering","Jul – Dec (yellow, on long stalks)."],["Habitat","Grey, white or yellow sand in coastal areas: dunes, plains and limestone."],["Local note","Recorded in the City of Joondalup. Grey-leaved and prostrate forms are sold in the trade – keep forms separate and labelled."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, after flowering finishes and new growth has begun to firm. Dec and May are workable. Avoid Jun – Nov (cool weather, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that has started to harden. Firm tip cuttings also work."],["Cutting size","50–75 mm long. Stems are fine and leaves small, so keep cuttings short."],["Selecting material","<b>Non-flowering<\/b> side shoots from healthy plants. Snip off any flower stalks or buds."],["Pre-treatment","• Strip leaves from the lower half (cut rather than pull on fine stems).<br/>• Wounding not needed on fine stems; a light wound is optional on firmer material.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength (3 g/L IBA, e.g. <b>Clonex Purple<\/b>). For softer tips use softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>)."],["Propagation mix","Very free-draining, sand-based mix. Use fresh, clean mix and clean tubes – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bright shade, bottom heat. Keep the mix moist but never wet; good airflow."],["Expected strike time","Roughly <b>4–8 weeks<\/b> in warm weather; may be slower. Record your results."],["Post-treatment / aftercare","• Standard hardening off (2 weeks closed by day/open at night, then 2 weeks shade).<br/>• Pot on into a free-draining native mix; avoid overwatering.<br/>• Keep good hygiene on benches to limit root rot."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Hibbertias are generally easy from cuttings, but some WA species (e.g. <i>H. hypericoides<\/i>) are known to be difficult. Set larger batches until your own strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage, use clean mix, remove affected cuttings."],["Few roots, cuttings flower","Material was taken from flowering shoots. Use non-flowering side shoots."],["Slow to strike in winter","Use bottom heat, or wait for the Jan – Apr window."]],"other":"Seed – generally unreliable in <i>Hibbertia<\/i> (complex dormancy). Layering – several hibbertias root where stems touch the ground; check low stems on prostrate forms and pot up any rooted pieces.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Hibbertia vestita profile (genus note: easy from cuttings, seed unreliable)","url":"anpsa.org.au/plant_profiles/hibbertia-vestita/"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Semi-hardwood cuttings (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Hibbertia seed is dormant and unreliable.","guide":null},{"method":"Division","suitability":"Possible","note":"Low stems may root where they touch the soil (layering).","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Shiny orange-brown, almost round seed; a white membranous aril wraps its base.","size":"About 2 × 1.6 mm","tell":"Good seed is plump, rounded, very hard and often darker; smaller seed is unlikely to be viable. Discard damaged or brittle seed (Seed Notes 17).","level":"species","d":{"shape":"round","L":2,"W":1.6,"col":"orangebrown","shiny":true,"aril":"white","arilpos":"base"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 17 – Hibbertia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02004.pdf"]],"photos":[],"sosa":false}},{"id":"hibbertia-spicata","sci":"Hibbertia spicata","common":"","family":"Dilleniaceae","fam":"Dilleniaceae","alt":"Perth coastal plants are now <i>Hibbertia leptotheca<\/i> (formerly <i>H. spicata<\/i> subsp. <i>leptotheca<\/i>)","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No species data. WA seed notes say most hibbertias are grown from cuttings, but <i>H. hypericoides<\/i> shows some WA species are hard.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[42,63],"calendar":["B","B","B","P","-","-","-","-","-","-","-","P"],"snapshot":[["Habit","Small erect or spreading shrub, 0.2–0.7 m (<i>H. leptotheca<\/i> 0.2–0.5 m)."],["Flowering","Jul – Nov (yellow)."],["Habitat","Sand, limestone and laterite; near-coastal limestone ridges, outcrops and cliffs."],["Local note","A recent revision split <i>H. spicata<\/i> (in the broad sense) into six species. True <i>H. spicata<\/i> is recorded around Geraldton – Shark Bay and Augusta – Margaret River. The Perth coastal plant is <i>H. leptotheca<\/i> (recorded in Wanneroo). It is a <b>Priority Three<\/b> species, so take cuttings only from nursery stock or under the right DBCA licence, and check provenance labels."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Mar<\/b>, after flowering, once new growth has firmed. <i>H. empetrifolia<\/i> cuttings strike readily in Jan – Feb. Dec and Apr are workable. Avoid May – Nov (cool, and plants are flowering)."],["Wood type","<b>Semi-hardwood<\/b> – current season's growth that has begun to firm."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants. Snip off any buds."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer stems."],["Propagation mix","Very free-draining, sand-based mix. Use fresh mix and clean tubes – hibbertias are prone to root rot."],["Environment","Humid frame, bright shade, bottom heat. Moist, never wet; good airflow."],["Expected strike time","Not documented – check from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; avoid overwatering."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Untested for this species. Set extra cuttings until your strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage; clean mix; remove affected cuttings."],["Cuttings flower instead of rooting","Material from flowering shoots. Use non-flowering shoots."],["Very low strike","Some WA hibbertias are hard. Try softer tips, bottom heat, and record which works."]],"other":"Seed – dormant: 9% in the one Alcoa nursery test (about 30 seedlings per gram). Removing the seed coat or using gibberellic acid (25 mg/L) can help (WA seed notes).","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"Cochrane A. (2007) Seed Notes 17 – Hibbertia (most plants grown from cuttings; dormant seed; GA 25 mg/L). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02004.pdf"},{"title":"Thiele K.R. – Nuytsia 30: the Hibbertia spicata group split into six species, incl. H. leptotheca","url":"florabase.dbca.wa.gov.au/nuytsia/article/924"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Most hibbertias are grown from cuttings (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Dormant; 9% in the one Alcoa test; GA may help.","guide":null},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":null,"conservation":"Priority Three (as H. leptotheca)","seedid":{"unit":"Seed (aril left on)","look":"Usually round, shiny brown seed with an aril; 2–5 seeds per fruit (genus). Perth coastal plants are now H. leptotheca.","size":"Not published","tell":"Good seed is plump, rounded, very hard and often darker; smaller seed is unlikely to be viable. Discard damaged or brittle seed (Seed Notes 17).","level":"genus","d":{"shape":"round","L":null,"W":null,"col":"brown","shiny":true,"aril":"white","arilpos":"base"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 17 – Hibbertia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02004.pdf"]],"photos":[],"sosa":false}},{"id":"hovea-pungens","sci":"Hovea pungens","common":"Devil's Pins","family":"Fabaceae","fam":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data available for this species; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","4–6 mm"],["Typical germination","41%"],["Seed per 100 plants","3.0 g"]],"check":[7,14],"stats":{"germ_pct":41,"per_gram":33},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, prickly, broom-like shrub, 0.2–1.8 m."],["Flowering","May – Nov (blue-purple)."],["Habitat","Wide range: shallow soils on rock, sand, laterite, gravel, clay and loam; granite outcrops, coastal limestone and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Sharp leaves – wear gloves when collecting."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in late spring to summer and <b>eject seed when ripe<\/b>. Bag developing pods with stockings or muslin."],["Extraction & cleaning","Collect seed from the bags; sieve out pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps for many years when dry (typical of hard-coated pea-family seed)."],["Typical germination","About <b>41%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over the seed and soak overnight. Sow swollen seed; re-treat any that haven't swollen."],["Sowing depth & method","Larger seed – cover about <b>4–6 mm<\/b> (roughly twice its thickness). Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","If tray-sown, prick out at the cotyledon stage – early, as the taproot grows fast."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or mix too wet. Keep to 30 s; water less."],["Taproot damage at pricking out","Pricked out too late. Direct sow into tubes instead."]],"other":"Wear gloves – the pungent (sharp) leaves make handling seedlings and stock plants prickly.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Pods eject seed when ripe – bag developing pods."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Brown seed with paler mottling and a small cup-shaped aril about 2 mm long. Pod round, 6–9 mm.","size":"4–5.5 mm long","tell":"Not published for Hovea. The float test used for other peas (good seed sinks in water with a drop of detergent) is worth trying.","level":"species","d":{"shape":"oval","L":4.75,"W":4.2,"col":"brown","mottle":true,"aril":"cream"},"sources":[["Flora of South Australia online","https://flora.sa.gov.au"],["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Legume seed identification tool (idtools.org) – genus seed descriptions","https://idtools.org/fabaceae/"]],"photos":[],"sosa":false}},{"id":"hovea-trisperma","sci":"Hovea trisperma","common":"Common Hovea","family":"Fabaceae","fam":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 25 tests; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","31%"],["Seed per 100 plants","4.4 g"]],"check":[7,14],"stats":{"germ_pct":31,"per_gram":22.6},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Straggling, weak to ascending shrub, 0.1–0.7 m."],["Flowering","May – Nov (purple-blue)."],["Habitat","Sandy soils, laterite, gravel and clay loam."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods shed seed as soon as they are ripe (late spring–summer). Bag developing pods with fine mesh."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","About <b>31%<\/b> after boiling-water treatment (Alcoa nursery average, 25 tests). About <b>23 seedlings per gram<\/b> – roughly 4.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. Sow the swollen seed; re-treat the rest."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Grows well under taller shrubs – a good understorey plant.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Pea family (Fabaceae) genus page: boiling-water pre-treatment, cuttings","url":"anpsa.org.au/genera/pea-family/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not d ","<b>Dec – Mar<\/b> (January is suggested for the Geraldton wax group), once the current season's growth has hardened. Nov and Apr are workable. Avoid May – Oct (cool, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth (ANPSA)."],["Cutting size","75–100 mm."],["Selecting material","Non-flowering tips from healthy plants."],["Pre-treatment","• Carefully remove the leaves from the lower two-thirds.<br/>• Wound the base.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>) – wounding and hormone both improve results."],["Propagation mix","Standard free-draining cutting mix. Clean mix and tubes – the genus includes dieback-affected species."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – usually quick; check from about 4 weeks."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix; tip-prune for bushiness."]]}],"difficulty_note":"<b>Easy.<\/b> Cuttings are the preferred method and strike readily (ANPSA).","problems":[["Cuttings brown off","Too soft or too dry. Use hardened growth; keep humidity up."],["Base rotting","Mix too wet. Water less, improve drainage."],["Leggy plants","Not pruned. Tip-prune young plants."]],"other":"Seed – possible; smoke water is likely to help (about 35% in a single Alcoa test with smoke).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTe
