","Not recorded – check from about one week after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat, or try the dry-heat method."],["Swollen seed rots","Mix too wet. Water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Treat as a trial and record germination so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Friends of Queens Park Bushland – plant pages (Gastrolobium capitatum, Xanthorrhoea preissii)","url":"friendsofqueensparkbushland.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Hot w treatment (Alcoa nursery average). About <b>125 seedlings per gram<\/b> – roughly 0.8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Either:<br/>• <b>Dry heat shock:<\/b> oven at 80–120°C for 10 min to 1 hour (Alcoa used a dry-heat pulse for this species); or<br/>• <b>Hot water:<\/b> pour near-boiling water over the seed and let it cool in the water (easiest method). Sow seed that has swollen; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>3–4 mm<\/b>. Direct sow a few seeds per tube and thin, or sow thinly in trays."],["After sowing","Water in; keep moist, not wet. Sow promptly after hot-water treatment."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed or switch between heat and hot-water methods."],["Seed rots after sowing","Too wet. Water less and improve drainage."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Spindly habit – tip-pruning young plants can give a fuller tube.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Dry heat or hot water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["B","B","-","-","-","-","-","-","-","-","P","B"],"basis":"guide","any":false,"note":"Bag developing pods/fruit with stockings or fine mesh – they split and shed seed quickly."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Kidney-shaped to round, smooth seed – reddish-brown, orange or black – with a dry reddish-brown rim-aril; 6–12 seeds per pod (genus).","size":"Not published (genus 1.6–3 × 1.2–2.5 mm)","tell":"Discard seed with holes (insect damage) or that is shrivelled. In water with a drop of detergent, good seed sinks and bad seed floats (Seed Notes 15).","level":"genus","d":{"shape":"kidney","L":2.3,"W":1.8,"col":"redbrown","aril":"redbrown"},"sources":[["Legume seed identification tool (idtools.org) – genus seed descriptions","https://idtools.org/fabaceae/"],["Seed Notes 15 – Chorizema, Daviesia, Gastrolobium, Gompholobium (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"]],"photos":[],"sosa":false}},{"id":"grevillea-crithmifolia","sci":"Grevillea crithmifolia","common":"","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Grown commercially from cuttings but reported slow to root; size and treatment follow ANPSA <i>Grevillea<\/i> guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[56,84],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Dense, much-branched shrub, (0.3–) 0.6–2 m. Compact shrub and low groundcover forms exist."],["Flowering","Jun or Aug – Nov (white to white-pink). Some people dislike the scent."],["Habitat","White or yellow sand over limestone; dunes, hillslopes and sandplains."],["Local note","Recorded in the City of Joondalup. Dieback susceptible. Keep the shrub and groundcover forms separate."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b>, after flowering, once new growth has firmed. Nov and May are workable. Avoid Jun – Oct (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm (ANPSA <i>Grevillea<\/i> guidance)."],["Selecting material","Non-flowering shoots from a plant of the form you want (shrub or groundcover)."],["Pre-treatment","• Strip leaves from the lower half to two-thirds (cut, don't tear).<br/>• Wound the base – a thin sliver of bark from the bottom 15–20 mm.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>). Wounding and hormone improve strike in grevilleas."],["Propagation mix","Free-draining, clean cutting mix. Strict hygiene – the species is dieback susceptible."],["Environment","Humid frame, bright shade, bottom heat. Be patient – roots can be slow."],["Expected strike time","Not documented, but reported slow – allow at least <b>8–12 weeks<\/b> before discarding. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a <b>low-phosphorus<\/b> native mix; feed only with low-P fertiliser."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Cuttings are the usual method but may be slow to produce roots.","problems":[["No roots after 8 weeks","Normal for this species – keep them going. Next time wound and use hormone."],["Heavy callus, no roots","Trim the callus and re-set; try a lower hormone strength."],["Plants yellow or die after potting","Phosphorus or dieback. Low-P mix, clean pots off the ground."]],"other":"Seed – poor: about 9% in a single Alcoa nursery test; a seed supplier recommends smoke treatment.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery (seed test figures quoted under Other methods)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"Australian Plants Society NSW – Grevillea crithmifolia (cuttings may be slow to root; shrub and groundcover forms)","url":"resources.austplants.com.au/plant/grevillea-crithmifolia/"},{"title":"APACE WA – Grevillea crithmifolia (dieback susceptible)","url":"apacewa.org.au/plant/grevillea-crithmifolia/"},{"title":"ANPSA – Grevillea genus page (75–100 mm cuttings, strip lower half to two-thirds, wounding, hormone; phosphorus)","url":"anpsa.org.au/genera/grevillea/"},{"title":"Nindethana Australian Seed – Grevillea crithmifolia and G. preissii seed (smoke treatment recommended)","url":"nindethana.net.au"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"The usual method, but may be slow to root.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"About 9% in one nursery test; smoke recommended.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed","look":"Not described for this species. Thin-walled grevillea follicles hold two narrow oval seeds, often with a membranous ant-attracting elaiosome (genus).","size":"Not published (follicle 12–15 mm)","tell":"Good seed is full and plump. The second 'seed' may be papery thin and aborted – discard it. Watch for insect damage. Bag developing follicles with stockings or muslin (Seed Notes 11).","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"brown"},"sources":[["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"],["Seed Notes 11 – Grevillea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01998.pdf"]],"photos":[],"sosa":false}},{"id":"grevillea-preissii","sci":"Grevillea preissii","common":"Spider-net Grevillea","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"ANPSA gives species-specific cutting advice; size follows ANPSA <i>Grevillea<\/i> guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Nov – Mar"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[56,84],"calendar":["B","B","B","P","-","-","-","-","-","P","B","B"],"snapshot":[["Habit","Shrub, 0.15–1.7 m."],["Flowering","Jun – Sep (red spider flowers; attract honeyeaters)."],["Habitat","White, grey or yellow sand, sandy clay and limestone; ridges, outcrops and seasonally wet areas."],["Local note","Recorded in Joondalup and Wanneroo. The former subsp. <i>glabrilimba<\/i> (including ‘Magic Lantern’) is now a separate species, <i>G. glabrilimba<\/i> – keep it apart from local stock."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Mar<\/b>, after flowering, once the current season's growth has firmed. Oct and Apr are workable. Avoid May – Sep (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","75–100 mm (ANPSA <i>Grevillea<\/i> guidance)."],["Selecting material","Non-flowering shoots from healthy, local-provenance plants."],["Pre-treatment","• Strip leaves from the lower half to two-thirds.<br/>• Wound the base on firmer stems.<br/>• Dip the base in rooting hormone – ANPSA notes it clearly improves success."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining, clean cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented, but reported slow – allow at least <b>8–12 weeks<\/b> before discarding. Record your results."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a <b>low-phosphorus<\/b> native mix."]]}],"difficulty_note":"<b>Moderate.<\/b> Cuttings of firm growth can be slow to strike; hormone improves success.","problems":[["Slow to strike","Normal. Use hormone and bottom heat; be patient."],["Heavy callus, no roots","Trim and re-set; try a lower hormone strength."],["Yellowing after potting on","Phosphorus in mix or fertiliser. Use low-P products."]],"other":"Seed – nick the seed coat before sowing (ANPSA); a seed supplier recommends smoke treatment.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Grevillea preissii profile (cuttings slow; hormone improves success; nick seed)","url":"anpsa.org.au/plant_profiles/grevillea-preissii/"},{"title":"ANPSA – Grevillea genus page (75–100 mm cuttings, strip lower half to two-thirds, wounding, hormone; phosphorus)","url":"anpsa.org.au/genera/grevillea/"},{"title":"Olde P.M. (2022) Telopea – Grevillea preissii subsp. glabrilimba raised to species rank as G. glabrilimba","url":"openjournals.library.sydney.edu.au/TEL/article/view/15872"},{"title":"Nindethana Australian Seed – Grevillea crithmifolia and G. preissii seed (smoke treatment recommended)","url":"nindethana.net.au"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Firm growth; slow, hormone improves strike.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Nick the seed coat; smoke water.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed","look":"Not described for this species. Thin-walled grevillea follicles hold two narrow oval seeds, often with a membranous ant-attracting elaiosome (genus).","size":"Not published (follicle about 15 mm)","tell":"Good seed is full and plump. The second 'seed' may be papery thin and aborted – discard it (Seed Notes 11).","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"brown"},"sources":[["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"],["ANPSA – plant profiles","https://anpsa.org.au/plant_profiles/"],["Seed Notes 11 – Grevillea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01998.pdf"]],"photos":[],"sosa":false}},{"id":"grevillea-vestita","sci":"Grevillea vestita","common":"","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Species-specific propagation information is published and consistent across sources.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","80–120 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[80.0,120.0],"check":[42,56],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Erect, spreading, prickly shrub, usually 0.5–3 m. Hairy branchlets; lobed leaves with sharp-pointed tips."],["Flowering","Mainly Jun – Nov (white to cream, often pink-tinged, scented). Odd flowers Jan – Apr."],["Habitat","Sandy soils over limestone or granite. Occurs on the Swan Coastal Plain, including the Perth area."],["Local note","Two subspecies exist (subsp. <i>vestita<\/i> and subsp. <i>isopogoides<\/i>). Label stock plants by subspecies and provenance."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b> (late spring to autumn), once the spring flush has firmed and flowering has finished. Nov and May are workable. Avoid Jun – Oct: plants are flowering, new growth is soft and cool weather slows rooting."],["Wood type","<b>Semi-hardwood<\/b> – firm, current season's growth. It should bend about 60° and spring back."],["Cutting size","80–120 mm long with 3–5 nodes. Tip or sub-tip pieces; two cuttings can often be taken from one shoot."],["Selecting material","Healthy, vigorous, <b>non-flowering<\/b> shoots. Skip shoots carrying buds, old woody stems and soft new tips."],["Pre-treatment","• Wear gloves: leaves are prickly and grevillea sap can irritate skin.<br/>• Remove any flowers or buds.<br/>• Strip leaves from the lower half to two-thirds (cut, don't tear the bark).<br/>• Trim remaining lobed leaves by about one-third.<br/>• Wound: remove a thin sliver of bark from the bottom 15–20 mm.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>. If cuttings form a heavy callus but no roots, trim the callus back to clean wood and re-set; try a lower strength on the next batch."],["Propagation mix","Free-draining, low nutrient: about 75–80% washed coarse river sand + 20–25% coir or peat (or a perlite/coir mix)."],["Environment","Humid propagation house or frame in bright shade. Bottom heat with the base of the cutting 5–10°C warmer than the air. Light misting only – the hairy foliage can rot if kept constantly wet."],["Expected strike time","About <b>6–8 weeks<\/b> in warm weather. Slower in the cooler months."],["Post-treatment / aftercare","• Harden off: ~2 weeks with cover closed by day and open at night, then ~2 weeks in shade before full sun.<br/>• Pot on when roots show at the drainage holes, into a <b>low-phosphorus<\/b> native mix.<br/>• Feed only with a low-phosphorus native fertiliser (Proteaceae are phosphorus-sensitive).<br/>• Responds well to pruning – tip-prune young plants for a bushier tube."]]}],"difficulty_note":"<b>Easy.<\/b> Cuttings from firm current season's growth usually strike reliably.","problems":[["Heavy callus, no roots","Trim callus back and re-set. Lower the hormone strength next time."],["Base rotting","Mix too wet or material too soft. Use firmer wood and water less often."],["Leaf yellowing or scorch after potting on","Check phosphorus in the potting mix and fertiliser."]],"other":"Seed – grows reasonably easily from seed, but seedlings are not identical to the parent. Grafting onto <i>G. robusta<\/i> is used on the humid east coast; not needed locally.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"ANPSA – Grevillea vestita plant profile","url":"anpsa.org.au/plant_profiles/grevillea-vestita/"},{"title":"Australian Plants Society NSW – Grevillea vestita","url":"resources.austplants.com.au/plant/grevillea-vestita/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Minimalist Gardener – Propagating Australian natives from cuttings (grevillea strike times, sap irritant)","url":"minimalistgardener.com.au"},{"title":"CompleteGrow – How to propagate Grevillea (low-phosphorus feeding)","url":"completegrow.com.au"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANPSA says it grows reasonably easily from seed; treatment follows WA <i>Grevillea<\/i> seed notes.","facts":[["Pre-treatment","Nick seed coat; smoke water"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","Not recorded"]],"check":[21,60],"stats":{"germ_pct":null,"per_gram":null},"grow":[4.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Store dry & cool"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, spreading, prickly shrub, usually 0.5–3 m."],["Flowering","Mainly Jun – Nov (white to cream, often pink-tinged, scented)."],["Habitat","Sandy soils over limestone or granite on the Swan Coastal Plain."],["Local note","Two subspecies exist – label seed by subspecies and provenance. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles split and drop seed soon after ripening. <b>Tie fine mesh or stocking bags over maturing follicles<\/b> and collect once they open."],["Extraction & cleaning","Seed usually falls into the bag; remove follicle debris."],["Seed quality","Cut-test a few seeds – good seed is firm and white inside."],["Storage life","Not well documented. Store dry, sealed and cool."],["Typical germination","Not recorded. Untreated seed can take 1–2 years to germinate."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool autumn). Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>Nick the seed coat<\/b> with a scalpel (or peel it off after a short soak), then soak in smoke water for 24 hours. Gibberellic acid (GA) can also help (WA <i>Grevillea<\/i> seed notes)."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes – seedlings have a taproot."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","A few weeks for treated seed; untreated seed can take <b>1–2 years<\/b>."],["Pricking out","If tray-sown, prick out early at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination after months","Seed coat not treated. Nick or peel, then smoke water."],["Seedlings yellow or die","Phosphorus toxicity or root rot. Low-P mix and feed; good hygiene."],["Seedlings differ from parent","Normal for seed. Use cuttings to keep a particular form."]],"other":"Cuttings are the main method and keep the parent's form (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 11 – Grevillea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01998.pdf"},{"title":"ANPSA – Grevillea vestita profile (grows reasonably easily from seed)","url":"anpsa.org.au/plant_profiles/grevillea-vestita/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Firm current season's growth strikes reliably.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Grows reasonably easily from seed; seedlings vary from the parent.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Can sucker – lift rooted suckers.","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","P","P","P","P"],"basis":"estimate","any":false,"note":"Follicles drop seed soon after ripening – bag maturing follicles."},"conservation":"","seedid":{"unit":"Seed","look":"Not described for this species. Thin-walled grevillea follicles hold two narrow oval seeds, often with a membranous ant-attracting elaiosome (genus).","size":"Not published (follicle 8–10.5 mm)","tell":"Good seed is full and plump. The second 'seed' may be papery thin and aborted – discard it (Seed Notes 11).","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"brown"},"sources":[["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"],["Seed Notes 11 – Grevillea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01998.pdf"]],"photos":[],"sosa":false}},{"id":"guichenotia-ledifolia","sci":"Guichenotia ledifolia","common":"","family":"Malvaceae","fam":"Malvaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA seed notes say the genus is often grown from cuttings; semi-hardwood cuttings are listed for this species. No published strike rates.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[28,42],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Spreading shrub, 0.4–1.5 (–2) m."],["Flowering","Jul – Oct (blue-purple or pink)."],["Habitat","Sandy or rocky clay; coastal limestone, sandplains and granite rocks."],["Local note","Recorded in Joondalup and Wanneroo. Tolerates drought and alkaline (limestone) soils."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b>, after flowering, once new growth has firmed. Nov and May are workable. Avoid Jun – Oct (cool, and plants are flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","50–75 mm."],["Selecting material","Healthy, <b>non-flowering<\/b> side shoots."],["Pre-treatment","• Strip leaves from the lower half; the leaves are small, so no trimming is needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Very free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat. Moist, not wet; good airflow."],["Expected strike time","Not documented – check from about 4–6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun in a free-draining mix.<br/>• Tip-prune for a denser plant."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Firm growth of the related <i>G. macrantha<\/i> usually strikes reliably; untested here.","problems":[["Leaves go mouldy","Too humid or crowded. Ventilate the frame; don't over-mist."],["Base rotting","Too wet. Coarser mix; water less."],["Slow to root","Use bottom heat and take cuttings in the warm months."]],"other":"Seed – hard-coated. Pour boiling water over sown seed or soak it 24 h in water just off the boil; germination is variable and takes 30+ days (see the Seed Sowing Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Cochrane A. (2007) Seed Notes 20 – Lasiopetalum, Thomasia and Guichenotia (often grown from cuttings; hard seed). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02007.pdf"},{"title":"Gardening With Angus – Guichenotia ledifolia (semi-hardwood cuttings)","url":"gardeningwithangus.com.au/guichenotia-ledifolia/"},{"title":"ANPSA – Guichenotia macrantha profile (cuttings of firm current season's growth usually strike reliably)","url":"anpsa.org.au/plant_profiles/guichenotia-macrantha/"},{"title":"Botanic Gardens of South Australia Plant Selector – Guichenotia ledifolia (drought and lime tolerant)","url":"plantselector.botanicgardens.sa.gov.au"}]},"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"Medium","confidence_note":"WA seed notes and a WA community-nursery method available; germination is reported to be variable.","facts":[["Pre-treatment","Boiling water over seed; smoke"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","Variable"]],"check":[30,45],"stats":{"germ_pct":null,"per_gram":null},"grow":[4.0,5.0],"storage":{"kind":"long","months":null,"text":"Hard-coated – likely long"},"calendar":["-","-","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Spreading shrub, 0.4–1.5 (–2) m."],["Flowering","Jul – Oct (blue-purple or pink)."],["Habitat","Sandy or rocky clay; coastal limestone, sandplains and granite rocks."],["Local note","Recorded in Joondalup and Wanneroo. Tolerates drought and alkaline (limestone) soils."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit develops in late spring–summer. Collect the <b>swollen fruits once the calyx turns papery<\/b>; each capsule holds up to 15 seeds."],["Extraction & cleaning","Dry in paper bags and sieve out the seed."],["Seed quality","Hard seed coat (physical dormancy). A seed supplier lists about 550 seeds per gram."],["Storage life","Not documented; hard-coated seed is usually long-lived when dry."],["Typical germination","Variable, as reported in WA seed notes. No nursery figures."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Jun – Aug and Oct workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Break the hard coat: <b>pour boiling water over the sown seed<\/b> (Geraldton method), or soak in water just off the boil for 24 hours, or chip the seed coat. Water in with smoke water."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>."],["After sowing","Keep moist, not wet."],["Germination time","<b>30+ days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low, patchy germination","Seed coat not broken. Try chipping, or the 24 h hot-water soak."],["Seed killed","Water too hot for too long. Use water just off the boil."],["Damping off","Sow thinly; airflow."]],"other":"Seed is rarely available commercially – it is usually grown from cuttings (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Cochrane A. (2007) Seed Notes 20 – Lasiopetalum, Thomasia and Guichenotia. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02007.pdf"},{"title":"Botanic Gardens of South Australia Plant Selector – Guichenotia ledifolia (drought and lime tolerant)","url":"plantselector.botanicgardens.sa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Often grown from cuttings; semi-hardwood.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Hard coat: boiling water over seed; variable.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect swollen fruits once the calyx turns papery."},"conservation":"","seedid":{"unit":"Seed","look":"Hard, dark-brown to black seed, up to 15 per capsule, inside the papery calyx (genus). Collect the swollen fruits once the calyx turns brown and papery.","size":"Not published – see the seed bank photos","tell":"Mature seed is dark brown to black and full; lighter-coloured or slightly shrivelled seed is unlikely to be viable. Nick a few to check for white endosperm; filled seed sinks in water (Seed Notes 20).","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"blackish"},"sources":[["Seed Notes 20 – Lasiopetalum, Thomasia and Guichenotia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02007.pdf"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"]],"photos":[{"id":"e5cd3050-6cbd-4b1d-83ca-b5d480b98c60","nsb":1675,"by":"B. Clinton"},{"id":"b44fc1e3-0e8e-4566-8596-12ef97914a0f","nsb":1676,"by":"B. Clinton"}],"sosa":false}},{"id":"haemodorum-laxum","sci":"Haemodorum laxum","common":"Bloodroot","family":"Haemodoraceae","fam":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Strong nursery germination data (33 tests); growing-on notes come from related species.","facts":[["Pre-treatment","None (smoke optional)"],["Best sowing","Mar – May"],["Sowing depth","Lightly covered"],["Typical germination","73%"],["Seed per 100 plants","0.7 g"]],"check":[42,84],"stats":{"germ_pct":73,"per_gram":150},"grow":null,"storage":{"kind":"unknown","months":24,"text":"Stores dry; 1–2 yr old seed fine"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Bulbous perennial herb with a red underground bulb; flowering stems 0.6–1.4 m."],["Flowering","Oct – Nov (black, brown or green-brown)."],["Habitat","Grey or yellow sand, clay, gravel and laterite; dry or seasonally damp sites."],["Local note","Recorded in Joondalup and Wanneroo. Rarely grown in nurseries – germinates well, but the bulb is slow to develop."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the flowering stems as the capsules dry and brown, in early summer after the Oct – Nov flowering (estimate). Capsules dry hard and split, and the small winged seeds are shaken out – don't wait too long."],["Extraction & cleaning","Dry in paper bags, shake out the seed and sieve off the capsule pieces."],["Seed quality","Flat, black, disc-shaped seed with a thin wing (genus). Cut-test a few."],["Storage life","Stores dry. The Alcoa nursery tests used seed that was usually 1–2 years old."],["Typical germination","About <b>73%<\/b> untreated (Alcoa nursery average, 33 tests) – high for a WA monocot. About <b>150 seedlings per gram<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb – the nursery tests were run cool, at about 15–20°C."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","<b>None needed.<\/b> Smoke water is optional – <i>Haemodorum<\/i> is listed as a smoke-responsive genus."],["Sowing depth & method","Sow thinly and cover lightly."],["After sowing","Keep moist, not wet, through the cool months."],["Germination time","Most within about <b>6 weeks<\/b> – the nursery tests were read after 40 days."],["Pricking out","Early and gently, at 1–2 leaves, so the developing bulb isn't damaged."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – a related species takes a couple of seasons to form a decent bulb, and is summer-dormant. Record your own."]]}],"difficulty_note":"","problems":[["Seedlings die back in summer","Probably normal summer dormancy (related species). Keep the pots, water sparingly and wait for autumn."],["Bulbs rot","Too wet while dormant. Free-draining mix; water less over summer."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Not divided – grow from seed. The red bulbs of <i>Haemodorum<\/i> were eaten and used as a dye, and survive summer and autumn fires.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/Ful ation":"","seedid":{"unit":"Seed","look":"Not described for this species. In the genus the seeds are flat, round discs with a thin papery wing around the edge, usually black, two per cell of a three-lobed capsule.","size":"Not published (genus: seed body about 2–3 mm wide, plus a thin wing)","tell":"Not published. Discard flat, papery seed with no body; cut-test a few.","level":"genus","d":{"shape":"disc","L":null,"W":null,"col":"black"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"hakea-lissocarpha","sci":"Hakea lissocarpha","common":"Honey Bush","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (41 tests) and WA <i>Hakea<\/i> seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","66%"],["Seed per 100 plants","2.0 g"]],"check":[21,42],"stats":{"germ_pct":66,"per_gram":50},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Erect to sprawling, prickly shrub, 0.4–1.5 (–3) m."],["Flowering","May – Sep (scented white-cream, yellow or pink)."],["Habitat","White, grey or yellow sand, sandy loam, granitic soils and laterite."],["Local note","Recorded in the Wanneroo LGA. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Woody fruits usually hold their seed for at least a year. Collect mature, closed fruits."],["Extraction & cleaning","Keep fruits in a paper bag in a warm, dry place – they open after several days to several weeks. If they won't open, oven at about <b>125°C for 1 hour<\/b>. Each fruit holds two winged seeds."],["Seed quality","Cut-test a few seeds."],["Storage life","<b>Long<\/b> – viable for many years stored dry and cool."],["Typical germination","About <b>66%<\/b> (untreated, Alcoa nursery average, 41 tests). About <b>50 seedlings per gram<\/b> – roughly 2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Direct sow 1–2 seeds per tube, covered about <b>3–5 mm<\/b>."],["After sowing","Water in; keep moist, not wet. Watch for damping off."],["Germination time","About <b>3–6 weeks<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, good airflow, bottom watering."],["Yellowing seedlings","Phosphorus toxicity. Very low-P feed only."],["Fruits won't open","Warm them longer, or use the oven method."]],"other":"Hakea cuttings are harder than seed; seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 66% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Fruits hold seed for a year or more – collect mature closed fruits."},"conservation":"","seedid":{"unit":"Winged seed","look":"Seed body dark brown to black (genus) with a papery wing that runs down one side only. From woody follicles 15–25 mm long with two short beaks.","size":"9–20 mm long including the wing; 5–7 mm wide","tell":"Good seed has a solid white endosperm. Discard flattened or shrivelled seed, and seed with frass or grub holes (Seed Notes 14).","level":"species","d":{"shape":"hakea","L":14,"W":6,"col":"darkbrown"},"sources":[["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"],["Seed Notes 14 – Hakea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"]],"photos":[{"id":"8a97861e-3b7b-47ce-928d-4f86d8cd3b0b","nsb":712,"by":"B. Clinton"},{"id":"d1e34131-99e7-474f-a4d8-a82878864218","nsb":713,"by":"B. Clinton"}],"sosa":false}},{"id":"hakea-prostrata","sci":"Hakea prostrata","common":"Harsh Hakea","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data from 30 tests and WA <i>Hakea<\/i> seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","79%"],["Seed per 100 plants","4.9 g"]],"check":[21,42],"stats":{"germ_pct":79,"per_gram":20.6},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Erect to spreading or prostrate shrub, 1–3 m, with stiff, prickly-edged leaves. No lignotuber."],["Flowering","Jul – Oct (white-cream)."],["Habitat","Sandy soils, often over laterite; hillslopes, granite outcrops and coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Extremely phosphorus-sensitive. Prostrate coastal forms exist – label by form."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","<b>Unlike most hakeas, it releases seed when the fruit ripens<\/b> (WA Hakea seed notes). Bag maturing fruits with mesh, or pick them just before they split."],["Extraction & cleaning","Keep fruits in a paper bag in a warm, dry place until they open; each holds two winged seeds."],["Seed quality","Cut-test a few seeds."],["Storage life","<b>Long<\/b> – viable for many years stored dry and cool."],["Typical germination","About <b>79%<\/b> (untreated, Alcoa nursery average, 30 tests). About <b>21 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free mix with <b>no added phosphorus<\/b>."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Direct sow 1–2 seeds per tube, covered about <b>3–5 mm<\/b>."],["After sowing","Water in; keep moist, not wet. Watch for damping off."],["Germination time","About <b>3–6 weeks<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings yellow and die","Phosphorus toxicity – this species is extremely sensitive. No P in mix or feed."],["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Fruits empty when collected","Seed already shed. Bag fruits earlier."]],"other":"Bird and bee attracting. Hakea cuttings are harder than seed.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Seed Notes 14 – Hakea. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"},{"title":"ANPSA – Hakea genus page (opening fruits, germination 14–60 days, cuttings, P and dieback sensitivity)","url":"anpsa.org.au/genera/hakea/"},{"title":"Shane M.W. et al. (2004) Plant, Cell & Environment – A root trait accounting for the extreme phosphorus sensitivity of Hakea prostrata","url":"onlinelibrary.wiley.com/doi/full/10.1111/j.1365-3040.2004.01204.x"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Hakeas are harder from cuttings than seed.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; bag fruit – it sheds seed when ripe.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","-","-","-","-","-","-","-"],"basis":"estimate","any":false,"note":"Releases seed when ripe – bag maturing fruits or pick just before they split."},"conservation":"","seedid":{"unit":"Winged seed","look":"Seed body dark brown to black (genus) with a papery wing partly down one or both sides. From ovate follicles 2.3–3.8 cm long.","size":"18–20 mm long (Flora of Australia); the seed bank measured about 9.8 × 6.4 mm","tell":"Collect before the follicles open – this species releases its seed when ripe. Good seed has a solid white endosperm. Discard flattened or shrivelled seed, and seed with frass or grub holes (Seed Notes 14).","level":"species","d":{"shape":"hakea","L":19,"W":6.4,"col":"darkbrown"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"],["Seed Notes 14 – Hakea (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02001.pdf"]],"photos":[{"id":"c268f40b-e078-4af6-b752-3dc118151a4e","nsb":718,"by":"B. Clinton"},{"id":"737b2d50-a1eb-4c50-bdd0-76740043da07","nsb":719,"by":"B. Clinton"}],"sosa":false}},{"id":"hakea-trifurcata","sci":"Hakea trifurcata","common":"Two-leaf Hakea","family":"Proteaceae","fam":"Proteaceae","alt"
