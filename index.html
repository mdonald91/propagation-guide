m leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. Keep the sand moist, not wet."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery collects from female plants growing close to males, separates the seed, cuts off the awns and sows en masse with smoke water (about 10 days to germinate). <i>S. sericeus<\/i> research found seed germinates far better in darkness, so cover seed. Division of tussocks also works.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"}]},"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA community-nursery method for this species plus trial results for the closely related <i>S. sericeus<\/i>.","facts":[["Pre-treatment","Cut off spines/awns; smoke water"],["Best sowing","Mar – May"],["Sowing depth","10 mm (needs dark)"],["Typical germination","Not recorded"]],"check":[10,20],"stats":{"germ_pct":null,"per_gram":null},"grow":[6.0,9.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners."],["Flowering","Apr – Dec or Jan. Male and female plants are separate; female heads up to 250 mm across."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe female heads as they begin to break away. <b>Choose female plants growing close to males<\/b>."],["Extraction & cleaning","Separate the seed from the head and <b>cut off the awns<\/b>."],["Seed quality","Many spikelets are empty – squeeze-test a few."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded for this species. In <i>S. sericeus<\/i> trials, seed germinated far better in darkness (56%) than in light (14%)."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (provisional). Sep – Feb workable. Avoid Jun – Aug."],["Seed mix","Coarse, sandy, free-draining mix."],["Pre-treatment","Cut off the awns and <b>sow en masse with smoke water<\/b> (Geraldton method)."],["Sowing depth & method","<b>Cover well (about 10 mm)<\/b> – seed germinates best in the dark. Deep trays."],["After sowing","Keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 6–9 months from sowing (record your own). Plant out in late autumn or winter."]]}],"difficulty_note":"","problems":[["Little germination","Seed from isolated females, or sown too shallow. Collect near males; cover seed."],["Seedlings rot","Mix too wet. Use coarse sand and water less."],["Slow growth","Normal for spinifex. Full sun, deep tubes."]],"other":"Rooted runner sections (Cuttings Guide) and tussock division (Division Guide) are alternatives.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes (Spinifex sericeus seed in dark vs light; division)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"Cottesloe Coastcare Association – plant pages (Rhagodia baccata, Spinifex longifolius, Jacksonia sericea)","url":"cottesloecoastcare.org"}]},"division":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"Based on <i>S. sericeus<\/i> trials, where divided tussocks survived less well (31%) than rooted runner cuttings (40%).","facts":[["Division type","Tussock division"],["Best months","Mar – May"],["Division size","Rooted clumps with runners"],["Time to establish","Slow – several weeks"]],"check":[28,56],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners."],["Flowering","Apr – Dec or Jan. Male and female plants are separate."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA. Dune plants are protected – use nursery stock or approved salvage."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, while growing actively, giving plants ready for winter planting. Sep – Feb workable. Avoid Jun – Aug."],["Division type","<b>Tussock division<\/b> – small clumps with rooted runners."],["Division size","Small clumps with <b>as much root and rooted runner as possible<\/b>."],["Selecting stock","Vigorous nursery stock plants."],["Preparation","• Keep pieces moist and shaded – they dry out fast.<br/>• Cut clumps apart with a sharp spade or knife.<br/>• Trim leaves back by about half."],["Potting","Pot into <b>deep tubes<\/b> of coarse sand or a very sandy mix. Firm in and water well."],["Environment","Shade house or light shade until new growth shows; keep the sand moist, not wet."],["Time to establish","Slow – allow several weeks for new roots and shoots."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate–Difficult (provisional).<\/b> Divisions survived less well than rooted runner cuttings in trials. Runner cuttings or seed are usually better choices.","problems":[["Divisions dry out and die","Roots exposed too long. Work in the shade; keep pieces in damp bags."],["Base rots","Mix too wet. Use coarse sand, water less."],["Slow establishment","Normal for spinifex. Full sun once hardened; deep tubes."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus division vs stolon cuttings)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"options":[{"method":"Cuttings","suitability":"Good","note":"Runner (stolon) sections with 1–2 nodes.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"The usual nursery method; smoke water, about 10 days.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Tussock divisions work but survived less well than rooted runners.","guide":"division"}],"collect":{"cal":["P","P","P","-","-","-","-","-","-","-","P","P"],"basis":"estimate","any":false,"note":"Collect female heads as they break away, from females near male plants."},"conservation":"","seedid":{"unit":"Spikelets from the female seed heads","look":"Each ray of the female head (4–12 cm) carries one lance-shaped spikelet at its base, then continues as a long bristle.","size":"Spikelet 6–6.5 mm","tell":"Separate the spikelets and cut off the awns (Geraldton). Collect from female plants near male plants for higher viability.","level":"species","d":{"shape":"floret","L":6.25,"W":1.6,"col":"straw","awn":30,"bends":0,"bristle":true},"sources":[["AusGrass2 – Grasses of Australia (floret and grain descriptions)","https://keys.lucidcentral.org/keys/v3/AusGrass/"],["City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","https://www.cgg.wa.gov.au/Profiles/cgg/Assets/ClientData/Documents/Infrastructure/GGCN001_Web_vFINAL.pdf"],["Cottesloe Coastcare Association – plant pages","https://www.cottesloecoastcare.org"]],"photos":[],"sosa":false}},{"id":"spyridium-globulosum","sci":"Spyridium globulosum","common":"Basket Bush","family":"Rhamnaceae","fam":"Rhamnaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific dormancy research and nursery data available.","facts":[["Pre-treatment","Hot water (or dry heat)"],["Best sowing","Apr – Jun"],["Sowing depth","2–3 mm (needs dark)"],["Typical germination","41%"],["Seed per 100 plants","0.5 g"]],"check":[28,56],"stats":{"germ_pct":41,"per_gram":205},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Hard-coated – likely long"},"calendar":["-","-","P","B","B","B","P","P","-","-","-","-"],"snapshot":[["Habit","Erect shrub, usually 0.6–5 m."],["Flowering","Jun – Nov (white, in woolly heads)."],["Habitat","Sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fruit as it ripens in late spring–summer; bag branches to catch shed seed."],["Extraction & cleaning","Rub and sieve the small seed from the woolly flower heads."],["Seed quality","Water-impervious seed coat (physical dormancy) – seed won't take up water until treated."],["Storage life","Not well documented; hard-coated seed is usually long-lived when dry."],["Typical germination","About <b>41%<\/b> after heat treatment (Alcoa, only 2 tests). About <b>205 seedlings per gram<\/b>. Research recorded high germination after hot water at cool (7/18°C) temperatures."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – germinates best at winter-like temperatures (7/18°C); warmth suppresses it. Mar, Jul – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water<\/b> (about 90–95°C) breaks the seed-coat dormancy – keep it short, as over-long treatment can kill seed. Alcoa used a dry-heat pulse instead."],["Sowing depth & method","Cover about <b>2–3 mm<\/b> – germination is suppressed by light, so keep the seed covered and trays shaded."],["After sowing","Water in; keep moist in a cool, shaded spot."],["Germination time","Not well documented – allow several weeks and record results."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not broken, or trays too warm or too light. Re-treat; cover seed; sow in cooler months."],["Seed killed by treatment","Hot water too long. Shorten the soak."],["Damping off","Wet, crowded trays. Thin sowing, airflow."]],"other":"One of the few coastal shrubs here that needs cool temperatures <i>and<\/i> darkness to germinate.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Science Research – Physical dormancy in seeds of six genera of Australian Rhamnaceae (incl. Spyridium globulosum)","url":"cambridge.org (Seed Science Research)"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Hot water; cool, dark conditions to germinate.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Bag branches to catch shed seed."},"conservation":"","seedid":{"unit":"Not published","look":"Fruit a capsule enclosed in the flower tube and crowned by the old sepals (genus). Seed not described – add a photo when you clean some.","size":"Not published","tell":"Not published.","level":"genus","d":null,"sources":[["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"]],"photos":[],"sosa":false}},{"id":"stirlingia-latifolia","sci":"Stirlingia latifolia","common":"Blueboy","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery tests (6) show very low germination; smoke and burial research published. No reliable nursery method yet.","facts":[["Pre-treatment","Smoke water (trial)"],["Best sowing","Apr – Jun"],["Sowing depth","3–5 mm"],["Typical germination","2%"],["Seed per 100 plants","56 g"]],"check":[28,56],"stats":{"germ_pct":2,"per_gram":1.8},"grow":[6.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Erect, lignotuberous shrub, 0.2–1.5 m. Resprouts after fire."],["Flowering","Aug – Oct (yellow to red-brown)."],["Habitat","White, grey, yellow-brown or black sand, sometimes with lateritic gravel."],["Local note","Recorded in the Wanneroo LGA. Widely bush-picked for the dried-flower trade."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect dry, mature heads after flowering (late spring–summer)."],["Extraction & cleaning","Rub heads over a sieve to free the hairy nuts."],["Seed quality","Viability is often low (a seed supplier quotes 20–40%) – cut-test a sample and expect many empty nuts."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Very low: about <b>2%<\/b> untreated (Alcoa, 6 tests), about 1.8 seedlings per gram – roughly 55 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> (cool, about 15–23°C). Mar and Jul workable."],["Seed mix","Free-draining, pathogen-free, low-phosphorus mix."],["Pre-treatment","<b>Smoke water<\/b> (24 h soak or first watering) – <i>Stirlingia<\/i> is one of the hard-to-germinate genera that responds to smoke. Research found seed buried in soil for longer germinated even without smoke, so older seed may do better. Treat as a trial."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow generously in deep trays."],["After sowing","Keep moist, not wet. Keep trays going for months."],["Germination time","Slow and erratic."],["Pricking out","At the cotyledon stage, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – allow 6+ months (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Normal for this species. Try smoke water and older seed; sow large amounts."],["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Slow growth","Normal. Very low-P feed only."]],"other":"Conventional cuttings are poor. Research found the best material is new shoots after a fire, and tissue culture does better still – a specialist job.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Smoke germination of Australian plants (Dixon; Stirlingia among smoke-responsive recalcitrant genera)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"},{"title":"Tieu A. et al. (2001) Seed Science Research – Interaction of soil burial and smoke on germination of Australian native plants","url":"cambridge.org (Seed Science Research)"},{"title":"Australian Seed – Stirlingia latifolia (viability 20–40%; smoke; 15–23°C)","url":"australianseed.com/shop/item/stirlingia-latifolia"},{"title":"Australian Flora Foundation – Fuss & Reid, Stirlingia latifolia propagation (post-fire shoots, tissue culture)","url":"aff.org.au/results/grant-summaries/aff-fuss-stirlingia/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Best from new shoots after fire; tissue culture works better.","guide":null},{"method":"Seed","suitability":"Difficult","note":"About 2% in nursery tests; smoke water (trial).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Lignotuberous; not documented as a method.","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect dry, mature heads."},"conservation":"","seedid":{"unit":"Whole hairy nut (sown whole)","look":"Cone-shaped, densely silky nut that falls when mature, from fluffy blue-grey seed heads.","size":"Not published","tell":"Viability is often only 20–40%, so expect many empty nuts; no visual test is published.","level":"genus","d":{"shape":"hairynut","L":null,"W":null,"col":"grey"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Australian Seed – Stirlingia latifolia (viability 20–40%)","https://www.australianseed.com/shop/item/stirlingia-latifolia"]],"photos":[],"sosa":false}},{"id":"styphelia-insularis","sci":"Styphelia insularis","common":"","family":"Ericaceae","fam":"Ericaceae","alt":"Formerly <i>Leucopogon insularis<\/i>","cuttings":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No propagation data found for this species. Based on the related Coast Beard-heath and general epacrid experience – a trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Oct – Dec"],["Cutting length","50–80 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,80.0],"check":[180,360],"calendar":["P","P","-","-","-","-","-","-","P","B","B","B"],"snapshot":[["Habit","Erect, spreading shrub, usually 0.25–0.9 m."],["Flowering","Mar – Jul (white)."],["Habitat","Calcareous white or grey sand; coastal dunes, limestone and sandplains."],["Name note","Moved from <i>Leucopogon<\/i> to <i>Styphelia<\/i> in 2020 (FloraBase) – older lists and labels use <i>Leucopogon insularis<\/i>."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Oct – Dec<\/b> (estimate) – new growth made after the autumn–winter flowering has firmed, and it's warm. Sep, Jan and Feb are workable. Avoid Mar – Aug (flowering, and cool)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","50–80 mm – a small shrub, so shorter than for the Coast Beard-heath."],["Selecting material","Non-flowering tips from healthy plants. Take plenty."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Medium strength, as for other epacrids: 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Very free-draining sand-based cutting mix."],["Environment","Humid frame in bright shade, not heavy mist. Trial bottom heat on part of the batch."],["Expected strike time","Not documented – epacrids are slow (6–12 months in trials). Check from about 8 weeks and record the result."],["Post-treatment / aftercare","• Expect fine, fragile roots – pot up with the mix ball intact.<br/>• Harden off slowly."]]}],"difficulty_note":"<b>Difficult (provisional).<\/b> No data for this species; related beard-heaths strike poorly, so the rating is cautious.","problems":[["No roots after months","Common in epacrids. Keep them going; try another month or hormone strength next batch."],["Cuttings blacken or rot","Too wet or humid. Less mist, better drainage and airflow."],["Roots break when potting up","Move the whole plug without disturbing the roots."]],"other":"Seed – not documented for this species. Woody epacrid fruits don't respond to smoke alone; Kings Park found that ageing seed in soil for 1–2 years with repeated smoke worked for smoke-resistant Ericaceae.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Understorey Network (Tasmania) – Leucopogon parviflorus (usually grown from cuttings; low strike; very fine roots)","url":"database.understorey-network.org.au/plant/leucopogon-parviflorus"},{"title":"Doig – Epacrids from cuttings, ANPSA Australian Plants Online (Dec 1999): half-hardened wood 80–250 mm, medium-strength hormone, cold non-misting frame, 6–12 months","url":"anpsa.org.au/APOL16/dec99-6.html"},{"title":"Dixon K. & Roche S., ANPSA Australian Plants Online (Jun 1996) – smoke germination: drupaceous Epacridaceae don't respond","url":"anpsa.org.au/APOL2/jun96-6.html"},{"title":"ANPSA – Smoke germination of Australian plants (ageing seed in soil 1–2 years plus repeat smoke for Ericaceae)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"No data – trial protocol based on related beard-heaths.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Not documented; woody epacrid fruits need soil ageing + smoke.","guide":null},{"method":"D ["Pre-treatment","<b>Soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method)."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>."],["After sowing","Water in; keep just moist – semi-succulent seedlings rot if wet."],["Germination time","About <b>10–15 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Too warm. Sow in the cooler months."],["Seedlings rot","Too wet. Water less, improve drainage."],["Leggy seedlings","Not enough light. Move to full sun sooner."]],"other":"Softwood cuttings are a trial alternative (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Trial","note":"No published cutting data; trial protocol.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Smoke-water soak; 10–15 days in cool weather.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Not documented.","guide":null}],"collect":{"cal":["B","B","P","-","-","-","-","-","-","-","-","B"],"basis":"guide","any":false,"note":"Collect the small fruits once they turn red to black."},"conservation":"","seedid":{"unit":"Whole fruit (sown whole)","look":"Small fruit, succulent outside and woody inside, red turning black when mature.","size":"1.5–3.5 mm","tell":"Collect black (mature) fruits.","level":"species","d":{"shape":"stone","L":2.5,"W":2.2,"col":"black"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Cottesloe Coastcare Association – plant pages","https://www.cottesloecoastcare.org"]],"photos":[],"sosa":false}},{"id":"waitzia-suaveolens","sci":"Waitzia suaveolens","common":"Fragrant Waitzia","family":"Asteraceae","fam":"Asteraceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (2 tests); sowing follows standard practice for annual everlastings.","facts":[["Pre-treatment","Smoke water (optional)"],["Best sowing","Apr – May"],["Sowing depth","Surface – light cover"],["Typical germination","21%"],["Seed per 100 plants","0.1 g"]],"check":[14,28],"stats":{"germ_pct":21,"per_gram":967},"grow":[1.5,2.5],"storage":{"kind":"short","months":12,"text":"Store dry & cool; sow next autumn"},"calendar":["-","-","P","B","B","P","-","-","-","-","-","-"],"snapshot":[["Habit","Annual herb to 0.6 m."],["Flowering","Sep – Dec or Jan (white, pink, purple or yellow papery heads)."],["Habitat","Widespread across the south-west, including the Swan Coastal Plain."],["Local note","Recorded in the Wanneroo LGA. An annual – it flowers the spring after sowing, then dies."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect heads in early summer once they dry and the fluffy seed starts to lift."],["Extraction & cleaning","Rub heads gently over a sieve. Seed is very fine."],["Seed quality","Fine seed – a little goes a long way."],["Storage life","Store dry and cool and sow the following autumn."],["Typical germination","About <b>21%<\/b> (untreated, Alcoa nursery average, 2 tests). About <b>967 seedlings per gram<\/b> – roughly 0.1 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b>, after the first autumn rains. Mar and Jun are workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","None required. Smoke water in the first watering may help."],["Sowing depth & method","Mix the fine seed with dry sand and surface-sow; cover very lightly or not at all. A pinch per tube avoids pricking out."],["After sowing","Water in with a fine mist; keep moist."],["Germination time","About <b>2–4 weeks<\/b>."],["Pricking out","If tray-sown, prick out small, at the second-leaf stage. Thin direct-sown cells to 1–3 seedlings."],["Shade house & hardening","Short – a week or so in the shade house, then full sun."],["Time to planting size","Plant out small, about <b>6–10 weeks<\/b> after sowing, so plants flower in spring."]]}],"difficulty_note":"","problems":[["Seed washed into clumps","Bottom water or use a very fine mist."],["Leggy seedlings","Too much shade. Full sun early."],["Plants flower in the tube","Held too long. Plant out while small."]],"other":"Often direct-seeded into revegetation sites after the first autumn rains.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (annuals from seed, light, smoke and GA; perennial cuttings)","url":"anpsa.org.au/genera/daisies/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Annual.","guide":null},{"method":"Seed","suitability":"Main method","note":"Annual everlasting – sow after the first autumn rains.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Annual.","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","P","B"],"basis":"guide","any":false,"note":"Collect heads once they dry and the fluffy seed starts to lift."},"conservation":"","seedid":{"unit":"Achenes with pappus","look":"Flattened-ellipsoid brown achene with a slender neck and many barbed pappus bristles (genus).","size":"Not published","tell":"Not published.","level":"genus","d":{"shape":"achene","L":null,"W":null,"col":"brown","pappus":true},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"xanthorrhoea-preissii","sci":"Xanthorrhoea preissii","common":"Balga / Grass Tree","family":"Asphodelaceae (Xanthorrhoeoideae)","fam":"Asphodelaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (42 tests); growth and handling notes published.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","47%"],["Seed per 100 plants","2.2 g"]],"check":[21,42],"stats":{"germ_pct":47,"per_gram":44.5},"grow":[12.0,12.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Grass tree to 5 m, trunk over 3 m on old plants. <b>Very slow<\/b> – about 1.5 cm of trunk a year."],["Flowering","Jun or Aug – Dec (white-cream spikes)."],["Habitat","Grey to black sand, laterite and granite; ranges, coastal plain and near watercourses."],["Local note","Recorded in the Wanneroo LGA and common on the coastal plain. Susceptible to <i>Phytophthora<\/i> dieback – strict hygiene."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","The black seeds are released from the spike when ripe (summer). Cut spikes as capsules begin to split, or bag them."],["Extraction & cleaning","Dry spikes on a tarp or in bags; knock out the black seeds and sieve."],["Seed quality","Cut-test a sample – good seed is firm and white inside."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>47%<\/b> untreated (Alcoa nursery average, 42 tests). About <b>45 seedlings per gram<\/b> – roughly 2.2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, pathogen-free mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per deep tube."],["After sowing","Keep moist, not wet."],["Germination time","Starts in about <b>3–6 weeks<\/b>, but some seed can take much longer – keep trays going."],["Pricking out","Avoid if possible – sow direct into deep tubes. Otherwise prick out at the first leaf."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 12 months or more – very slow (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings yellow and die","Dieback or waterlogging. Strict hygiene, pots off the ground, free-draining mix."],["Very slow growth","Normal for grass trees. Don't overfeed."],["Damping off","Sow thinly; airflow."]],"other":"Not divided. Moving established plants from the bush has a high failure rate and is only worth doing with a large root ball where plants would otherwise be destroyed.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Friends of Queens Park Bushland – plant pages (Gastrolobium capitatum, Xanthorrhoea preissii)","url":"friendsofqueensparkbushland.org.au"},{"title":"Wild Seed Australia – Australian grass tree cultivation notes (germination starts in 3–6 weeks)","url":"wildseedaustralia.com.au/cultivation-notes/australian-grass-tree/"},{"title":"ANPSA, Australian Plants Online (Mar 2004) – Grass trees (slow growth; seed up to a year; transplanting not recommended)","url":"anpsa.org.au/APOL33/mar04-5.html"},{"title":"Colangelo W.I. et al. (2002) – Xanthorrhoea preissii growth rate about 1.5 cm a year (citing Lamont & Downes 1979)","url":"pmc.ncbi.nlm.nih.gov/articles/PMC4233884/"},{"title":"Shire of Mundaring (2023) – Dieback brochure (grass trees susceptible)","url":"mundaring.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not possible.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 47% (Alcoa). Very slow growing.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Not divided; bush transplants often fail.","guide":null}],"collect":{"cal":["B","B","P","-","-","-","-","-","-","-","-","B"],"basis":"guide","any":false,"note":"Cut or bag spikes as the capsules begin to split."},"conservation":"","seedid":{"unit":"Seed","look":"Semi-matt black, flattened oval seed, 1–2 per capsule chamber (genus).","size":"Not published (a grower guide gives over 5 mm long)","tell":"Tap the opened spike or prise seed out with tweezers. Not all seed is viable.","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"black"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["Ecobits – how to grow grass trees from seed (grower guide)","https://ecobits.net.au/how-to-grow-grass-trees-from-seed-xanthorrhoea/"]],"photos":[],"sosa":false}}],"methods":{"cuttings":[{"title":"Wood types and the bend test","level":2,"blocks":[{"type":"table","rows":[["Wood type","What it looks like","Bend test","Use"],["<b>Softwood<\/b>","Soft, flexible, bright new growth from the current flush.","Flops or stays bent.","Roots fast but wilts and rots easily. Suits soft-stemmed plants such as <i>Scaevola<\/i>."],["<b>Semi-hardwood<\/b>","Current season's growth that has begun to firm; bark starting to colour.","Bends about 60° and springs back.","The standard for most WA native shrubs. More forgiving than softwood."],["<b>Hardwood<\/b>","Fully mature, woody stems from previous seasons.","Stiff; snaps rather than bends.","Slow to root. Rarely needed for the species in this guide."]]}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Strikes reliably with the standard method."],["<b>Easy–Moderate<\/b>","Usually strikes; one factor (e.g. moisture, fragile stems) needs extra care."],["<b>Moderate<\/b>","Strikes, but results depend on timing, material and moisture control. Set extra cuttings."],["<b>Moderate–Difficult<\/b>","Low or variable strike; needs careful timing and good facilities."],["<b>Difficult<\/b>","Low or erratic strike; specialist techniques or alternative methods usually needed."]]},{"type":"p","html":"<b>* Provisional<\/b> – rating is based on how the genus generally behaves because little species-specific data is published. Replace it with the nursery's own figure once a few batches have been recorded.","small":true}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific propagation information is published and consistent."],["<b>Medium<\/b>","Built from genus-level information plus the species' own traits (habit, leaf type, flowering time). Sound starting point – verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard cutting method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Collect<\/b>","Take material early in the morning from healthy, pest-free, well-watered, <b>non-flowering<\/b> stock. Seal in a moist plastic bag and keep in an esky out of the sun. Process the same day."],["<b>2. Prepare<\/b>","Use a sharp, clean blade (wipe with alcohol between stock plants). Cut just below a node. Strip leaves from the lower half to two-thirds without tearing the bark. Reduce large leaves by about one-third. Remove flowers and buds."],["<b>3. Wound (optional)<\/b>","On firmer stems, remove a thin sliver of bark from the bottom 15–20 mm to expose more rooting area."],["<b>4. Hormone<\/b>","Decant a small amount into a clean container, dip the base to about 1 cm, and discard what's left. Store hormone in the fridge – it has a limited shelf life."],["<b>5. Set<\/b>","Make a hole with a dibber so the hormone isn't wiped off, insert to the bottom of the hole, and firm the mix. Single tubes make potting on easier than community pots."],["<b>6. Environment<\/b>","Water in and place in a humid frame or propagation house in bright shade. Bottom heat so the base is 5–10°C warmer than the air. Keep the mix moist, not wet. Mist sparingly on hairy-leaved species."],["<b>7. Check<\/b>","Most cuttings strike in 4–8 weeks in warm weather. Look for roots at the drainage holes. Remove any rotting cuttings promptly."],["<b>8. Harden off<\/b>","About 2 weeks with cover closed by day and open at night, then about 2 weeks in shade, then into the open. Many struck cuttings are lost by skipping this step."],["<b>9. Pot on<\/b>","After 1–3 months, pot on into larger containers. Don't let roots become pot-bound."]]}]},{"title":"Rooting hormone guide","level":2,"blocks":[{"type":"table","rows":[["Product (example)","IBA strength","Use for"],["Clonex Green","1.5 g/L","Softwood and soft tip cuttings"],["Clonex Purple","3 g/L","Semi-hardwood – the general all-rounder"],["Clonex Red","8 g/L","Hardwood cuttings"]]},{"type":"p","html":"Equivalent powders or liquids work too – match the strength to the wood type. Callus forming without roots usually means the hormone is too strong for that material.","small":true}]},{"title":"Mix, hygiene and collecting","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>Propagation mix<\/b>","About 75–80% washed coarse river sand with 20–25% coir or peat. Add extra perlite or coarse sand for rot-prone species."],["<b>Hygiene<\/b>","Fresh mix, clean tubes and benches. Many WA natives (including <i>Hibbertia<\/i> and <i>Grevillea<\/i>) are susceptible to <i>Phytophthora<\/i>. Discard diseased cuttings; use fungicide only if a problem persists."],["<b>Collecting<\/b>","Collecting from bushland generally requires a DBCA flora licence and landholder permission. Use local-provenance stock and label every batch with its source."]]}]}],"seed":[{"title":"Pre-treatments explained","level":1,"blocks":[{"type":"p","html":"Many WA species have seed dormancy that must be broken before they will germinate. The species pages say which treatment to use.","small":false},{"type":"table","rows":[["Treatment","How to do it","Used for"],["<b>None<\/b>","Sow untreated seed. Remove from cones or follicles first where needed.","<i>Allocasuarina<\/i>, <i>Banksia<\/i>"],["<b>Boiling water (30 s)<\/b>","Drop seed into boiling water for 30 seconds, then drain and cool (Alcoa Marrinup method).","Hard-seeded peas, e.g. <i>Daviesia<\/i>, <i>Hovea<\/i>"],["<b>Hot water soak<\/b>","Pour near-boiling water over the seed (at least 10 parts water to 1 part seed) and leave to cool and soak overnight. Sow the seed that has swollen (1.5–2× its size); re-treat the rest.","Hard-seeded peas"],["<b>Dry heat<\/b>","Spread seed on a tray in a pre-heated oven. Peas: 80–120°C for 10 min to 1 hour. Kangaroo paw: 100°C for 3 hours.","<i>Gompholobium<\/i>, <i>Anigozanthos<\/i>"],["<b>Smoke water<\/b>","Soak seed for up to 24 hours in diluted smoke water (e.g. 1:9), or water trays with it after sowing. Also has slight antifungal properties.","Fire-responsive species, e.g. <i>Anigozanthos<\/i> (optional for others)"],["<b>Aged seed<\/b>","Store seed dry at room temperature for one or more years before sowing – dormancy fades with time (after-ripening).","<i>Anigozanthos<\/i>"],["<b>Ferment<\/b>","Soak ripe fleshy fruit or berries in water for 4–5 days, wash the pulp off through a sieve, then dry the seed.","<i>Carpobrotus<\/i>, <i>Myoporum<\/i>, <i>Rhagodia<\/i>"],["<b>Long soak<\/b>","Soak for 4 days, changing the water 3 times a day, to wash germination inhibitors out of the fruit.","<i>Atriplex<\/i>"],["<b>Clean or nick<\/b>","Remove whatever blocks germination: the woolly floral parts (<i>Ptilotus<\/i>), the fleshy coat (<i>Macrozamia<\/i>), or nick the seed coat with a scalpel (<i>Grevillea<\/i>, <i>Petrophile<\/i>).","<i>Ptilotus<\/i>, <i>Macrozamia<\/i>, <i>Grevillea<\/i>, <i>Petrophile<\/i>"]]},{"type":"p","html":"<b>Safety:<\/b> boiling water and hot ovens scald – use tongs, strainers, heat-proof containers and gloves.","small":true}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Germinates reliably with the standard method; few losses."],["<b>Easy–Moderate<\/b>","Germinates well, but one factor needs care (e.g. damping off, extraction, low fill)."],["<b>Moderate<\/b>","Needs the right pre-treatment and timing; germination may be low or variable."],["<b>Moderate–Difficult<\/b>","Low or erratic germination; specialist treatment usually needed."],["<b>Difficult<\/b>","Very low germination from seed; cuttings or other methods usually preferred."]]}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific germination data and handling guidance are published."],["<b>Medium<\/b>","Some species data (e.g. few tests) plus genus-level guidance. Verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard sowing method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Seed mix<\/b>","Sterile, free-draining, low-nutrient mix: about <b>80–85% washed river sand + 15–20% coir or peat<\/b>, or a commercial native seed-raising mix. Use fresh mix and clean trays. Pre-moisten before sowing."],["<b>2. Check the seed<\/b>","Label every lot (species, provenance, collection date). Cut-test a few seeds – good seed is firm and white inside. For peas, a float test removes damaged seed."],["<b>3. Pre-treat<\/b>","Use the treatment on the species page (see Pre-treatments explained). Sow soon after hot-water treatment."],["<b>4. Sow<\/b>","Cover to about <b>twice the seed's thickness<\/b>. Fine seed: sprinkle on the surface and press in lightly, or cover with a thin layer of fine sand or vermiculite. Large seed (e.g. <i>Banksia<\/i>, peas): sow direct into tubes to avoid pricking-out damage."],["<b>5. Water in (post-treatment)<\/b>","Water with a fine spray – smoke water is a useful first watering (slight antifungal effect, more even germination). Keep moist, never wet. A capillary bed lets you water from below."],["<b>6. Germinate<\/b>","Shaded, sheltered, protected from rain and drying wind. Check daily. Watch for damping off, snails and slugs."],["<b>7. Prick out<\/b>","When seedlings can be handled – usually when the <b>second pair of leaves<\/b> appears; earlier for taprooted species. Lift with a narrow spatula, hold by the leaves, not the stem, and firm mix around the roots with a gentle spray."],["<b>8. Shade house<\/b>","About <b>2 weeks<\/b> in the shade house after pricking out. Don't let tubes dry out (a capillary bed helps)."],["<b>9. Harden off<\/b>","Move gradually into full sun over <b>2–4 weeks<\/b>. Pot on to larger containers after 1–3 months if needed; don't let roots become pot-bound."]]}]},{"title":"Seed storage","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>General rule<\/b>","Dry the seed (air-dry or desiccator, never an oven), seal it in labelled airtight containers and keep it cool and dark, away from vermin. A sealed fridge is good; freezing suits many species but not all."],["<b>Exceptions<\/b>","<i>Anigozanthos manglesii<\/i> lost germination at –18°C – store at room temperature or cooler, not frozen. <i>Allocasuarina<\/i> and <i>Banksia<\/i> seed is short-lived once out of the cone – store in the cone, or dry and cool. <i>Macrozamia fraseri<\/i> seed is shed moist and is damaged by cold, dry storage – sow it fresh."],["<b>Long-lived<\/b>","Hard-coated pea seed keeps many years dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["<b>Collecting<\/b>","Collecting from bushland generally needs a DBCA licence and landholder permission. Collect only ripe seed from many plants to keep genetic diversity."]]}]},{"title":"Hygiene and damping off","level":2,"blocks":[{"type":"p","html":"Damping off (<i>Pythium<\/i>, <i>Rhizoctonia<\/i>) rots seedlings at soil level, especially in wet, crowded trays. Prevent it with sterile mix, clean trays, thin sowing, good airflow and bottom watering. Remove affected seedlings quickly and use a registered fungicide only if the problem persists. Keep pots off the ground to reduce <i>Phytophthora<\/i> risk.","small":true}]}],"division":[{"title":"Types of division","level":1,"blocks":[{"type":"table","rows":[["Type","What it is","Examples"],["<b>Clump / rhizome<\/b>","Grass-like clumps with a creeping underground stem. Cut into pieces of rhizome, each with shoots and roots.","<i>Anigozanthos<\/i>, <i>Dianella<\/i>, <i>Lomandra<\/i>, <i>Patersonia<\/i>"],["<b>Tussock<\/b>","True grasses. Split a clump into smaller clumps of shoots (tillers) with roots.","<i>Austrostipa<\/i>, <i>Spinifex<\/i>"],["<b>Suckers<\/b>","New shoots arising from roots a short way from the parent. Dig up with roots attached and pot individually.","Some <i>Lechenaultia<\/i>, <i>Scaevola<\/i>, <i>Grevillea<\/i>"],["<b>Layering<\/b>","Stems that root where they touch the soil. Cut into rooted pieces and pot up, or pin a stem into a pot beside the parent.","<i>Hibbertia<\/i>, <i>Carpobrotus<\/i>, spinifex runners"]]},{"type":"p","html":"Based on ANPSA's propagation notes (source 1).","small":true}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Divisions re-establish reliably with the standard method."],["<b>Easy–Moderate<\/b>","Usually re-establish; one factor (e.g. moisture, size of piece) needs care."],["<b>Moderate<\/b>","Re-establish, but results depend on timing, piece size and aftercare."],["<b>Moderate–Difficult<\/b>","Many divisions fail; another method is usually better."],["<b>Difficult<\/b>","Rarely successful; use another method."]]}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","A published division method exists for the species or genus."],["<b>Medium<\/b>","Based on closely related plants or general practice for this plant type. Verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard division method","level":1,"blocks":[{"type":"p","html":"Species pages note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Choose stock<\/b>","Healthy, vigorous, pest- and disease-free nursery plants with plenty of shoots. Label each stock plant's provenance."],["<b>2. Time it<\/b>","Warmer months give the best results; late-summer to autumn divisions root well before winter (ANPSA). Summer divisions need extra shelter."],["<b>3. Water first<\/b>","Water the stock plant the day before so roots and shoots are full of water."],["<b>4. Lift and clean<\/b>","Lift the clump or knock it out of its pot. Shake or wash off the mix so you can see where to cut."],["<b>5. Divide<\/b>","Cut with a clean, sharp knife or spade. Aim for pieces with <b>three or four leaf shoots<\/b>, a good section of rhizome and healthy roots (ANPSA). Smaller pieces need a humid house."],["<b>6. Trim<\/b>","Cut off damaged roots. Cut leaves back by about <b>one-third<\/b> to reduce water loss."],["<b>7. Pot<\/b>","Pot into a free-draining mix with shoots at the <b>same level as before<\/b>. Firm in and water well."],["<b>8. Shelter<\/b>","Keep in a sheltered, shaded spot (or humid house for small pieces) until new leaves grow and roots show at the drainage holes. Small divisions typically need 4–6 weeks."],["<b>9. Harden off<\/b>","About a week with nights exposed, then a week in a sheltered spot, then into the open (ANPSA)."],["<b>10. Pot on<\/b>","Pot on or plant out once roots fill the pot."]]}]},{"title":"Hygiene","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>Tools<\/b>","Clean, sharp knives and spades. Wipe with alcohol between stock plants."],["<b>Disease<\/b>","Don't divide plants showing disease. Kangaroo paws are prone to ink disease (black leaf spots); many WA natives are susceptible to <i>Phytophthora<\/i> – keep pots off the ground and use fresh mix."],["<b>Collecting<\/b>","Digging plants from bushland needs a DBCA licence and landholder permission. Divide nursery stock instead, and label every batch with its source."]]}]},{"title":"Other species that can be divided or layered","level":2,"blocks":[{"type":"p","html":"These have no page in this guide because another method works better, but they can be split, or rooted pieces lifted, when stock plants allow.","small":true},{"type":"table","rows":[["Species","How","Main method"],["<i>Acanthocarpus preissii<\/i>","Rhizomatous clumps; division not documented.","Seed"],["<i>Carpobrotus virescens<\/i>","Lift stems that have rooted – treat as cuttings.","Cuttings"],["<i>Conostylis candicans<\/i>","Less easy than kangaroo paws – large pieces (3+ big shoots), autumn.","Seed"],["<i>Conostylis setigera<\/i>","Large pieces in autumn, as for other Conostylis.","Seed"],["<i>Grevillea vestita<\/i>","Can sucker – lift rooted suckers.","Cuttings"],["<i>Hibbertia racemosa<\/i>","Low stems may root where they touch the soil (layering).","Cuttings"],["<i>Lechenaultia linarioides<\/i>","Some leschenaultias sucker – pot up rooted suckers.","Cuttings"],["<i>Opercularia vaginata<\/i>","May sucker; untested.","–"],["<i>Orthrosanthus laxus<\/i>","Clumps can be divided in spring (RHS); untested here.","Seed"],["<i>Patersonia occidentalis<\/i>","Large pieces in autumn; ANBG calls division unreliable.","Seed"],["<i>Scaevola canescens<\/i>","Only if stems have rooted or suckered.","Cuttings"],["<i>Scaevola globulifera<\/i>","Check stock plants for rooted stems.","Cuttings"],["<i>Scaevola repens<\/i>","Some scaevolas sucker; check for rooted pieces.","Cuttings"],["<i>Scaevola thesioides<\/i>","Only if stock plants have suckered.","Cuttings"]]}]}]},"pdfs":{"cuttings":"Native_Plant_Cuttings_Guide_v1.7.pdf","seed":"Native_Plant_Seed_Sowing_Guide_v1.7.pdf","division":"Native_Plant_Division_Guide_v1.3.pdf"},"app":{"version":"1.9","revisions":[["1.0","Sep 2026","First release: Cuttings and Seed Sowing guides, This month planner, species search, batch records with CSV export and import. Installs on phones and works offline."],["1.1","Sep 2026","Division guide and Division tabs; Propagation options (cuttings, seed, division) on every species page; division batch records."],["1.2","Sep 2026","Cutting ruler: an on-screen millimetre ruler with the recommended length shaded, set up once per phone with a bank card."],["1.3","Sep 2026","Light and dark mode switch (sun / moon button, or About > Appearance)."],["1.4","Sep 2026","PDF guides now open properly on Android phones. Species notes (Records > Species notes, and on each species page). Gallery tab on every species with photos from the Atlas of Living Australia. App change log and copyright notice."],["1.5","Sep 2026","Family filter on the Species tab, with an A–Z or By family sort. Recorded by: add your name or initials in Records – it's saved with each record and note and included in CSV exports."],["1.6","Sep 2026","Seed ID tab on every species: what you bag after cleaning, how to tell seed from chaff, and a seed drawing at actual size (using the ruler set-up). Seed photos: a team seed library (seed-photos folder on GitHub), photos taken on the phone, and ANBG National Seed Bank photos for 16 species. Gallery now has a Fruit & seed view (iNaturalist)."],["1.7","Sep 2026","Sites tab: drop a pin (GPS or map) where there's a good stand of a species, add species, photos, access notes. Each site shows when to take cuttings and collect seed; This month lists sites worth visiting, and the app tells you what's in season when you're at a saved site. Export as GeoJSON, KML (Google Earth) or CSV. Seed ID now shows when to collect."],["1.8","Sep 2026","Today view: batches due to check, seed to use and sites to visit, above the month planner. Our results on every species page, compared with the guide. Our species star and filter. Seed lots (Records): provenance, amount, storage and use-by warnings, with sowings taken off the lot. Plan seed for an order on Seed pages. Suggest a correction. Record sources can be picked from sites and seed lots."],["1.9","Oct 2026","Added 8 species: Daviesia decurrens, Haemodorum laxum, Leucopogon parviflorus, Melaleuca cardiophylla, Orthrosanthus laxus, Patersonia occidentalis, Ricinocarpos undulatus, Styphelia insularis (formerly Leucopogon insularis). Sites: search for a species by name, common name or family when adding it to a site. Records: filter saved batches by Cuttings, Seed or Division, and sort by date, A–Z or source. Today: + / − to hide or show Due to check and What to do this month."]],"copyright":"© 2026 Mitchell Donald. All rights reserved."}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var APP_VERSION = "1.9 (guides C1.7·S1.7·D1.3)";
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DIFF = { "Easy": "d-easy", "Easy-Moderate": "d-easymod", "Moderate": "d-mod", "Moderate-Difficult": "d-moddiff", "Difficult": "d-diff" };
  var DIFF_ORDER = ["Easy", "Easy-Moderate", "Moderate", "Moderate-Difficult", "Difficult"];
  var GUIDES = ["cuttings", "seed", "division"];
  var G = {
    cuttings: { short: "Cuttings", title: "Cuttings guide", cal: "Cutting calendar", month: "Take cuttings", log: "Log a cutting batch", other: "Other methods", pdf: "Cuttings Guide" },
    seed: { short: "Seed", title: "Seed sowing guide", cal: "Sowing calendar", month: "Sow seed", log: "Log a sowing", other: "Other notes", pdf: "Seed Sowing Guide" },
    division: { short: "Division", title: "Division guide", cal: "Division calendar", month: "Divide clumps", log: "Log a division batch", other: "Other methods", pdf: "Division Guide" }
  };
  var SUIT = { "Main method": "s-main", "Good": "s-good", "Possible": "s-poss", "Trial": "s-poss", "Difficult": "s-diff", "Not used": "s-none" };
  var BY_ID = {};
  DATA.species.forEach(function (s) { BY_ID[s.id] = s; });

  var view = document.getElementById("view");
  var backBtn = document.getElementById("back-btn");
  var state = {
    tab: "month",
    month: new Date().getMonth(),
    query: "",
    filter: "all",
    family: "",
    sortBy: "az",
    methodsTab: "cuttings",
    detailGuide: {},
    editing: null,
    recTab: "batches",
    noteEditing: null,
    noteFilter: "",
    recorderEditing: false,
    galleryMode: "all",
    sitePlacing: null,
    siteEditing: null,
    lotEditing: null
  };

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(html) { return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
  function dash(s) { return String(s).replace(/-/g, "–"); }
  function diffChip(g, prefix) {
    var label = (prefix ? prefix + " · " : "") + dash(g.difficulty) + (g.provisional ? " *" : "");
    return '<span class="chip ' + DIFF[g.difficulty] + '">' + esc(label) + "</span>";
  }
  function store(key, val) {
    try {
      if (val === undefined) { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      localStorage.setItem(key, JSON.stringify(val)); return true;
    } catch (e) { return val === undefined ? null : false; }
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  var CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

  function calendarHTML(cal) {
    var now = new Date().getMonth();
    var out = '<div class="cal" role="img" aria-label="' + esc(cal.map(function (c, i) {
      return MONTHS[i] + ": " + (c === "B" ? "best" : c === "P" ? "workable" : "avoid");
    }).join(", ")) + '">';
    cal.forEach(function (c, i) {
      var cls = c === "B" ? "B" : c === "P" ? "P" : "N";
      var txt = c === "B" ? "Best" : c === "P" ? "OK" : "–";
      out += '<div class="' + (i === now ? "now" : "") + '">' + MONTHS[i] + '<span class="' + cls + '">' + txt + "</span></div>";
    });
    return out + "</div>" +
      '<div class="legend"><span><i style="background:var(--cal-best)"></i>Best</span>' +
      '<span><i style="background:var(--cal-ok)"></i>Workable</span>' +
      '<span><i style="background:var(--cal-no)"></i>Avoid / poor results</span></div>';
  }

  // ---------- navigation ----------
  function setTitle(title, sub, italic) {
    var t = italic ? "<i>" + esc(title) + "</i>" : esc(title);
    document.getElementById("top-title").innerHTML = t + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "");
  }
  function go(hash) {
    if (location.hash === hash) { render(); } else { location.hash = hash; }
  }
  function parseHash() {
    var h = location.hash.replace(/^#/, "");
    if (h.indexOf("sp-") === 0 && BY_ID[h.slice(3)]) return { tab: "species", id: h.slice(3) };
    if (h.indexOf("site-") === 0) return { tab: "sites", site: h.slice(5) };
    if (["month", "species", "sites", "methods", "records", "about"].indexOf(h) >= 0) return { tab: h };
    return { tab: "month" };
  }
  document.querySelectorAll(".tabbar button").forEach(function (b) {
    b.addEventListener("click", function () { go("#" + b.dataset.tab); });
  });
  backBtn.addEventListener("click", function () {
    if (history.length > 1) history.back(); else go(parseHash().site ? "#sites" : "#species");
  });
  window.addEventListener("hashchange", render);

  // ---------- views ----------
  function renderMonth() {
    var m = state.month, now = new Date().getMonth(), only = oursOnly();
    setTitle(m === now ? "Today" : "Plan ahead", m === now ? MONTHS_LONG[now] + " · Joondalup / Perth coastal" : MONTHS_LONG[m]);
    var strip = '<div class="month-strip" role="group" aria-label="Choose month">' + MONTHS.map(function (n, i) {
      return '<button type="button" data-month="' + i + '" aria-pressed="' + (i === m) + '" class="' + (i === now ? "is-now" : "") + '">' + n + "</button>";
    }).join("") + "</div>";

    function block(kind, label) {
      var best = [], ok = [];
      DATA.species.forEach(function (s) {
        var g = s[kind]; if (!g) return;
        if (only && !isOurs(s.sci)) return;
        if (g.calendar[m] === "B") best.push(s); else if (g.calendar[m] === "P") ok.push(s);
      });
      function rows(list, tag) {
        return list.map(function (s) {
          var g = s[kind];
          return '<button type="button" class="row" data-open="' + s.id + '" data-guide="' + kind + '">' +
            '<span class="main"><span class="sci">' + (isOurs(s.sci) ? '<span class="star-mark" aria-label="Our species">★</span> ' : "") + esc(s.sci) + "</span>" +
            (s.common ? '<span class="common">' + esc(s.common) + "</span>" : "") +
            '<span class="chips">' + (tag === "B" ? '<span class="chip best">Best month</span>' : '<span class="chip ok">Workable</span>') +
            diffChip(g) + "</span></span>" + CHEV + "</button>";
        }).join("");
      }
      var total = best.length + ok.length;
      return '<div class="section-head"><h2>' + label + '</h2><span class="count num">' + total + " species</span></div>" +
        (total ? '<div class="list">' + rows(best, "B") + rows(ok, "P") + "</div>"
               : '<div class="empty">' + (only ? "None of Our species suit " : "Nothing in the guide suits ") + MONTHS_LONG[m] + ".</div>");
    }
    var todayTop = m === now ? dueHTML() + lotsTodayHTML() + sitesForMonthHTML(m, true) : "";
    var mFold = m === now && folded("month");
    var counts = GUIDES.map(function (k) {
      var n = DATA.species.filter(function (s) { var g = s[k]; return g && (!only || isOurs(s.sci)) && (g.calendar[m] === "B" || g.calendar[m] === "P"); }).length;
      return G[k].month + " " + n;
    });
    view.innerHTML = todayTop +
      '<div class="plan-head' + (m === now ? " fold-head" : "") + '"' + (m === now ? ' data-fold-head="month"' : "") + '><div><div class="eyebrow">' + (m === now ? "What to do this month" : "Plan for") + '</div><div class="view-title">' + MONTHS_LONG[m] + (m === now ? ' <span class="now-tag">(now)</span>' : "") + "</div></div>" +
      (m === now ? foldBtn("month", "What to do this month") + "</div>" + (ours().length && !mFold ? '<div class="plan-chip">' + oursChip() + "</div>" : "")
                 : (ours().length ? oursChip() : "") + "</div>") +
      (mFold ? '<p class="note fold-sum num">' + esc(counts.join(" · ")) + (only ? " (Our species)" : "") + "</p>" : "") +
      '<div class="fold-body" id="fold-month"' + (mFold ? " hidden" : "") + ">" +
      strip +
      (m !== now ? sitesForMonthHTML(m) : "") +
      GUIDES.map(function (k) { return block(k, G[k].month); }).join("") + "</div>";
    bindFolds(renderMonth);
    view.querySelectorAll("[data-month]").forEach(function (b) {
      b.addEventListener("click", function () { state.month = +b.dataset.month; renderMonth(); });
    });
    view.querySelectorAll("[data-site]").forEach(function (b) { b.addEventListener("click", function () { go("#site-" + b.dataset.site); }); });
    bindDue(); bindLotRows(); bindOursChip(renderMonth);
    bindOpen();
  }

  function famOf(s) { return s.fam || s.family; }
  function renderSpecies() {
    var byFam = state.sortBy === "family";
    setTitle("Species", DATA.species.length + " species · " + (byFam ? "by family" : "A–Z"));
    var q = state.query.toLowerCase().trim();
    var only = oursOnly();
    var inGuide = DATA.species.filter(function (s) { return (state.filter === "all" || s[state.filter]) && (!only || isOurs(s.sci)); });
    var famCount = {};
    inGuide.forEach(function (s) { famCount[famOf(s)] = (famCount[famOf(s)] || 0) + 1; });
    var fams = Object.keys(famCount).sort();
    if (state.family && !famCount[state.family]) fams = fams.concat([state.family]).sort();
    var list = inGuide.filter(function (s) {
      if (state.family && famOf(s) !== state.family) return false;
      if (!q) return true;
      return (s.sci + " " + s.common + " " + s.family + " " + plain(s.alt)).toLowerCase().indexOf(q) >= 0;
    });
    if (byFam) list = list.slice().sort(function (a, b) { return famOf(a).localeCompare(famOf(b)) || a.sci.localeCompare(b.sci); });
    var html = '<input class="search" id="sp-search" type="search" placeholder="Search name, common name or family" value="' + esc(state.query) + '" aria-label="Search species">' +
      '<div class="seg" role="group" aria-label="Filter">' +
      ["all"].concat(GUIDES).map(function (f) {
        var lbl = f === "all" ? "All" : G[f].short;
        return '<button type="button" data-filter="' + f + '" aria-pressed="' + (state.filter === f) + '">' + lbl + "</button>";
      }).join("") + "</div>" +
      '<div class="fam-bar"><div class="fam-head"><h2 class="subhead" id="fam-lbl">Family</h2>' +
      '<div class="mini-seg" role="group" aria-label="Sort species">' + [["az", "A–Z"], ["family", "By family"]].map(function (o) {
        return '<button type="button" data-sort="' + o[0] + '" aria-pressed="' + (state.sortBy === o[0]) + '">' + o[1] + "</button>";
      }).join("") + "</div></div>" +
      '<select id="sp-family" aria-labelledby="fam-lbl"><option value="">All families (' + fams.length + ")</option>" +
      fams.map(function (f) {
        return '<option value="' + esc(f) + '"' + (f === state.family ? " selected" : "") + ">" + esc(f) + " (" + (famCount[f] || 0) + ")</option>";
      }).join("") + "</select></div>" +
      '<div class="count-row"><div class="count num">' + list.length + " of " + DATA.species.length + " species" +
      (state.family ? ' · <button type="button" class="linkbtn" id="fam-clear">Show all families</button>' : "") + "</div>" + oursChip() + "</div>";
    if (!list.length) {
      html += '<div class="empty">No ' + (only ? "Our species" : "species") + " match" + (state.query ? " “" + esc(state.query) + "”" : "") +
        (state.family ? " in " + esc(state.family) : "") + (state.filter !== "all" ? " in the " + esc(G[state.filter].pdf) : "") + ".</div>";
    } else {
      html += '<div class="list">';
      var head = "";
      list.forEach(function (s) {
        var H = byFam ? famOf(s) : s.sci.charAt(0);
        if (H !== head) {
          head = H;
          html += byFam ? '<div class="letter fam"><span>' + esc(H) + '</span><span class="num">' +
                          list.filter(function (x) { return famOf(x) === H; }).length + "</span></div>"
                        : '<div class="letter">' + H + "</div>";
        }
        html += '<button type="button" class="row" data-open="' + s.id + '"><span class="main"><span class="sci">' + (isOurs(s.sci) ? '<span class="star-mark" aria-label="Our species">★</span> ' : "") + esc(s.sci) + "</span>" +
          (s.common ? '<span class="common">' + esc(s.common) + "</span>" : "") +
          '<span class="chips">' + GUIDES.map(function (k) { return s[k] ? diffChip(s[k], G[k].short) : ""; }).join("") + "</span></span>" + CHEV + "</button>";
      });
      html += "</div>";
    }
    view.innerHTML = html;
    var inp = document.getElementById("sp-search");
    inp.addEventListener("input", function () {
      state.query = inp.value;
      var pos = inp.selectionStart;
      renderSpecies();

  var CSV_COLS = ["id", "date", "recorder", "species", "method", "source", "treatment", "qty", "unit", "success", "result", "notes", "created", "updated", "lot"];
  function toCSV() {
    var rows = [CSV_COLS.join(",")];
    loadRecs().forEach(function (r) {
      var res = resultOf(r);
      var row = CSV_COLS.map(function (k) {
        var v = k === "result" ? (res ? res.value : "") : (r[k] == null ? "" : String(r[k]));
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      });
      rows.push(row.join(","));
    });
    return rows.join("\n");
  }
  function exportCSV() {
    var csv = toCSV(), name = exportBase("propagation-records") + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    try {
      var file = new File([csv], name, { type: "text/csv" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Propagation records" }).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();

  }
  function copyCSV() {
    var csv = toCSV();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () { toast("CSV copied – paste into an email or sheet"); },
        function () { toast("Copy was blocked by the browser"); });
    } else { toast("Copy isn't available here"); }
  }
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || r[0] !== ""; });
  }
  function importCSV(ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result || ""));
      if (rows.length < 2) { toast("That file has no records"); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      if (head.indexOf("species") < 0) { toast("That doesn't look like a records export"); return; }
      var recs = loadRecs(), ids = {}, added = 0, updated = 0;
      recs.forEach(function (r, i) { ids[r.id] = i; });
      rows.slice(1).forEach(function (cells) {
        var r = {};
        head.forEach(function (h, i) { if (h !== "result") r[h] = cells[i] || ""; });
        if (!r.species) return;
        if (!r.id) r.id = uid();
        if (ids[r.id] != null) {
          var old = recs[ids[r.id]];
          if ((r.updated || "") > (old.updated || "")) { recs[ids[r.id]] = r; updated++; }
        } else { recs.push(r); ids[r.id] = recs.length - 1; added++; }
      });
      if (saveRecs(recs)) { toast(added + " added, " + updated + " updated"); renderRecords(); }
    };
    reader.readAsText(f);
    ev.target.value = "";
  }

  function centreOnHere() { if (siteMap && here) siteMap.setView([here.lat, here.lng], Math.max(siteMap.getZoom(), 17), { animate: false }); }

  function bindPlacing(L) {

  // ---- add / edit form ----
  // Species search (site form): every typed word must appear in the name, common name, old name or family.
  function speciesMatches(text, exclude) {
    var toks = String(text || "").toLowerCase().replace(/[–—-]/g, " ").split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    var first = toks[0], out = [];
    DATA.species.forEach(function (s) {
      if (exclude && exclude[s.sci]) return;
      var sci = s.sci.toLowerCase(), hay = (sci + " " + (s.common || "") + " " + plain(s.alt || "") + " " + s.family).toLowerCase();
      if (!toks.every(function (t) { return hay.indexOf(t) >= 0; })) return;
      var words = hay.split(/[\s,\/()]+/), rank = sci.indexOf(first) === 0 ? 0 : (words.some(function (w) { return w.indexOf(first) === 0; }) ? 1 : 2);
      out.push({ s: s, r: rank });
    });
    out.sort(function (a, b) { return a.r - b.r || a.s.sci.localeCompare(b.s.sci); });
    return out.map(function (x) { return x.s; });
  }

  // ---- export / import ----
  function siteSpeciesText(e) {

  }
  function sitesGeoJSON() {
    return JSON.stringify({ type: "FeatureCollection", name: "Propagation field sites", features: loadSites().map(function (x) {
      return { type: "Feature", geometry: { type: "Point", coordinates: [Math.round(x.lng * 1e7) / 1e7, Math.round(x.lat * 1e7) / 1e7] },
        properties: { id: x.id, name: x.name, species: (x.species || []).map(siteSpeciesText).join(" | "), species_detail: x.species || [],
          accuracy_m: x.acc || null, access: x.access || "", notes: x.notes || "", recorder: x.recorder || "", date: x.date || "", created: x.created || "", updated: x.updated || "" } };
    }) }, null, 1);

      loadSites().map(function (x) {

          var s = bySci(e.sci), t = (e.want || []).map(function (k) { var a = s && activityTiming(s, k, m); return a ? ACT[k] + ": " + a.when : ""; }).filter(Boolean);
          return siteSpeciesText(e) + (t.length ? " – " + t.join("; ") : "");

    var ext = kind === "geo" ? "geojson" : kind, type = kind === "geo" ? "application/geo+json" : (kind === "kml" ? "application/vnd.google-earth.kml+xml" : "text/csv");
    var name = exportBase("field-sites") + "-" + new Date().toISOString().slice(0, 10) + "." + ext;

    } catch (e) {}

  function parseSpeciesText(txt) {
    return String(txt || "").split("|").map(function (p) {
