ower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining mix of sand and potting mix."],["Environment","Bright shade with <b>good ventilation and little or no mist<\/b> (misting encourages leaf disease on saltbush cuttings). Bottom heat helps."],["Expected strike time","Not documented – check from about 4–6 weeks and record the result."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Water sparingly once established."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Untested here; related saltbushes strike from tip cuttings. Seed is the documented method.","problems":[["Leaf spots, leaves dropping","Too humid. Stop misting and improve airflow."],["Base rotting","Mix too wet. Use a sandier mix, water less."],["No roots","Try firmer material or the seed method, and record the result."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (ventilate, avoid mist on cuttings)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (15 cm terminal cuttings in spring)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery test data (7 tests); treatment follows the WA community-nursery method for <i>Rhagodia<\/i>.","facts":[["Pre-treatment","Ferment berries; smoke-water soak"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","11%"],["Seed per 100 plants","1.3 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Spreading shrub, 0.3–2 m, with grey-green leaves."],["Flowering","Variable – Feb, Apr – May or Oct – Dec, followed by red berries."],["Habitat","Sand dunes and coastal rock."],["Local note","Recorded in Joondalup and Wanneroo. FloraBase uses <i>Rhagodia baccata<\/i>; national lists use <i>Chenopodium baccatum<\/i>."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pick fully ripe, deep red berries."],["Extraction & cleaning","<b>Ferment:<\/b> soak the berries in water for 4–5 days, wash off the pulp through a sieve and dry the seed."],["Seed quality","Small, dark seeds; discard any that float after washing."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>11%<\/b> (untreated, Alcoa nursery average, 7 tests). About <b>75 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Ferment and clean (above), then <b>soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method for <i>R. preissii<\/i>)."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow thinly in trays."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>7–14 days<\/b> (Geraldton, <i>R. preissii<\/i>)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Pulp left on, or unripe berries. Ferment fully; use ripe fruit."],["Mould on trays","Pulp residue. Wash seed well."],["Seedlings collapse","Damping off. Sow thinly; good airflow."]],"other":"Tip cuttings are worth trialling (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Cottesloe Coastcare Association – plant pages (Rhagodia baccata, Spinifex longifolius, Jacksonia sericea)","url":"cottesloecoastcare.org"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Chenopod shrubs generally strike well (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Ferment berries, then smoke water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"scaevola-canescens","sci":"Scaevola canescens","common":"Grey Scaevola","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus (strikes readily) plus this species' hairy foliage.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Nov – Jan"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,80.0],"calendar":["B","P","P","P","P","-","-","-","-","P","B","B"],"snapshot":[["Habit","Prostrate to ascending shrub, 0.1–0.5 m. Densely hairy grey leaves; stems are brittle."],["Flowering","Mar – Oct (white to white-purple), in spikes in the leaf axils."],["Habitat","Sand, often with lateritic gravel or limestone."],["Local note","Recorded in the northern Perth area (Wanneroo and Stirling LGAs)."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Jan<\/b>, on new growth after flowering ends, while it is warm. Oct and Feb – May are workable if you choose shoots without flower spikes. Avoid Jun – Sep (cool, peak flowering)."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm tips."],["Selecting material","Vigorous <b>non-flowering<\/b> tips. Flowers form in the leaf axils along the stem, so check the whole cutting and pinch off any spikes."],["Pre-treatment","• Handle gently – stems snap easily. Carry in a rigid tray or box.<br/>• Strip lower leaves by cutting, not tearing.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>) for soft tips; semi-hardwood strength (3 g/L, <b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Extra free-draining: standard sand/coir mix with extra coarse sand or perlite."],["Environment","<b>Keep foliage as dry as possible.<\/b> Dense hairy leaves rot under heavy mist. Water the mix rather than the leaves, give good airflow, and use bottom heat (root zone about 21–24°C)."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; keep water off the foliage.<br/>• Remove any leaves showing grey mould promptly."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily; the hairy foliage makes rot the main risk.","problems":[["Grey fuzz or blackened leaves","Too humid/wet. Cut back misting, remove affected material, improve airflow."],["Snapped stems","Brittle stems – transport in rigid containers and use a dibber when setting."],["Cuttings flowering, not rooting","Take shoots without axillary flower spikes."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if a plant has suckered or rooted along its stems.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Soft to semi-hardwood tips; keep hairy foliage dry.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Only if stems have rooted or suckered.","guide":null}]},{"id":"scaevola-crassifolia","sci":"Scaevola crassifolia","common":"Thick-leaved Fan-flower","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Cuttings are the standard method in WA nurseries (e.g. Geraldton community nursery).","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["P","P","B","B","B","-","-","-","-","P","P","P"],"snapshot":[["Habit","Erect or spreading shrub, 0.1–1.5 m and up to 3 m wide. Young growth is sticky; thick, toothed, egg-shaped to round leaves."],["Flowering","Jul – Dec, also Jan – Feb (blue, mauve or white fans)."],["Habitat","Sand on coastal dunes, plains and limestone cliffs."],["Local note","Recorded in Joondalup and Wanneroo. Flower colour and habit vary – cuttings keep the parent's form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b> – warm, and outside the main flowering period. Oct – Feb is workable with non-flowering shoots (shade well in summer). Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips. Flower spikes carry leafy bracts – check closely and pinch them off."],["Pre-treatment","• New growth is sticky – wipe the blade often.<br/>• Strip lower leaves; cut the large remaining leaves back by a third to a half.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Standard humid frame with bottom heat, bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix.<br/>• Tip-prune young plants for dense growth."]]}],"difficulty_note":"<b>Easy.<\/b> Semi-hardwood cuttings in the warmer months are the standard method.","problems":[["Wilting in the first week","Too much leaf area. Trim leaves harder; keep the frame closed."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering tips or wait for the Mar – May window."]],"other":"Seed – large seeds are produced and sometimes germinate naturally; cuttings are preferred to keep flower colour and habit.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Nurseries Online – Scaevola crassifolia (semi-hardwood cuttings in warmer months)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/scaevola-crassifolia/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Standard method; keeps flower colour and form.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Large seeds sometimes germinate naturally.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"scaevola-globulifera","sci":"Scaevola globulifera","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species-specific data found. Based on the genus, which strikes readily from cuttings.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,80.0],"calendar":["B","B","B","B","P","-","-","-","-","-","P","P"],"snapshot":[["Habit","Spreading, low-lying to ascending shrub, 0.2–1.2 m. Hairless."],["Flowering","Aug – Dec (blue to white)."],["Habitat","Sand, sandhills and limestone ridges."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b> – warm, and after flowering finishes in Dec. Nov – Dec and May are workable. Avoid Jun – Oct."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm."],["Selecting material","<b>Non-flowering<\/b> tips; pinch off any buds."],["Pre-treatment","• Strip lower leaves.<br/>• Trim larger leaves by about one-third.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Humid frame, bottom heat, bright shade. Hairless leaves tolerate normal misting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix.<br/>• Pinch tips to encourage branching."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily.","problems":[["Wilting","Low humidity or too much leaf. Trim leaves; keep the frame closed."],["Rotting","Mix too wet. Water less often."],["Cuttings flowering","Use non-flowering tips, or wait for the Jan – Apr window."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – check stock plants for rooted stems.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Soft to semi-hardwood tips (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Check stock plants for rooted stems.","guide":null}]},{"id":"scaevola-repens","sci":"Scaevola repens","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus, which strikes readily from cuttings.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Mar – May"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,80.0],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Prostrate to ascending or erect shrub, 0.05–1 m; trailing branches to about 50 cm."],["Flowering","Jun – Dec, sometimes Jan – Feb (white or cream, occasionally blue-purple; golden hairs on the outside of the flower)."],["Habitat","Sand dunes and plains on sand, gravel, laterite or limestone."],["Local note","Recorded in the City of Joondalup. A variable species with informal subspecies – use local provenance and keep it labelled."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b> – warm autumn weather, mostly outside the main flowering period. Sep – Feb is workable using non-flowering shoots (shade well in summer). Avoid Jun – Aug."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm tips from the trailing stems."],["Selecting material","<b>Non-flowering<\/b> tips. Flower spikes sit in the leaf axils – pinch off any you find."],["Pre-treatment","• Strip lower leaves.<br/>• Leaves can be long (up to 90 mm) – trim remaining leaves by about one-third to cut water loss.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Humid frame with bottom heat, bright shade. Keep the mix moist but on the drier side rather than wet."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix.<br/>• Pinch tips once growing to encourage branching."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily.","problems":[["Wilting in the first week","Too much leaf area or low humidity. Trim leaves harder; keep the frame closed."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering, not rooting","Take non-flowering tips, or wait for the Mar – May window."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – some scaevolas sucker; check stock plants for rooted pieces.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Soft to semi-hardwood tips (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Some scaevolas sucker; check for rooted pieces.","guide":null}]},{"id":"scaevola-thesioides","sci":"Scaevola thesioides","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus plus this species' fine, slender growth.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Apr – May"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["P","P","P","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Spreading subshrub or perennial herb, 0.15–1 m. Mostly hairless; thread-like to narrow leaves; ribbed stems."],["Flowering","Aug – Dec and Jan – Mar (pale blue to white), in spikes at the ends of branches."],["Habitat","Coastal sand and limestone."],["Local note","The coastal Perth plant is subsp. <i>thesioides<\/i>; recorded in the Wanneroo LGA."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Apr – May<\/b> – warm autumn weather between flowering periods. Sep – Mar is workable using non-flowering side shoots. Avoid Jun – Aug."],["Wood type","<b>Softwood to semi-hardwood<\/b> – firm but still green tip or side-shoot cuttings."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering side shoots.<\/b> Flowers form at the branch tips, so main tips often carry buds."],["Pre-treatment","• Strip leaves from the lower half; leaves are narrow so little trimming is needed.<br/>• Stems are slender – always use a dibber hole.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>); 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Hairless leaves tolerate misting better than <i>S. canescens<\/i>, but fine stems collapse quickly if the mix is waterlogged or dries out. Keep evenly moist, with bottom heat and bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on gently – fine roots break easily. Single cuttings per tube make this easier.<br/>• Pinch tips once growing to encourage branching."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> The genus strikes readily; the fine stems are less forgiving of watering errors.","problems":[["Fine stems wilt or collapse","Mix drying out or waterlogged. Keep evenly moist; check daily."],["Cuttings flower instead of rooting","Pinch off terminal flower buds; use side shoots."],["Root damage when potting on","Strike one cutting per tube instead of community pots."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if stock plants have suckered.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Non-flowering side shoots (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Only if stock plants have suckered.","guide":null}]},{"id":"spinifex-hirsutus","sci":"Spinifex hirsutus","common":"Hairy Spinifex","family":"Poaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Method based on published trials with the closely related <i>S. sericeus<\/i> and general spinifex practice.","facts":[["Wood type","Runner (stolon) sections"],["Best months","Mar – May"],["Cutting length","10–15 cm, 1–2 nodes"],["Hormone (IBA)","Optional (1.5 g/L)"]],"length_mm":[100.0,150.0],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, sending long runners across the sand. Broad, flat, silvery leaves, hairy on both sides."],["Flowering","Oct – Jan. Male and female flowers are on separate plants; female heads are large spiky balls that roll in the wind."],["Habitat","White sand on coastal dunes; an important stabiliser at the toe of unstable dunes."],["Local note","Recorded in the City of Joondalup. Less common than <i>S. longifolius<\/i> on the Cottesloe foreshore."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, when runners are young, green and actively growing, giving plants ready for winter planting. Sep – Feb is workable. Avoid Jun – Aug (slow growth)."],["Wood type","<b>Runner (stolon) sections<\/b> – not woody cuttings. Use young, green runners, not old brown ones."],["Cutting size","<b>Nursery tubes:<\/b> 10–15 cm sections with at least one (ideally two) nodes.<br/><b>Direct planting on site:<\/b> 40–50 cm runners, buried about halfway in damp sand."],["Selecting material","Actively growing runners from the dune edge. Plants are male or female, so collect from several plants if you want seed-producing plantings later."],["Pre-treatment","• Keep runners moist and shaded after collecting – they dry out fast.<br/>• Cut just below a node; trim leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. The hairy leaves of this species can hold water, so mist lightly."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery advises collecting from female plants growing near males. <i>S. sericeus<\/i> research found seed germinates far better in darkness (56%) than light (14%), so cover seed. Division of tussocks also works but survived less well than rooted cuttings in trials (31% vs 40%).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"}]},"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA community-nursery method for spinifex plus trial results for the closely related <i>S. sericeus<\/i>.","facts":[["Pre-treatment","Cut off spines/awns; smoke water"],["Best sowing","Mar – May"],["Sowing depth","10 mm (needs dark)"],["Typical germination","Not recorded"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, with long runners and silvery, hairy leaves."],["Flowering","Oct – Jan. Male and female flowers on separate plants; female heads are large spiky balls."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the spiky female heads in summer as they ripen and start to break away. <b>Collect from female plants growing near male plants<\/b> – isolated females set little seed."],["Extraction & cleaning","Pull the seed-bearing spikelets from the head and <b>cut off the long spines (awns)<\/b>."],["Seed quality","Many spikelets are empty – squeeze-test a few."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded for this species. In <i>S. sericeus<\/i> trials, seed germinated far better in darkness (56%) than in light (14%)."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (provisional). Sep – Feb workable. Avoid Jun – Aug."],["Seed mix","Coarse, sandy, free-draining mix."],["Pre-treatment","Cut off the awns; water in with smoke water after sowing (Geraldton method)."],["Sowing depth & method","<b>Cover well (about 10 mm)<\/b> – seed germinates best in the dark. Sow en masse in deep trays."],["After sowing","Water in with smoke water; keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 6–9 months from sowing (record your own). Plant out in late autumn or winter."]]}],"difficulty_note":"","problems":[["Little germination","Seed from isolated females, or sown too shallow. Collect near males; cover seed."],["Seedlings rot","Mix too wet. Use coarse sand and water less."],["Slow growth","Normal for spinifex. Full sun, deep tubes, light feeding."]],"other":"Rooted runner sections (Cuttings Guide) and tussock division (Division Guide) are alternatives.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes (Spinifex sericeus seed in dark vs light; division)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"division":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"Based on <i>S. sericeus<\/i> trials, where divided tussocks survived less well (31%) than rooted runner cuttings (40%).","facts":[["Division type","Tussock division"],["Best months","Mar – May"],["Division size","Rooted clumps with runners"],["Time to establish","Slow – several weeks"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, with long runners and silvery, hairy leaves."],["Flowering","Oct – Jan. Male and female flowers on separate plants."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the City of Joondalup. Dune plants are protected – use nursery stock or approved salvage."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, while growing actively, giving plants ready for winter planting. Sep – Feb workable. Avoid Jun – Aug."],["Division type","<b>Tussock division<\/b> – small clumps with rooted runners."],["Division size","Small clumps with <b>as much root and rooted runner as possible<\/b>."],["Selecting stock","Vigorous nursery stock plants. Collect male and female plants if you want seed-producing plantings later."],["Preparation","• Keep pieces moist and shaded – they dry out fast.<br/>• Cut clumps apart with a sharp spade or knife.<br/>• Trim leaves back by about half."],["Potting","Pot into <b>deep tubes<\/b> of coarse sand or a very sandy mix. Firm in and water well."],["Environment","Shade house or light shade until new growth shows; keep the sand moist, not wet."],["Time to establish","Slow – allow several weeks for new roots and shoots. Plants take many months to reach planting size."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate–Difficult (provisional).<\/b> Divisions survived less well than rooted runner cuttings in trials. Runner cuttings or seed are usually better choices.","problems":[["Divisions dry out and die","Roots exposed too long. Work in the shade; keep pieces in damp bags."],["Base rots","Mix too wet. Use coarse sand, water less."],["Slow establishment","Normal for spinifex. Full sun once hardened; deep tubes."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus division vs stolon cuttings)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"options":[{"method":"Cuttings","suitability":"Good","note":"Runner (stolon) sections with 1–2 nodes.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"The usual nursery method; cover seed (needs dark).","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Tussock divisions work but survived less well than rooted runners.","guide":"division"}]},{"id":"spinifex-longifolius","sci":"Spinifex longifolius","common":"Beach Spinifex","family":"Poaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Method based on published trials with the closely related <i>S. sericeus<\/i> and general spinifex practice.","facts":[["Wood type","Runner (stolon) sections"],["Best months","Mar – May"],["Cutting length","10–15 cm, 1–2 nodes"],["Hormone (IBA)","Optional (1.5 g/L)"]],"length_mm":[100.0,150.0],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners through the sand."],["Flowering","Apr – Dec or Jan (green-brown). Male and female plants are separate; female heads up to 250 mm across roll in the wind."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA; the more common of the two spinifex species on the Cottesloe foreshore."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, when runners are young, green and actively growing, giving plants ready for winter planting. Sep – Feb is workable. Avoid Jun – Aug (slow growth)."],["Wood type","<b>Runner (stolon) sections<\/b> – not woody cuttings. Use young, green runners, not old brown ones."],["Cutting size","<b>Nursery tubes:<\/b> 10–15 cm sections with at least one (ideally two) nodes.<br/><b>Direct planting on site:<\/b> 40–50 cm runners, buried about halfway in damp sand."],["Selecting material","Actively growing runners from the dune edge. Plants are male or female, so collect from several plants if you want seed-producing plantings later."],["Pre-treatment","• Keep runners moist and shaded after collecting – they dry out fast.<br/>• Cut just below a node; trim leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. Keep the sand moist, not wet."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery collects from female plants growing close to males, separates the seed, cuts off the awns and sows en masse with smoke water (about 10 days to germinate). <i>S. sericeus<\/i> research found seed germinates far better in darkness, so cover seed. Division of tussocks also works.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"}]},"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA community-nursery method for this species plus trial results for the closely related <i>S. sericeus<\/i>.","facts":[["Pre-treatment","Cut off spines/awns; smoke water"],["Best sowing","Mar – May"],["Sowing depth","10 mm (needs dark)"],["Typical germination","Not recorded"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners."],["Flowering","Apr – Dec or Jan. Male and female plants are separate; female heads up to 250 mm across."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe female heads as they begin to break away. <b>Choose female plants growing close to males<\/b>."],["Extraction & cleaning","Separate the seed from the head and <b>cut off the awns<\/b>."],["Seed quality","Many spikelets are empty – squeeze-test a few."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded for this species. In <i>S. sericeus<\/i> trials, seed germinated far better in darkness (56%) than in light (14%)."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (provisional). Sep – Feb workable. Avoid Jun – Aug."],["Seed mix","Coarse, sandy, free-draining mix."],["Pre-treatment","Cut off the awns and <b>sow en masse with smoke water<\/b> (Geraldton method)."],["Sowing depth & method","<b>Cover well (about 10 mm)<\/b> – seed germinates best in the dark. Deep trays."],["After sowing","Keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 6–9 months from sowing (record your own). Plant out in late autumn or winter."]]}],"difficulty_note":"","problems":[["Little germination","Seed from isolated females, or sown too shallow. Collect near males; cover seed."],["Seedlings rot","Mix too wet. Use coarse sand and water less."],["Slow growth","Normal for spinifex. Full sun, deep tubes."]],"other":"Rooted runner sections (Cuttings Guide) and tussock division (Division Guide) are alternatives.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes (Spinifex sericeus seed in dark vs light; division)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"Cottesloe Coastcare Association – plant pages (Rhagodia baccata, Spinifex longifolius, Jacksonia sericea)","url":"cottesloecoastcare.org"}]},"division":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"Based on <i>S. sericeus<\/i> trials, where divided tussocks survived less well (31%) than rooted runner cuttings (40%).","facts":[["Division type","Tussock division"],["Best months","Mar – May"],["Division size","Rooted clumps with runners"],["Time to establish","Slow – several weeks"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners."],["Flowering","Apr – Dec or Jan. Male and female plants are separate."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA. Dune plants are protected – use nursery stock or approved salvage."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, while growing actively, giving plants ready for winter planting. Sep – Feb workable. Avoid Jun – Aug."],["Division type","<b>Tussock division<\/b> – small clumps with rooted runners."],["Division size","Small clumps with <b>as much root and rooted runner as possible<\/b>."],["Selecting stock","Vigorous nursery stock plants."],["Preparation","• Keep pieces moist and shaded – they dry out fast.<br/>• Cut clumps apart with a sharp spade or knife.<br/>• Trim leaves back by about half."],["Potting","Pot into <b>deep tubes<\/b> of coarse sand or a very sandy mix. Firm in and water well."],["Environment","Shade house or light shade until new growth shows; keep the sand moist, not wet."],["Time to establish","Slow – allow several weeks for new roots and shoots."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate–Difficult (provisional).<\/b> Divisions survived less well than rooted runner cuttings in trials. Runner cuttings or seed are usually better choices.","problems":[["Divisions dry out and die","Roots exposed too long. Work in the shade; keep pieces in damp bags."],["Base rots","Mix too wet. Use coarse sand, water less."],["Slow establishment","Normal for spinifex. Full sun once hardened; deep tubes."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus division vs stolon cuttings)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"options":[{"method":"Cuttings","suitability":"Good","note":"Runner (stolon) sections with 1–2 nodes.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"The usual nursery method; smoke water, about 10 days.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Tussock divisions work but survived less well than rooted runners.","guide":"division"}]},{"id":"spyridium-globulosum","sci":"Spyridium globulosum","common":"Basket Bush","family":"Rhamnaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific dormancy research and nursery data available.","facts":[["Pre-treatment","Hot water (or dry heat)"],["Best sowing","Apr – Jun"],["Sowing depth","2–3 mm (needs dark)"],["Typical germination","41%"],["Seed per 100 plants","0.5 g"]],"calendar":["-","-","P","B","B","B","P","P","-","-","-","-"],"snapshot":[["Habit","Erect shrub, usually 0.6–5 m."],["Flowering","Jun – Nov (white, in woolly heads)."],["Habitat","Sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fruit as it ripens in late spring–summer; bag branches to catch shed seed."],["Extraction & cleaning","Rub and sieve the small seed from the woolly flower heads."],["Seed quality","Water-impervious seed coat (physical dormancy) – seed won't take up water until treated."],["Storage life","Not well documented; hard-coated seed is usually long-lived when dry."],["Typical germination","About <b>41%<\/b> after heat treatment (Alcoa, only 2 tests). About <b>205 seedlings per gram<\/b>. Research recorded high germination after hot water at cool (7/18°C) temperatures."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – germinates best at winter-like temperatures (7/18°C); warmth suppresses it. Mar, Jul – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water<\/b> (about 90–95°C) breaks the seed-coat dormancy – keep it short, as over-long treatment can kill seed. Alcoa used a dry-heat pulse instead."],["Sowing depth & method","Cover about <b>2–3 mm<\/b> – germination is suppressed by light, so keep the seed covered and trays shaded."],["After sowing","Water in; keep moist in a cool, shaded spot."],["Germination time","Not well documented – allow several weeks and record results."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not broken, or trays too warm or too light. Re-treat; cover seed; sow in cooler months."],["Seed killed by treatment","Hot water too long. Shorten the soak."],["Damping off","Wet, crowded trays. Thin sowing, airflow."]],"other":"One of the few coastal shrubs here that needs cool temperatures <i>and<\/i> darkness to germinate.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Science Research – Physical dormancy in seeds of six genera of Australian Rhamnaceae (incl. Spyridium globulosum)","url":"cambridge.org (Seed Science Research)"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Hot water; cool, dark conditions to germinate.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"stirlingia-latifolia","sci":"Stirlingia latifolia","common":"Blueboy","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery tests (6) show very low germination; smoke and burial research published. No reliable nursery method yet.","facts":[["Pre-treatment","Smoke water (trial)"],["Best sowing","Apr – Jun"],["Sowing depth","3–5 mm"],["Typical germination","2%"],["Seed per 100 plants","56 g"]],"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Erect, lignotuberous shrub, 0.2–1.5 m. Resprouts after fire."],["Flowering","Aug – Oct (yellow to red-brown)."],["Habitat","White, grey, yellow-brown or black sand, sometimes with lateritic gravel."],["Local note","Recorded in the Wanneroo LGA. Widely bush-picked for the dried-flower trade."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect dry, mature heads after flowering (late spring–summer)."],["Extraction & cleaning","Rub heads over a sieve to free the hairy nuts."],["Seed quality","Viability is often low (a seed supplier quotes 20–40%) – cut-test a sample and expect many empty nuts."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Very low: about <b>2%<\/b> untreated (Alcoa, 6 tests), about 1.8 seedlings per gram – roughly 55 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> (cool, about 15–23°C). Mar and Jul workable."],["Seed mix","Free-draining, pathogen-free, low-phosphorus mix."],["Pre-treatment","<b>Smoke water<\/b> (24 h soak or first watering) – <i>Stirlingia<\/i> is one of the hard-to-germinate genera that responds to smoke. Research found seed buried in soil for longer germinated even without smoke, so older seed may do better. Treat as a trial."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow generously in deep trays."],["After sowing","Keep moist, not wet. Keep trays going for months."],["Germination time","Slow and erratic."],["Pricking out","At the cotyledon stage, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – allow 6+ months (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Normal for this species. Try smoke water and older seed; sow large amounts."],["Seedlings collapse","Damping off. Sterile mix, good airflow."],["Slow growth","Normal. Very low-P feed only."]],"other":"Conventional cuttings are poor. Research found the best material is new shoots after a fire, and tissue culture does better still – a specialist job.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Smoke germination of Australian plants (Dixon; Stirlingia among smoke-responsive recalcitrant genera)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"},{"title":"Tieu A. et al. (2001) Seed Science Research – Interaction of soil burial and smoke on germination of Australian native plants","url":"cambridge.org (Seed Science Research)"},{"title":"Australian Seed – Stirlingia latifolia (viability 20–40%; smoke; 15–23°C)","url":"australianseed.com/shop/item/stirlingia-latifolia"},{"title":"Australian Flora Foundation – Fuss & Reid, Stirlingia latifolia propagation (post-fire shoots, tissue culture)","url":"aff.org.au/results/grant-summaries/aff-fuss-stirlingia/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Best from new shoots after fire; tissue culture works better.","guide":null},{"method":"Seed","suitability":"Difficult","note":"About 2% in nursery tests; smoke water (trial).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Lignotuberous; not documented as a method.","guide":null}]},{"id":"templetonia-retusa","sci":"Templetonia retusa","common":"Cockies Tongues","family":"Fabaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"ANPSA reports cuttings of firm current season's growth are successful; size follows ANPSA pea-family guidance.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Much-branched shrub, 0.3–4 m."],["Flowering","Apr – Nov (red, sometimes white-yellow)."],["Habitat","White sand, red clay, gravel and limestone; coastal cliffs, hillsides and plateaus."],["Local note","Recorded in the Wanneroo LGA. Cuttings keep a chosen flower colour."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b>, after flowering, once the new growth has firmed. Nov and Apr are workable. Avoid May – Oct (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth (ANPSA)."],["Cutting size","<b>50–75 mm<\/b> (ANPSA pea-family guidance)."],["Selecting material","Non-flowering side shoots from healthy plants."],["Pre-treatment","• Remove the leaves from the lower two-thirds.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Cuttings are reported successful; no strike rates published. Seed is easy after hot water.","problems":[["Callus, no roots","Trim and re-set; try a lower hormone strength."],["Cuttings brown off","Too dry or too soft. Firmer material; keep humidity up."],["Base rotting","Mix too wet. Water less."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Pea family (Fabaceae) genus page (50–75 mm cuttings, leaves off the lower two-thirds)","url":"anpsa.org.au/genera/pea-family/"},{"title":"ANPSA – Templetonia retusa profile (cuttings of firm current season's growth are successful)","url":"anpsa.org.au/plant_profiles/templetonia-retusa/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (14 tests) plus a WA community-nursery method.","facts":[["Pre-treatment","Hot water (or boil 30 s); smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","42%"],["Seed per 100 plants","5.0 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Much-branched shrub, 0.3–4 m."],["Flowering","Apr – Nov (red, sometimes white-yellow)."],["Habitat","White sand, red clay, gravel and limestone; coastal cliffs, hillsides and plateaus."],["Local note","Recorded in the Wanneroo LGA. Tough on coastal limestone."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen and split in late spring–summer. Bag developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long<\/b> – seed keeps its viability for many years (ANPSA)."],["Typical germination","About <b>42%<\/b> after boiling-water treatment (Alcoa nursery average, 14 tests). About <b>20 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer at 95°C for 2 minutes, pour over the seed and soak 24 hours, then <b>soak 24 hours in smoke water<\/b> (Geraldton method). Alcoa used a 30 s boil. Sow the swollen seed."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>8–12 days<\/b> (Geraldton nursery)."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Mix too wet. Water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Cuttings of firm current season's growth are also successful (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Templetonia retusa profile (easy from treated seed; long-lived seed; cuttings)","url":"anpsa.org.au/plant_profiles/templetonia-retusa/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Firm current season's growth is successful.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Hot water + smoke water; 8–12 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"thomasia-triphylla","sci":"Thomasia triphylla","common":"","family":"Malvaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"No species data. ANPSA says cuttings of firm growth usually strike reliably in <i>Thomasia<\/i>, though at least one species is difficult.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Multi-stemmed shrub, 0.3–1.2 m."],["Flowering","Jul – Nov (pink-purple or white)."],["Habitat","Calcareous sand; coastal limestone and dunes."],["Local note","Recorded in the Wanneroo LGA. Suits alkaline limestone sand and dry coastal sites."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b>, after flowering, once new growth has firmed. Nov and May are workable. Avoid Jun – Oct (cool, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","50–75 mm."],["Selecting material","Non-flowering side shoots from healthy plants."],["Pre-treatment","• Strip leaves from the lower half; reduce large leaves by a third.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat. Keep the mix moist, not wet, and mist lightly."],["Expected strike time","Not documented – check from about 4–6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> <i>Thomasia<\/i> cuttings usually strike reliably, but this species is untested – start with a trial batch.","problems":[["Leaves go brown and soft","Too wet or humid. Mist less, improve airflow."],["Callus, no roots","Trim and re-set; try a lower hormone strength."],["Slow in winter","Use bottom heat, or wait for the summer window."]],"other":"Seed – unreliable in <i>Thomasia<\/i>; a seed supplier recommends smoke treatment.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Thomasia grandiflora profile (genus: cuttings of firm growth usually strike reliably; seed unreliable)","url":"anpsa.org.au/plant_profiles/thomasia-grandiflora/"},{"title":"Geographe Community Landcare Nursery – Thomasia triphylla (coastal, drought tolerant, alkaline sand)","url":"gcln.org.au/product/thomasia-triphylla/"},{"title":"Nindethana Australian Seed – Thomasia triphylla (smoke treatment recommended for seed)","url":"nindethana.net.au/thomasia-triphylla-2716"},{"title":"ANPSA – Australian Plants Online (2007): Thomasia pygmaea, cuttings difficult to strike","url":"anpsa.org.au/APOL2007/jul07-2.html"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Cuttings usually strike reliably in the genus (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Unreliable in the genus; a supplier recommends smoke.","guide":null},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"threlkeldia-diffusa","sci":"Threlkeldia diffusa","common":"Coast Bonefruit","family":"Amaranthaceae (chenopods)","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Seed is the documented method; cuttings are a trial.","facts":[["Wood type","Softwood tips"],["Best months","Dec – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5 g/L IBA"]],"length_mm":[50.0,75.0],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Much-branched, prostrate to erect perennial, 0.1–0.4 m, forming a spreading mat. Semi-succulent leaves."],["Flowering","Oct – Nov (tiny, green), followed by small red to black fruits."],["Habitat","White or grey sand over limestone, coastal areas and saline flats. Salt- and drought-tolerant."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b> – warm, with plants actively growing after flowering. Nov and Apr are workable. Avoid May – Oct."],["Wood type","<b>Softwood tip cuttings<\/b> of the semi-succulent stems."],["Cutting size","50–75 mm."],["Selecting material","Healthy tips without developing fruit."],["Pre-treatment","• Strip lower leaves.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength, 1.5 g/L IBA (<b>Clonex Green<\/b>)."],["Propagation mix","Very free-draining sandy mix."],["Environment","Semi-succulent leaves rot if kept wet – mist very little, keep the mix on the dry side, give good airflow and bright light."],["Expected strike time","Not documented – start checking from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; water sparingly."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> No cutting data found; seed is the proven method (see Other methods).","problems":[["Cuttings turn soft and rot","Too wet or humid. Water less, mist less, improve airflow."],["Weak, stretched growth","Not enough light. Move to a brighter position."],["No roots","Try firmer tips or the seed method."]],"other":"Seed – the documented method. The Geraldton community nursery soaks seed in smoke water (1:9) for 24 hours; germination takes 10–15 days and happens in cooler weather, so sow in autumn.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"APACE WA – Threlkeldia diffusa","url":"apacewa.org.au/plant/threlkeldia-diffusa/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method available; no nursery test data.","facts":[["Pre-treatment","24 h smoke-water soak"],["Best sowing","Apr – Jun"],["Sowing depth","1–2 mm"],["Typical germination","Not recorded"]],"calendar":["-","-","P","B","B","B","P","P","-","-","-","-"],"snapshot":[["Habit","Much-branched, prostrate to erect perennial, 0.1–0.4 m, with semi-succulent leaves."],["Flowering","Oct – Nov (tiny, green), followed by small red to black fruits."],["Habitat","White or grey sand over limestone, coastal areas and saline flats."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the small fruits in summer once they turn red to black."],["Extraction & cleaning","Dry the fruits; sow them whole."],["Seed quality","Cut-test a few fruits to check they are filled."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – germinates in cooler weather. Mar, Jul – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","<b>Soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method)."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>."],["After sowing","Water in; keep just moist – semi-succulent seedlings rot if wet."],["Germination time","About <b>10–15 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Too warm. Sow in the cooler months."],["Seedlings rot","Too wet. Water less, improve drainage."],["Leggy seedlings","Not enough light. Move to full sun sooner."]],"other":"Softwood cuttings are a trial alternative (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Trial","note":"No published cutting data; trial protocol.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Smoke-water soak; 10–15 days in cool weather.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Not documented.","guide":null}]},{"id":"waitzia-suaveolens","sci":"Waitzia suaveolens","common":"Fragrant Waitzia","family":"Asteraceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (2 tests); sowing follows standard practice for annual everlastings.","facts":[["Pre-treatment","Smoke water (optional)"],["Best sowing","Apr – May"],["Sowing depth","Surface – light cover"],["Typical germination","21%"],["Seed per 100 plants","0.1 g"]],"calendar":["-","-","P","B","B","P","-","-","-","-","-","-"],"snapshot":[["Habit","Annual herb to 0.6 m."],["Flowering","Sep – Dec or Jan (white, pink, purple or yellow papery heads)."],["Habitat","Widespread across the south-west, including the Swan Coastal Plain."],["Local note","Recorded in the Wanneroo LGA. An annual – it flowers the spring after sowing, then dies."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect heads in early summer once they dry and the fluffy seed starts to lift."],["Extraction & cleaning","Rub heads gently over a sieve. Seed is very fine."],["Seed quality","Fine seed – a little goes a long way."],["Storage life","Store dry and cool and sow the following autumn."],["Typical germination","About <b>21%<\/b> (untreated, Alcoa nursery average, 2 tests). About <b>967 seedlings per gram<\/b> – roughly 0.1 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b>, after the first autumn rains. Mar and Jun are workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","None required. Smoke water in the first watering may help."],["Sowing depth & method","Mix the fine seed with dry sand and surface-sow; cover very lightly or not at all. A pinch per tube avoids pricking out."],["After sowing","Water in with a fine mist; keep moist."],["Germination time","About <b>2–4 weeks<\/b>."],["Pricking out","If tray-sown, prick out small, at the second-leaf stage. Thin direct-sown cells to 1–3 seedlings."],["Shade house & hardening","Short – a week or so in the shade house, then full sun."],["Time to planting size","Plant out small, about <b>6–10 weeks<\/b> after sowing, so plants flower in spring."]]}],"difficulty_note":"","problems":[["Seed washed into clumps","Bottom water or use a very fine mist."],["Leggy seedlings","Too much shade. Full sun early."],["Plants flower in the tube","Held too long. Plant out while small."]],"other":"Often direct-seeded into revegetation sites after the first autumn rains.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (annuals from seed, light, smoke and GA; perennial cuttings)","url":"anpsa.org.au/genera/daisies/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Annual.","guide":null},{"method":"Seed","suitability":"Main method","note":"Annual everlasting – sow after the first autumn rains.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Annual.","guide":null}]}],"methods":{"cuttings":[{"title":"Wood types and the bend test","level":2,"blocks":[{"type":"table","rows":[["Wood type","What it looks like","Bend test","Use"],["<b>Softwood<\/b>","Soft, flexible, bright new growth from the current flush.","Flops or stays bent.","Roots fast but wilts and rots easily. Suits soft-stemmed plants such as <i>Scaevola<\/i>."],["<b>Semi-hardwood<\/b>","Current season's growth that has begun to firm; bark starting to colour.","Bends about 60° and springs back.","The standard for most WA native shrubs. More forgiving than softwood."],["<b>Hardwood<\/b>","Fully mature, woody stems from previous seasons.","Stiff; snaps rather than bends.","Slow to root. Rarely needed for the species in this guide."]]}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Strikes reliably with the standard method."],["<b>Easy–Moderate<\/b>","Usually strikes; one factor (e.g. moisture, fragile stems) needs extra care."],["<b>Moderate<\/b>","Strikes, but results depend on timing, material and moisture control. Set extra cuttings."],["<b>Moderate–Difficult<\/b>","Low or variable strike; needs careful timing and good facilities."],["<b>Difficult<\/b>","Low or erratic strike; specialist techniques or alternative methods usually needed."]]},{"type":"p","html":"<b>* Provisional<\/b> – rating is based on how the genus generally behaves because little species-specific data is published. Replace it with the nursery's own figure once a few batches have been recorded.","small":true}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific propagation information is published and con
