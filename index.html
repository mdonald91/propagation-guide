      if (!mm) return p.trim() ? { sci: p.trim(), amount: AMOUNTS[1], want: [] } : null;
      return { sci: mm[1].trim(), amount: mm[2].trim() || AMOUNTS[1], want: (mm[3] || "").split("+").map(function (w) { return w.trim(); }).filter(Boolean) };
    }).filter(Boolean);
  }
  function importSites(ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || ""), incoming = [];
      try {
        if (/\.csv$/i.test(f.name) || /^id,name,lat/i.test(text)) {
          var rows = parseCSV(text), head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
          rows.slice(1).forEach(function (cells) {
            var r = {}; head.forEach(function (h, i) { r[h] = cells[i] || ""; });
            incoming.push({ id: r.id, name: r.name, lat: parseFloat(r.lat), lng: parseFloat(r.lng), acc: parseFloat(r.accuracy_m) || null,
              species: parseSpeciesText(r.species), access: r.access, notes: r.notes, recorder: r.recorder, date: r.date, created: r.created, updated: r.updated });
          });
        } else {
          var gj = JSON.parse(text);
          (gj.features || []).forEach(function (ft) {
            var p = ft.properties || {}, c = ft.geometry && ft.geometry.coordinates;
            if (!c) return;
            incoming.push({ id: p.id, name: p.name, lat: +c[1], lng: +c[0], acc: p.accuracy_m || null,
              species: Array.isArray(p.species_detail) ? p.species_detail : parseSpeciesText(p.species),
              access: p.access || "", notes: p.notes || "", recorder: p.recorder || "", date: p.date || "", created: p.created || "", updated: p.updated || "" });
          });

      } catch (e) { toast("That file couldn't be read"); return; }
      incoming = incoming.filter(function (x) { return isFinite(x.lat) && isFinite(x.lng) && Math.abs(x.lat) <= 90 && Math.abs(x.lng) <= 180; });
      if (!incoming.length) { toast("No sites found in that file"); return; }
      var list = loadSites(), ids = {}, added = 0, updated = 0;
      list.forEach(function (x, i) { ids[x.id] = i; });
      incoming.forEach(function (x) {
        if (!x.id) x.id = uid();
        if (ids[x.id] != null) { if ((x.updated || "") > (list[ids[x.id]].updated || "")) { list[ids[x.id]] = x; updated++; } }
        else { list.push(x); ids[x.id] = list.length - 1; added++; }
      });
      if (saveSites(list)) { toast(added + " added, " + updated + " updated"); renderSites(); }
    };
    reader.readAsText(f);
    ev.target.value = "";
  }

  // ---------- our results vs the guide ----------
  var BANDS = { "Easy": [70, 100], "Easy-Moderate": [50, 90], "Moderate": [30, 75], "Moderate-Difficult": [15, 50], "Difficult": [0, 30] };
  function daysSince(ds) { var d = new Date(String(ds) + "T00:00:00"); return isNaN(d) ? 0 : Math.floor((Date.now() - d.getTime()) / 86400000); }
  function hasResult(r) { return r.success !== "" && r.success != null && !isNaN(parseFloat(r.success)) && parseFloat(r.qty) > 0; }
  function speciesResults(sci, method) {
    var recs = loadRecs().filter(function (r) { return r.species === sci && methodOf(r) === method; });
    var done = recs.filter(hasResult);
    var count = done.filter(function (r) { return !(method === "seed" && r.unit === "g"); });
    var grams = done.filter(function (r) { return method === "seed" && r.unit === "g"; });
    function pool(list) { var a = 0, b = 0; list.forEach(function (r) { a += parseFloat(r.qty); b += parseFloat(r.success); }); return a > 0 ? { v: b / a, a: a, b: b } : null; }
    var rates = count.map(function (r) { return parseFloat(r.success) / parseFloat(r.qty); });
    var months = {};
    count.forEach(function (r) {
      var m = parseInt(String(r.date || "").slice(5, 7), 10) - 1; if (!(m >= 0)) return;
      (months[m] = months[m] || []).push(r);
    });
    var byMonth = Object.keys(months).map(function (k) { var p = pool(months[k]); return { m: +k, rate: p.v, n: months[k].length }; });
    byMonth.sort(function (a, b) { return b.rate - a.rate; });
    return { total: recs.length, pending: recs.length - done.length, n: count.length, pool: pool(count), gN: grams.length, gPool: pool(grams),
             min: rates.length ? Math.min.apply(null, rates) : null, max: rates.length ? Math.max.apply(null, rates) : null,
             best: byMonth.length >= 2 && Math.round(byMonth[0].rate * 100) - Math.round(byMonth[byMonth.length - 1].rate * 100) >= 5 ? byMonth[0] : null };
  }
  function pct(v) { return Math.round(v * 100) + "%"; }
  var RES_WORD = { cuttings: ["strike", "cuttings", "struck"], seed: ["germination", "seeds", "up"], division: ["established", "pieces", "established"] };
  function resultFlags(s, k, res) {
    var g = s[k], flags = [];
    if (res.n >= 3 && res.pool) {
      var p = Math.round(res.pool.v * 100);
      if (k === "seed" && g.stats && g.stats.germ_pct != null) {
        var d = p - g.stats.germ_pct;
        if (d >= 20) flags.push("Your germination (" + p + "%) is well above the guide's " + g.stats.germ_pct + "% – the guide may be underselling this species.");
        else if (d <= -20) flags.push("Your germination (" + p + "%) is well below the guide's " + g.stats.germ_pct + "% – check the pre-treatment and seed quality, or the guide figure may not suit your seed.");
      } else if (k !== "seed" && BANDS[g.difficulty]) {
        var band = BANDS[g.difficulty], label = dash(g.difficulty);
        if (p > band[1]) flags.push("Your " + RES_WORD[k][0] + " rate (" + p + "%) is higher than a “" + label + "” rating suggests – it may be easier here than the guide says.");
        else if (p < band[0]) flags.push("Your " + RES_WORD[k][0] + " rate (" + p + "%) is lower than a “" + label + "” rating suggests – check timing, material and moisture, or the rating may need changing.");
      }
    }
    if (k === "seed" && res.gN >= 2 && res.gPool && g.stats && g.stats.per_gram) {
      var ratio = res.gPool.v / g.stats.per_gram;
      if (ratio >= 1.5 || ratio <= 0.67) flags.push("You're getting about " + (Math.round(res.gPool.v * 10) / 10) + " seedlings per gram, against the guide's " + g.stats.per_gram + ".");
    }
    if (res.best && res.best.n >= 2 && g.calendar[res.best.m] === "-")
      flags.push("Your best results came from batches started in " + MONTHS_LONG[res.best.m] + ", which the guide marks as a month to avoid.");
    if (g.provisional && res.n >= 3 && !flags.length) flags.push("This rating is provisional – your " + res.n + " batches are enough to confirm or replace it.");

  }
  function resultsCard(s, k) {

    if (res.n && res.pool) {
      html += '<div class="res-big"><span class="num">' + pct(res.pool.v) + "</span> " + W[0] + " from " + res.n + (res.n === 1 ? " batch" : " batches") + "</div>";
      var sub = [Math.round(res.pool.b) + " of " + Math.round(res.pool.a) + " " + W[1]];

      (g.stats && g.stats.per_gram ? " (guide: " + g.stats.per_gram + ")" : "") + "</div>";

  // ---------- batches due to check ----------
  function checkWindow(r) {

    var k = cal.pxPerMm, side = ruler.side, range = ruler.ctx.range;
    [rulerEl, markerEl, barEl].forEach(function (el) { el.classList.remove("left", "right"); el.classList.add(side); });
    rulerEl.hidden = false; barEl.hidden = false;
    var H = rulerEl.clientHeight, W = rulerEl.clientWidth || 68;
    var maxMm = Math.floor((H - RULER_OFF - 2) / k);
    var edge = side === "right" ? W : 0, dir = side === "right" ? -1 : 1;
    var out = [];
    if (range) {
      var y1 = RULER_OFF + range[0] * k, y2 = RULER_OFF + Math.min(range[1], maxMm) * k;
      if (range[0] <= maxMm) {
        out.push('<rect class="rg" x="0" y="' + y1.toFixed(2) + '" width="' + W + '" height="' + Math.max(0, y2 - y1).toFixed(2) + '"/>');
        out.push('<line class="rge" x1="0" x2="' + W + '" y1="' + y1.toFixed(2) + '" y2="' + y1.toFixed(2) + '"/>');
        if (range[1] <= maxMm) out.push('<line class="rge" x1="0" x2="' + W + '" y1="' + y2.toFixed(2) + '" y2="' + y2.toFixed(2) + '"/>');
      }
    }
    for (var mm = 0; mm <= maxMm; mm++) {
      var y = (RULER_OFF + mm * k).toFixed(2);
      var len = mm % 10 === 0 ? 30 : (mm % 5 === 0 ? 20 : 11);
      out.push('<line class="' + (mm === 0 ? "zero" : mm % 10 === 0 ? "t10" : mm % 5 === 0 ? "t5" : "t") + '" x1="' + (mm === 0 ? 0 : edge) +
        '" x2="' + (mm === 0 ? W : edge + dir * len) + '" y1="' + y + '" y2="' + y + '"/>');
      if (mm % 10 === 0 && mm > 0) {
        out.push('<text class="lbl" x="' + (edge + dir * 34) + '" y="' + (parseFloat(y) + 4) + '" text-anchor="' + (side === "right" ? "end" : "start") + '">' + mm + "</text>");
      }
    }
    out.push('<text class="lbl0" x="' + (edge + dir * 34) + '" y="' + (RULER_OFF + 14) + '" text-anchor="' + (side === "right" ? "end" : "start") + '">0</text>');
    rulerEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + out.join("") + "</svg>";
    rulerEl.setAttribute("aria-label", "Ruler in millimetres, 0 at the top" + (range ? ", recommended " + range[0] + " to " + range[1] + " mm highlighted" : ""));

    var notes = [];
    if (range && range[1] > maxMm) notes.push("This screen shows up to " + maxMm + " mm, so the top of the range (" + range[1] + " mm) is past the bottom edge.");
    if (window.innerWidth > window.innerHeight) notes.push("Turn the phone upright for the full ruler.");
    if (zoomed()) notes.push("The page is zoomed in – pinch back out or the ruler won't be accurate.");
    barEl.innerHTML =
      '<div class="aim">' + (range ? "Aim for <b>" + range[0] + "–" + range[1] + " mm</b>" : "Cutting ruler") + ' <span class="hint">(' + esc(ruler.ctx.name) + ")</span></div>" +
      '<div class="hint">Base of the cutting on the red 0 line. Touch the ruler at the tip to read its length.</div>' +
      notes.map(function (n) { return '<div class="warn">' + esc(n) + "</div>"; }).join("") +
      '<div class="row3"><button type="button" id="r-side">Swap side</button><button type="button" id="r-cal">Re-check</button><button type="button" id="r-close">Close</button></div>';
    document.getElementById("r-side").addEventListener("click", function () { ruler.side = ruler.side === "right" ? "left" : "right"; markerEl.hidden = true; drawRuler(); });
    document.getElementById("r-cal").addEventListener("click", function () { openCalibration(); });
    document.getElementById("r-close").addEventListener("click", rulerOff);
  }

  function rulerRead(ev) {
    var cal = currentCal(); if (!cal || !ruler.on) return;
    var rect = rulerEl.getBoundingClientRect();
    var y = ev.clientY - rect.top;
    var mm = (y - RULER_OFF) / cal.pxPerMm;
    if (mm < 0) mm = 0;
    var r = ruler.ctx && ruler.ctx.range, verdict = "";
    var shown = Math.round(mm);
    if (r) verdict = shown < r[0] ? '<i class="no"> · too short</i>' : shown > r[1] ? '<i class="no"> · too long</i>' : '<i class="ok"> · in range ✓</i>';
    markerEl.style.top = (rect.top + RULER_OFF + mm * cal.pxPerMm) + "px";
    markerEl.innerHTML = "<span>" + shown + " mm" + verdict + "</span>";
    markerEl.hidden = false;
  }
  rulerEl.addEventListener("pointerdown", function (e) { rulerEl.setPointerCapture && rulerEl.setPointerCapture(e.pointerId); rulerRead(e); e.preventDefault(); });
  rulerEl.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "touch") rulerRead(e); });
  window.addEventListener("resize", function () { if (ruler.on) drawRuler(); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { if (ruler.on) drawRuler(); });

  function openCalibration(onSaved) {
    var old = rawCal();
    var stale = old && !currentCal();
    var k = old ? old.pxPerMm : 6.2;
    calEl.innerHTML =
      '<div class="ctop"><h2>Set up the ruler for this phone</h2>' +
      (stale ? '<div class="banner">This phone’s display settings have changed since the ruler was set up – please check it again.</div>' : "") +
      "<p>Phone screens differ, so the ruler needs one quick check on each phone. Hold a <b>bank card sideways</b> across the screen " +
      "(it can hang over the edges) with its top edge on the top line of the green band.</p></div>" +
      '<div class="band" id="c-band"><svg id="c-ticks" aria-hidden="true"></svg><div class="mid">Card goes here</div></div>' +
      '<div class="cctl"><p style="margin:0"><b>Adjust until no green shows above or below the card.</b></p>' +
      '<div class="adj"><button type="button" id="c-minus" aria-label="Smaller">−</button>' +
      '<input type="range" id="c-range" min="3.5" max="10" step="0.005" value="' + k + '" aria-label="Band height">' +
      '<button type="button" id="c-plus" aria-label="Bigger">+</button></div>' +
      '<div class="btn-row"><button type="button" class="btn primary" id="c-save">Save</button><button type="button" class="btn" id="c-cancel">Cancel</button></div>' +
      '<p class="note">Driver’s licences and Medicare cards are the same size as bank cards. No card? The band is 54 mm tall – check it with a ruler ' +
      "instead (ticks every 10 mm). Redo this if you change the phone’s display size setting.</p></div>";
    calEl.hidden = false;
    var band = document.getElementById("c-band"), rng = document.getElementById("c-range"), ticks = document.getElementById("c-ticks");
    function upd() {
      var kk = parseFloat(rng.value);
      band.style.height = (CARD_SHORT_MM * kk).toFixed(2) + "px";
      var t = [];
      for (var mm = 10; mm < CARD_SHORT_MM; mm += 10) {
        var y = (mm * kk).toFixed(2);
        t.push('<line class="t" x1="0" x2="18" y1="' + y + '" y2="' + y + '"/><text class="lbl" x="22" y="' + (parseFloat(y) + 4) + '">' + mm + "</text>");
      }
      ticks.innerHTML = t.join("");
    }
    function nudge(d) { rng.value = Math.min(10, Math.max(3.5, parseFloat(rng.value) + d)).toFixed(3); upd(); }
    rng.addEventListener("input", upd);
    document.getElementById("c-minus").addEventListener("click", function () { nudge(-0.01); });
    document.getElementById("c-plus").addEventListener("click", function () { nudge(0.01); });
    document.getElementById("c-cancel").addEventListener("click", function () { calEl.hidden = true; });
    document.getElementById("c-save").addEventListener("click", function () {
      saveCal(parseFloat(rng.value));
      calEl.hidden = true;
      toast("Ruler set for this phone");
      if (typeof onSaved === "function") { onSaved(); return; }
      if (ruler.ctx) {
        ruler.on = true; drawRuler();
        var b = document.getElementById("ruler-btn");
        if (b) b.lastChild.textContent = " Hide ruler";
      }
    });
    upd();
    calEl.scrollTop = 0;
  }

  // ---------- light / dark mode ----------
  // "auto" follows the phone's setting; "light" or "dark" overrides it on this device.
  var THEME_KEY = "npg.theme";
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function themeMode() { var t = null; try { t = localStorage.getItem(THEME_KEY); } catch (e) {} return t === "light" || t === "dark" ? t : (themeMode._mem || "auto"); }
  function isDark() { var m = themeMode(); return m === "dark" || (m === "auto" && !!(darkMQ && darkMQ.matches)); }
  function applyTheme() {
    var m = themeMode(), root = document.documentElement;
    if (m === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", m);
    var btn = document.getElementById("theme-btn"), dark = isDark();
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    btn.title = btn.getAttribute("aria-label");
    var brand = getComputedStyle(root).getPropertyValue("--brand").trim();
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta && brand) meta.setAttribute("content", brand);
    if (ruler && ruler.on) drawRuler();
  }
  function setTheme(m) {
    themeMode._mem = m;
    try { if (m === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, m); } catch (e) {}
    applyTheme();
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    setTheme(isDark() ? "light" : "dark");
    toast(isDark() ? "Dark mode on" : "Light mode on");
    if (state.tab === "about" && !location.hash.match(/^#sp-/)) renderAbout();
  });
  if (darkMQ) {
    var onMQ = function () { if (themeMode() === "auto") applyTheme(); };
    if (darkMQ.addEventListener) darkMQ.addEventListener("change", onMQ); else if (darkMQ.addListener) darkMQ.addListener(onMQ);
  }

  // ---------- render ----------
  function render() {
    var r = parseHash();
    state.tab = r.tab;
    document.querySelectorAll(".tabbar button").forEach(function (b) {
      if (b.dataset.tab === r.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    backBtn.hidden = !(r.id || r.site);
    if (!r.id && ruler.on) rulerOff();
    dropMap();
    if (r.tab !== "sites") { state.sitePlacing = null; state.siteEditing = null; }
    if (r.id) renderDetail(r.id);
    else if (r.site) renderSiteDetail(r.site);
    else if (r.tab === "species") renderSpecies();
    else if (r.tab === "sites") renderSites();
    else if (r.tab === "methods") renderMethods();
    else if (r.tab === "records") renderRecords();
    else if (r.tab === "about") renderAbout();
    else renderMonth();
    if (!render._first) window.scrollTo(0, 0);
    render._first = false;
  }
  render._first = true;
  applyTheme();
  render();

  // ---------- offline / updates ----------
  
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function showUpdate(worker) {
          var bar = document.getElementById("update-bar");
          bar.hidden = false;
          document.getElementById("update-btn").onclick = function () { worker.postMessage({ type: "SKIP_WAITING" }); };
        }
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (nw) nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 3600000);
      }).catch(function () {});
      var refreshing = false, hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        // first install: the new worker just takes control – no reload needed (it would wipe a half-filled form)
        if (!hadController) { hadController = true; return; }
        if (refreshing) return; refreshing = true; location.reload();
      });
    });
  }

})();
</script>

</body>
