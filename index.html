<title>Native Plant Propagation Guide</title>
<style>
:root {
  --bg: #F4F7F2;
  --surface: #FFFFFF;
  --surface-2: #EEF3EB;
  --ink: #1F2A22;
  --muted: #5B6B5F;
  --rule: #D5DDD2;
  --brand: #2E4A36;
  --brand-ink: #FFFFFF;
  --leaf: #4F7A5A;
  --leaf-soft: #DCE8D8;
  --focus: #2F6FB0;
  --cal-best: #3E7A4E;
  --cal-best-ink: #FFFFFF;
  --cal-ok: #C4DDBC;
  --cal-ok-ink: #24452E;
  --cal-no: #ECEFEA;
  --cal-no-ink: #9AA59C;
  --d-easy: #3F7F4A;
  --d-easymod: #6B8726;
  --d-mod: #A2740F;
  --d-moddiff: #B0561F;
  --d-diff: #A3382E;
  --warn-bg: #FFF4DB;
  --warn-ink: #6A4A00;
  --shadow: 0 1px 2px rgba(31, 42, 34, .08), 0 2px 8px rgba(31, 42, 34, .06);
  --radius: 12px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
    --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
    --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
    --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
    --warn-bg: #3A3016; --warn-ink: #F2D993;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
  --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
  --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
  --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
  --warn-bg: #3A3016; --warn-ink: #F2D993;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
i, em { font-style: italic; }
a { color: var(--leaf); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding-block: 10px; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { font-size: .8rem; opacity: .8; font-weight: 500; display: block; }
.icon-btn {
  background: transparent; border: 0; color: inherit; width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 24px; height: 24px; }

.update-bar {
  background: var(--warn-bg); color: var(--warn-ink); padding-block: 10px; padding-inline: 16px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: .95rem;
}
.update-bar button { background: var(--warn-ink); color: var(--warn-bg); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

/* ---------- main ---------- */
main {
  padding-inline: 16px; padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  max-width: 760px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
}
.view-title { font-size: 1.45rem; font-weight: 750; }
.lede { color: var(--muted); margin: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; }
.count { color: var(--muted); font-size: .85rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- bottom nav ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.tabbar button {
  background: none; border: 0; min-height: var(--nav-h); padding: 6px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: .72rem; font-weight: 600;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--leaf); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.4; }

/* ---------- controls ---------- */
.month-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month-strip button {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; min-height: 44px;
  font-weight: 650; cursor: pointer; font-size: .92rem;
}
.month-strip button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.month-strip button.is-now { box-shadow: inset 0 -3px 0 var(--leaf); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  flex: 1; border: 0; background: transparent; min-height: 42px; border-radius: 9px; font-weight: 650; cursor: pointer; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface);
  padding-inline: 14px 14px; font-size: 1rem;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding-inline: 18px;
  border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--d-diff); border-color: var(--d-diff); }
.btn.danger.armed { background: var(--d-diff); color: #fff; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- lists ---------- */
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--rule); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px;
  width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit;
}
.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sci { font-style: italic; font-weight: 700; }
.common { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chev { color: var(--muted); flex: none; }
.letter { background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 700; padding: 4px 14px; letter-spacing: .06em; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700;
  color: #fff; white-space: nowrap; line-height: 1.6;
}
.chip.neutral { background: var(--surface-2); color: var(--ink); }
.chip.best { background: var(--cal-best); color: var(--cal-best-ink); }
.chip.ok { background: var(--cal-ok); color: var(--cal-ok-ink); }
.d-easy { background: var(--d-easy); } .d-easymod { background: var(--d-easymod); } .d-mod { background: var(--d-mod); }
.d-moddiff { background: var(--d-moddiff); } .d-diff { background: var(--d-diff); }
.empty { color: var(--muted); padding: 16px; text-align: center; background: var(--surface); border-radius: var(--radius); }

/* ---------- species detail ---------- */
.sp-head { background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.sp-head h2 { font-size: 1.55rem; font-style: italic; font-weight: 750; }
.sp-head .common { color: var(--brand-ink); opacity: .85; font-size: .98rem; }
.sp-head .fam { font-size: .82rem; opacity: .75; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.fact .k { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fact .v { font-weight: 700; }
.fact.diff { color: #fff; }
.fact.d-easy { background: var(--d-easy); } .fact.d-easymod { background: var(--d-easymod); } .fact.d-mod { background: var(--d-mod); }
.fact.d-moddiff { background: var(--d-moddiff); } .fact.d-diff { background: var(--d-diff); }
.fact.diff .k { color: rgba(255,255,255,.85); }
.cal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 6px; }
.cal div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .75rem; font-weight: 700; color: var(--muted); }
.cal span { display: grid; place-items: center; width: 100%; height: 32px; border-radius: 7px; font-size: .78rem; }
.cal .B { background: var(--cal-best); color: var(--cal-best-ink); }
.cal .P { background: var(--cal-ok); color: var(--cal-ok-ink); }
.cal .N { background: var(--cal-no); color: var(--cal-no-ink); }
.cal .now span { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 1.02rem; font-weight: 700; color: var(--leaf); }
.dl { display: flex; flex-direction: column; }
.dl > div { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.dl > div:first-child { border-top: 0; padding-top: 0; }
.dl dt { font-weight: 700; font-size: .86rem; color: var(--muted); }
.dl dd { margin: 0; }
.note { font-size: .88rem; color: var(--muted); margin: 0; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.sources, .dl dd, .mrow .kv { overflow-wrap: anywhere; }
.sources { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.back { align-self: flex-start; }

/* methods: table rows rendered as stacked items */
.mrow { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.mrow:first-child { border-top: 0; padding-top: 0; }
.mrow .t { font-weight: 700; }
.mrow .kv { font-size: .92rem; }
.mrow .kv b.lbl { color: var(--muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; display: block; }

/* ---------- records ---------- */
form.card label { font-weight: 650; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
form.card input, form.card select, form.card textarea {
  min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); padding: 8px 12px; width: 100%;
}
form.card textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.radio-row { display: flex; gap: 8px; }
.radio-row label { flex: 1; flex-direction: row !important; align-items: center; justify-content: center; gap: 8px !important;
  border: 1px solid var(--rule); border-radius: 10px; min-height: 46px; cursor: pointer; background: var(--bg); }
.radio-row input { width: auto !important; min-height: 0 !important; accent-color: var(--leaf); }
.result { font-weight: 750; font-size: 1.05rem; }
.rec { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.rec:hover { background: var(--surface-2); }
.rec .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.rec .meta { color: var(--muted); font-size: .86rem; }
.pct { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 650; z-index: 40; max-width: calc(100% - 32px);
}
.about p { margin: 0; }
.about ol, .about ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

@media (min-width: 620px) {
  .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .month-strip { grid-template-columns: repeat(12, 1fr); }
  .cal { grid-template-columns: repeat(12, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

</head>

<script type="application/json" id="app-data">{"versions":{"cuttings":"1.1","seed":"1.1"},"revisions":{"cuttings":[["1.0","Sep 2026","First edition: Grevillea vestita, Hibbertia racemosa, Scaevola canescens, S. repens, S. thesioides."],["1.1","Sep 2026","Added 10 species: Eremophila glabra, Hibbertia hypericoides, Lechenaultia linarioides, Myoporum insulare, Phyllanthus calycinus, Scaevola crassifolia, S. globulifera, Spinifex hirsutus, S. longifolius, Threlkeldia diffusa. Added page numbers to the species index."]],"seed":[["1.0","Sep 2026","First edition: Allocasuarina fraseriana, A. humilis, Anigozanthos manglesii, Banksia attenuata, B. menziesii, Daviesia nudiflora, Gompholobium tomentosum, Hovea pungens."],["1.1","Sep 2026","Added 15 species: Austrostipa flavescens, Banksia sessilis, Bossiaea eriocarpa, Calothamnus quadrifidus, Corymbia calophylla, Dianella revoluta, Eucalyptus gomphocephala, E. marginata, Kennedia prostrata, Melaleuca huegelii, M. systena, Olearia axillaris, Petrophile linearis, P. macrostachya, Spyridium globulosum."]]},"species":[{"id":"allocasuarina-fraseriana","sci":"Allocasuarina fraseriana","common":"Sheoak / Western Sheoak","family":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and WA seed-handling notes are available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","37%"],["Seed per 100 plants","1.3 g"]],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect tree, 5–15 m. Male and female flowers usually on separate trees (dioecious)."],["Flowering","May – Oct. Woody cones up to 40 mm long follow on female trees."],["Habitat","Lateritic soils and white, grey or yellow sand; jarrah forest and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Only female trees bear cones – note which trees you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones mature within about a year of flowering. Collect cones that have turned pale to dark brown <b>with the valves still closed<\/b>. Use secateurs or a pole pruner."],["Extraction & cleaning","Place cones in a paper bag or tray in a warm, dry spot – they open readily and drop the winged seeds (samaras). Sieve off cone debris."],["Seed quality","Many seeds look sound but are empty. <b>Cut-test<\/b> a sample before sowing and discard lots with empty or shrivelled seed."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store dried seed sealed in the fridge, or keep seed in closed cones until the sowing season."],["Typical germination","About <b>37%<\/b> (untreated, Alcoa nursery average). About <b>76 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cooling autumn weather, 15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan (heat)."],["Seed mix","Standard sterile native seed mix (see Standard method)."],["Pre-treatment","<b>None needed.<\/b> Seed becomes sticky (mucilaginous) when wet – mix dry seed with a little dry, sterile yellow sand so it spreads evenly and can be seen."],["Sowing depth & method","Scatter thinly and cover lightly with about <b>2–3 mm<\/b> of fine sand or vermiculite. <b>Direct sowing into tubes or cells<\/b> (a few seeds each, thinned later) reduces losses – sheoak seedlings are prone to damping off after pricking out."],["After sowing","Water in with a fine spray (smoke water is optional – aerosol smoke gave similar results to untreated seed in Alcoa trials). Keep moist, not wet. Watch for damping off."],["Germination time","Seedlings emerge after about <b>2–5 weeks<\/b>."],["Pricking out","If sown in trays, prick out early – once seedlings are about 2–3 cm tall and can be handled – disturbing roots as little as possible."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out or thinning, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, use sterile mix, water from below where possible, direct sow into tubes."],["Very low germination","Seed lot mostly empty. Cut-test before sowing; collect from closed, mature cones."],["Seed clumps together","Mucilage. Mix dry seed with dry sand before sowing; don't pre-soak."]],"other":"Cuttings are rarely used. Seed from several trees keeps genetic diversity in revegetation stock.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]}},{"id":"allocasuarina-humilis","sci":"Allocasuarina humilis","common":"Dwarf Sheoak","family":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and WA seed-handling notes are available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","25%"],["Seed per 100 plants","1.3 g"]],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect or spreading shrub, 0.2–2 m. Dioecious or monoecious."],["Flowering","May – Nov."],["Habitat","Sand (often over laterite), sandy clay and gravel on sandplains and dunes."],["Local note","Widespread in the South West. Collect from local-provenance plants and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect mature brown cones <b>with valves still closed<\/b>, usually within a year of flowering. On dioecious plants only female plants bear cones."],["Extraction & cleaning","Dry cones in a paper bag in a warm, dry place until they open; sieve out the small winged seeds."],["Seed quality","Germination is often low – <b>cut-test<\/b> a sample. Many seeds can be empty."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store sealed in the fridge, or keep in closed cones until needed."],["Typical germination","About <b>25%<\/b> (untreated, Alcoa nursery average). About <b>77 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Mix dry seed with dry, sterile sand for even spreading (seed turns sticky when wet)."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube/cell and thin, or sow thinly in trays. Sow more generously than for <i>A. fraseriana<\/i> to allow for lower germination."],["After sowing","Water in with a fine spray; keep moist, not wet. Good airflow to limit damping off."],["Germination time","About <b>2–5 weeks<\/b>."],["Pricking out","Prick out early, at about 2–3 cm tall, with minimal root disturbance."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, sterile mix, avoid overwatering."],["Very low germination","Empty seed. Cut-test; collect from closed, fully mature cones."],["Seed clumps together","Mix dry seed with dry sand; don't pre-soak."]],"other":"Slower-growing shrub – allow extra time to reach planting size.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]}},{"id":"anigozanthos-manglesii","sci":"Anigozanthos manglesii","common":"Red and Green Kangaroo Paw","family":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Well researched: dormancy, heat, smoke and storage responses are published.","facts":[["Pre-treatment","Dry heat 100°C 3 h, or aged seed"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","70%"],["Seed per 100 plants","0.5 g"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous perennial herb, 0.2–1.1 m (flower stems). Often short-lived – best treated as a 2–3 year plant."],["Flowering","Aug – Nov (green and red). WA's floral emblem."],["Habitat","White, yellow or grey sand and sandy loam."],["Local note","Recorded in the Wanneroo LGA. Also called Mangles Kangaroo Paw."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens roughly three months after flowering (about Nov – Feb). Collect when capsules dry and brown, before they split and shed."],["Extraction & cleaning","Dry capsules in paper bags; rub and sieve to separate the small seed."],["Seed quality","Fresh seed is strongly dormant – untreated germination can be very low (about 1% in one Alcoa trial)."],["Storage life","<b>Stores well for several years<\/b> dry at room temperature, and germination <b>improves with age<\/b> (after-ripening). Research found <b>freezing (–18°C) reduced germination<\/b> – store dry at 23°C or cooler, not in the freezer."],["Typical germination","About <b>70%<\/b> after heat treatment (Alcoa nursery average). About <b>211 seedlings per gram<\/b> – roughly 0.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – germinates in cool conditions (tested at 15–20°C). Jun – Aug workable (slower). Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix; very free-draining."],["Pre-treatment","Choose one:<br/>• <b>Dry heat:<\/b> spread seed on a tray in an oven at <b>100°C for 3 hours<\/b> (Geraldton community nursery; Alcoa).<br/>• <b>Aged seed:<\/b> use seed stored at room temperature for a few years.<br/>• <b>Smoke water<\/b> (e.g. 24 h soak at 1:9) – response improves the longer seed has been stored."],["Sowing depth & method","Sow thinly on the surface of trays and cover very lightly, about <b>1–2 mm<\/b> of fine sand or vermiculite."],["After sowing","Water in with a fine spray (smoke water optional). Keep moist but not wet. Protect from snails and slugs."],["Germination time","About <b>3–6 weeks<\/b> (around 20 days in the Geraldton nursery)."],["Pricking out","When the <b>second leaf<\/b> appears and seedlings can be handled (about 2–3 cm). Lift gently with a narrow spatula."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks. Keep foliage dry and airflow good."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Seed still dormant. Heat-treat, use older seed, or add smoke water."],["Black spots spreading on leaves","Ink disease (fungal). Remove affected plants, improve airflow, avoid wetting foliage."],["Seedlings chewed","Snails and slugs. Bait or hand-remove."]],"other":"Division of clumps also works. Seed-grown plants vary slightly; keep local provenance for revegetation.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 3 – Seed quality and germination. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01990.pdf"},{"title":"Seed Science Research – Seed ageing of four Western Australian species in relation to storage environment (incl. A. manglesii)","url":"cambridge.org (Seed Science Research)"},{"title":"AoB PLANTS (2018) – Seed dormancy regulates germination response to smoke and temperature (Anigozanthos)","url":"academic.oup.com/aobpla/article/10/4/ply042/5048955"},{"title":"Wikipedia – Anigozanthos manglesii (cultivation, ink disease)","url":"en.wikipedia.org/wiki/Anigozanthos_manglesii"}]}},{"id":"austrostipa-flavescens","sci":"Austrostipa flavescens","common":"Coast Speargrass","family":"Poaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and genus-level dormancy research; no Alcoa data for this species.","facts":[["Pre-treatment","Smoke water; aged seed"],["Best sowing","Mar – May"],["Sowing depth","0–2 mm"],["Typical germination","Not recorded"]],"calendar":["-","P","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Tufted perennial grass, 0.2–1.2 m."],["Flowering","Sep – Oct."],["Habitat","Grey, red or calcareous sand, sandy loam and limestone; sand dunes."],["Local note","Coastal species. Collect from local-provenance stands and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens in late spring to early summer after flowering. Collect when seed heads turn straw-coloured and seed pulls away easily; it sheds quickly once ripe."],["Extraction & cleaning","Strip seed by hand and dry in paper bags. Long awns can be trimmed to make sowing easier."],["Seed quality","Fresh seed is often dormant (after-ripening needed)."],["Storage life","Store dry at room temperature. <b>Older seed (1–2 years) gives higher germination<\/b> in <i>Austrostipa<\/i> (Geraldton community nursery)."],["Typical germination","No Alcoa data for this species. A related speargrass (<i>A. caespitosa<\/i>) gave 73% after aerosol smoke."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (autumn). Feb and Jun – Aug workable. Avoid Sep – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","• Use seed stored for a year or more, <b>or<\/b><br/>• Water trays with smoke water after sowing (Geraldton method).<br/>• With fresh seed only, gibberellic acid plus smoke water can lift germination."],["Sowing depth & method","<b>Sow very shallowly<\/b> – on or just below the surface (0–2 mm), pressed in lightly. Seed needs light to germinate."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>21 days<\/b> (Geraldton nursery)."],["Pricking out","Prick out or divide small clumps when seedlings are 3–5 cm with several leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination from fresh seed","Dormant. Store seed a year, or use smoke water (and GA if available)."],["Seed buried too deep","Needs light. Sow on the surface and press in."],["Seedlings rot","Overwatering. Keep moist, not wet."]],"other":"Can also be multiplied by dividing established clumps.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]}},{"id":"banksia-attenuata","sci":"Banksia attenuata","common":"Slender Banksia / Candle Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","60%"],["Seed per 100 plants","6.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Lignotuberous tree or shrub, usually 2–4 m (up to 10 m). Resprouts after fire."],["Flowering","Oct – Feb (yellow candles)."],["Habitat","White, yellow, brown or pale red sand, sometimes over laterite; sand dunes and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Highly susceptible to <i>Phytophthora<\/i> dieback – strict hygiene."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles can take a year or more to mature. Collect <b>old, dry, dark grey-brown cones<\/b> with closed follicles. Cones hold seed for some time, so collection isn't tied to one month."],["Extraction & cleaning","Open follicles with heat: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat then soak in water for several hours and dry in a warm oven. Separate the winged black seed from the woody separator. Good seed is white and firm inside. Never microwave cones."],["Seed quality","Seed from older cones tends to have lower viability than from younger cones – favour recent cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Best kept in the cone until the sowing season; extracted seed can remain viable for some years sealed, dry and cool (10–25°C, 40–60% RH)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>15 seedlings per gram<\/b> – roughly 7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Sep workable. Avoid Oct – Feb (heat raises damping-off losses)."],["Seed mix","Free-draining, <b>pathogen-free, low-phosphorus<\/b> mix (pasteurise home-made mix at 60°C for 30 min). Slightly acid (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or sow thinly in deep trays. <b>Just cover<\/b> with fine mix or vermiculite (about 3–5 mm)."],["After sowing","Water in with a fine spray. This species is <b>highly vulnerable to damping off<\/b> – water from below (capillary bed) if possible, or use a registered fungicide at germination (e.g. furalaxyl or captan, as per label)."],["Germination time","About <b>16–49 days<\/b>."],["Pricking out","If tray-sown, prick out <b>at the cotyledon stage, no later than a few weeks after germination<\/b>, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, fungicide at germination, less crowding."],["Yellowing, dying seedlings in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Use very low-P fertiliser; keep pots off the ground."],["Few seeds from cones","Immature or old cones. Collect ripe, recent cones; check follicles have developed."]],"other":"Feed only with half-strength, very low-phosphorus fertiliser once established (Proteaceae are P-sensitive).","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]}},{"id":"banksia-menziesii","sci":"Banksia menziesii","common":"Firewood Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","56%"],["Seed per 100 plants","3.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree or shrub, 1.3–7 m, from a lignotuber. Resprouts after fire."],["Flowering","Feb – Oct, peaking May – Jul (pink, red or yellow)."],["Habitat","White, grey or yellow sand."],["Local note","Recorded in Joondalup and Wanneroo. Medium to high susceptibility to <i>Phytophthora<\/i> dieback."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Up to 25 follicles per cone, each with 1–2 seeds. Follicles open mainly after fire (or release seed after about two years), so collect <b>mature, closed cones<\/b>."],["Extraction & cleaning","Heat cones to open follicles: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat, soak for several hours, then dry in a warm oven. Separate seed from the woody separators."],["Seed quality","Good seed is white and firm with a dark coat. Recent cones generally give better viability than old cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Keep in the cone until needed where possible."],["Typical germination","About <b>56%<\/b> (untreated, Alcoa nursery average). About <b>27 seedlings per gram<\/b> – roughly 3.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>, once the weather cools. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or thinly in deep trays. Just cover (about 3–5 mm)."],["After sowing","Water in with a fine spray; bottom watering where possible. Watch for damping off; fungicide at germination if needed (as per label)."],["Germination time","About <b>26–40 days<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Very low-P feed; strict hygiene; pots off the ground."],["Follicles won't open","Not enough heat. Repeat heating, or heat then soak and re-dry."]],"other":"Takes about five to seven years to flower from seed.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]}},{"id":"banksia-sessilis","sci":"Banksia sessilis","common":"Parrot Bush","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery test data (as <i>Dryandra sessilis<\/i>) and WA seed-handling notes available.","facts":[["Pre-treatment","None (smoke water optional)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","42%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Upright, prickly shrub or small tree to 6 m. Killed by fire and regrows from seed."],["Flowering","Mainly Jul – Nov (cream-yellow domes)."],["Habitat","Sandy soils over laterite or limestone."],["Local note","The Swan Coastal Plain form is var. <i>cygnorum<\/i>. Formerly <i>Dryandra sessilis<\/i>."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Not serotinous: most seed is <b>released in autumn<\/b> even without fire. Collect ripe heads in summer, before release."],["Extraction & cleaning","Put heads in a paper bag in a warm place or a low oven (<b>no hotter than 60°C<\/b>) until the follicles open; cut stubborn follicles with secateurs."],["Seed quality","Good seed is firm and white inside."],["Storage life","Seed in the soil is short-lived, but cleaned seed keeps well <b>stored dry and cool<\/b>."],["Typical germination","About <b>42%<\/b> (untreated, Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b> Geraldton soaks seed in smoke water (1:9) for 24 hours."],["Sowing depth & method","Direct sow 1–2 seeds per tube, just covered (about 3–5 mm)."],["After sowing","Water in; avoid excess water – damping off can be a problem."],["Germination time","About <b>2–6 weeks<\/b> (14 days at Geraldton)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Water less, sterile mix, good airflow."],["Few seeds in heads","Collected too late – seed already released in autumn. Collect in summer."],["Yellowing seedlings","Phosphorus toxicity. Use very low-P fertiliser."]],"other":"Cuttings have proved virtually impossible – seed is the only practical method. Flowers within about two years.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 13 – Dryandra (now Banksia). Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"},{"title":"Wikipedia – Banksia sessilis (seed release, fire response, cuttings)","url":"en.wikipedia.org/wiki/Banksia_sessilis"}]}},{"id":"bossiaea-eriocarpa","sci":"Bossiaea eriocarpa","common":"Common Brown Pea","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (40 tests) and WA hard-seed guidance available.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","44%"],["Seed per 100 plants","0.4 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect or straggly, spreading shrub, 0.2–1 m."],["Flowering","Jul – Nov (yellow and brown-red pea flowers)."],["Habitat","Usually sandy soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and shed seed when ripe. <b>Bag developing pods<\/b> with stockings or muslin."],["Extraction & cleaning","Rub and sieve the small seed from pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps many years when dry (typical of hard-coated pea seed)."],["Typical germination","About <b>44%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>229 seedlings per gram<\/b> – under 0.5 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or pour near-boiling water over and soak overnight. Sow swollen seed; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>2–3 mm<\/b>. Direct sow a few seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet. Keep to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Very small seed for a pea – a little goes a long way.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]}},{"id":"calothamnus-quadrifidus","sci":"Calothamnus quadrifidus","common":"One-sided Bottlebrush","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (39 tests) and WA community-nursery method available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","26%"],["Seed per 100 plants","0.2 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Erect, compact or spreading shrub, usually 0.9–2 m."],["Flowering","Jun – Dec (red, one-sided brushes)."],["Habitat","Wide variety of soils and habitats."],["Local note","Recorded in the Wanneroo LGA. Several subspecies exist – label stock by subspecies and provenance."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Woody capsules stay on the older stems for years. Collect capsules from <b>older wood<\/b> (at least a year old) at any time of year."],["Extraction & cleaning","Place capsules in an open tray or paper bag in a warm spot; fine seed is released in a few days. No need to separate seed from chaff."],["Seed quality","Very fine seed mixed with chaff – a cut-test and count gives seeds per gram."],["Storage life","<b>Long<\/b> if kept dry and cool (typical of capsule-fruited Myrtaceae)."],["Typical germination","About <b>26%<\/b> (untreated, Alcoa nursery average). About <b>572 seedlings per gram<\/b> – a pinch goes a long way."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b> (15–25°C). Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix with a smooth surface."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix seed with dry, sterile yellow sand and sprinkle from a spice jar. <b>Sow on the surface<\/b> and press in lightly; don't bury."],["After sowing","Water in with smoke water (Geraldton method) using a very fine spray, or water from below (bog method) so seed isn't washed away."],["Germination time","About <b>7–10 days<\/b> (Geraldton nursery)."],["Pricking out","When the <b>second pair of leaves<\/b> appears (about 2 cm). Seedlings are tiny – handle by the leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings too crowded","Sown too thickly. Dilute seed well with sand."],["Seed washed into clumps","Overhead watering too coarse. Use a fine mist or bottom watering."],["Damping off","Crowding and wet mix. Thin sowing, airflow, sterile mix."]],"other":"Also grows readily from cuttings if a particular form is wanted.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]}},{"id":"corymbia-calophylla","sci":"Corymbia calophylla","common":"Marri","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (66 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","About 5 mm"],["Typical germination","60%"],["Seed per 100 plants","5.3 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree to 40 m (rarely a mallee), with rough, tessellated bark."],["Flowering","Dec or Jan – May (white or pink)."],["Habitat","Wide range: clay loam, sandy clay, gravel, grey sand over limestone, granite and laterite."],["Local note","Recorded in the Wanneroo LGA. Large urn-shaped gumnuts (‘honky nuts’)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown, woody gumnuts when the valves look ready to open."],["Extraction & cleaning","Keep gumnuts warm and dry in a tray or paper bag until the large winged seed is released."],["Seed quality","Large seed – easy to check by cutting a few open."],["Storage life","<b>Long<\/b> if stored cool and dry (eucalypt seed keeps its viability a long time)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>19 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> A dip in dilute bleach (10%) to surface-sterilise the seed can help."],["Sowing depth & method","Large seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube (preferred) or space out in trays."],["After sowing","Water in; keep moist."],["Germination time","Usually within about <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, avoid crowding."],["Leggy seedlings","Too much shade. Move to brighter light once up."],["Roots circling","Kept too long in tubes. Plant out or pot on sooner."]],"other":"Fast-growing – time sowings so trees aren't held in tubes too long.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]}},{"id":"daviesia-nudiflora","sci":"Daviesia nudiflora","common":"","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data available (small number of tests); method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","22%"],["Seed per 100 plants","1.8 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Shrub, 0.3–1.5 m."],["Flowering","Jun – Sep (orange-yellow and red-brown pea flowers)."],["Habitat","Sandy and clayey soils and laterite; low rises and flats."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and <b>release seed as soon as they are ripe<\/b>. Tie nylon stockings or muslin bags over developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow to remove debris."],["Seed quality","Hard-seeded: nearly all fresh seed is dormant until the seed coat is treated. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea-family seed keeps for many years when dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["Typical germination","About <b>22%<\/b> after boiling-water treatment (Alcoa nursery average, few tests). About <b>57 seedlings per gram<\/b> – roughly 1.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan (heat stress, damping off)."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop seed into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over seed (at least 10 parts water to 1 part seed) and leave to soak overnight. <b>Sow seed that has swollen<\/b>; re-treat seed that hasn't."],["Sowing depth & method","Cover to about twice the seed's thickness, roughly <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet. Sow soon after treatment – don't let swollen seed dry out."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage – early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very low germination","Seed coat not broken. Re-treat unswollen seed; try a dry-heat pulse (80–120°C) on the next batch."],["Swollen seed rots","Mix too wet or seed damaged by overlong boiling. Keep boiling to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow, avoid crowding."]],"other":"Treat with care: boiling water scalds – use tongs, a strainer and heat-proof containers.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]}},{"id":"dianella-revoluta","sci":"Dianella revoluta","common":"Blueberry Lily / Flax Lily","family":"Asphodelaceae (Hemerocallidoideae)","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and dormancy research available; nursery results vary widely.","facts":[["Pre-treatment","GA 24 h + smoke water 24 h"],["Best sowing","Mar – Apr"],["Sowing depth","3–5 mm"],["Typical germination","<1% untreated"]],"calendar":["-","P","B","B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.3–1.5 m."],["Flowering","Sep – Dec (blue-purple), followed by blue berries."],["Habitat","White or yellow sand, sandy clay, laterite, loam and clay."],["Local note","Recorded in Joondalup and Wanneroo (var. <i>divaricata<\/i> is common on the coast)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe, deep-blue berries in summer after flowering."],["Extraction & cleaning","Soak berries in water for a few days, then rub and wash off the pulp in a sieve. Dry the shiny black seed before storing."],["Seed quality","Seed is dormant (morphophysiological dormancy): untreated seed gave under 1% in Alcoa tests."],["Storage life","Not well documented. Store cleaned, dried seed sealed and cool."],["Typical germination","Untreated: <b>under 1%<\/b> (Alcoa, 19 tests). Treated seed does much better – record your own results."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> – seed experiences warm conditions, then germinates as the weather cools (Geraldton: not until late April). Feb and May workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Gibberellic acid<\/b> (1 part per thousand) for 24 hours, then <b>smoke water<\/b> (1:9) for 24 hours (Geraldton method). Research shows warm stratification followed by smoke also breaks dormancy."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow in trays or direct into tubes."],["After sowing","Keep moist and be patient – don't discard trays too early."],["Germination time","About <b>58–75 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves and are large enough to handle."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–7 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Nothing after 6 weeks","Normal – germination takes 8–11 weeks. Keep trays moist."],["No germination at all","Seed still dormant. Use GA + smoke water, or keep trays for a second season."],["Pulp left on seed goes mouldy","Clean seed thoroughly before drying and storing."]],"other":"Division of established clumps is a quicker way to produce plants.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]}},{"id":"eremophila-glabra","sci":"Eremophila glabra","common":"Tar Bush / Common Emu Bush","family":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree most forms strike readily from cuttings.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"calendar":["B","B","B","B","P","-","-","-","-","-","P","P"],"snapshot":[["Habit","Very variable, from prostrate to 3 m. Perth coastal plants are mostly subsp. <i>albicans<\/i>: low, spreading, to about 0.4 m high and 2 m wide, with grey, felty leaves."],["Flowering","Species: Mar – Dec. Subsp. <i>albicans<\/i>: May – Jan. Tubular flowers, yellow, orange, red or green."],["Habitat","Sand and limestone; dunes, sandplains and winter-wet flats, sometimes saline."],["Local note","Recorded in the Wanneroo LGA and along the Perth coast. Several subspecies and many forms – label stock by subspecies and form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, using hardened current season's growth while the weather is warm and plants are mostly out of flower. Nov – Dec and May are workable. Avoid Jun – Oct (cool weather, flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips or side shoots. On grey-leaved forms pick clean foliage with no sign of mould."],["Pre-treatment","• Carefully remove leaves from the lower two-thirds.<br/>• Wound: remove a thin sliver of bark from the base.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>."],["Propagation mix","Very free-draining, sand-based mix."],["Environment","<b>Grey, felty-leaved forms rot under heavy mist or high humidity<\/b> – keep foliage as dry as possible, water the mix, give good airflow. Green-leaved forms tolerate normal misting. Bottom heat speeds rooting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix and grow on in full sun.<br/>• Keep water off grey foliage; water in the morning."]]}],"difficulty_note":"<b>Easy.<\/b> Most forms of <i>E. glabra<\/i> strike readily from cuttings.","problems":[["Leaves blacken or grow grey mould","Too humid. Cut back misting, open the frame, remove affected leaves."],["Base rotting","Mix too wet. Water less often and use a sandier mix."],["Cuttings flower instead of rooting","Use non-flowering shoots and pinch off buds."]],"other":"Seed – unreliable in <i>Eremophila<\/i> (hard fruits, slow and erratic germination). Grafting is used for difficult eremophilas but isn't needed for this species.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra","url":"cottesloecoastcare.org"},{"title":"ANPSA – Eremophila glabra plant profile","url":"anpsa.org.au/plant_profiles/eremophila-glabra/"},{"title":"Australian Bushfoods – The Eremophila Page (cutting length, wounding, hormone)","url":"ausbushfoods.com/bushfoodsonline/reports/Plants/EREMO.TXT"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null},{"id":"eucalyptus-gomphocephala","sci":"Eucalyptus gomphocephala","common":"Tuart","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data (16 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","1–2 mm"],["Typical germination","42%"],["Seed per 100 plants","0.4 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree, 10–40 m."],["Flowering","Jan – Apr (white)."],["Habitat","Sand over limestone on the coastal plain."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown capsules when the valves are just starting to open; many trees hold seed for a year."],["Extraction & cleaning","Keep capsules warm and dry from a day to several weeks until seed drops. Seed is mixed with chaff."],["Seed quality","A cut-test and count on seed and chaff estimates seeds per gram."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>42%<\/b> (untreated, Alcoa nursery average). About <b>228 seedlings per gram<\/b> – under 0.5 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach (10%) can help."],["Sowing depth & method","Mix with dry sand and sprinkle thinly; cover very lightly (about <b>1–2 mm<\/b>)."],["After sowing","Water in with a fine spray (smoke water optional); keep moist."],["Germination time","About <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Thin sowing, sterile mix, airflow."],["Uneven germination","Chaff clumps. Mix seed well with sand."],["Roots circling","Held too long in tubes. Time sowings to planting."]],"other":"Local coastal-plain provenance matters for revegetation – record seed source.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]}},{"id":"eucalyptus-marginata","sci":"Eucalyptus marginata","common":"Jarrah","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (67 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","2–3 mm"],["Typical germination","31%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree to 40 m."],["Flowering","Jun – Dec or Jan (white-cream to pink)."],["Habitat","Grey sand, clay or sandy loam and laterite; hills and rises."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown capsules when the valves look ready to open."],["Extraction & cleaning","Keep capsules warm and dry until seed is released; sieve out large debris."],["Seed quality","Cut-test a sample; seed is mixed with chaff."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>31%<\/b> (untreated, Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach (10%) can help."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube and thin, or sow thinly in trays."],["After sowing","Water in; keep moist."],["Germination time","About <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, avoid crowding."],["Low germination","Old or immature seed. Collect mature capsules; cut-test."],["Roots circling","Held too long in tubes."]],"other":"Jarrah seedlings develop a lignotuber early – a good sign of healthy stock.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]}},{"id":"gompholobium-tomentosum","sci":"Gompholobium tomentosum","common":"Hairy Yellow Pea","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data and WA hard-seed guidance available for this species.","facts":[["Pre-treatment","Dry heat or hot water"],["Best sowing","Mar – May"],["Sowing depth","3–4 mm"],["Typical germination","34%"],["Seed per 100 plants","0.8 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, often spindly shrub, 0.15–1 m."],["Flowering","Jul – Jan (yellow pea flowers)."],["Habitat","White, grey or yellow sand, sandy clay and lateritic sand; coastal limestone, dunes and plains."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and shed seed when ripe. <b>Bag developing pods<\/b> with stockings or muslin and collect once split."],["Extraction & cleaning","Rub and sieve out the small seed."],["Seed quality","Hard-seeded – almost all fresh seed is dormant until the coat is treated."],["Storage life","<b>Long.<\/b> Keeps for many years when dry (typical of hard-coated pea-family seed)."],["Typical germination","About <b>34%<\/b> after heat treatment (Alcoa nursery average). About <b>125 seedlings per gram<\/b> – roughly 0.8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Either:<br/>• <b>Dry heat shock:<\/b> oven at 80–120°C for 10 min to 1 hour (Alcoa used a dry-heat pulse for this species); or<br/>• <b>Hot water:<\/b> pour near-boiling water over the seed and let it cool in the water (easiest method). Sow seed that has swollen; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>3–4 mm<\/b>. Direct sow a few seeds per tube and thin, or sow thinly in trays."],["After sowing","Water in; keep moist, not wet. Sow promptly after hot-water treatment."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed or switch between heat and hot-water methods."],["Seed rots after sowing","Too wet. Water less and improve drainage."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Spindly habit – tip-pruning young plants can give a fuller tube.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]}},{"id":"grevillea-vestita","sci":"Grevillea vestita","common":"","family":"Proteaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Species-specific propagation information is published and consistent across sources.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Apr"],["Cutting length","80–120 mm"],["Hormone (IBA)","3 g/L IBA"]],"calendar":["B","B","B","B","P","-","-","-","-","-","P","B"],"snapshot":[["Habit","Erect, spreading, prickly shrub, usually 0.5–3 m. Hairy branchlets; lobed leaves with sharp-pointed tips."],["Flowering","Mainly Jun – Nov (white to cream, often pink-tinged, scented). Odd flowers Jan – Apr."],["Habitat","Sandy soils over limestone or granite. Occurs on the Swan Coastal Plain, including the Perth area."],["Local note","Two subspecies exist (subsp. <i>vestita<\/i> and subsp. <i>isopogoides<\/i>). Label stock plants by subspecies and provenance."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Apr<\/b> (late spring to autumn), once the spring flush has firmed and flowering has finished. Nov and May are workable. Avoid Jun – Oct: plants are flowering, new growth is soft and cool weather slows rooting."],["Wood type","<b>Semi-hardwood<\/b> – firm, current season's growth. It should bend about 60° and spring back."],["Cutting size","80–120 mm long with 3–5 nodes. Tip or sub-tip pieces; two cuttings can often be taken from one shoot."],["Selecting material","Healthy, vigorous, <b>non-flowering<\/b> shoots. Skip shoots carrying buds, old woody stems and soft new tips."],["Pre-treatment","• Wear gloves: leaves are prickly and grevillea sap can irritate skin.<br/>• Remove any flowers or buds.<br/>• Strip leaves from the lower half to two-thirds (cut, don't tear the bark).<br/>• Trim remaining lobed leaves by about one-third.<br/>• Wound: remove a thin sliver of bark from the bottom 15–20 mm.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>. If cuttings form a heavy callus but no roots, trim the callus back to clean wood and re-set; try a lower strength on the next batch."],["Propagation mix","Free-draining, low nutrient: about 75–80% washed coarse river sand + 20–25% coir or peat (or a perlite/coir mix)."],["Environment","Humid propagation house or frame in bright shade. Bottom heat with the base of the cutting 5–10°C warmer than the air. Light misting only – the hairy foliage can rot if kept constantly wet."],["Expected strike time","About <b>6–8 weeks<\/b> in warm weather. Slower in the cooler months."],["Post-treatment / aftercare","• Harden off: ~2 weeks with cover closed by day and open at night, then ~2 weeks in shade before full sun.<br/>• Pot on when roots show at the drainage holes, into a <b>low-phosphorus<\/b> native mix.<br/>• Feed only with a low-phosphorus native fertiliser (Proteaceae are phosphorus-sensitive).<br/>• Responds well to pruning – tip-prune young plants for a bushier tube."]]}],"difficulty_note":"<b>Easy.<\/b> Cuttings from firm current season's growth usually strike reliably.","problems":[["Heavy callus, no roots","Trim callus back and re-set. Lower the hormone strength next time."],["Base rotting","Mix too wet or material too soft. Use firmer wood and water less often."],["Leaf yellowing or scorch after potting on","Check phosphorus in the potting mix and fertiliser."]],"other":"Seed – grows reasonably e
