<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cuttings and seed sowing guide for WA native plants, Joondalup nursery. Works offline.">
<meta name="theme-color" content="#2E4A36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Propagation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>try{var t=localStorage.getItem("npg.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Native Plant Propagation Guide</title>
<style>
:root {
  --bg: #F4F7F2;
  --surface: #FFFFFF;
  --surface-2: #EEF3EB;
  --ink: #1F2A22;
  --muted: #5B6B5F;
  --rule: #D5DDD2;
  --brand: #2E4A36;
  --brand-ink: #FFFFFF;
  --leaf: #4F7A5A;
  --leaf-soft: #DCE8D8;
  --focus: #2F6FB0;
  --cal-best: #3E7A4E;
  --cal-best-ink: #FFFFFF;
  --cal-ok: #C4DDBC;
  --cal-ok-ink: #24452E;
  --cal-no: #ECEFEA;
  --cal-no-ink: #9AA59C;
  --d-easy: #3F7F4A;
  --d-easymod: #6B8726;
  --d-mod: #A2740F;
  --d-moddiff: #B0561F;
  --d-diff: #A3382E;
  --s-main: #2E6B3E;
  --s-good: #4F8A48;
  --s-poss: #8A7414;
  --s-diff: #B0561F;
  --warn-bg: #FFF4DB;
  --warn-ink: #6A4A00;
  --shadow: 0 1px 2px rgba(31, 42, 34, .08), 0 2px 8px rgba(31, 42, 34, .06);
  --radius: 12px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
    --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
    --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
    --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
    --s-main: #3F8A52; --s-good: #5E9A57; --s-poss: #9C8526; --s-diff: #C4692F;
    --warn-bg: #3A3016; --warn-ink: #F2D993;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221C; --surface-2: #202B24; --ink: #E3EBE4; --muted: #9EB0A3; --rule: #2E3B32;
  --brand: #1F3326; --brand-ink: #E9F2EA; --leaf: #86BC93; --leaf-soft: #2A3C30; --focus: #7FB2E8;
  --cal-best: #4E9361; --cal-best-ink: #FFFFFF; --cal-ok: #2F4A37; --cal-ok-ink: #CFE6D2; --cal-no: #1D2620; --cal-no-ink: #56655A;
  --d-easy: #4E9A5B; --d-easymod: #7F9C35; --d-mod: #B98A22; --d-moddiff: #C4692F; --d-diff: #BD4A3F;
  --s-main: #3F8A52; --s-good: #5E9A57; --s-poss: #9C8526; --s-diff: #C4692F;
  --warn-bg: #3A3016; --warn-ink: #F2D993;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
i, em { font-style: italic; }
a { color: var(--leaf); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding-block: 10px; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { font-size: .8rem; opacity: .8; font-weight: 500; display: block; }
.icon-btn {
  background: transparent; border: 0; color: inherit; width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 24px; height: 24px; }

.update-bar {
  background: var(--warn-bg); color: var(--warn-ink); padding-block: 10px; padding-inline: 16px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: .95rem;
}
.update-bar button { background: var(--warn-ink); color: var(--warn-bg); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

/* ---------- main ---------- */
main {
  padding-inline: 16px; padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  max-width: 760px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
}
.view-title { font-size: 1.45rem; font-weight: 750; }
.lede { color: var(--muted); margin: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; }
.count { color: var(--muted); font-size: .85rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- bottom nav ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.tabbar button {
  background: none; border: 0; min-height: var(--nav-h); padding: 6px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: .72rem; font-weight: 600;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--leaf); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.4; }

/* ---------- controls ---------- */
.month-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month-strip button {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; min-height: 44px;
  font-weight: 650; cursor: pointer; font-size: .92rem;
}
.month-strip button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.month-strip button.is-now { box-shadow: inset 0 -3px 0 var(--leaf); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  flex: 1; border: 0; background: transparent; min-height: 42px; border-radius: 9px; font-weight: 650; cursor: pointer; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface);
  padding-inline: 14px 14px; font-size: 1rem;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding-inline: 18px;
  border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--d-diff); border-color: var(--d-diff); }
.btn.danger.armed { background: var(--d-diff); color: #fff; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- lists ---------- */
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--rule); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px;
  width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit;
}
.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sci { font-style: italic; font-weight: 700; }
.common { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chev { color: var(--muted); flex: none; }
.letter { background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 700; padding: 4px 14px; letter-spacing: .06em; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700;
  color: #fff; white-space: nowrap; line-height: 1.6;
}
.chip.neutral { background: var(--surface-2); color: var(--ink); }
.chip.best { background: var(--cal-best); color: var(--cal-best-ink); }
.chip.ok { background: var(--cal-ok); color: var(--cal-ok-ink); }
.d-easy { background: var(--d-easy); } .d-easymod { background: var(--d-easymod); } .d-mod { background: var(--d-mod); }
.d-moddiff { background: var(--d-moddiff); } .d-diff { background: var(--d-diff); }
.s-main { background: var(--s-main); } .s-good { background: var(--s-good); } .s-poss { background: var(--s-poss); }
.s-diff { background: var(--s-diff); } .s-none { background: var(--surface-2); color: var(--muted); }
.empty { color: var(--muted); padding: 16px; text-align: center; background: var(--surface); border-radius: var(--radius); }

/* ---------- species detail ---------- */
.sp-head { background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.sp-head h2 { font-size: 1.55rem; font-style: italic; font-weight: 750; }
.sp-head .common { color: var(--brand-ink); opacity: .85; font-size: .98rem; }
.sp-head .fam { font-size: .82rem; opacity: .75; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.fact .k { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fact .v { font-weight: 700; }
.fact.diff { color: #fff; }
.fact.d-easy { background: var(--d-easy); } .fact.d-easymod { background: var(--d-easymod); } .fact.d-mod { background: var(--d-mod); }
.fact.d-moddiff { background: var(--d-moddiff); } .fact.d-diff { background: var(--d-diff); }
.fact.diff .k { color: rgba(255,255,255,.85); }
.cal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 6px; }
.cal div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .75rem; font-weight: 700; color: var(--muted); }
.cal span { display: grid; place-items: center; width: 100%; height: 32px; border-radius: 7px; font-size: .78rem; }
.cal .B { background: var(--cal-best); color: var(--cal-best-ink); }
.cal .P { background: var(--cal-ok); color: var(--cal-ok-ink); }
.cal .N { background: var(--cal-no); color: var(--cal-no-ink); }
.cal .now span { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 1.02rem; font-weight: 700; color: var(--leaf); }
.dl { display: flex; flex-direction: column; }
.dl > div { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.dl > div:first-child { border-top: 0; padding-top: 0; }
.dl dt { font-weight: 700; font-size: .86rem; color: var(--muted); }
.dl dd { margin: 0; }
.note { font-size: .88rem; color: var(--muted); margin: 0; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.sources, .dl dd, .mrow .kv { overflow-wrap: anywhere; }
.sources { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.back { align-self: flex-start; }

/* propagation options on a species page */
.opt { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 4px 10px; padding-block: 10px; border-top: 1px solid var(--rule); align-items: center; }
.opt:first-child { border-top: 0; padding-top: 0; }
.opt .m { font-weight: 700; }
.opt .chip { justify-self: start; }
.opt .n { grid-column: 2; font-size: .92rem; }
.opt .here { grid-column: 2; font-size: .8rem; font-weight: 700; color: var(--leaf); }
.opt .go { grid-column: 2; justify-self: start; border: 0; background: none; padding: 4px 0; min-height: 32px; color: var(--leaf);
  font-weight: 700; font-size: .9rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* methods: table rows rendered as stacked items */
.mrow { padding-block: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.mrow:first-child { border-top: 0; padding-top: 0; }
.mrow .t { font-weight: 700; }
.mrow .kv { font-size: .92rem; }
.mrow .kv b.lbl { color: var(--muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; display: block; }

/* ---------- records ---------- */
form.card label { font-weight: 650; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
form.card input, form.card select, form.card textarea {
  min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); padding: 8px 12px; width: 100%;
}
form.card textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.radio-row { display: flex; gap: 8px; }
.radio-row label { flex: 1; flex-direction: row !important; align-items: center; justify-content: center; gap: 8px !important;
  border: 1px solid var(--rule); border-radius: 10px; min-height: 46px; cursor: pointer; background: var(--bg); }
.radio-row input { width: auto !important; min-height: 0 !important; accent-color: var(--leaf); }
.result { font-weight: 750; font-size: 1.05rem; }
.rec { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.rec:hover { background: var(--surface-2); }
.rec .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.rec .meta { color: var(--muted); font-size: .86rem; }
.pct { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 650; z-index: 40; max-width: calc(100% - 32px);
}
.about p { margin: 0; }
.about ol, .about ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- species notes ---------- */
.nlist { display: flex; flex-direction: column; }
.nitem { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule);
  padding: 10px 0; color: inherit; cursor: pointer; font: inherit; }
.nitem:first-child { border-top: 0; padding-top: 0; }
.nitem .meta, .rec .meta { color: var(--muted); font-size: .82rem; }
.ntext { font-size: .92rem; color: var(--ink); overflow-wrap: anywhere; }
.rec .ntext { color: var(--muted); }
.filter select { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); padding: 8px 12px; color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- photos ---------- */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ph { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ph button { padding: 0; border: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; cursor: zoom-in; aspect-ratio: 1 / 1; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph figcaption { font-size: .72rem; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 9, .92); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.lightbox img { max-width: 100%; max-height: 70vh; border-radius: 10px; object-fit: contain; }
.lightbox .lb-cap { color: #E3EBE4; font-size: .88rem; text-align: center; overflow-wrap: anywhere; }
.lightbox .btn { background: #19221C; color: #E3EBE4; border-color: #2E3B32; }
.lightbox .btn.primary { background: #4F7A5A; border-color: #4F7A5A; color: #fff; }
@media (min-width: 620px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- cutting ruler ---------- */
.fact .rbtn { margin-top: 6px; align-self: flex-start; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; min-height: 34px; font-weight: 700; font-size: .85rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn svg, .rbtn svg { width: 18px; height: 18px; }
.ruler { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); width: 68px; z-index: 60;
  background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: 0 0 0 1px var(--rule), 0 2px 12px rgba(0,0,0,.18);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.ruler.right { right: 0; } .ruler.left { left: 0; }
.ruler svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ruler .t { stroke: var(--ink); stroke-width: 1; }
.ruler .t5 { stroke: var(--ink); stroke-width: 1.3; }
.ruler .t10 { stroke: var(--ink); stroke-width: 1.8; }
.ruler .zero { stroke: var(--d-diff); stroke-width: 2.5; }
.ruler .lbl { fill: var(--ink); font: 700 12px system-ui, sans-serif; }
.ruler .lbl0 { fill: var(--d-diff); font: 800 12px system-ui, sans-serif; }
.ruler .rg { fill: var(--cal-best); opacity: .35; }
.ruler .rge { stroke: var(--cal-best); stroke-width: 3; }
.ruler-marker { position: fixed; left: 0; right: 0; height: 0; border-top: 2px solid var(--focus); z-index: 59; pointer-events: none; }
.ruler-marker > span { position: absolute; top: -34px; padding: 4px 10px; border-radius: 8px; background: var(--ink); color: var(--bg);
  font-weight: 800; font-size: .95rem; white-space: nowrap; }
.ruler-marker.right > span { right: 80px; } .ruler-marker.left > span { left: 80px; }
.ruler-marker i { font-style: normal; } .ruler-marker .ok { color: #9BE3A9; } .ruler-marker .no { color: #FFC1A8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ruler-marker .ok { color: #1E6B35; } :root:not([data-theme="light"]) .ruler-marker .no { color: #9E3517; } }
:root[data-theme="dark"] .ruler-marker .ok { color: #1E6B35; } :root[data-theme="dark"] .ruler-marker .no { color: #9E3517; }
.ruler-bar { position: fixed; z-index: 61; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow), 0 0 0 1px var(--rule); padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px; width: calc(100% - 68px - 24px); max-width: 420px; }
.ruler-bar.right { left: 12px; } .ruler-bar.left { right: 12px; }
.ruler-bar .aim { font-weight: 750; }
.ruler-bar .aim b { color: var(--leaf); }
.ruler-bar .hint { font-size: .82rem; color: var(--muted); }
.ruler-bar .warn { font-size: .85rem; color: var(--warn-ink); background: var(--warn-bg); border-radius: 8px; padding: 6px 8px; }
.ruler-bar .row3 { display: flex; gap: 6px; }

iffusa, Waitzia suaveolens. Added a ‘Propagation options’ table (cuttings, seed, division) to every species page."],["1.3","Sep 2026","Added 13 species: Acacia lasiocarpa, A. pulchella, A. truncata, Eucalyptus decipiens, Gastrolobium capitatum, G. nervosum, Hardenbergia comptoniana, Hovea trisperma, Jacksonia furcellata, J. sericea, J. sternbergiana, Nuytsia floribunda, Templetonia retusa."],["1.4","Sep 2026","Added 7 species: Banksia dallanneyi, B. grandis, B. prionotes, Hakea lissocarpha, H. prostrata, H. trifurcata, Stirlingia latifolia."]],"division":[["1.0","Sep 2026","First edition: Anigozanthos manglesii, Austrostipa flavescens, Dianella revoluta, Spinifex hirsutus, S. longifolius. Includes a list of other species in the Cuttings and Seed guides that can be divided or layered."]]},"species":[{"id":"acacia-lasiocarpa","sci":"Acacia lasiocarpa","common":"Panjang","family":"Fabaceae (Mimosoideae)","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (21 tests) including a treatment trial; WA Acacia seed notes available.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","64%"],["Seed per 100 plants","1.0 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Shrub, 0.15–1.5 (–2.5) m, often spiny. Coastal dune plants are low and compact with few spines."],["Flowering","May – Oct (yellow balls)."],["Habitat","Sandy soils and laterite; winter-wet areas, swamps, coastal dunes and flats."],["Local note","Recorded in Joondalup and Wanneroo (var. <i>lasiocarpa<\/i>). Often short-lived."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods are ripe when they dry, change colour, turn brittle and start to split – and they split quickly. Bag branches with fine mesh, or check plants often as pods brown."],["Extraction & cleaning","Dry pods in paper bags; rub and sieve or winnow out the seed."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Very long.<\/b> Acacia seed can stay viable for 50+ years at room temperature; drying and freezing extend it further."],["Typical germination","About <b>64%<\/b> after boiling-water treatment (Alcoa nursery average, 21 tests). About <b>105 seedlings per gram<\/b> – roughly 1 g of seed per 100 seedlings. In one Alcoa trial, untreated seed gave 31% and 8% against 70% and 94% after a 30 s boil."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> 30 seconds (Alcoa method), or pour boiling water over the seed and leave to stand overnight, then sow the seed that has swollen. A 2-minute boil lowered germination in the Alcoa trial – don't overdo it."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Boiled too long or mix too wet."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Growers report softwood cuttings also work.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA 100 plants","1.3 g"]],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect tree, 5–15 m. Male and female flowers usually on separate trees (dioecious)."],["Flowering","May – Oct. Woody cones up to 40 mm long follow on female trees."],["Habitat","Lateritic soils and white, grey or yellow sand; jarrah forest and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Only female trees bear cones – note which trees you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones mature within about a year of flowering. Collect cones that have turned pale to dark brown <b>with the valves still closed<\/b>. Use secateurs or a pole pruner."],["Extraction & cleaning","Place cones in a paper bag or tray in a warm, dry spot – they open readily and drop the winged seeds (samaras). Sieve off cone debris."],["Seed quality","Many seeds look sound but are empty. <b>Cut-test<\/b> a sample before sowing and discard lots with empty or shrivelled seed."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store dried seed sealed in the fridge, or keep seed in closed cones until the sowing season."],["Typical germination","About <b>37%<\/b> (untreated, Alcoa nursery average). About <b>76 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cooling autumn weather, 15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan (heat)."],["Seed mix","Standard sterile native seed mix (see Standard method)."],["Pre-treatment","<b>None needed.<\/b> Seed becomes sticky (mucilaginous) when wet – mix dry seed with a little dry, sterile yellow sand so it spreads evenly and can be seen."],["Sowing depth & method","Scatter thinly and cover lightly with about <b>2–3 mm<\/b> of fine sand or vermiculite. <b>Direct sowing into tubes or cells<\/b> (a few seeds each, thinned later) reduces losses – sheoak seedlings are prone to damping off after pricking out."],["After sowing","Water in with a fine spray (smoke water is optional – aerosol smoke gave similar results to untreated seed in Alcoa trials). Keep moist, not wet. Watch for damping off."],["Germination time","Seedlings emerge after about <b>2–5 weeks<\/b>."],["Pricking out","If sown in trays, prick out early – once seedlings are about 2–3 cm tall and can be handled – disturbing roots as little as possible."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out or thinning, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, use sterile mix, water from below where possible, direct sow into tubes."],["Very low germination","Seed lot mostly empty. Cut-test before sowing; collect from closed, mature cones."],["Seed clumps together","Mucilage. Mix dry seed with dry sand before sowing; don't pre-soak."]],"other":"Cuttings are rarely used. Seed from several trees keeps genetic diversity in revegetation stock.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; 2–5 weeks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"allocasuarina-humilis","sci":"Allocasuarina humilis","common":"Dwarf Sheoak","family":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and WA seed-handling notes are available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","25%"],["Seed per 100 plants","1.3 g"]],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect or spreading shrub, 0.2–2 m. Dioecious or monoecious."],["Flowering","May – Nov."],["Habitat","Sand (often over laterite), sandy clay and gravel on sandplains and dunes."],["Local note","Widespread in the South West. Collect from local-provenance plants and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect mature brown cones <b>with valves still closed<\/b>, usually within a year of flowering. On dioecious plants only female plants bear cones."],["Extraction & cleaning","Dry cones in a paper bag in a warm, dry place until they open; sieve out the small winged seeds."],["Seed quality","Germination is often low – <b>cut-test<\/b> a sample. Many seeds can be empty."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store sealed in the fridge, or keep in closed cones until needed."],["Typical germination","About <b>25%<\/b> (untreated, Alcoa nursery average). About <b>77 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Mix dry seed with dry, sterile sand for even spreading (seed turns sticky when wet)."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube/cell and thin, or sow thinly in trays. Sow more generously than for <i>A. fraseriana<\/i> to allow for lower germination."],["After sowing","Water in with a fine spray; keep moist, not wet. Good airflow to limit damping off."],["Germination time","About <b>2–5 weeks<\/b>."],["Pricking out","Prick out early, at about 2–3 cm tall, with minimal root disturbance."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, sterile mix, avoid overwatering."],["Very low germination","Empty seed. Cut-test; collect from closed, fully mature cones."],["Seed clumps together","Mix dry seed with dry sand; don't pre-soak."]],"other":"Slower-growing shrub – allow extra time to reach planting size.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; sow generously.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"allocasuarina-lehmanniana","sci":"Allocasuarina lehmanniana","common":"Dune Sheoak","family":"Casuarinaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (3 tests); handling follows the other <i>Allocasuarina<\/i> in this guide.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","19%"],["Seed per 100 plants","0.5 g"]],"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Shrub, 0.5–4 m. Male and female flowers on separate plants (dioecious)."],["Flowering","Sep – Dec (female flowers red)."],["Habitat","Coastal sites and winter-wet areas."],["Local note","Recorded in Joondalup and Wanneroo. Only female plants bear cones – note which plants you collect from."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect mature brown cones <b>with the valves still closed<\/b>, usually within a year of flowering. Use secateurs."],["Extraction & cleaning","Dry cones in a paper bag in a warm, dry spot until they open; sieve out the small winged seeds."],["Seed quality","Many seeds can be empty – <b>cut-test<\/b> a sample before sowing."],["Storage life","<b>Short once released from the cone<\/b> unless kept dry and cool. Store sealed in the fridge, or keep seed in closed cones until needed."],["Typical germination","About <b>19%<\/b> (untreated, Alcoa nursery average, 3 tests). About <b>193 seedlings per gram<\/b> – roughly 0.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (15–25°C). Feb and Jun – Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Mix dry seed with dry, sterile sand for even spreading (seed turns sticky when wet)."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube or cell and thin, or sow thinly in trays."],["After sowing","Water in with a fine spray; keep moist, not wet. Good airflow to limit damping off."],["Germination time","About <b>2–5 weeks<\/b>."],["Pricking out","Prick out early, at about 2–3 cm tall, with minimal root disturbance."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse at soil level","Damping off. Sow thinly, sterile mix, avoid overwatering."],["Very low germination","Empty seed. Cut-test; collect from closed, fully mature cones."],["Seed clumps together","Mix dry seed with dry sand; don't pre-soak."]],"other":"A good choice for damp, low-lying coastal sites. Collect from several female plants to keep genetic diversity.","sources":[{"title":"Cochrane A. (2007) Seed Notes 7 – Allocasuarina. Wildflower Society of WA / DEC Threatened Flora Seed Centre","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01994.pdf"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Rarely used for sheoaks.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; like other sheoaks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"anigozanthos-manglesii","sci":"Anigozanthos manglesii","common":"Red and Green Kangaroo Paw","family":"Haemodoraceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Well researched: dormancy, heat, smoke and storage responses are published.","facts":[["Pre-treatment","Dry heat 100°C 3 h, or aged seed"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","70%"],["Seed per 100 plants","0.5 g"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous perennial herb, 0.2–1.1 m (flower stems). Often short-lived – best treated as a 2–3 year plant."],["Flowering","Aug – Nov (green and red). WA's floral emblem."],["Habitat","White, yellow or grey sand and sandy loam."],["Local note","Recorded in the Wanneroo LGA. Also called Mangles Kangaroo Paw."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens roughly three months after flowering (about Nov – Feb). Collect when capsules dry and brown, before they split and shed."],["Extraction & cleaning","Dry capsules in paper bags; rub and sieve to separate the small seed."],["Seed quality","Fresh seed is strongly dormant – untreated germination can be very low (about 1% in one Alcoa trial)."],["Storage life","<b>Stores well for several years<\/b> dry at room temperature, and germination <b>improves with age<\/b> (after-ripening). Research found <b>freezing (–18°C) reduced germination<\/b> – store dry at 23°C or cooler, not in the freezer."],["Typical germination","About <b>70%<\/b> after heat treatment (Alcoa nursery average). About <b>211 seedlings per gram<\/b> – roughly 0.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – germinates in cool conditions (tested at 15–20°C). Jun – Aug workable (slower). Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix; very free-draining."],["Pre-treatment","Choose one:<br/>• <b>Dry heat:<\/b> spread seed on a tray in an oven at <b>100°C for 3 hours<\/b> (Geraldton community nursery; Alcoa).<br/>• <b>Aged seed:<\/b> use seed stored at room temperature for a few years.<br/>• <b>Smoke water<\/b> (e.g. 24 h soak at 1:9) – response improves the longer seed has been stored."],["Sowing depth & method","Sow thinly on the surface of trays and cover very lightly, about <b>1–2 mm<\/b> of fine sand or vermiculite."],["After sowing","Water in with a fine spray (smoke water optional). Keep moist but not wet. Protect from snails and slugs."],["Germination time","About <b>3–6 weeks<\/b> (around 20 days in the Geraldton nursery)."],["Pricking out","When the <b>second leaf<\/b> appears and seedlings can be handled (about 2–3 cm). Lift gently with a narrow spatula."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks. Keep foliage dry and airflow good."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Almost no germination","Seed still dormant. Heat-treat, use older seed, or add smoke water."],["Black spots spreading on leaves","Ink disease (fungal). Remove affected plants, improve airflow, avoid wetting foliage."],["Seedlings chewed","Snails and slugs. Bait or hand-remove."]],"other":"Division of clumps also works. Seed-grown plants vary slightly; keep local provenance for revegetation.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 3 – Seed quality and germination. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01990.pdf"},{"title":"Seed Science Research – Seed ageing of four Western Australian species in relation to storage environment (incl. A. manglesii)","url":"cambridge.org (Seed Science Research)"},{"title":"AoB PLANTS (2018) – Seed dormancy regulates germination response to smoke and temperature (Anigozanthos)","url":"academic.oup.com/aobpla/article/10/4/ply042/5048955"},{"title":"Wikipedia – Anigozanthos manglesii (cultivation, ink disease)","url":"en.wikipedia.org/wiki/Anigozanthos_manglesii"}]},"division":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"ANPSA publishes a detailed division method for kangaroo paws.","facts":[["Division type","Rhizome clump division"],["Best months","Mar – May"],["Division size","3+ shoots with roots"],["Time to establish","4–6 weeks sheltered"]],"calendar":["-","P","B","B","B","P","-","-","P","P","-","-"],"snapshot":[["Habit","Rhizomatous perennial herb, 0.2–1.1 m (flower stems). Often short-lived – best treated as a 2–3 year plant."],["Flowering","Aug – Nov (green and red). WA's floral emblem."],["Habitat","White, yellow or grey sand and sandy loam."],["Local note","Recorded in the Wanneroo LGA. Less vigorous and shorter-lived than most garden hybrids."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b> – ANPSA says clumps are best divided in autumn, though other times also work. Feb, Jun and Sep – Oct are workable; summer divisions need protection until re-established. Avoid Jul – Aug (cold, wet) and Nov – Jan (heat)."],["Division type","<b>Rhizome clump division<\/b> – the clump is cut into pieces of rhizome, each with leaf shoots and roots."],["Division size","<b>At least three large shoots<\/b> per piece gives the best chance of success (ANPSA). Single-shoot pieces with some roots can work but need a humid glasshouse until new roots form."],["Selecting stock","Vigorous, healthy clumps, ideally in their second year – this species is often short-lived. Don't divide plants with black leaf spotting (ink disease)."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump (or knock it out of its pot) and shake or wash off the mix so you can see the rhizome.<br/>• Cut through the rhizome with a clean, sharp knife.<br/>• Trim damaged roots.<br/>• <b>Cut all leaves back by about one-third<\/b> to reduce water loss (ANPSA)."],["Potting","Pot into a well-drained potting mix with the shoots <b>at the same level as before<\/b> (ANPSA). Don't bury the crown. Water in."],["Environment","Sheltered, shaded spot until new leaf growth is well advanced and roots show at the drainage holes. Small divisions go in a humid house."],["Time to establish","Small divisions need about <b>4–6 weeks<\/b> in humid conditions (ANPSA); larger pieces re-establish in the shelter over a similar time."],["Aftercare","• Harden off gradually – about a week with nights exposed, then a week in a sheltered spot, then into the open.<br/>• Keep foliage dry and airflow good to limit ink disease.<br/>• Pot on once roots fill the pot."]]}],"difficulty_note":"<b>Moderate.<\/b> Kangaroo paws divide well, but this species is shorter-lived than many hybrids, so divide young, healthy clumps. Seed is the main method.","problems":[["Division rots at the base","Too wet, too cold, or planted too deep. Pot at the original level; water less; divide in autumn."],["Black spots spreading on leaves","Ink disease. Discard affected pieces; keep foliage dry; improve airflow."],["Division wilts and dies","Too few roots or leaves not trimmed. Use larger pieces, trim leaves by a third, keep sheltered."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"ANPSA – Kangaroo Paws & Relatives: propagation by division (autumn, 3+ shoots, trim leaves by a third)","url":"anpsa.org.au/genera/kangaroo-paw-family/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Wikipedia – Anigozanthos manglesii (short-lived habit, ink disease)","url":"en.wikipedia.org/wiki/Anigozanthos_manglesii"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Clumping herb – no stems to cut.","guide":null},{"method":"Seed","suitability":"Main method","note":"Dry heat or aged seed; autumn sowing.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Split vigorous clumps into rhizome pieces with shoots and roots.","guide":"division"}]},{"id":"atriplex-isatidea","sci":"Atriplex isatidea","common":"Coast Saltbush","family":"Amaranthaceae (chenopods)","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"No species-specific cutting data. Method follows published results for related saltbushes (<i>A. nummularia<\/i>, <i>A. halimus<\/i>).","facts":[["Wood type","Semi-hardwood tips"],["Best months","Sep – Nov"],["Cutting length","100–150 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[100.0,150.0],"calendar":["P","P","-","-","-","-","-","P","B","B","B","P"],"snapshot":[["Habit","Grey-leaved, spreading shrub, 0.5–2.5 m. Male and female flowers on the same plant."],["Flowering","Mainly Mar – Jun (small, inconspicuous)."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Very salt- and wind-tolerant – a useful dune stabiliser."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b>, in active spring growth (the time recommended for the related Old Man Saltbush). Aug and Dec – Feb are workable. Avoid Mar – Jul (flowering, then cool, slow growth)."],["Wood type","<b>Semi-hardwood terminal (tip) cuttings<\/b> of current season's growth."],["Cutting size","100–150 mm. Terminal cuttings of about 15 cm are used for <i>A. nummularia<\/i>."],["Selecting material","Vigorous, non-flowering tips from healthy plants. Avoid old, woody stems."],["Pre-treatment","• Strip leaves from the lower half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood to semi-hardwood strength (1.5–3 g/L IBA, <b>Clonex Green<\/b> or <b>Purple<\/b>). Related saltbushes root without hormone, so it mainly evens out the batch."],["Propagation mix","Free-draining mix of sand and potting mix."],["Environment","<b>Good ventilation and no mist<\/b> – misting encourages a leaf-spotting fungus on saltbush cuttings (ANBG, <i>A. nummularia<\/i>). Bottom heat helps; keep the mix just moist."],["Expected strike time","Not documented for this species. In one trial, 20 cm unrooted <i>A. halimus<\/i> cuttings with no hormone gave about <b>49% survival at 8 weeks<\/b>. Check from about 4 weeks and record your result."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Water sparingly once established.<br/>• Tip-prune for a bushier tube."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Saltbushes generally strike readily from tip cuttings; the main risk is leaf disease under mist. Seed is the more common nursery method.","problems":[["Leaf spots, leaves dropping","Too humid or misted. Stop misting, open the frame, improve airflow."],["Base rotting","Mix too wet. Use a sandier mix and water less."],["Leggy, pale growth","Not enough light. Grow on in full sun."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (ventilate, avoid mist on cuttings)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (15 cm terminal cuttings in spring)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"},{"title":"Applied Sciences (MDPI, 2025) – Propagation of Atriplex halimus by unrooted cuttings","url":"mdpi.com/2076-3417/15/13/7027"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (3 tests) and a WA community-nursery method are available.","facts":[["Pre-treatment","Soak 4 days; smoke water"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","22%"],["Seed per 100 plants","6.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Grey-leaved, spreading shrub, 0.5–2.5 m. Male and female flowers on the same plant."],["Flowering","Mainly Mar – Jun."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Very salt- and wind-tolerant."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Each seed is enclosed in a pair of papery bracts. Collect the fruiting bracts when they turn dry and straw-coloured and come away easily."],["Extraction & cleaning","Rub off stems and leaves and sieve. Sow the seed still inside its bracts."],["Seed quality","Soaking or washing removes germination inhibitors (salts) from the bracts – the reason for the long soak below."],["Storage life","Not well documented. Store dry and cool. Soaked seed can be dried again and stored until needed (Geraldton community nursery)."],["Typical germination","About <b>22%<\/b> (untreated, Alcoa nursery average, 3 tests). About <b>15 seedlings per gram<\/b> – roughly 6.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Oct is workable (autumn, early winter and spring suit saltbush). Avoid Nov – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Soak for 4 days, changing the water 3 times a day<\/b>, then water in with smoke water (Geraldton method). Presoaked seed germinates faster."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>. Sow thinly in trays, or 2–3 bracts per tube and thin."],["After sowing","Water in with smoke water; keep moist, not wet."],["Germination time","About <b>11–20 days<\/b> (Geraldton nursery). Germinates best in cool conditions."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor, patchy germination","Inhibitors not washed out. Soak the full 4 days with regular water changes."],["Seedlings collapse","Damping off. Thinner sowing, sterile mix, good airflow."],["Leaf spots on young plants","Foliage kept wet. Water the mix, not the leaves; improve airflow."]],"other":"Tip cuttings are a workable alternative (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (wash or soak fruits; sow autumn, early winter or spring)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (seed soaked, sown 1–2 mm deep)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Saltbush cuttings are generally reliable (provisional for this species).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Soak 4 days in changed water, then smoke water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"austrostipa-flavescens","sci":"Austrostipa flavescens","common":"Coast Speargrass","family":"Poaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and genus-level dormancy research; no Alcoa data for this species.","facts":[["Pre-treatment","Smoke water; aged seed"],["Best sowing","Mar – May"],["Sowing depth","0–2 mm"],["Typical germination","Not recorded"]],"calendar":["-","P","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Tufted perennial grass, 0.2–1.2 m."],["Flowering","Sep – Oct."],["Habitat","Grey, red or calcareous sand, sandy loam and limestone; sand dunes."],["Local note","Coastal species. Collect from local-provenance stands and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens in late spring to early summer after flowering. Collect when seed heads turn straw-coloured and seed pulls away easily; it sheds quickly once ripe."],["Extraction & cleaning","Strip seed by hand and dry in paper bags. Long awns can be trimmed to make sowing easier."],["Seed quality","Fresh seed is often dormant (after-ripening needed)."],["Storage life","Store dry at room temperature. <b>Older seed (1–2 years) gives higher germination<\/b> in <i>Austrostipa<\/i> (Geraldton community nursery)."],["Typical germination","No Alcoa data for this species. A related speargrass (<i>A. caespitosa<\/i>) gave 73% after aerosol smoke."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (autumn). Feb and Jun – Aug workable. Avoid Sep – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","• Use seed stored for a year or more, <b>or<\/b><br/>• Water trays with smoke water after sowing (Geraldton method).<br/>• With fresh seed only, gibberellic acid plus smoke water can lift germination."],["Sowing depth & method","<b>Sow very shallowly<\/b> – on or just below the surface (0–2 mm), pressed in lightly. Seed needs light to germinate."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>21 days<\/b> (Geraldton nursery)."],["Pricking out","Prick out or divide small clumps when seedlings are 3–5 cm with several leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination from fresh seed","Dormant. Store seed a year, or use smoke water (and GA if available)."],["Seed buried too deep","Needs light. Sow on the surface and press in."],["Seedlings rot","Overwatering. Keep moist, not wet."]],"other":"Can also be multiplied by dividing established clumps.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"Division of established clumps works for this grass, but no species-specific method is published. Follows general tussock-grass practice – trial protocol.","facts":[["Division type","Tussock division"],["Best months","Apr – Jun"],["Division size","Small clumps, 3–5 tillers"],["Time to establish","4–6 weeks"]],"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Tufted perennial grass, 0.2–1.2 m."],["Flowering","Sep – Oct."],["Habitat","Grey, red or calcareous sand, sandy loam and limestone; sand dunes."],["Local note","Coastal species. Use nursery stock plants rather than digging from bushland."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Apr – Jun<\/b>, as autumn rain restarts growth. Mar and Jul are workable. Avoid Aug – Feb (flowering, seed set and summer heat)."],["Division type","<b>Tussock division<\/b> – a clump is split into smaller clumps of shoots (tillers), each with roots."],["Division size","Small clumps of <b>3–5 tillers<\/b> with a good root mass. Very small pieces establish poorly."],["Selecting stock","Healthy, established pot-grown clumps that are actively growing."],["Preparation","• Water the stock plant the day before.<br/>• Knock the clump out and tease or cut it apart with a sharp knife or spade.<br/>• Trim damaged roots.<br/>• Cut the leaves back to about 10–15 cm to reduce water loss."],["Potting","Pot into a free-draining mix at the original depth. Firm in and water well."],["Environment","Shade house until new leaves appear. Keep the mix moist, not wet."],["Time to establish","Roughly <b>4–6 weeks<\/b> in autumn. Record your results."],["Aftercare","• Move gradually to full sun once new growth shows.<br/>• Pot on or plant out in winter."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Grass clumps usually divide readily, but this species hasn't been tested here. Seed is the main method.","problems":[["Divisions brown off","Too small, or roots dried out. Keep 3–5 tillers per piece; work quickly in the shade."],["Base rots","Too wet or planted too deep. Pot at the original level; water less."],["No new growth","Divided in the wrong season. Divide as autumn growth starts."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Tufted grass.","guide":null},{"method":"Seed","suitability":"Main method","note":"Aged seed and smoke water; sow shallow.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Divide established tussocks into small clumps.","guide":"division"}]},{"id":"banksia-attenuata","sci":"Banksia attenuata","common":"Slender Banksia / Candle Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","60%"],["Seed per 100 plants","6.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Lignotuberous tree or shrub, usually 2–4 m (up to 10 m). Resprouts after fire."],["Flowering","Oct – Feb (yellow candles)."],["Habitat","White, yellow, brown or pale red sand, sometimes over laterite; sand dunes and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Highly susceptible to <i>Phytophthora<\/i> dieback – strict hygiene."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles can take a year or more to mature. Collect <b>old, dry, dark grey-brown cones<\/b> with closed follicles. Cones hold seed for some time, so collection isn't tied to one month."],["Extraction & cleaning","Open follicles with heat: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat then soak in water for several hours and dry in a warm oven. Separate the winged black seed from the woody separator. Good seed is white and firm inside. Never microwave cones."],["Seed quality","Seed from older cones tends to have lower viability than from younger cones – favour recent cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Best kept in the cone until the sowing season; extracted seed can remain viable for some years sealed, dry and cool (10–25°C, 40–60% RH)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>15 seedlings per gram<\/b> – roughly 7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Sep workable. Avoid Oct – Feb (heat raises damping-off losses)."],["Seed mix","Free-draining, <b>pathogen-free, low-phosphorus<\/b> mix (pasteurise home-made mix at 60°C for 30 min). Slightly acid (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or sow thinly in deep trays. <b>Just cover<\/b> with fine mix or vermiculite (about 3–5 mm)."],["After sowing","Water in with a fine spray. This species is <b>highly vulnerable to damping off<\/b> – water from below (capillary bed) if possible, or use a registered fungicide at germination (e.g. furalaxyl or captan, as per label)."],["Germination time","About <b>16–49 days<\/b>."],["Pricking out","If tray-sown, prick out <b>at the cotyledon stage, no later than a few weeks after germination<\/b>, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, fungicide at germination, less crowding."],["Yellowing, dying seedlings in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Use very low-P fertiliser; keep pots off the ground."],["Few seeds from cones","Immature or old cones. Collect ripe, recent cones; check follicles have developed."]],"other":"Feed only with half-strength, very low-phosphorus fertiliser once established (Proteaceae are P-sensitive).","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Banksias are rarely grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Extract from cones; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree / shrub.","guide":null}]},{"id":"banksia-dallanneyi","sci":"Banksia dallanneyi","common":"Couch Honeypot","family":"Proteaceae","alt":"Previously <i>Dryandra lindleyana<\/i>","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (23 tests) and WA <i>Dryandra<\/i> seed notes available.","facts":[["Pre-treatment","None (warm fruit to release)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","37%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Low, lignotuberous shrub to 0.5 m, often prostrate and spreading by underground stems."],["Flowering","May – Oct (cream, yellow-brown or pink honeypot heads at ground level)."],["Habitat","Sand or sandy loam, laterite, granite, limestone; flats and rises."],["Local note","Recorded in the Wanneroo LGA (subsp. <i>dallanneyi<\/i> var. <i>dallanneyi<\/i> on the Swan Coastal Plain). Label seed by subspecies – there are five."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles turn dark brown or black when ripe. Collect whole heads, checking for insect and bird damage."],["Extraction & cleaning","Warm the heads in a paper bag – a low oven (<b>no more than 60°C<\/b>) or a car dashboard – until the follicles open. Separate the winged seed from the woody separators."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Long<\/b> – seed stays viable for many years stored dry and cool."],["Typical germination","About <b>37%<\/b> (Alcoa nursery average, 23 tests, fruit warmed to release seed). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings. Many dryandras can reach close to 100% with good seed."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb (heat and damping off)."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> once the seed is out of the follicle."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in; keep moist, not wet. Water from below if you can – damping off is the main risk."],["Germination time","Several weeks to several months – keep trays going."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, good airflow."],["Yellowing seedlings","Phosphorus toxicity or <i>Phytophthora<\/i>. Very low-P feed; pots off the ground."],["Few seeds from heads","Insect-damaged or immature heads. Collect dark, ripe follicles."]],"other":"One of the more reliable dryandras in cultivation. ANPSA notes cuttings are also successful.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 13 – Dryandra (now Banksia). Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"},{"title":"ANPSA – Banksia dallanneyi (syn. Dryandra lindleyana) profile","url":"anpsa.org.au/plant_profiles/banksia-dallanneyi-syn-dryandra-lindleyana/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"ANPSA reports cuttings are successful; no details.","guide":null},{"method":"Seed","suitability":"Main method","note":"Warm heads to release seed; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Spreads by underground stems; not documented as a method.","guide":null}]},{"id":"banksia-grandis","sci":"Banksia grandis","common":"Bull Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (54 tests) and Banksia seed-handling guidance available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","78%"],["Seed per 100 plants","7.4 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree, 1.5–10 m (a shrub on the south coast), with huge, deeply lobed leaves."],["Flowering","Sep – Dec or Jan (yellow-green spikes)."],["Habitat","White or grey sand and laterite."],["Local note","Recorded in the Wanneroo LGA. <b>Very phosphorus-sensitive<\/b> and susceptible to <i>Phytophthora<\/i> dieback."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Unlike many banksias, the follicles <b>open as they mature<\/b> without fire. Tie old stockings or muslin over maturing cones, or collect cones just before the follicles split."],["Extraction & cleaning","Dry cones in a warm spot; if follicles stay shut, oven at <b>120–130°C for 1 hour<\/b>. Separate the winged seed from the separators."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool."],["Typical germination","About <b>78%<\/b> (untreated, Alcoa nursery average, 54 tests). About <b>14 seedlings per gram<\/b> – roughly 7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (about 20–25°C). Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> – reliable without treatment (ANPSA)."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in. Water from below if possible; watch closely for damping off."],["Germination time","About <b>3–6 weeks<\/b> (22–42 days reported)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing. Slow to flower – many years from seed."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or dieback. No P in feed; strict hygiene; pots off the ground."],["Empty follicles","Cones collected too early. Wait until follicles are fully developed."]],"other":"Cuttings are slow and unreliable – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"ANPSA – Banksia grandis profile (reliable from seed; slow cuttings; slow to flower)","url":"anpsa.org.au/plant_profiles/banksia-grandis/"},{"title":"Wikipedia – Banksia grandis and Banksia prionotes (seed release, germination times)","url":"en.wikipedia.org"},{"title":"Lambers H. et al. (2013) Conservation Physiology – phosphorus sensitivity and Phytophthora in Banksia grandis","url":"academic.oup.com/conphys/article/1/1/cot010/361663"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Slow to strike, well under 100% success.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 78% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"banksia-menziesii","sci":"Banksia menziesii","common":"Firewood Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","56%"],["Seed per 100 plants","3.7 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree or shrub, 1.3–7 m, from a lignotuber. Resprouts after fire."],["Flowering","Feb – Oct, peaking May – Jul (pink, red or yellow)."],["Habitat","White, grey or yellow sand."],["Local note","Recorded in Joondalup and Wanneroo. Medium to high susceptibility to <i>Phytophthora<\/i> dieback."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Up to 25 follicles per cone, each with 1–2 seeds. Follicles open mainly after fire (or release seed after about two years), so collect <b>mature, closed cones<\/b>."],["Extraction & cleaning","Heat cones to open follicles: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat, soak for several hours, then dry in a warm oven. Separate seed from the woody separators."],["Seed quality","Good seed is white and firm with a dark coat. Recent cones generally give better viability than old cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Keep in the cone until needed where possible."],["Typical germination","About <b>56%<\/b> (untreated, Alcoa nursery average). About <b>27 seedlings per gram<\/b> – roughly 3.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>, once the weather cools. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or thinly in deep trays. Just cover (about 3–5 mm)."],["After sowing","Water in with a fine spray; bottom watering where possible. Watch for damping off; fungicide at germination if needed (as per label)."],["Germination time","About <b>26–40 days<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Very low-P feed; strict hygiene; pots off the ground."],["Follicles won't open","Not enough heat. Repeat heating, or heat then soak and re-dry."]],"other":"Takes about five to seven years to flower from seed.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: s
