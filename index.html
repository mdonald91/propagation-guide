ower nodes; cut remaining leaflets back by about half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on promptly – runners tangle across the bench. Trim runners to keep tubes tidy."]]}],"difficulty_note":"<b>Easy–Moderate.<\/b> Cuttings of firm growth strike well. Seed is quick and is the usual nursery method.","problems":[["Cuttings wilt and collapse","Material too soft. Use firmer runners and keep humidity up."],["Runners tangled between tubes","Space tubes out and trim runners regularly."],["Base rotting","Mix too wet. Water less, improve drainage."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Kennedia prostrata profile (cuttings of firm current season's growth)","url":"anpsa.org.au/plant_profiles/kennedia-prostrata/"}]},"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data, WA community-nursery method and ANPSA notes agree.","facts":[["Pre-treatment","Hot water + smoke water"],["Best sowing","Mar – May"],["Sowing depth","About 5 mm"],["Typical germination","30%"],["Seed per 100 plants","8.3 g"]],"check":[7,14],"stats":{"germ_pct":30,"per_gram":12},"grow":[3.0,4.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Prostrate or twining groundcover, spreading to about 2.5 m."],["Flowering","Apr – Nov (red pea flowers)."],["Habitat","Usually sandy, gravelly soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods (about 50 mm) ripen in late spring to summer and split when ripe – bag them or collect as they turn brown."],["Extraction & cleaning","Dry pods in paper bags and collect the seed."],["Seed quality","Impervious seed coat – dormant until treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Seed maintains viability for extended periods."],["Typical germination","About <b>30%<\/b> after dry heat (100°C, 3 h; Alcoa). About <b>12 seedlings per gram<\/b> – roughly 8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer water at 95°C for 2 minutes, pour over the seed (at least 10:1 water to seed) and soak 24 hours, then soak 24 hours in smoke water (Geraldton method). Alternatives: boiling water, abrasion, or dry heat 100°C for 3 hours."],["Sowing depth & method","Larger seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>8 days<\/b> (Geraldton nursery)."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Runners tangle in the nursery","Space tubes out; trim runners before dispatch."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Cuttings of firm current season's growth also strike well.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"ANPSA – Kennedia prostrata profile","url":"anpsa.org.au/plant_profiles/kennedia-prostrata/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Firm current season's growth strikes well.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Hot water + smoke water; about 8 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect pods as they turn brown, or bag them – they split when ripe."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Black, kidney-shaped seed with a large pale-yellow aril; 5–8 per hairy pod.","size":"2.5–4 mm long, about 1.5 mm wide","tell":"Collect pods turning from purple-red to brown that hold dark, hard seed. Dry under paper (they pop), rub and sieve. Seed is hard-coated.","level":"species","d":{"shape":"kidney","L":3,"W":1.6,"col":"black","aril":"yellow"},"sources":[["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"]],"photos":[],"sosa":true}},{"id":"lechenaultia-linarioides","sci":"Lechenaultia linarioides","common":"Yellow Leschenaultia","family":"Goodeniaceae","fam":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species-specific cutting data found. Based on the genus, whose cuttings strike very easily.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[28,42],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Sprawling, open shrub to 1.5 m, with narrow, linear leaves."],["Flowering","Can flower in any month. Flowers yellow with red or pink tones, sometimes cream."],["Habitat","Sand (often over limestone) and sandy clay; sandplains, low dunes, ridges and winter-wet flats."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> (late summer to autumn) while it is warm. One grower reports roots in 4–6 weeks from late-February leschenaultia cuttings. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> tips. This species can flower in any month, so check each cutting and remove buds."],["Pre-treatment","• Strip leaves from the lower half (narrow leaves strip easily).<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Very free-draining – leschenaultias dislike wet roots."],["Environment","Humid frame, bottom heat, bright shade. Keep the mix moist, never wet."],["Expected strike time","About <b>4–6 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; water sparingly.<br/>• Tip-prune to counter the sprawling habit."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Lechenaultia<\/i> cuttings generally strike very easily; seed is difficult.","problems":[["Base rotting","Overwatering. Water less often; add coarse sand or perlite to the mix."],["Wilting in the frame","Material too soft or humidity too low. Use slightly firmer tips; keep the frame closed."],["Cuttings flowering","Remove buds; pick vegetative shoots."]],"other":"Seed – slow and unreliable. The Geraldton community nursery soaked seed in smoke water, saw germination at about 46 days, and kept trays for a second year. Division – some leschenaultias sucker; pot up rooted suckers.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Lechenaultia biloba profile (cuttings strike very easily; seed difficult)","url":"anpsa.org.au/plant_profiles/lechenaultia-biloba/"},{"title":"Better Homes and Gardens – fastest and easiest native plants to propagate (leschenaultia timing)","url":"bhg.com.au/how-to-propagate-natives"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Cuttings strike easily in this genus.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Slow; trays may need a second season.","guide":null},{"method":"Division","suitability":"Possible","note":"Some leschenaultias sucker – pot up rooted suckers.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Seed segments of the woody fruit","look":"Each seed sits inside a woody segment of an elongated fruit that breaks into 7–11 pairs of segments (genus).","size":"Not published (fruit 19–33 mm long)","tell":"Not published.","level":"genus","d":null,"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"lepidosperma-gladiatum","sci":"Lepidosperma gladiatum","common":"Coast Sword-sedge","family":"Cyperaceae (sedges)","fam":"Cyperaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"One nursery test (41% untreated) and genus research on dormancy; results vary widely between seed lots.","facts":[["Pre-treatment","None, or heat + smoke (trial)"],["Best sowing","Apr – May"],["Sowing depth","3–5 mm"],["Typical germination","41%"],["Seed per 100 plants","0.3 g"]],"check":[56,70],"stats":{"germ_pct":41,"per_gram":296},"grow":[6.0,9.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","P","B","B","P","P","-","-","-","-","-"],"snapshot":[["Habit","Robust, rhizomatous, tufted sedge, 0.5–1.5 (–3) m, clumps to 1.5 m wide. Flat leaves with <b>knife-sharp edges<\/b>."],["Flowering","Nov – Dec or Jan – May (brown)."],["Habitat","White, grey or calcareous sand, limestone and loam; dunes and creeklines."],["Local note","Recorded in the Wanneroo LGA. A strong dune stabiliser. Wear gloves – the leaf edges cut."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed can only be harvested for a <b>few weeks after it ripens<\/b>. Check heads often and collect as the nutlets harden and darken."],["Extraction & cleaning","Rub the heads over a sieve."],["Seed quality","In <i>Lepidosperma<\/i>, 21–77% of nutlets can be empty – cut-test a sample and sow generously."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>41%<\/b> untreated (Alcoa, 1 test), about 296 seedlings per gram. Most <i>Lepidosperma<\/i> seed needs dormancy broken first, so expect big differences between seed lots."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b>. Mar, Jun – Jul workable."],["Seed mix","Free-draining, sterile mix."],["Pre-treatment","Sow untreated first. If a lot won't germinate, <b>trial<\/b> a heat shock (100°C for 10 minutes) followed by smoke water – the best treatment for fresh seed of the related <i>L. scabrum<\/i>."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>, in deep trays."],["After sowing","Keep moist, not wet. Soil disturbance helps germination in the wild."],["Germination time","About <b>53–72 days<\/b> in one study – keep trays going."],["Pricking out","At the first leaf, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 6–9 months (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Dormant or empty seed. Cut-test; trial heat plus smoke."],["Harvested heads are empty","Collected too late – seed had already dropped. Check heads weekly as they ripen."],["Slow growth","Normal. Deep tubes, full sun once established."]],"other":"Division of the crown is also used, and commercial stock is increasingly tissue-cultured (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Barrett R.L. (2013) Annals of Botany 111 – Lepidosperma review (germination 53–72 days in L. gladiatum)","url":"pmc.ncbi.nlm.nih.gov/articles/PMC3605947/"},{"title":"Turner S.R. et al. (2013) Aust. J. Botany 61 – heat shock and smoke break dormancy in Lepidosperma scabrum","url":"connectsci.au/bt/article-abstract/61/8/643/115316/"},{"title":"Kodym A. et al. (2010) Aust. J. Botany – Lepidosperma seed fill and harvest timing","url":"publish.csiro.au/bt/bt09183"}]},"division":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"Crown division is used commercially (a Joondalup-selected form was first propagated this way) but no method or survival data are published. Trial protocol.","facts":[["Division type","Crown (clump) division"],["Best months","Mar – May"],["Division size","Large pieces with rhizome & roots"],["Time to establish","Slow – several weeks"]],"check":[28,56],"calendar":["-","P","B","B","B","P","P","-","-","-","-","-"],"snapshot":[["Habit","Robust, rhizomatous, tufted sedge, 0.5–1.5 (–3) m, clumps to 1.5 m wide. <b>Knife-sharp leaf edges.<\/b>"],["Flowering","Nov – Dec or Jan – May (brown)."],["Habitat","White, grey or calcareous sand, limestone and loam; dunes and creeklines."],["Local note","Recorded in the Wanneroo LGA. Wear heavy gloves and long sleeves when dividing."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b> (trial). Feb, Jun – Jul workable. Avoid Aug – Jan."],["Division type","<b>Crown (clump) division<\/b> of the rhizome."],["Division size","Keep pieces large, with a good section of rhizome and plenty of roots (trial)."],["Selecting stock","Vigorous nursery clumps. Mark any selected forms."],["Preparation","• Water the day before.<br/>• Lift the clump; cut through the tough rhizome with a sharp spade or pruning saw.<br/>• Trim leaves back by about half to cut water loss."],["Potting","Pot into deep pots of free-draining mix at the original depth. Water well."],["Environment","Shade house until new leaves appear."],["Time to establish","Slow – allow several weeks; record the result."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in late autumn or winter."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Used commercially, but untested here. Tissue-cultured stock is also available.","problems":[["Divisions die back","Too few roots or too small. Keep pieces large."],["Hands cut","Leaf edges are sharp – heavy gloves and sleeves."],["Slow establishment","Normal. Be patient; full sun once rooted."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"US Plant Patent PP30,800 – Lepidosperma gladiatum 'LEP01' (first propagated by crown division in Joondalup; tissue culture)","url":"patents.google.com/patent/USPP30800"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Sedge.","guide":null},{"method":"Seed","suitability":"Difficult","note":"Variable; 41% in one test, 53–72 days.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Crown division is used commercially (trial here).","guide":"division"}],"collect":{"cal":["-","-","P","P","P","P","P","-","-","-","-","-"],"basis":"estimate","any":false,"note":"Only a few weeks' window after ripening – check heads often."},"conservation":"","seedid":{"unit":"Nut (the seed)","look":"Narrow egg-shaped, shiny nut, straw-coloured at the tip and brown at the base, with spongy white scales at the base reaching about a third of its length.","size":"3–4 × 1.5–2 mm","tell":"The red-brown hairy glumes are chaff, and the lowest 3–4 glumes of each spikelet are empty – expect about one nut per spikelet. The white scales stay on the nut.","level":"species","d":{"shape":"nutlet","L":3.5,"W":1.75,"col":"brown","tip":"straw","scales":true,"shiny":true},"sources":[["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Flora of South Australia online","https://flora.sa.gov.au"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":true}},{"id":"leucophyta-brownii","sci":"Leucophyta brownii","common":"Cushion Bush","family":"Asteraceae","fam":"Asteraceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"ANBG growing notes say semi-hardened cuttings are the preferred method; timing and details follow general daisy practice.","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May; Sep – Oct"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,75.0],"check":[28,42],"calendar":["-","P","B","B","B","P","-","P","B","B","P","-"],"snapshot":[["Habit","Compact, rounded shrub to about 1 m, densely covered in silvery-white woolly hairs."],["Flowering","Dec or Jan – Feb (small yellow button heads)."],["Habitat","Coastal foredunes and cliffs."],["Local note","Recorded in the Wanneroo LGA. Very salt-tolerant; grows poorly in high humidity."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, after flowering, and <b>Sep – Oct<\/b> as spring growth firms. Feb, Jun, Aug and Nov are workable. Avoid Dec – Jan (flowering and heat) and Jul (cold)."],["Wood type","<b>Semi-hardwood<\/b> – ANBG notes cuttings should come from semi-hardened branches."],["Cutting size","50–75 mm tip cuttings."],["Selecting material","Non-flowering tips from compact, healthy plants. Avoid soft, sappy growth."],["Pre-treatment","• Rub the small leaves off the lower half.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for firm tips; 3 g/L for firmer material."],["Propagation mix","Very free-draining – add extra coarse sand or perlite."],["Environment","<b>Keep it airy.<\/b> The woolly foliage rots in humidity: use a well-ventilated frame in bright light with little or no mist. Bottom heat helps. Keep the mix only just moist."],["Expected strike time","Not documented – check from about 4 weeks and record the result."],["Post-treatment / aftercare","• Harden off promptly and grow on in full sun.<br/>• Free-draining mix; never let pots sit wet – plants die easily if waterlogged.<br/>• Tip-prune for a dense cushion."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Cuttings are the preferred method; the main risk is rot from too much moisture or humidity.","problems":[["Cuttings turn grey-brown and mushy","Too humid or wet. Reduce mist, open the frame, improve airflow."],["Slow to root in winter","Use bottom heat, or wait for the autumn or spring window."],["Loses its dense shape","Tip-prune young plants."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Leucophyta brownii (semi-hardened cuttings; dislikes humidity)","url":"anbg.gov.au/gnp/interns-2014/leucophyta-brownii.html"},{"title":"ANPSA – Australian Daisies (perennial stem cuttings strike quickly; 3:1 sand:peat mix)","url":"anpsa.org.au/genera/daisies/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"ANBG growing notes give treatment and germination time; no nursery test data.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","Surface – light cover"],["Typical germination","Not recorded"]],"check":[10,30],"stats":{"germ_pct":null,"per_gram":null},"grow":[3.0,4.0],"storage":{"kind":"short","months":6,"text":"Not well documented – sow fresh"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Compact, rounded shrub to about 1 m, densely covered in silvery-white woolly hairs."],["Flowering","Dec or Jan – Feb (small yellow button heads)."],["Habitat","Coastal foredunes and cliffs."],["Local note","Recorded in the Wanneroo LGA. Grows poorly in high humidity and dies easily if waterlogged."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the dry flower heads in late summer, once they turn brown and papery."],["Extraction & cleaning","Rub heads gently over a sieve to free the small seeds."],["Seed quality","Many florets may be empty – sow generously."],["Storage life","Not well documented. Sow in the first autumn after collection."],["Typical germination","Not recorded. ANBG notes seed germinates 10–30 days after sowing."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","<b>None needed<\/b> (ANBG)."],["Sowing depth & method","Surface-sow and cover very lightly with fine sand – daisy-family seed often needs light."],["After sowing","Water in with a fine spray; keep just moist. Good airflow."],["Germination time","About <b>10–30 days<\/b>."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off or too humid. Sow thinly, water less, more airflow."],["Seed buried too deep","Needs light. Surface-sow."],["Plants die in pots","Waterlogging. Very free-draining mix; don't overwater."]],"other":"Semi-hardened cuttings are the preferred method (see the Cuttings Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Australian Daisies (annuals from seed, light, smoke and GA; perennial cuttings)","url":"anpsa.org.au/genera/daisies/"},{"title":"Australian National Botanic Gardens – Leucophyta brownii (no pre-treatment; 10–30 days)","url":"anbg.gov.au/gnp/interns-2014/leucophyta-brownii.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Semi-hardened cuttings are the preferred method.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"No pre-treatment; 10–30 days.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["-","B","B","P","-","-","-","-","-","-","-","-"],"basis":"guide","any":false,"note":"Collect dry flower heads once they turn brown and papery."},"conservation":"","seedid":{"unit":"Achenes with bristles","look":"Tiny cone-shaped achene with 10–13 pappus bristles, from compound flower heads 6–16 mm long. Colour isn't published.","size":"1.2–1.8 mm long","tell":"Not published – the bracts of the flower heads are the chaff.","level":"species","d":{"shape":"achene","L":1.5,"W":0.5,"col":"unknown","pappus":2.5},"sources":[["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"leucopogon-parviflorus","sci":"Leucopogon parviflorus","common":"Coast Beard-heath","family":"Ericaceae","fam":"Ericaceae","alt":"","cuttings":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"Sources agree cuttings strike poorly (low strike, very fine roots); no WA trial data. Treat as a trial protocol and record results.","facts":[["Wood type","Semi-hardwood"],["Best months","Nov – Jan"],["Cutting length","80–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[80.0,100.0],"check":[180,360],"calendar":["B","P","P","P","P","-","-","-","-","-","B","B"],"snapshot":[["Habit","Erect, densely branched shrub or small tree, usually 0.3–3 m (to 5 m)."],["Flowering","Feb – Mar or Jun – Oct (white), followed by round green fruit that turn translucent white when ripe."],["Habitat","Sandy soils over limestone or granite; coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. A frontline coastal shrub that buffers wind; birds and lizards eat the fruit (State Flora SA)."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Jan<\/b> (estimate), once the spring growth has firmed and before the summer heat peaks. Feb – May are workable with non-flowering shoots. Avoid Jun – Oct (main flowering, and cool)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth gives the best results (ANPSA)."],["Cutting size","80–100 mm – the short end of the 80–250 mm range used for epacrid cuttings in Sydney trials (Doig)."],["Selecting material","Non-flowering tips from healthy, vigorous plants. Take plenty – strike rates are low."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone – ANPSA advises using one."],["Rooting hormone","Doig used a medium-strength hormone powder for epacrids; use 3 g/L IBA (<b>Clonex Purple<\/b>) as the equivalent."],["Propagation mix","Very free-draining sand-based cutting mix."],["Environment","Humid frame in bright shade, not heavy mist. Doig got at least 30% strike with epacrids in a cold, non-misting frame. Bottom heat is worth trialling on part of the batch."],["Expected strike time","<b>Slow<\/b> – epacrid cuttings were held for 6–12 months in trials. Check from about 8 weeks and record the result."],["Post-treatment / aftercare","• The roots are <b>very fine and easily damaged<\/b> (Tasmania) – pot up with the mix ball intact; don't tease the roots.<br/>• Harden off slowly; keep potted plants in light shade at first."]]}],"difficulty_note":"<b>Difficult (provisional).<\/b> ANPSA calls cuttings unreliable, and Tasmanian growers report low strike rates even though cuttings are their usual method.","problems":[["Cuttings sit for months without roots","Normal for epacrids. Keep them going; try bottom heat or a different month on the next batch."],["Roots break when potting up","Pot up before roots fill the cell, and move the whole plug without disturbing it."],["Cuttings blacken or rot","Too wet or humid. Less mist, better drainage and airflow."]],"other":"Seed – difficult (dormant stones). South Australian trials reached 80–100% with special treatments; see the Seed Sowing Guide.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Leucopogon parviflorus profile (cuttings unreliable; firm current season's growth and a root-promoting hormone)","url":"anpsa.org.au/?p=11543"},{"title":"Understorey Network (Tasmania) – Leucopogon parviflorus (usually grown from cuttings; low strike; very fine roots)","url":"database.understorey-network.org.au/plant/leucopogon-parviflorus"},{"title":"NZ Plant Conservation Network – Leucopogon parviflorus (semi-hardwood cuttings, slow to strike)","url":"nzpcn.org.nz/flora/species/leucopogon-parviflorus/"},{"title":"Doig – Epacrids from cuttings, ANPSA Australian Plants Online (Dec 1999): half-hardened wood 80–250 mm, medium-strength hormone, cold non-misting frame, 6–12 months","url":"anpsa.org.au/APOL16/dec99-6.html"},{"title":"State Flora SA – coastal garden plants (Leucopogon parviflorus buffers coastal wind; birds and lizards eat the fruit)","url":"stateflora.sa.gov.au/news/coastal-garden-plants"}]},"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No WA nursery data. Method based on South Australian germination trials (Seeds of SA); eastern growers report slow, erratic results.","facts":[["Pre-treatment","Peroxide + smoke water"],["Best sowing","Mar – May"],["Sowing depth","Just covered"],["Typical germination","Not recorded"]],"check":[49,98],"stats":{"germ_pct":null,"per_gram":null},"grow":[9.0,12.0],"storage":{"kind":"unknown","months":24,"text":"Dry & cool; viability varies"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, densely branched shrub or small tree, usually 0.3–3 m (to 5 m)."],["Flowering","Feb – Mar or Jun – Oct (white)."],["Habitat","Sandy soils over limestone or granite; coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Birds and lizards eat the fruit (State Flora SA)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pick fruit that has turned <b>translucent white<\/b> with a hard stone inside – green fruit is unripe. In SA this is Nov – Feb; watch local plants after the spring flowering."],["Extraction & cleaning","Soak overnight, rub off the flesh by hand, rinse, and dry the stones on paper towel (Seeds of SA). The stone – pale yellow, ridged, about 4 mm – is what you sow."],["Seed quality","Viability varies a lot (10–90% in SA seed lots). Cut-test a few stones before a big sowing."],["Storage life","Store dry and cool, in an airtight container with desiccant."],["Typical germination","Not tested in WA nurseries. SA lab trials: <b>100%<\/b> after 15 minutes in 30% hydrogen peroxide then 24 hours in 10% smoke water; <b>80%<\/b> after 2 minutes at 100°C, then 15 minutes in 30% hydrogen peroxide, a rinse and 72 hours in gibberellic acid (1000 mg/L). Cold stratification or peroxide alone gave 0%."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool, moist conditions; the SA trials were incubated at spring/autumn temperatures). Jun – Aug workable."],["Seed mix","Standard sterile native seed mix, very free-draining."],["Pre-treatment","Trial one of the SA treatments on part of the batch: <b>hydrogen peroxide then smoke water<\/b> (the best result), or <b>dry heat, hydrogen peroxide, then gibberellic acid<\/b>. 30% hydrogen peroxide is corrosive – wear gloves and eye protection for both. Untreated seed can still come up slowly, especially sown in soil from under the parent plants (Victoria)."],["Sowing depth & method","Sow the stones and just cover them."],["After sowing","Keep moist, not wet. <b>Keep trays for at least a year<\/b> – don't tip them out early."],["Germination time","First seedlings about <b>7 weeks<\/b> and half by 11 weeks in the SA trials; untreated seed 3–18 months (Tasmania)."],["Pricking out","Early and gently – the roots are very fine and easily damaged."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 9–12 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Nothing comes up for months","Normal for epacrids. Keep the trays going; try the other pre-treatment on the next batch."],["Few seedlings from a big sowing","Low-viability seed lot. Cut-test before sowing; collect only white, ripe fruit."],["Seedlings collapse","Damping off. Sterile mix, airflow, careful watering."]],"other":"Bird-passed seed germinates much better (APS Warrnambool). Cuttings are the other option – see the Cuttings Guide.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"},{"title":"Seeds of South Australia – Leucopogon parviflorus: collection, cleaning, viability and germination trials","url":"seedsofsa.au (read via syzygium.xyz mirror)"},{"title":"Understorey Network (Tasmania) – Leucopogon parviflorus (stratification; germination 3–18 months)","url":"database.understorey-network.org.au/plant/leucopogon-parviflorus"},{"title":"APS Warrnambool – small trees notes (Leucopogon parviflorus: sow in soil from under the parent; bird-passed seed germinates better)","url":"apswarrnambool.org.au"},{"title":"ANPSA – Leucopogon parviflorus profile (seed germination slow and unreliable)","url":"anpsa.org.au/?p=11543"},{"title":"State Flora SA – coastal garden plants (Leucopogon parviflorus: buffers coastal wind; birds and lizards eat the fruit)","url":"stateflora.sa.gov.au/news/coastal-garden-plants"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Low strike and fine roots – trial protocol (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Dormant stones; peroxide + smoke water worked best in SA trials.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"estimate","any":false,"note":"Pick translucent white fruit with a hard stone – green fruit is unripe."},"conservation":"","seedid":{"unit":"Stone (endocarp) – flesh removed","look":"Round, pale yellow to orange-brown woody stone with ridges, from a round fruit about 4.5–5 mm across that turns translucent white when ripe.","size":"To about 4 mm across","tell":"Collect only white fruit with a hard seed – green fruit is unripe. Soak overnight and rub off all the flesh. Viability varies a lot (10–90% in SA seed lots), so cut-test a few stones: firm and white inside is good.","level":"species","d":{"shape":"stone","L":4,"W":3.8,"col":"straw","texture":"ribbed"},"sources":[["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"]],"photos":[],"sosa":true}},{"id":"lomandra-maritima","sci":"Lomandra maritima","common":"Maritime Mat Rush","family":"Asparagaceae (Lomandroideae)","fam":"Asparagaceae","alt":"","cuttings":null,"seed":null,"division":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"No species method published. Follows general <i>Lomandra<\/i> and ANPSA clump-division guidance.","facts":[["Division type","Clump division"],["Best months","Aug – Sep"],["Division size","3–4 shoots with roots"],["Time to establish","4–6 weeks"]],"check":[28,42],"calendar":["-","-","P","P","P","P","P","B","B","P","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial, 0.2–0.6 m, clumps to 0.2 m wide. Male and female plants are separate (dioecious)."],["Flowering","Aug – Nov (purple and yellow)."],["Habitat","White or grey sand and limestone; coastal dunes and hills."],["Local note","Recorded in Joondalup and Wanneroo. A breeding plant for the threatened graceful sun-moth."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Aug – Sep<\/b> – late winter to early spring is usually best for lomandras. Mar – Jul and Oct are workable. Avoid Nov – Feb."],["Division type","<b>Clump division.<\/b>"],["Division size","Three or four shoots with a piece of rhizome and healthy roots (ANPSA general guidance)."],["Selecting stock","Vigorous nursery clumps. Plants are male or female – label stock plants when they flower so plantings include both."],["Preparation","• Water the day before.<br/>• Lift the clump and cut it apart with a sharp knife.<br/>• Trim the leaves back to about a third of their length."],["Potting","Pot into a free-draining mix at the original depth."],["Environment","Sheltered, shaded spot until new growth starts."],["Time to establish","About <b>4–6 weeks<\/b> (record yours)."],["Aftercare","• Harden off gradually.<br/>• Pot on once roots fill the pot."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Lomandras generally divide well; untested for this species.","problems":[["Divisions wilt","Leaves not trimmed or too few roots. Trim harder; use bigger pieces."],["Base rots","Too wet or planted too deep."],["All plants one sex","Stock came from a single plant. Divide from several labelled male and female plants."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Ozbreed – How to divide Lomandras (late winter to early spring; trim leaves)","url":"ozbreed.com.au/how-to-divide-lomandras/"},{"title":"Cottesloe Coastcare Association – Lomandra maritima (separate male and female plants)","url":"cottesloecoastcare.org/lomandra-maritima/"},{"title":"DBCA Library – graceful sun-moth breeds on Lomandra maritima and L. hermaphrodita","url":"library.dbca.wa.gov.au/static/Journals/080525/080525-41.pdf"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Tufted herb.","guide":null},{"method":"Seed","suitability":"Difficult","note":"Lomandra seed is strongly dormant; not documented for this species.","guide":null},{"method":"Division","suitability":"Main method","note":"Clump division, late winter to early spring (provisional).","guide":"division"}],"collect":null,"conservation":"","seedid":{"unit":"Seed","look":"Round to ellipsoid seed, brown, orange or reddish (genus).","size":"Not published","tell":"Collect fruits turning brown with a hard seed inside; dry, rub and sieve (related species).","level":"genus","d":{"shape":"round","L":null,"W":null,"col":"orangebrown"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"macrozamia-fraseri","sci":"Macrozamia fraseri","common":"Sandplain Zamia","family":"Zamiaceae (cycads)","fam":"Zamiaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific seed storage and germination research published in 2023. Germination figure is from the related <i>M. riedlei<\/i>.","facts":[["Pre-treatment","Remove fleshy coat; float test"],["Best sowing","Feb – Mar (fresh seed)"],["Sowing depth","Surface"],["Typical germination","~34% (related M. riedlei)"]],"check":[360,720],"stats":{"germ_pct":null,"per_gram":null},"grow":[12.0,24.0],"storage":{"kind":"short","months":6,"text":"Short – sow fresh; don't cold-store"},"calendar":["P","B","B","P","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Cycad with a trunk that can exceed 1 m. Male and female cones on separate plants (dioecious)."],["Flowering","Cones, not flowers. Seeds with a bright red fleshy coat are shed in late summer to early autumn."],["Habitat","Sand, in heath. Swan Coastal Plain and Geraldton Sandplains."],["Local note","Recorded in the Wanneroo LGA. <b>All parts, especially the seeds, are poisonous<\/b> – wear gloves, wash hands, and keep seed away from pets and stock."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fallen seed, or seed from cones as they break apart, in <b>late summer to early autumn<\/b> (February in the 2023 study)."],["Extraction & cleaning","Remove the red fleshy coat (sarcotesta). Researchers used a cement mixer with water and 10–30 mm aggregate; small lots can be scrubbed by hand in gloves."],["Seed quality","<b>Float test:<\/b> soak in water for about 5 minutes – seeds that sink are viable; floaters are dead."],["Storage life","<b>Short – sow fresh.<\/b> Seeds are shed moist (about 46% moisture) with an unfinished embryo. Standard cold, dry seed-bank storage (5°C, ~20% RH) damages them: viability was still over 50% at about 6 months but fell to 0–29% after 30+ months."],["Typical germination","No figure for this species. The related <i>M. riedlei<\/i> averaged about <b>34%<\/b> untreated in Alcoa tests (10 tests). Seeds are large – sow individually."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>As soon as seed is cleaned<\/b> – usually Feb – Mar. Jan and Apr – May are workable."],["Seed mix","Coarse, free-draining, sand-based mix in <b>deep containers<\/b> – cycads have a long root."],["Pre-treatment","None beyond removing the fleshy coat and float testing."],["Sowing depth & method","<b>Surface-sow:<\/b> lay seeds on the mix and press them in slightly; don't bury. Sow one seed per deep tube or pot, or in deep trays."],["After sowing","Keep outdoors under natural temperatures and rainfall, as the researchers recommend. Water lightly in dry spells – avoid heavy irrigation."],["Germination time","Slow. The embryo keeps developing after the seed falls; the first root appears after about 5 months and full germination takes <b>more than 12 months<\/b>."],["Pricking out","Avoid if possible – sow direct into deep containers. If tray-sown, pot each seed on once its root appears, keeping the root intact."],["Shade house & hardening","Grow on in light shade and harden off to full sun over several weeks once the first leaf is firm."],["Time to planting size","Very slow – allow 1–2 years or more from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seed rots","Too wet, or damaged when the fleshy coat was removed. Water lightly; handle gently."],["No sign of life after 6 months","Normal – germination takes over a year. Keep trays going."],["Poor results from stored seed","Seed dried or cold-stored. Sow fresh, within a few months of collection."]],"other":"Poisonous: label trays clearly and keep seed and seedlings out of reach of children, pets and stock.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 735 et neat material","Tangled, prickly stems. Take straight outer tips and trim leaves carefully."],["Base rotting","Mix too wet. Water less."]],"other":"Seed – easy; capsules hold seed on the plant (see the Seed Sowing Guide).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Melaleuca genus page (75–100 mm cuttings, strip, wound, hormone)","url":"anpsa.org.au/genera/melaleuca/"},{"title":"Australian Plants Society NSW – Melaleuca cardiophylla (propagate from seed and cuttings; regrows after fire)","url":"resources.austplants.com.au/plant/melaleuca-cardiophylla/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Few nursery tests (2); WA community-nursery method and ANPSA genus notes agree.","facts":[["Pre-treatment","None (smoke water to water in)"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","19%"],["Seed per 100 plants","0.5 g"]],"check":[10,20],"stats":{"germ_pct":19,"per_gram":222},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Long – dry & cool"},"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Dense, prickly, erect to spreading shrub, 0.2–2 m (to 4 m), with tangled branches."],["Flowering","Aug – Dec or Jan (white-cream)."],["Habitat","White, grey or brown sand on limestone ridges, outcrops and dunes."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed stays in the woody capsules (about 10 mm – large for a melaleuca), so collect at any time. Use capsules <b>at least 12 months old<\/b> from older stems. Wear gloves."],["Extraction & cleaning","Place capsules in an open container somewhere warm; fine seed is released in 2–3 days."],["Seed quality","Fine seed with chaff; no need to separate."],["Storage life","<b>Long<\/b> if kept dry and cool."],["Typical germination","About <b>19%<\/b> (untreated, Alcoa average of only 2 tests). About <b>222 seedlings per gram<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Dilute with dry, sterile yellow sand and sprinkle from a spice jar (Geraldton). <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist (Geraldton), or use the bog method."],["Germination time","About <b>10 days<\/b> at Geraldton; 14–30 days is typical for the genus."],["Pricking out","When the second pair of leaves appears. Handle tiny seedlings by the leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Young or empty capsules. Use capsules 12+ months old; sow more."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix. Thin sowing, airflow."]],"other":"Cuttings are also reliable in the genus (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 141 oo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect capsules at least 12 months old from older stems at any time; seed is retained in closed capsules."],["Extraction & cleaning","Place capsules somewhere warm in an open container; seed is released in 2–3 days."],["Seed quality","Fine seed with chaff. Germination in nursery tests was low – sow generously."],["Storage life","<b>Long<\/b> if kept dry and cool."],["Typical germination","About <b>14%<\/b> (untreated, Alcoa average of only 3 tests). About <b>301 seedlings per gram<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix with dry sand and sprinkle from a spice jar. <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist, or use the bog method."],["Germination time","About <b>7 days<\/b> at Geraldton; allow up to 4 weeks."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Empty or old seed. Use older capsules (12+ months) from vigorous plants; sow more."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix."]],"other":"Cuttings are a reliable alternative for this genus.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299,  dry (about 11% relative humidity) at 23°C or cooler, and declined in the freezer."],["Typical germination","Not recorded. The related <i>M. tetragona<\/i> and <i>M. graciliceps<\/i> gave 0% untreated in Alcoa tests."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b> (trial). Mar, Jun – Jul workable."],["Seed mix","Free-draining, sterile mix."],["Pre-treatment","<b>Trial only:<\/b> no treatment has been published. A heat shock (100°C for 10 minutes) plus smoke water, which helped a related sedge, is a reasonable trial."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow generously in deep trays."],["After sowing","Keep moist, not wet. Keep trays going for months."],["Germination time","Not recorded."],["Pricking out","At the first leaf, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – record your own."]]}],"difficulty_note":"","problems":[["No germination","Expected. Try heat plus smoke, older seed, and larger sowings."],["Empty seed","Cut-test before sowing."],["Seedlings rot","Too wet. Water less."]],"other":"Tissue culture has given over 80% rooting and 95% survival in research, and is how most tube stock is produced. Record any seed trial results.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, Scrophulariaceae","fam":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species data. ANPSA: most <i>Myoporum<\/i> strike readily from hardened current season's growth, the preferred method.","facts":[["Wood type","Semi-hardwood"],["Best months","Nov – Mar"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,42],"calendar":["B","B","B","P","-","-","-","-","-","P","B","B"],"snapshot":[["Habit","Erect, slender, compact or sprawling shrub, (0.3–) 0.5–3 m."],["Flowering","Variable – from Feb, Apr or Jun to Dec (white, sometimes blue-pink tinged)."],["Habitat","White-grey to black sand, peaty sand and clay loam; seasonally wet flats, swamps, dunes and limestone ridges."],["Local note","Recorded in Joondalup and Wanneroo. Suits sites that stay damp in winter. Small berries attract birds."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Mar<\/b>, in the warm months once current growth has hardened. Oct and Apr are workable. Avoid May – Sep (slow rooting)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth."],["Cutting size","75–100 mm."],["Selecting material","Non-flowering tips from a plant with the form you want (upright or sprawling)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – usually quick in the genus; check from about 4 weeks."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a native mix that holds some moisture."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> Most myoporums strike readily; this species is untested here.","problems":[["Base rotting","Mix too wet in the frame. Water less; improve drainage."],["Cuttings wilt","Material too soft. Use hardened growth."],["Leggy plants","Tip-prune young plants."]],"other":"Seed – not documented for this species. The related <i>M. insulare<\/i> is fermented, then soaked in smoke water (Geraldton).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"ANPSA – Eremophila and relatives (Myoporum: cuttings of hardened current season's growth strike readily)","url":"anpsa.org.au/genera/eremophila-and-relatives/"},{"title":"APACE WA – Myoporum caprarioides (winter-wet sites; berries attract birds)","url":"apacewa.org.au/plant/myoporum-caprarioides/"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Hardened current season's growth strikes readily in the genus.","guide":"cuttings"},{"method":"Seed","suitability":"Possible","note":"Not documented; the related M. insulare is fermented + smoke.","guide":null},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Whole fruit (sown whole)","look":"Small, roughly round brown drupe.","size":"2–3 mm across","tell":"Not every fruit chamber holds a seed – cut a few open to check (as for Eremophila, Seed Notes 5).","level":"species","d":{"shape":"stone","L":2.5,"W":2.4,"col":"brown"},"sources":[["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"],["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["Seed Notes 5 – Eremophila (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01992.pdf"]],"photos":[],"sosa":false}},{"id":"myoporum-insulare","sci":"Myoporum insulare","common":"Blueberry Tree / Common Boobialla","family":"Scrophulariaceae","fam":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree it strikes readily from firm young growth.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,56],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Dense, low spreading to erect shrub or small tree, 0.25–5 m, with thick, fleshy leaves."],["Flowering","Jul – Dec, also Jan – Feb (white, purple-spotted), followed by purple berries."],["Habitat","White or grey sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Forms range from prostrate to tree-like – take cuttings from a plant with the form you want."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the main flowering. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b> – firm young growth."],["Cutting size","75–100 mm."],["Selecting material","Firm, <b>non-flowering<\/b> young shoots from a stock plant with the growth form you need (prostrate for groundcover, erect for screening)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Reduce the remaining thick leaves by about one-third.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>). Strikes readily without it, but hormone gives faster, more even rooting."],["Propagation mix","Standard sand/coir cutting mix."],["Environment","Standard humid frame with bottom heat. Hairless leaves tolerate normal misting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Fast-growing – pot on promptly before roots circle.<br/>• Tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy.<\/b> Firm young growth roots readily; even branchlets placed straight into soil can strike.","problems":[["Leaf drop in the frame","Too dark or too wet. Give brighter shade and water less."],["Roots circling in tubes","Pot on sooner – it grows quickly."],["Plants not the expected shape","Seed-grown or mixed stock. Propagate from a known-form stock plant."]],"other":"Seed – the Geraldton community nursery ferments ripe (darkest purple) berries for 4–5 days, washes off the pulp and soaks in smoke water; germination took 15–30 days. Seedlings vary in form.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Australian National Botanic Gardens – Myoporum insulare","url":"anbg.gov.au/gnp/interns-2010/myoporum-insulare.html"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method available; no nursery test data.","facts":[["Pre-treatment","Ferment berries; smoke-water soak"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","Not recorded"]],"check":[15,30],"stats":{"germ_pct":null,"per_gram":null},"grow":[3.0,5.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Dense, low spreading to erect shrub or small tree, 0.25–5 m, with thick, fleshy leaves."],["Flowering","Jul – Dec, also Jan – Feb (white, purple-spotted), followed by purple berries."],["Habitat","White or grey sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Forms range from prostrate to tree-like; seedlings vary."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pick the <b>darkest purple<\/b>, fully ripe berries."],["Extraction & cleaning","<b>Ferment:<\/b> soak the berries in water for 4–5 days, then wash off the pulp through a sieve and dry the stones."],["Seed quality","Hard stones; cut-test a few to check they are filled."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","After fermenting, <b>soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method)."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow in trays or 2–3 stones per tube."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>15–30 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Unripe berries or pulp left on. Use the darkest berries h a sieve and dry the stones (Geraldton).","level":"species","d":{"shape":"stone","L":null,"W":null,"col":"tan"},"sources":[["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","https://www.cgg.wa.gov.au/Profiles/cgg/Assets/ClientData/Documents/Infrastructure/GGCN001_Web_vFINAL.pdf"],["ANBG National Seed Bank – seed images and measurements (APII)","https://canbr.gov.au/photo/apii/"]],"photos":[{"id":"2f82ed81-4175-4c3b-b30f-e4015708d0c7","nsb":2338,"by":"National Seed Bank, ANBG"},{"id":"6180342d-ba03-407f-b5d0-5427df21490b","nsb":2337,"by":"National Seed Bank, ANBG"}],"sosa":false}},{"id":"nuytsia-floribunda","sci":"Nuytsia floribunda","common":"WA Christmas Tree / Moodjar","family":"Loranthaceae","fam":"Loranthaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (6 tests) and grower methods published; host-plant research available. Germinating seed is easy – keeping seedlings alive is the hard part.","facts":[["Pre-treatment","None – sow fresh"],["Best sowing","Feb – Apr (fresh seed)"],["Sowing depth","Surface, upright"],["Typical germination","29%"],["Seed per 100 plants","2.4 g"]],"check":[10,35],"stats":{"germ_pct":29,"per_gram":41},"grow":[12.0,12.0],"storage":{"kind":"short","months":6,"text":"Short – sow fresh"},"calendar":["P","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Tree or shrub to 10 m. A <b>root parasite<\/b> – it taps the roots of nearby plants for water and nutrients."],["Flowering","Oct – Dec or Jan (brilliant yellow-orange)."],["Habitat","Sand, sandy loam, gravel over clay, granite, laterite and limestone; sandplains and slopes."],["Local note","Recorded in the Wanneroo LGA. Takes about 7–10 years to flower from seed."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the papery winged seed as it matures on the tree, within a few weeks of flowering."],["Extraction & cleaning","Little cleaning needed – remove twigs and old flower parts."],["Seed quality","Use freshly collected seed."],["Storage life","Not well documented. Growers rely on fresh seed – sow as soon as it is collected."],["Typical germination","About <b>29%<\/b> (untreated, Alcoa nursery average, 6 tests). About <b>41 seedlings per gram<\/b> – roughly 2.4 g of seed per 100 seedlings. Most growers find fresh seed easy to germinate."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>As soon as seed is collected<\/b> – usually Feb – Apr. Jan, May and Dec are workable."],["Seed mix","Standard sterile native seed mix. <b>No fertiliser<\/b> – it is adapted to poor soils."],["Pre-treatment","None."],["Sowing depth & method","Stand the papery seed <b>upright on the surface<\/b> of the mix and keep moist."],["After sowing","Keep moist, not wet (about 18–22°C suits it)."],["Germination time","About <b>10–35 days<\/b>."],["Pricking out","Move seedlings into forestry tubes to grow on, then pot each into a pot <b>with a host plant<\/b> once big enough. Hosts that have worked: dichondra, native grasses, kangaroo paw, even carrot seedlings; research found <i>Acacia<\/i> hosts passed nitrogen to the seedlings."],["Shade house & hardening","Grow on in light shade with the host, then harden off gradually to full sun."],["Time to planting size","Slow and unpredictable – allow 12 months or more (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings stall or die after a year or two","No host, or a poor one. Pot up with a host plant early."],["Poor germination","Old seed. Sow fresh."],["Yellowing after feeding","Fertiliser. Don't feed."]],"other":"Growers warn tube stock is hard to produce – set more than you need and plant out with a ne Seed","suitability":"Main method","note":"Fresh seed germinates readily; seedlings need a host plant.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Old trees sucker from the roots; not a nursery method.","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","-","B"],"basis":"guide","any":false,"note":"Collect the papery winged fruit within a few weeks of flowering."},"conservation":"","seedid":{"unit":"Whole winged fruit","look":"Dry, strongly three-winged, single-seeded fruit; the seed has a thin sticky coat.","size":"About 2.5 cm across the wings","tell":"Not published.","level":"species","d":{"shape":"samara3","L":25,"W":25,"col":"tan"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"olearia-axillaris","sci":"Olearia axillaris","common":"Coastal Daisybush","family":"Asteraceae","fam":"Asteraceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"ANPSA: stem cuttings of most perennial Australian daisies strike quickly from vigorous growth.","facts":[["Wood type","Semi-hardwood"],["Best months","Aug – Oct"],["Cutting length","75–100 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[21,32],"calendar":["-","-","P","P","-","-","P","B","B","B","P","-"],"snapshot":[["Habit","Erect, much-branched grey shrub, 0.2–3 m."],["Flowering","Jan – Jul or Nov – Dec (small white to yellow daisies)."],["Habitat","White, grey or red sand and loam; coastal limestone, sand dunes and rocky hillsides."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Aug – Oct<\/b>, on vigorous spring growth between flowering periods. Mar – Apr, Jul and Nov are workable with non-flowering shoots. Avoid Dec – Feb and May – Jun."],["Wood type","<b>Semi-hardwood<\/b> – vigorous current growth that has begun to firm."],["Cutting size","75–100 mm."],["Selecting material","Vigorous, healthy, non-flowering shoots (ANPSA)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for softer tips; 3 g/L for firmer material."],["Propagation mix","Free-draining: about 3 parts sand to 1 part peat or coir (ANPSA daisy mix)."],["Environment","Humid frame, bright shade, bottom heat. The grey, hairy leaves rot if kept wet – mist lightly."],["Expected strike time","Usually quick – check from about 3–4 weeks."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; tip-prune for a compact plant."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> Perennial daisies usually strike quickly and easily.","problems":[["Leaves go grey-brown and soft","Too wet or humid. Mist less, improve airflow."],["Cuttings flower","Taken from flowering shoots. Use vigorous non-flowering growth."],["Leggy plants","Too much shade. Move to full sun after hardening off."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Australian Daisies (perennial stem cuttings strike quickly; 3:1 sand:peat mix)","url":"anpsa.org.au/genera/daisies/"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery data and a detailed WA community-nursery method available.","facts":[["Pre-treatment","Air-dry 3 months; smoke water"],["Bes es appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Old seed or not aired. Use this season's seed, aired for 3 months."],["Seed buried too deep","Needs light. Surface sow."],["Leggy seedlings","Too much shade. Move to full sun sooner."]],"other":"Also strikes readily from cuttings.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Perennial daisies strike quickly from vigorous growth.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Fresh seed, aired 3 months; surface-sow.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["-","-","P","B","B","P","-","-","-","-","-","-"],"basis":"guide","any":false,"note":"Can also set seed about 6 weeks after a big summer rain."},"conservation":"","seedid":{"unit":"Achenes with pappus","look":"Narrow, silky achene with straw-coloured pappus bristles.","size":"1.5–3 mm long; pappus about 5 mm","tell":"No visual test is published – seed banks use a cut test. Air the seed for 3 months before storage or sowing (Geraldton).","level":"species","d":{"shape":"achene","L":2.25,"W":0.6,"col":"greybrown","pappus":5},"sources":[["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","https://www.cgg.wa.gov.au/Profiles/cgg/Assets/ClientData/Documents/Infrastructure/GGCN001_Web_vFINAL.pdf"]],"photos":[],"sosa":false}},{"id":"opercularia-vaginata","sci":"Opercularia vaginata","common":"Dog Weed","family":"Rubiaceae","fam":"Rubiaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"Nursery tests show under 1% germination untreated; no published treatment. Trial protocol.","facts":[["Pre-treatment","Smoke water (trial)"],["Best sowing","Apr – May"],["Sowing depth","1–2 mm"],["Typical germination","<1% untreated"],["Seed per 100 plants","38 g"]],"check":[28,56],"stats":{"germ_pct":null,"per_gram":2.6},"grow":null,"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","P","B","B","P","P","-","-","-","-","-"],"snapshot":[["Habit","Low, decumbent to erect perennial herb or subshrub, 0.1–0.45 m."],["Flowering","Jul – Dec (green to green-yellow heads)."],["Habitat","Sandy, lateritic or granitic soils and coastal limestone."],["Local note","Recorded in Joondalup and Wanneroo. Many <i>Opercularia<\/i> have an unpleasant smell. May sucker."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the fruit heads when dry; the capsules shed a lid to release the seed."],["Extraction & cleaning","Dry heads in a paper bag and sieve out the seed."],["Seed quality","Cut-test a sample."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Under 1% untreated (0.17%, Alcoa, 4 tests), about 2.6 seedlings per gram."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – May<\/b> (trial). Mar, Jun – Jul workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Trial only:<\/b> no treatment has been published. Smoke water (24 h soak) and seed aged for a year or more are low-cost things to try – record the results."],["Sowing depth & method","Cover lightly, about 1–2 mm."],["After sowing","Keep moist, not wet."],["Germination time","Not recorded."],["Pricking out","At the second leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Record your own."]]}],"difficulty_note":"","problems":[["No germination","Expected untreated. Try smoke and aged seed; sow generously."],["Seedlings collapse","Damping off. Sterile mix; airflow."],["Weak seedlings","Too much shade."]],"other":"Suckering plants may be divided – untested. Record any trial so this page can be updated.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"F
