 make potting on easier than community pots."],["<b>6. Environment<\/b>","Water in and place in a humid frame or propagation house in bright shade. Bottom heat so the base is 5–10°C warmer than the air. Keep the mix moist, not wet. Mist sparingly on hairy-leaved species."],["<b>7. Check<\/b>","Most cuttings strike in 4–8 weeks in warm weather. Look for roots at the drainage holes. Remove any rotting cuttings promptly."],["<b>8. Harden off<\/b>","About 2 weeks with cover closed by day and open at night, then about 2 weeks in shade, then into the open. Many struck cuttings are lost by skipping this step."],["<b>9. Pot on<\/b>","After 1–3 months, pot on into larger containers. Don't let roots become pot-bound."]]}]},{"title":"Rooting hormone guide","level":2,"blocks":[{"type":"table","rows":[["Product (example)","IBA strength","Use for"],["Clonex Green","1.5 g/L","Softwood and soft tip cuttings"],["Clonex Purple","3 g/L","Semi-hardwood – the general all-rounder"],["Clonex Red","8 g/L","Hardwood cuttings"]]},{"type":"p","html":"Equivalent powders or liquids work too – match the strength to the wood type. Callus forming without roots usually means the hormone is too strong for that material.","small":true}]},{"title":"Mix, hygiene and collecting","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>Propagation mix<\/b>","About 75–80% washed coarse river sand with 20–25% coir or peat. Add extra perlite or coarse sand for rot-prone species."],["<b>Hygiene<\/b>","Fresh mix, clean tubes and benches. Many WA natives (including <i>Hibbertia<\/i> and <i>Grevillea<\/i>) are susceptible to <i>Phytophthora<\/i>. Discard diseased cuttings; use fungicide only if a problem persists."],["<b>Collecting<\/b>","Collecting from bushland generally requires a DBCA flora licence and landholder permission. Use local-provenance stock and label every batch with its source."]]}]}],"seed":[{"title":"Pre-treatments explained","level":1,"blocks":[{"type":"p","html":"Many WA species have seed dormancy that must be broken before they will germinate. The species pages say which treatment to use.","small":false},{"type":"table","rows":[["Treatment","How to do it","Used for"],["<b>None<\/b>","Sow untreated seed. Remove from cones or follicles first where needed.","<i>Allocasuarina<\/i>, <i>Banksia<\/i>"],["<b>Boiling water (30 s)<\/b>","Drop seed into boiling water for 30 seconds, then drain and cool (Alcoa Marrinup method).","Hard-seeded peas, e.g. <i>Daviesia<\/i>, <i>Hovea<\/i>"],["<b>Hot water soak<\/b>","Pour near-boiling water over the seed (at least 10 parts water to 1 part seed) and leave to cool and soak overnight. Sow the seed that has swollen (1.5–2× its size); re-treat the rest.","Hard-seeded peas"],["<b>Dry heat<\/b>","Spread seed on a tray in a pre-heated oven. Peas: 80–120°C for 10 min to 1 hour. Kangaroo paw: 100°C for 3 hours.","<i>Gompholobium<\/i>, <i>Anigozanthos<\/i>"],["<b>Smoke water<\/b>","Soak seed for up to 24 hours in diluted smoke water (e.g. 1:9), or water trays with it after sowing. Also has slight antifungal properties.","Fire-responsive species, e.g. <i>Anigozanthos<\/i> (optional for others)"],["<b>Aged seed<\/b>","Store seed dry at room temperature for one or more years before sowing – dormancy fades with time (after-ripening).","<i>Anigozanthos<\/i>"]]},{"type":"p","html":"<b>Safety:<\/b> boiling water and hot ovens scald – use tongs, strainers, heat-proof containers and gloves.","small":true}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Germinates reliably with the standard method; few losses."],["<b>Easy–Moderate<\/b>","Germinates well, but one factor needs care (e.g. damping off, extraction, low fill)."],["<b>Moderate<\/b>","Needs the right pre-treatment and timing; germination may be low or variable."],["<b>Moderate–Difficult<\/b>","Low or erratic germination; specialist treatment usually needed."],["<b>Difficult<\/b>","Very low germination from seed; cuttings or other methods usually preferred."]]}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific germination data and handling guidance are published."],["<b>Medium<\/b>","Some species data (e.g. few tests) plus genus-level guidance. Verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard sowing method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Seed mix<\/b>","Sterile, free-draining, low-nutrient mix: about <b>80–85% washed river sand + 15–20% coir or peat<\/b>, or a commercial native seed-raising mix. Use fresh mix and clean trays. Pre-moisten before sowing."],["<b>2. Check the seed<\/b>","Label every lot (species, provenance, collection date). Cut-test a few seeds – good seed is firm and white inside. For peas, a float test removes damaged seed."],["<b>3. Pre-treat<\/b>","Use the treatment on the species page (see Pre-treatments explained). Sow soon after hot-water treatment."],["<b>4. Sow<\/b>","Cover to about <b>twice the seed's thickness<\/b>. Fine seed: sprinkle on the surface and press in lightly, or cover with a thin layer of fine sand or vermiculite. Large seed (e.g. <i>Banksia<\/i>, peas): sow direct into tubes to avoid pricking-out damage."],["<b>5. Water in (post-treatment)<\/b>","Water with a fine spray – smoke water is a useful first watering (slight antifungal effect, more even germination). Keep moist, never wet. A capillary bed lets you water from below."],["<b>6. Germinate<\/b>","Shaded, sheltered, protected from rain and drying wind. Check daily. Watch for damping off, snails and slugs."],["<b>7. Prick out<\/b>","When seedlings can be handled – usually when the <b>second pair of leaves<\/b> appears; earlier for taprooted species. Lift with a narrow spatula, hold by the leaves, not the stem, and firm mix around the roots with a gentle spray."],["<b>8. Shade house<\/b>","About <b>2 weeks<\/b> in the shade house after pricking out. Don't let tubes dry out (a capillary bed helps)."],["<b>9. Harden off<\/b>","Move gradually into full sun over <b>2–4 weeks<\/b>. Pot on to larger containers after 1–3 months if needed; don't let roots become pot-bound."]]}]},{"title":"Seed storage","level":2,"blocks":[{"type":"table","rows":[["Topic","Guidance"],["<b>General rule<\/b>","Dry the seed (air-dry or desiccator, never an oven), seal it in labelled airtight containers and keep it cool and dark, away from vermin. A sealed fridge is good; freezing suits many species but not all."],["<b>Exceptions<\/b>","<i>Anigozanthos manglesii<\/i> lost germination at –18°C – store at room temperature or cooler, not frozen. <i>Allocasuarina<\/i> and <i>Banksia<\/i> seed is short-lived once out of the cone – store in the cone, or dry and cool."],["<b>Long-lived<\/b>","Hard-coated pea seed keeps many years dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["<b>Collecting<\/b>","Collecting from bushland generally needs a DBCA licence and landholder permission. Collect only ripe seed from many plants to keep genetic diversity."]]}]},{"title":"Hygiene and damping off","level":2,"blocks":[{"type":"p","html":"Damping off (<i>Pythium<\/i>, <i>Rhizoctonia<\/i>) rots seedlings at soil level, especially in wet, crowded trays. Prevent it with sterile mix, clean trays, thin sowing, good airflow and bottom watering. Remove affected seedlings quickly and use a registered fungicide only if the problem persists. Keep pots off the ground to reduce <i>Phytophthora<\/i> risk.","small":true}]}]},"pdfs":{"cuttings":"Native_Plant_Cuttings_Guide_v1.1.pdf","seed":"Native_Plant_Seed_Sowing_Guide_v1.1.pdf"}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var APP_VERSION = "C1.1·S1.1";
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DIFF = { "Easy": "d-easy", "Easy-Moderate": "d-easymod", "Moderate": "d-mod", "Moderate-Difficult": "d-moddiff", "Difficult": "d-diff" };
  var DIFF_ORDER = ["Easy", "Easy-Moderate", "Moderate", "Moderate-Difficult", "Difficult"];
  var BY_ID = {};
  DATA.species.forEach(function (s) { BY_ID[s.id] = s; });

  var view = document.getElementById("view");
  var backBtn = document.getElementById("back-btn");
  var state = {
    tab: "month",
    month: new Date().getMonth(),
    query: "",
    filter: "all",
    methodsTab: "cuttings",
    detailGuide: {},
    editing: null
  };

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(html) { return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
  function dash(s) { return String(s).replace(/-/g, "–"); }
  function diffChip(g, prefix) {
    var label = (prefix ? prefix + " · " : "") + dash(g.difficulty) + (g.provisional ? " *" : "");
    return '<span class="chip ' + DIFF[g.difficulty] + '">' + esc(label) + "</span>";
  }
  function store(key, val) {
    try {
      if (val === undefined) { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      localStorage.setItem(key, JSON.stringify(val)); return true;
    } catch (e) { return val === undefined ? null : false; }
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  var CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

  function calendarHTML(cal) {
    var now = new Date().getMonth();
    var out = '<div class="cal" role="img" aria-label="' + esc(cal.map(function (c, i) {
      return MONTHS[i] + ": " + (c === "B" ? "best" : c === "P" ? "workable" : "avoid");
    }).join(", ")) + '">';
    cal.forEach(function (c, i) {
      var cls = c === "B" ? "B" : c === "P" ? "P" : "N";
      var txt = c === "B" ? "Best" : c === "P" ? "OK" : "–";
      out += '<div class="' + (i === now ? "now" : "") + '">' + MONTHS[i] + '<span class="' + cls + '">' + txt + "</span></div>";
    });
    return out + "</div>" +
      '<div class="legend"><span><i style="background:var(--cal-best)"></i>Best</span>' +
      '<span><i style="background:var(--cal-ok)"></i>Workable</span>' +
      '<span><i style="background:var(--cal-no)"></i>Avoid / poor results</span></div>';
  }

  // ---------- navigation ----------
  function setTitle(title, sub, italic) {
    var t = italic ? "<i>" + esc(title) + "</i>" : esc(title);
    document.getElementById("top-title").innerHTML = t + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "");
  }
  function go(hash) {
    if (location.hash === hash) { render(); } else { location.hash = hash; }
  }
  function parseHash() {
    var h = location.hash.replace(/^#/, "");
    if (h.indexOf("sp-") === 0 && BY_ID[h.slice(3)]) return { tab: "species", id: h.slice(3) };
    if (["month", "species", "methods", "records", "about"].indexOf(h) >= 0) return { tab: h };
    return { tab: "month" };
  }
  document.querySelectorAll(".tabbar button").forEach(function (b) {
    b.addEventListener("click", function () { go("#" + b.dataset.tab); });
  });
  backBtn.addEventListener("click", function () {
    if (history.length > 1) history.back(); else go("#species");
  });
  window.addEventListener("hashchange", render);

  // ---------- views ----------
  function renderMonth() {
    setTitle("This month", "Joondalup / Perth coastal");
    var m = state.month, now = new Date().getMonth();
    var strip = '<div class="month-strip" role="group" aria-label="Choose month">' + MONTHS.map(function (n, i) {
      return '<button type="button" data-month="' + i + '" aria-pressed="' + (i === m) + '" class="' + (i === now ? "is-now" : "") + '">' + n + "</button>";
    }).join("") + "</div>";

    function block(kind, label) {
      var best = [], ok = [];
      DATA.species.forEach(function (s) {
        var g = s[kind]; if (!g) return;

  var CSV_COLS = ["id", "date", "species", "method", "source", "treatment", "qty", "unit", "success", "result", "notes", "created", "updated"];
  function toCSV() {
    var rows = [CSV_COLS.join(",")];
    loadRecs().forEach(function (r) {
      var res = resultOf(r);
      var row = CSV_COLS.map(function (k) {
        var v = k === "result" ? (res ? res.value : "") : (r[k] == null ? "" : String(r[k]));
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      });
      rows.push(row.join(","));
    });
    return rows.join("\n");
  }
  function exportCSV() {
    var csv = toCSV(), name = "propagation-records-" + new Date().toISOString().slice(0, 10) + ".csv";
    try {
      var file = new File([csv], name, { type: "text/csv" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Propagation records" }).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast("CSV downloaded");
    } catch (e) { toast("Export isn't available here – use Copy CSV"); }
  }
  function copyCSV() {
    var csv = toCSV();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () { toast("CSV copied – paste into an email or sheet"); },
        function () { toast("Copy was blocked by the browser"); });
    } else { toast("Copy isn't available here"); }
  }
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || r[0] !== ""; });
  }
  function importCSV(ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result || ""));
      if (rows.length < 2) { toast("That file has no records"); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      if (head.indexOf("species") < 0) { toast("That doesn't look like a records export"); return; }
      var recs = loadRecs(), ids = {}, added = 0, updated = 0;
      recs.forEach(function (r, i) { ids[r.id] = i; });
      rows.slice(1).forEach(function (cells) {
        var r = {};
        head.forEach(function (h, i) { if (h !== "result") r[h] = cells[i] || ""; });
        if (!r.species) return;
        if (!r.id) r.id = uid();
        if (ids[r.id] != null) {
          var old = recs[ids[r.id]];
          if ((r.updated || "") > (old.updated || "")) { recs[ids[r.id]] = r; updated++; }
        } else { recs.push(r); ids[r.id] = recs.length - 1; added++; }
      });
      if (saveRecs(recs)) { toast(added + " added, " + updated + " updated"); renderRecords(); }
    };
    reader.readAsText(f);
    ev.target.value = "";
  }

      '<a class="btn" href="guides/' + esc(DATA.pdfs.seed) + '" target="_blank" rel="noopener">Seed Sowing Guide (PDF)</a></div></div>' +
      '<div class="card about"><h3>Install on your phone</h3>' +
      "<p><b>Android (Chrome):</b></p><ol><li>Open the app’s web address in Chrome.</li><li>Tap <b>Install</b> when prompted, or the ⋮ menu → <b>Add to Home screen</b> → <b>Install</b>.</li><li>Open it from the new icon. It now works offline.</li></ol>" +
      "<p><b>iPhone (Safari):</b></p><ol><li>Open the address in Safari.</li><li>Tap the <b>Share</b> button → <b>Add to Home Screen</b>.</li></ol></div>" +
      '<div class="card about"><h3>Updates</h3><p>When the guides are updated, the app shows <b>“A new version of the guide is ready”</b> next time it’s opened with internet. Tap <b>Update now</b>. Your saved records are kept.</p></div>' +
      '<div class="card about"><h3>Records and privacy</h3><p>Records are stored only on this device. Clearing Chrome’s site data or uninstalling the app deletes them, so export a CSV regularly.</p></div>' +
      '<div class="card about"><h3>Change log</h3><p><b>Cuttings Guide</b></p><ul>' + rev(DATA.revisions.cuttings) + "</ul><p><b>Seed Sowing Guide</b></p><ul>" + rev(DATA.revisions.seed) + "</ul></div>" +
      '<p class="note">Compiled from published sources (listed on each species page). Windows and ratings are starting points for local practice – confirm them with your own records. Collecting from bushland generally needs a DBCA licence and landholder permission.</p>';
  }

  // ---------- render ----------
  function render() {
    var r = parseHash();
    state.tab = r.tab;
    document.querySelectorAll(".tabbar button").forEach(function (b) {
      if (b.dataset.tab === r.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    backBtn.hidden = !r.id;
    if (r.id) renderDetail(r.id);
    else if (r.tab === "species") renderSpecies();
    else if (r.tab === "methods") renderMethods();
    else if (r.tab === "records") renderRecords();
    else if (r.tab === "about") renderAbout();
    else renderMonth();
    if (!render._first) window.scrollTo(0, 0);
    render._first = false;
  }
  render._first = true;
  render();

  // ---------- offline / updates ----------
  
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function showUpdate(worker) {
          var bar = document.getElementById("update-bar");
          bar.hidden = false;
          document.getElementById("update-btn").onclick = function () { worker.postMessage({ type: "SKIP_WAITING" }); };
        }
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (nw) nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 3600000);
      }).catch(function () {});
      var refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (refreshing) return; refreshing = true; location.reload();
      });
    });
  }

})();
</script>
