Typical germination","7%"],["Seed per 100 plants","5.6 g"]],"check":[28,56],"stats":{"germ_pct":7,"per_gram":17.8},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial; grass-like leaves 0.1–0.45 m, flower stems to about 0.7 m."],["Flowering","Aug – Nov (pale to bright blue, rarely white). Flowers are best in the morning and fade through the day."],["Where it grows","Grows locally in the Perth region; suits full sun or light shade and is drought hardy (ReWild Perth)."],["Local note","Increasingly used for revegetation and landscaping. The variety <i>gramineus<\/i> (Grass-leaved Orthrosanthus) is a separate form – keep provenances separate."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect capsules (12–15 mm, pointed) as they dry and brown after the spring flowering – est. Nov – Dec, as for the related <i>O. multiflorus<\/i>."],["Extraction & cleaning","Dry 1–2 weeks in paper bags, rub and sieve (genus)."],["Seed quality","Brown, wrinkled, rounded-angular seed about 2 mm. Fresh WA seed tested 93% viable."],["Storage life","Not well documented. Seed buried in soil for a year fell to 34% viable, although the survivors germinated better with smoke – so don't rely on old seed."],["Typical germination","Low untreated: about <b>7%<\/b> (Alcoa, 8 tests; the inland var. <i>gramineus<\/i> 18%). About <b>18 seedlings per gram<\/b>. WA research lists it as <b>smoke-responsive<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb (germinates at 13–18°C, RHS)."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","<b>Smoke water<\/b> – 24 h soak (1:9) or water the trays with it."],["Sowing depth & method","Lightly cover. Because germination varies a lot between seed lots, sow <b>about 4 seeds per cell<\/b> (as in WA research) and thin."],["After sowing","Keep moist, not wet. Keep trays for a second season if few come up."],["Germination time","Not documented – expect it to be uneven."],["Pricking out","At 2–3 leaves, gently."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very few seedlings","Normal for some seed lots. Use smoke water, sow more per cell, and record germination by lot."],["Seedlings rot","Too wet. Water less; free-draining mix."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Can also be divided in spring (RHS); not tested here – see the Division Guide's list of other species.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Smoke germination of Australian plants (Dixon; Stirlingia among smoke-responsive recalcitrant genera)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"},{"title":"RIRDC (1998) Smoke germination of Australian plants, report 98/108 – soil storage plus smoke (Patersonia occidentalis, Orthrosanthus laxus); smoke-responsive genera incl. Haemodorum","url":"agrifutures.com.au/product/smoke-germination-of-australian-plants/"},{"title":"Acta Horticulturae 1104 (ISHS) – Orthrosanthus: germination variable between seed lots and years; 4 seeds per cell","url":"ishs.org/ishs-article/1104_35"},{"title":"Royal Horticultural Society – Orthrosanthus laxus (sow at 13–18°C; divide in spring)","url":"rhs.org.uk/plants/53721/orthrosanthus-laxus/details"},{"title":"ReWild Perth – Morning Iris (grows locally around Perth; full sun or light shade)","url":"rewildperth.com.au/resource/morning-iris/"},{"title":"Pacific Bulb Society – Orthrosanthus (height, flower colour; flowers best in the morning)","url":"pacificbulbsociety.org/pbswiki/index.php/Orthrosanthus"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Smoke water; germination varies between seed lots.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Clumps can be divided in spring (RHS); untested here.","guide":null}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","-","B","B"],"basis":"estimate","any":false,"note":"Collect capsules as they dry and brown, before they split."},"conservation":"","seedid":{"unit":"Seed","look":"Rounded to angular brown seed with a wrinkled coat, from a pointed capsule 12–15 mm long.","size":"About 2 mm across","tell":"Not published. Rub dry capsules and sieve; cut-test a few.","level":"species","d":{"shape":"round","L":2,"W":1.8,"col":"brown","texture":"wrinkled"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"patersonia-occidentalis","sci":"Patersonia occidentalis","common":"Purple Flag","family":"Iridaceae","fam":"Iridaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery tests (7, with smoke) and WA smoke research agree germination is low; South Australian seed is reported to germinate readily.","facts":[["Pre-treatment","Smoke; aged seed"],["Best sowing","May – Jun"],["Sowing depth","Lightly covered"],["Typical germination","2%"],["Seed per 100 plants","14 g"]],"check":[28,56],"stats":{"germ_pct":2,"per_gram":7.3},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Airtight & dry; ageing helps"},"calendar":["-","-","P","P","B","B","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, to 1.5 m in flower."],["Flowering","Aug – Dec or Jan (purple). Each flower lasts less than a day, but each stem carries many."],["Habitat","Wide range of soils – sand, sandy clay, loam, gravel, laterite, granite and limestone; winter-wet areas, dunes and granite outcrops."],["Local note","Recorded in the Wanneroo LGA (not listed for Joondalup). Several varieties – keep provenances separate."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect capsules as they dry and turn brown, with hard brown seed inside – Dec – Mar in SA, after the spring flowering."],["Extraction & cleaning","Dry 1–2 weeks, rub the capsules gently and sieve."],["Seed quality","Dark brown, flattened oval seed 2–3 mm, with no aril. Cut-test a few."],["Storage life","Airtight with a desiccant, cool and dry. In WA research, seed stored in soil for a year then smoked germinated best (viability 67% fresh, 58% after a year)."],["Typical germination","Low in WA nursery tests: about <b>2%<\/b> even with smoke (Alcoa, 7 tests); about <b>7 seedlings per gram<\/b>. WA research found it needs <b>both soil storage and smoke<\/b> for its best germination."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>May – Jun<\/b> (Kings Park). Mar – Apr and Jul – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","<b>Smoke water<\/b> – soak 12 hours in 10% smoke water (Dixon, ANPSA). Seed a year or more old is likely to do better."],["Sowing depth & method","Sow thinly and cover lightly."],["After sowing","Keep moist, not wet. If germination is poor, <b>keep the trays over summer<\/b> and water with smoke water again next autumn – this mimics the soil storage that worked in research."],["Germination time","Not documented – expect slow, spasmodic germination."],["Pricking out","At 2–3 leaves, gently."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from germination (record your own)."]]}],"difficulty_note":"","problems":[["Very few seedlings","Normal in WA tests. Use smoke, older seed, and keep trays a second season."],["Seedlings rot","Too wet. Water less; free-draining mix."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Clumps can be divided, but ANBG calls it unreliable; if you try, use large pieces in autumn (see the Division Guide's list of other species).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Smoke germination of Australian plants (Dixon; Stirlingia among smoke-responsive recalcitrant genera)","url":"anpsa.org.au/smoke-germination-of-australian-plants/"},{"title":"RIRDC (1998) Smoke germination of Australian plants, report 98/108 – soil storage plus smoke (Patersonia occidentalis, Orthrosanthus laxus); smoke-responsive genera incl. Haemodorum","url":"agrifutures.com.au/product/smoke-germination-of-australian-plants/"},{"title":"Seeds of South Australia – Patersonia occidentalis (collection Dec – Mar, cleaning, storage)","url":"seedsofsa.au (read via syzygium.xyz mirror)"},{"title":"Kings Park (BGPA) – Patersonia occidentalis (sow May – June; flowers open less than a day)","url":"bgpa.wa.gov.au/plants/patersonia-occidentalis"},{"title":"Australian National Botanic Gardens – Patersonia (dividing clumps not a reliable method)","url":"anbg.gov.au/gnp/gnp8/patersonia-sp.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Smoke and aged seed; low in nursery tests.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Large pieces in autumn; ANBG calls division unreliable.","guide":null}],"collect":{"cal":["B","B","P","-","-","-","-","-","-","-","P","B"],"basis":"estimate","any":false,"note":"Collect capsules as they dry and turn brown, with hard brown seed inside."},"conservation":"","seedid":{"unit":"Seed","look":"Flattened oval, dark brown seed with no aril, from a cylindrical capsule 18–25 mm long.","size":"2–3 mm long, to about 1.2 mm wide","tell":"Collect capsules that are drying and turning brown with hard brown seed inside, then sieve off the capsule pieces. Cut-test a few – firm and white inside is good.","level":"species","d":{"shape":"oval","L":2.5,"W":1.2,"col":"darkbrown"},"sources":[["VicFlora – Flora of Victoria (fruit and seed descriptions)","https://vicflora.rbg.vic.gov.au"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[{"id":"3980f978-93ca-454c-9967-76f66c5e9be8","nsb":918,"by":"B. Clinton"},{"id":"7001ceb9-1037-4b1f-b463-f0180238638f","nsb":919,"by":"B. Clinton"}],"sosa":true}},{"id":"petrophile-axillaris","sci":"Petrophile axillaris","common":"","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Medium","confidence_note":"No species data; follows WA Petrophile seed notes, as for <i>P. linearis<\/i>.","facts":[["Pre-treatment","Remove hairs, nick coat; smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","Not recorded"]],"check":[21,120],"stats":{"germ_pct":null,"per_gram":null},"grow":[6.0,8.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, multi-stemmed shrub to 3 m, with sharp-pointed leaves."],["Flowering","Sep – Nov (pink, purple and grey)."],["Habitat","Red, yellow or grey sand over limestone, sandy loam and gravel; sandplains, slopes and ridges."],["Local note","Recorded in Joondalup and Wanneroo. The pink form once sold as <i>P. serruriae<\/i> is this species. Prickly – gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones are usually ripe about six months after flowering, when they turn grey to grey-brown. Cones over a year old hold mature fruit."],["Extraction & cleaning","Keep cones warm and dry – after a few days the scales open and the hairy nuts can be pulled out with tweezers."],["Seed quality","Many 'false' (empty) fruits are produced – cut-test a sample."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded. Fresh seed is reported to germinate well once treated, but times vary."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool autumn). Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>Remove the hairs and nick a small section of the seed coat<\/b> to reveal the white seed, without damaging it. Smoke water may also help."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","Can take <b>several months<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–8 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not nicked, or empty nuts. Nick carefully; cut-test."],["Seedlings die in pots","Phosphorus toxicity or dieback – petrophiles are very sensitive to both."],["Seedlings collapse","Damping off. Sterile mix; bottom watering."]],"other":"Cuttings are hard in <i>Petrophile<\/i> (3–10 months to strike, 10–67% success in study-group trials).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 18 – Isopogon and Petrophile. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02005.pdf"},{"title":"Lightfoot K., ANPSA Australian Plants Online (Mar 2003) – Petrophile (cones, extraction, cuttings, phosphorus and dieback)","url":"anpsa.org.au/APOL29/mar03-3.html"},{"title":"ANPSA Isopogon & Petrophile Study Group Newsletter 24 (2019) – Petrophile axillaris; cuttings trials (3–10 months, 10–67%)","url":"anpsa.org.au/wp-content/uploads/iso-pet24.pdf"},{"title":"Lamont B.B. et al. (2020) Critical Reviews in Plant Sciences – serotiny, supplementary Table S1 (Eremaea, Petrophile)","url":"uv.es/jgpausas/papers/Lamont-2020-CritRevPlSci_supp.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Petrophile cuttings take 3–10 months; 10–67% strike.","guide":null},{"method":"Seed","suitability":"Main method","note":"Remove hairs and nick the seed coat; slow.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":{"cal":["P","P","B","B","B","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Cones ripe about six months after flowering; older cones also hold ripe fruit."},"conservation":"","seedid":{"unit":"Hairy nut (fruit) – sown whole","look":"Small, often flattened nut fringed with long hairs, pulled from the cone with tweezers; the seed inside is flat and white (genus).","size":"Not published (cone 9–20 mm)","tell":"Many 'false' fruits form without a seed. Nick a small corner of a few nuts – a filled one shows a white seed (Seed Notes 18).","level":"genus","d":{"shape":"hairynut","L":null,"W":null,"col":"lightbrown"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 18 – Isopogon and Petrophile (Wildflower Society of WA / DEC 2007)","https://libra "B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Small erect shrub, 0.2–1.2 m, with smooth branchlets."],["Flowering","Jun – Dec or Jan (white-cream to pink). Sepals enlarge to enclose the fruit."],["Habitat","Usually sandy soils, including coastal alkaline sands."],["Name note","FloraBase now lists this plant as <i>Lysiandra calycina<\/i>; many nurseries still sell it as <i>Phyllanthus calycinus<\/i>. Kept under <i>Phyllanthus<\/i> here to match your plant list."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the long flowering season ends. Jan and May are workable. Avoid Jun – Dec (flowering, and cool in winter)."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>); trial 1.5 g/L (<b>Clonex Green<\/b>) on softer tips."],["Propagation mix","Free-draining sand-based mix."],["Environment","Standard humid frame, bottom heat, bright shade."],["Expected strike time","Not documented – start checking from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> No cutting data found for this species; the rating is a cautious starting point.","problems":[["No roots after 10+ weeks","Try a different hormone strength or timing on the next batch; record what you tried."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering shoots only."]],"other":"Seed – the method most guides mention; use fresh seed. Few published details on pre-treatment.","sources":[{"title":"Australian Native Plan guide":null},{"method":"Seed","suitability":"Main method","note":"Remove the woolly floral parts to lift germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Annual or short-lived.","guide":null}],"collect":{"cal":["P","P","-","-","-","-","-","-","-","P","P","P"],"basis":"estimate","any":false,"note":"Collect spikes when papery and very dry; the hairs can irritate skin."},"conservation":"","seedid":{"unit":"Seed (rubbed out of the hairy fruits)","look":"Brown, kidney-shaped seed, one per long papery, hairy fruit.","size":"To about 2 × 1.2 mm","tell":"Collect heads dried to a pale straw colour. Rub gently to free the seed at the base of each fruit and sieve. Not all fruits hold seed, and the hairs may cause an allergic reaction.","level":"species","d":{"shape":"kidney","L":2,"W":1.2,"col":"brown"},"sources":[["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":true}},{"id":"rhagodia-baccata","sci":"Rhagodia baccata","common":"Berry Saltbush","family":"Amaranthaceae (chenopods)","fam":"Amaranthaceae","alt":"Also listed as <i>Chenopodium baccatum<\/i>","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Method follows related saltbushes – trial protocol.","facts":[["Wood type","Semi-hardwood tips"],["Best months","Sep – Nov"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,42],"calendar":["P","P","P","-","-","-","-","P","B","B","B","P"],"snapshot":[["Habit","Spreading shrub, 0.3–2 m, with grey-green leaves."],["Flowering","Variable – Feb, Apr – May or Oct – Dec (tiny), followed by red berries eaten by birds and bobtails."],["Habitat","Sand dunes and coastal rock."],["Local note","Recorded in Joondalup and Wanneroo. Salt-tolerant; a breeding plant for the saltbush blue butterfly."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b>, in active spring growth. Aug and Dec – Mar are workable with non-flowering shoots. Avoid Apr – Jul."],["Wood type","<b>Semi-hardwood tips<\/b> of current season's growth."],["Cutting size","75–100 mm."],["Selecting material","Vigorous tips without flowers or berries."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining mix of sand and potting mix."],["Environment","Bright shade with <b>good ventilation and little or no mist<\/b> (misting encourages leaf disease on saltbush cuttings). Bottom heat helps."],["Expected strike time","Not documented – check from about 4–6 weeks and record the result."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Water sparingly once established."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Untested here; related saltbushes strike from tip cuttings. Seed is the documented method.","problems":[["Leaf spots, leaves dropping","Too humid. Stop misting and improve airflow."],["Base rotting","Mix too wet. Use a sandier mix, water less."],["No roots","Try firmer material or the seed method, and record the result."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (ventilate, avoid mist on cuttings)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (15 cm terminal cuttings in spring)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"}]},"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery test data (7 tests); treatment follows the WA community-nursery method for <i>Rhagodia<\/i>.","facts":[["Pre-treatment","Ferment berries; smoke-water soak"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","11%"],["Seed per 100 plants","1.3 g"]],"check":[7,14],"stats":{"germ_pct":11,"per_gram":75},"grow":[3.0,4.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Spreading shrub, 0.3–2 m, with grey-green leaves."],["Flowering","Variable – Feb, Apr – May or Oct – Dec, followed by red berries."],["Habitat","Sand dunes and coastal rock."],["Local note","Recorded in Joondalup and Wanneroo. FloraBase uses <i>Rhagodia baccata<\/i>; national lists use <i>Chenopodium baccatum<\/i>."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pick fully ripe, deep red berries."],["Extraction & cleaning","<b>Ferment:<\/b> soak the berries in water for 4–5 days, wash off the pulp through a sieve and dry the seed."],["Seed quality","Small, dark seeds; discard any that float after washing."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>11%<\/b> (untreated, Alcoa nursery average, 7 tests). About <b>75 seedlings per gram<\/b> – roughly 1.3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Ferment and clean (above), then <b>soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method for <i>R. preissii<\/i>)."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Sow thinly in trays."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>7–14 days<\/b> (Geraldton, <i>R. preissii<\/i>)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Pulp left on, or unripe berries. Ferment fully; use ripe fruit."],["Mould on trays","Pulp residue. Wash seed well."],["Seedlings collapse","Damping off. Sow thinly; good airflow."]],"other":"Tip cuttings are worth trialling (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Cottesloe Coastcare Association – plant pages (Rhagodia baccata, Spinifex longifolius, Jacksonia sericea)","url":"cottesloecoastcare.org"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Chenopod shrubs generally strike well (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Ferment berries, then smoke water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","-","-","-","-","-","P"],"basis":"estimate","any":false,"note":"Flowering varies – pick fully ripe, deep red berries."},"conservation":"","seedid":{"unit":"Seed (berry pulp removed)","look":"Glossy black, round seed with a finely bumpy coat, from red berries.","size":"About 1.8 mm across","tell":"Pulp and skin are chaff – ferment or soak the berries, then wash them through a sieve (as for R. preissii, Geraldton).","level":"species","d":{"shape":"round","L":1.8,"W":1.8,"col":"black","shiny":true},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","https://www.cgg.wa.gov.au/Profiles/cgg/Assets/ClientData/Documents/Infrastructure/GGCN001_Web_vFINAL.pdf"]],"photos":[],"sosa":false}},{"id":"ricinocarpos-undulatus","sci":"Ricinocarpos undulatus","common":"Wedding Bush","family":"Euphorbiaceae","fam":"Euphorbiaceae","alt":"Sometimes spelled <i>Ricinocarpus undulatus<\/i>","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No germination data for this species. Method based on Kings Park research on the related <i>R. brevis<\/i> – treat as a trial.","facts":[["Pre-treatment","Smoke water (trial GA)"],["Best sowing","Mar – May"],["Sowing depth","Covered ~5 mm (dark)"],["Typical germination","Not recorded"]],"check":[28,56],"stats":{"germ_pct":null,"per_gram":null},"grow":[5.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Not documented"},"calendar":["-","P","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Erect, woody shrub, 0.5–1 m (to 1.5 m)."],["Flowering","Sep – Oct (white)."],["Habitat","White sand over limestone, sandy loam, sandy clay, gravel and laterite; plains, ridges and road verges."],["Local note","Recorded in Joondalup and Wanneroo. The similar <i>R. glaucus<\/i> also grows on the Swan Coastal Plain – check labels."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruits mature Sep – Nov. The capsules (8–10 mm) split into three when ripe – collect them as they turn brown, or bag branches."],["Extraction & cleaning","Dry in a paper bag to release the seed, then sieve (genus). Leave the cream caruncle on."],["Seed quality","Good seed is plump and shiny, 5–6 × about 3.8 mm, with the caruncle intact. Cut-test a few. The caruncle attracts ants – keep seed covered."],["Storage life","Not documented. Store dry and cool and record how old each lot is."],["Typical germination","Not tested in WA nurseries. In the related <i>R. brevis<\/i> the seed has physiological dormancy and germinated better with smoke water, karrikinolide and gibberellic acid. Priming – wetting the seed for a few days, then drying it back before sowing – also helped (Kings Park)."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (estimate). Feb and Jun – Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix, free-draining."],["Pre-treatment","Soak in <b>smoke water<\/b> for 24 hours (1:9) before sowing. As a trial, treat part of the batch with gibberellic acid instead and compare."],["Sowing depth & method","<b>Cover the seed<\/b> (about 5 mm) – light suppressed germination in <i>R. brevis<\/i>, which germinated across 15–30°C."],["After sowing","Keep moist, not wet, and keep trays at least 3 months."],["Germination time","Not documented. An eastern species germinates in 4–5 weeks from fresh seed."],["Pricking out","At the first true leaves, gently."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–6 months from germination (record your own)."]]}],"difficulty_note":"","problems":[["Nothing comes up","Dormant seed. Keep the trays; try smoke water plus gibberellic acid on the next batch and record what worked."],["Seed missing from trays","Ants carry off seed with a caruncle. Stand trays where ants can't reach them."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Cuttings are worth a small trial – eastern relatives are grown from half-ripened current season's growth, but it can be difficult to strike.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Turner S.R. et al. (2018) Australian Journal of Botany 65 – seed ecology of Ricinocarpos brevis (physiological dormancy; smoke, karrikinolide and GA; light suppresses germination)","url":"connectsci.au/bt/article-abstract/65/8/661/105354/"},{"title":"Turner S.R. – ANPC WA seed workshop (2019): seed priming improved Ricinocarpos germination","url":"anpc.asn.au/wp-content/uploads/2019/06/TurnerWAWorkshopweb.pdf"},{"title":"Flora of Australia online – Ricinocarpos undulatus (fruit Sep – Nov; capsule and seed description)","url":"profiles.ala.org.au/opus/foa/profile/Ricinocarpos%20undulatus"},{"title":"Australian Plants Society NSW – Ricinocarpos bowmanii and R. pinifolius (fresh seed in 4–5 weeks; cuttings of half-ripened growth)","url":"resources.austplants.com.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Trial","note":"Eastern relatives: half-ripened growth, can be difficult to strike.","guide":null},{"method":"Seed","suitability":"Difficult","note":"Dormant; smoke water, trial GA (related R. brevis).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub – not divided.","guide":null}],"collect":{"cal":["-","-","-","-","-","-","-","-","P","B","B","-"],"basis":"guide","any":false,"note":"Collect capsules as they turn brown, before they split into three."},"conservation":"","seedid":{"unit":"Seed (caruncle left on)","look":"Ellipsoid seed with a smooth, cream to yellowish-white fleshy caruncle at one end, from a capsule 8–10 mm long that splits into three. In the genus the coat is smooth, shiny and often blotched.","size":"5–6 mm long, 3.7–3.8 mm wide","tell":"Chaff is the three capsule segments and the central column. Good seed is plump and shiny with the caruncle intact; cut-test a few.","level":"species","d":{"shape":"oval","L":5.5,"W":3.75,"col":"lightbrown","shiny":true,"mottle":true,"aril":"cream"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Halford D.A. & Henderson R.J.F. (2007) – revision of Ricinocarpos (seed and caruncle)","https://www.biodiversitylibrary.org/part/299751"]],"photos":[],"sosa":false}},{"id":"santalum-acuminatum","sci":"Santalum acuminatum","common":"Quandong","family":"Santalaceae","fam":"Santalaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate-Difficult","provisional":false,"confidence":"High","confidence_note":"Well researched: after-ripening, seed-coat cracking, gibberellins and host plants are all published.","facts":[["Pre-treatment","Aged seed; crack shell; GA"],["Best sowing","May – Jul"],["Sowing depth","About the stone's thickness"],["Typical germination","53%"],["Seed per 100 plants","769 g"]],"check":[21,84],"stats":{"germ_pct":53,"per_gram":0.13},"grow":[6.0,12.0],"storage":{"kind":"ripen","months":12,"text":"Improves with 1–3 years' storage"},"calendar":["-","-","-","P","B","B","B","P","-","-","-","-"],"snapshot":[["Habit","Small tree or shrub, 1–7 m. A <b>root hemiparasite<\/b> – needs host plants."],["Flowering","Variable (green-white to red-brown); shiny red fruits ripen in late spring–summer."],["Habitat","Sand and clay loam; coastal dunes, gravelly plains, granite outcrops and creek beds."],["Local note","Recorded in the City of Joondalup. The fruit is a well-known bush food."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fruits once they turn shiny red, in late spring–summer."],["Extraction & cleaning","Remove the flesh and dry the hard, pitted stones."],["Seed quality","Check stones are heavy and sound; discard cracked or light ones."],["Storage life","Needs <b>after-ripening<\/b>: germination rose from about 5–30% after one year's storage to 35% after three years (ANBG). Don't let treated seed dry out again – drying then rewetting inhibits germination."],["Typical germination","About <b>53%<\/b> after a silica + gibberellin treatment (Alcoa, 1 test). Stones are large – about 0.13 seedlings per gram, roughly 770 g of stones per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>May – Jul<\/b> – germination is best at about 15°C, so winter suits it. Apr and Aug workable."],["Seed mix","Free-draining, sterile mix in deep pots."],["Pre-treatment","• Use stored (after-ripened) seed.<br/>• <b>Crack the shell<\/b> gently in a vice, or saw a nick into it (sow with the nick facing down).<br/>• Gibberellins improve germination – research found GA4 far more effective than GA3."],["Sowing depth & method","Cover the stone to about its own thickness. <b>Sow with a host plant<\/b> in the same pot, e.g. a native grass, legume or small shrub."],["After sowing","Keep moist, not wet, through winter."],["Germination time","Usually within a month but can take up to 3–4 months."],["Pricking out","Avoid – sow direct into the pot with its host."],["Shade house & hardening","Grow on with the host in light shade, then harden off to full sun."],["Time to planting size","Est. 6–12 months (record your own). Plant out with its host, or next to a suitable host."]]}],"difficulty_note":"","problems":[["No germination","Fresh seed or intact shell. Use seed stored 1+ years; crack or nick the shell."],["Seedlings stall after a few months","No host. Pot up with a host plant (e.g. <i>Acacia saligna<\/i>, a native grass)."],["Stones rot","Too wet. Free-draining mix; water less."]],"other":"Grafting onto seedling stock is also used for fruit production. Acacia saligna was the best host in a Jurien Bay trial.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Santalum acuminatum (after-ripening, cracking the testa, 15°C)","url":"anbg.gov.au/gnp/interns-2002/santalum-acuminatum.html"},{"title":"ANPSA – Santalum acuminatum profile (nicking the shell, sowing with a host, 3–12 weeks)","url":"anpsa.org.au/plant_profiles/santalum-acuminatum/"},{"title":"Loveys B.R. & Jusaitis M. (1994) Aust. J. Botany 42 – Stimulation of germination of quandong seeds (gibberellins)","url":"connectsci.au/bt/article-abstract/42/5/565/4933/"},{"title":"Nge F.J. et al. (2019) Plant and Soil – host plants for Santalum acuminatum at Jurien Bay","url":"link.springer.com/article/10.1007/s11104-019-03966-6"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Grafting onto seedling stock is used instead.","guide":null},{"method":"Seed","suitability":"Main method","note":"Aged seed, cracked shell, gibberellin; sow with a host.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Root hemiparasite.","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","B","B"],"basis":"guide","any":false,"note":"Collect fruits once shiny red; peel the flesh while soft."},"conservation":"","seedid":{"unit":"Stone (nut) with the flesh peeled off","look":"Hard, round, woody stone with a deeply wrinkled, brain-like surface. Fruit bright red, to 3 cm.","size":"Sources give 10–25 mm across","tell":"Peel the flesh while it's soft – it's hard to remove once dry. Crack or nick a few shells to check the kernel.","level":"species","d":{"shape":"stone","L":18,"W":17,"col":"tan","texture":"wrinkled"},"sources":[["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["PlantNET – Flora of New South Wales (genus and species descriptions)","https://plantnet.rbgsyd.nsw.gov.au"],["ANPSA – plant profiles","https://anpsa.org.au/plant_profiles/"]],"photos":[],"sosa":true}},{"id":"scaevola-canescens","sci":"Scaevola canescens","common":"Grey Scaevola","family":"Goodeniaceae","fam":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus (strikes readily) plus this species' hairy foliage.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Nov – Jan"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"length_mm":[50.0,80.0],"check":[28,56],"calendar":["B","P","P","P","P","-","-","-","-","P","B","B"],"snapshot":[["Habit","Prostrate to ascending shrub, 0.1–0.5 m. Densely hairy grey leaves; stems are brittle."],["Flowering","Mar – Oct (white to white-purple), in spikes in the leaf axils."],["Habitat","Sand, often with lateritic gravel or limestone."],["Local note","Recorded in the northern Perth area (Wanneroo and Stirling LGAs)."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Jan<\/b>, on new growth after flowering ends, while it is warm. Oct and Feb – May are workable if you choose shoots without flower spikes. Avoid Jun – Sep (cool, peak flowering)."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm tips."],["Selecting material","Vigorous <b>non-flowering<\/b> tips. Flowers form in the leaf axils along the stem, so check the whole cutting and pinch off any spikes."],["Pre-treatment","• Handle gently – stems snap easily. Carry in a rigid tray or box.<br/>• Strip lower leaves by cutting, not tearing.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>) for soft tips; semi-hardwood strength (3 g/L, <b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Extra free-draining: standard sand/coir mix with extra coarse sand or perlite."],["Environment","<b>Keep foliage as dry as possible.<\/b> Dense hairy leaves rot under heavy mist. Water the mix rather than the leaves, give good airflow, and use bottom heat (root zone about 21–24°C)."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; keep water off the foliage.<br/>• Remove any leaves showing grey mould promptly."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily; the hairy foliage makes rot the main risk.","problems":[["Grey fuzz or blackened leaves","Too humid/wet. Cut back misting, remove affected material, improve airflow."],["Snapped stems","Brittle stems – transport in rigid containers and use a dibber when setting."],["Cuttings flowering, not rooting","Take shoots without axillary flower spikes."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if a plant has suckered or rooted along its stems.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Soft to semi-hardwood tips; keep hairy foliage dry.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Only if stems have rooted or suckered.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Whole fruit (hard stone, sown whole)","look":"Egg-shaped fruit, narrower at the base, usually holding one seed. Colour isn't published.","size":"2–4 mm long","tell":"Not published.","level":"species","d":{"shape":"oval","L":3,"W":2,"col":"unknown"},"sources":[["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"],["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"]],"photos":[],"sosa":false}},{"id":"scaevola-crassifolia","sci":"Scaevola crassifolia","common":"Thick-leaved Fan-flower","family":"Goodeniaceae","fam":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Cuttings are the standard method in WA nurseries (e.g. Geraldton community nursery).","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[28,56],"calendar":["P","P","B","B","B","-","-","-","-","P","P","P"],"snapshot":[["Habit","Erect or spreading shrub, 0.1–1.5 m and up to 3 m wide. Young growth is sticky; thick, toothed, egg-shaped to round leaves."],["Flowering","Jul – Dec, also Jan – Feb (blue, mauve or white fans)."],["Habitat","Sand on coastal dunes, plains and limestone cliffs."],["Local note","Recorded in Joondalup and Wanneroo. Flower colour and habit vary – cuttings keep the parent's form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b> – warm, and outside the main flowering period. Oct – Feb is workable with non-flowering shoots (shade well in summer). Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips. Flower spikes carry leafy bracts – check closely and pinch them off."],["Pre-treatment","• New growth is sticky – wipe the blade often.<br/>• Strip lower leaves; cut the large remaining leaves back by a third to a half.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Standard humid frame with bottom heat, bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix.<br/>• Tip-prune young plants for dense growth."]]}],"difficulty_note":"<b>Easy.<\/b> Semi-hardwood cuttings in the warmer months are the standard method.","problems":[["Wilting in the first week","Too much leaf area. Trim leaves harder; keep the frame closed."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering tips or wait for the Mar – May window."]],"other":"Seed – large seeds are produced and sometimes germinate naturally; cuttings are preferred to keep flower colour and habit.","sources":[{"title":"Australian Native Plants Society (A base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>); 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Hairless leaves tolerate misting better than <i>S. canescens<\/i>, but fine stems collapse quickly if the mix is waterlogged or dries out. Keep evenly moist, with bottom heat and bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on gently – fine roots break easily. Single cuttings per tube make this easier.<br/>• Pinch tips once growing to encourage branching."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> The genus strikes readily; the fine stems are less forgiving of watering errors.","problems":[["Fine stems wilt or collapse","Mix drying out or waterlogged. Keep evenly moist; check daily."],["Cuttings flower instead of rooting","Pinch off terminal flower buds; use side shoots."],["Root damage when potting on","Strike one cutting per tube instead of community pots."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if stock plants have suckered.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Non-flowering side shoots (provisional rating).","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Scaevola seed is generally difficult.","guide":null},{"method":"Division","suitability":"Possible","note":"Only if stock plants have suckered.","guide":null}],"collect":null,"conservation":"","seedid":{"unit":"Whole fruit (hard stone, sown whole)","look":"Cylindrical to oval fruit. Colour isn't published.","size":"About 3 mm across","tell":"Not published.","level":"species","d":{"shape":"oval","L":3.6,"W":3,"col":"unknown"},"sources":[["Wikipedia – species pages (citing Flora of Australia / FloraBase)","https://en.wikipedia.org"],["FloraBase – WA Herbarium","https://florabase.dbca.wa.gov.au"]],"photos":[],"sosa":false}},{"id":"spinifex-hirsutus","sci":"Spinifex hirsutus","common":"Hairy Spinifex","family":"Poaceae","fam":"Poaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Method based on published trials with the closely related <i>S. sericeus<\/i> and general spinifex practice.","facts":[["Wood type","Runner (stolon) sections"],["Best months","Mar – May"],["Cutting length","10–15 cm, 1–2 nodes"],["Hormone (IBA)","Optional (1.5 g/L)"]],"length_mm":[100.0,150.0],"check":[28,56],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, sending long runners across the sand. Broad, flat, silvery leaves, hairy on both sides."],["Flowering","Oct – Jan. Male and female flowers are on separate plants; female heads are large spiky balls that roll in the wind."],["Habitat","White sand on coastal dunes; an important stabiliser at the toe of unstable dunes."],["Local note","Recorded in the City of Joondalup. Less common than <i>S. longifolius<\/i> on the Cottesloe foreshore."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, when runners are young, green and actively growing, giving plants ready for winter planting. Sep – Feb is workable. Avoid Jun – Aug (slow growth)."],["Wood type","<b>Runner (stolon) sections<\/b> – not woody cuttings. Use young, green runners, not old brown ones."],["Cutting size","<b>Nursery tubes:<\/b> 10–15 cm sections with at least one (ideally two) nodes.<br/><b>Direct planting on site:<\/b> 40–50 cm runners, buried about halfway in damp sand."],["Selecting material","Actively growing runners from the dune edge. Plants are male or female, so collect from several plants if you want seed-producing plantings later."],["Pre-treatment","• Keep runners moist and shaded after collecting – they dry out fast.<br/>• Cut just below a node; trim leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. The hairy leaves of this species can hold water, so mist lightly."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery advises collecting from female plants growing near males. <i>S. sericeus<\/i> research found seed germinates far better in darkness (56%) than light (14%), so cover seed. Division of tussocks also works but survived less well than rooted cuttings in trials (31% vs 40%).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"}]},"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA community-nursery method for spinifex plus trial results for the closely related <i>S. sericeus<\/i>.","facts":[["Pre-treatment","Cut off spines/awns; smoke water"],["Best sowing","Mar – May"],["Sowing depth","10 mm (needs dark)"],["Typical germination","Not recorded"]],"check":[10,20],"stats":{"germ_pct":null,"per_gram":null},"grow":[6.0,9.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, with long runners and silvery, hairy leaves."],["Flowering","Oct – Jan. Male and female flowers on separate plants; female heads are large spiky balls."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the spiky female heads in summer as they ripen and start to break away. <b>Collect from female plants growing near male plants<\/b> – isolated females set little seed."],["Extraction & cleaning","Pull the seed-bearing spikelets from the head and <b>cut off the long spines (awns)<\/b>."],["Seed quality","Many spikelets are empty – squeeze-test a few."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded for this species. In <i>S. sericeus<\/i> trials, seed germinated far better in darkness (56%) than in light (14%)."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (provisional). Sep – Feb workable. Avoid Jun – Aug."],["Seed mix","Coarse, sandy, free-draining mix."],["Pre-treatment","Cut off the awns; water in with smoke water after sowing (Geraldton method)."],["Sowing depth & method","<b>Cover well (about 10 mm)<\/b> – seed germinates best in the dark. Sow en masse in deep trays."],["After sowing","Water in with smoke water; keep moist, not wet."],["Germination time","About <b>10 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves, into deep tubes."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Slow – est. 6–9 months from sowing (record your own). Plant out in late autumn or winter."]]}],"difficulty_note":"","problems":[["Little germination","Seed from isolated females, or sown too shallow. Collect near males; cover seed."],["Seedlings rot","Mix too wet. Use coarse sand and water less."],["Slow growth","Normal for spinifex. Full sun, deep tubes, light feeding."]],"other":"Rooted runner sections (Cuttings Guide) and tussock division (Division Guide) are alternatives.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes (Spinifex sericeus seed in dark vs light; division)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"division":{"difficulty":"Moderate-Difficult","provisional":true,"confidence":"Medium","confidence_note":"Based on <i>S. sericeus<\/i> trials, where divided tussocks survived less well (31%) than rooted runner cuttings (40%).","facts":[["Division type","Tussock division"],["Best months","Mar – May"],["Division size","Rooted clumps with runners"],["Time to establish","Slow – several weeks"]],"check":[28,56],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, with long runners and silvery, hairy leaves."],["Flowering","Oct – Jan. Male and female flowers on separate plants."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the City of Joondalup. Dune plants are protected – use nursery stock or approved salvage."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, while growing actively, giving plants ready for winter planting. Sep – Feb workable. Avoid Jun – Aug."],["Division type","<b>Tussock division<\/b> – small clumps with rooted runners."],["Division size","Small clumps with <b>as much root and rooted runner as possible<\/b>."],["Selecting stock","Vigorous nursery stock plants. Collect male and female plants if you want seed-producing plantings later."],["Preparation","• Keep pieces moist and shaded – they dry out fast.<br/>• Cut clumps apart with a sharp spade or knife.<br/>• Trim leaves back by about half."],["Potting","Pot into <b>deep tubes<\/b> of coarse sand or a very sandy mix. Firm in and water well."],["Environment","Shade house or light shade until new growth shows; keep the sand moist, not wet."],["Time to establish","Slow – allow several weeks for new roots and shoots. Plants take many months to reach planting size."],["Aftercare","• Harden off, then grow on in full sun.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate–Difficult (provisional).<\/b> Divisions survived less well than rooted runner cuttings in trials. Runner cuttings or seed are usually better choices.","problems":[["Divisions dry out and die","Roots exposed too long. Work in the shade; keep pieces in damp bags."],["Base rots","Mix too wet. Use coarse sand, water less."],["Slow establishment","Normal for spinifex. Full sun once hardened; deep tubes."]],"other":"","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus division vs stolon cuttings)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"}]},"options":[{"method":"Cuttings","suitability":"Good","note":"Runner (stolon) sections with 1–2 nodes.","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"The usual nursery method; cover seed (needs dark).","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Tussock divisions work but survived less well than rooted runners.","guide":"division"}],"collect":{"cal":["B","B","P","-","-","-","-","-","-","-","-","B"],"basis":"guide","any":false,"note":"Collect female heads as they break away, from females near male plants."},"conservation":"","seedid":{"unit":"Spikelets from the female seed heads","look":"The ball-shaped female head breaks into rays, each with one lance-shaped spikelet near its base and a long bristle beyond.","size":"Spikelet 12–18 mm","tell":"The long bristles are chaff. Heads from female plants growing near male plants have higher viability (S. longifolius).","level":"species","d":{"shape":"floret","L":15,"W":2.4,"col":"straw","awn":30,"bends":0,"bristle":true},"sources":[["AusGrass2 – Grasses of Australia (floret and grain descriptions)","https://keys.lucidcentral.org/keys/v3/AusGrass/"],["PlantNET – Flora of New South Wale
