eed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Banksias are rarely grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Extract from cones; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree / shrub.","guide":null}]},{"id":"banksia-prionotes","sci":"Banksia prionotes","common":"Acorn Banksia","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data from 3 tests plus Banksia seed-handling guidance.","facts":[["Pre-treatment","None (heat cones to open)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","57%"],["Seed per 100 plants","3.4 g"]],"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree or shrub to 10 m. No lignotuber – killed by fire and regenerates only from seed."],["Flowering","Feb – Aug (cream and orange ‘acorn’ spikes)."],["Habitat","Sand, sandy loam, clay, laterite and granite; sandplains, dunes and slopes."],["Local note","Recorded in the Wanneroo LGA. Highly susceptible to <i>Phytophthora<\/i> dieback. Good cut flower."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed is mostly held in the cone until fire, releasing only slowly otherwise. Collect cones <b>at least 12 months old<\/b>, with closed follicles."],["Extraction & cleaning","Open follicles with heat: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 minutes), or pass over a burner, soak for several hours and dry in a warm oven; repeat if needed. Never microwave cones."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Short-lived once extracted<\/b> – keep seed in the cone until the sowing season."],["Typical germination","About <b>57%<\/b> (untreated, Alcoa, 3 tests). About <b>29 seedlings per gram<\/b> – roughly 3.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (about 20–25°C). Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> once the seed is out of the follicle."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in. Water from below if possible; watch for damping off."],["Germination time","About <b>3–5 weeks<\/b> (21–35 days reported)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or dieback. Very low-P feed; strict hygiene."],["Follicles won't open","Not enough heat. Repeat the heat-and-soak cycle."]],"other":"Cuttings are difficult; grafting onto <i>B. integrifolia<\/i> or <i>B. serrata<\/i> has been used for humid climates.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"ANPSA – Banksia prionotes profile (seed retained until fire; cuttings difficult; grafting; cut flower)","url":"anpsa.org.au/plant_profiles/banksia-prionotes/"},{"title":"Wikipedia – Banksia grandis and Banksia prionotes (seed release, germination times)","url":"en.wikipedia.org"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Cuttings are difficult to strike.","guide":null},{"method":"Seed","suitability":"Main method","note":"Heat old cones to open; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"banksia-sessilis","sci":"Banksia sessilis","common":"Parrot Bush","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery test data (as <i>Dryandra sessilis<\/i>) and WA seed-handling notes available.","facts":[["Pre-treatment","None (smoke water optional)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","42%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Upright, prickly shrub or small tree to 6 m. Killed by fire and regrows from seed."],["Flowering","Mainly Jul – Nov (cream-yellow domes)."],["Habitat","Sandy soils over laterite or limestone."],["Local note","The Swan Coastal Plain form is var. <i>cygnorum<\/i>. Formerly <i>Dryandra sessilis<\/i>."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Not serotinous: most seed is <b>released in autumn<\/b> even without fire. Collect ripe heads in summer, before release."],["Extraction & cleaning","Put heads in a paper bag in a warm place or a low oven (<b>no hotter than 60°C<\/b>) until the follicles open; cut stubborn follicles with secateurs."],["Seed quality","Good seed is firm and white inside."],["Storage life","Seed in the soil is short-lived, but cleaned seed keeps well <b>stored dry and cool<\/b>."],["Typical germination","About <b>42%<\/b> (untreated, Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b> Geraldton soaks seed in smoke water (1:9) for 24 hours."],["Sowing depth & method","Direct sow 1–2 seeds per tube, just covered (about 3–5 mm)."],["After sowing","Water in; avoid excess water – damping off can be a problem."],["Germination time","About <b>2–6 weeks<\/b> (14 days at Geraldton)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Water less, sterile mix, good airflow."],["Few seeds in heads","Collected too late – seed already released in autumn. Collect in summer."],["Yellowing seedlings","Phosphorus toxicity. Use very low-P fertiliser."]],"other":"Cuttings have proved virtually impossible – seed is the only practical method. Flowers within about two years.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 13 – Dryandra (now Banksia). Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"},{"title":"Wikipedia – Banksia sessilis (seed release, fire response, cuttings)","url":"en.wikipedia.org/wiki/Banksia_sessilis"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Cuttings have proved virtually impossible.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; sow as it cools after March.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub.","guide":null}]},{"id":"bossiaea-eriocarpa","sci":"Bossiaea eriocarpa","common":"Common Brown Pea","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (40 tests) and WA hard-seed guidance available.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","44%"],["Seed per 100 plants","0.4 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect or straggly, spreading shrub, 0.2–1 m."],["Flowering","Jul – Nov (yellow and brown-red pea flowers)."],["Habitat","Usually sandy soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and shed seed when ripe. <b>Bag developing pods<\/b> with stockings or muslin."],["Extraction & cleaning","Rub and sieve the small seed from pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps many years when dry (typical of hard-coated pea seed)."],["Typical germination","About <b>44%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>229 seedlings per gram<\/b> – under 0.5 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or pour near-boiling water over and soak overnight. Sow swollen seed; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>2–3 mm<\/b>. Direct sow a few seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet. Keep to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Very small seed for a pea – a little goes a long way.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"calothamnus-quadrifidus","sci":"Calothamnus quadrifidus","common":"One-sided Bottlebrush","family":"Myrtaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Low","confidence_note":"ANPSA notes the genus is ‘presumably’ grown from cuttings. Method follows related melaleucas – trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Erect, compact or spreading shrub, usually 0.9–2 m."],["Flowering","Jun – Dec (red, one-sided brushes)."],["Habitat","Wide variety of soils and habitats."],["Local note","Recorded in the Wanneroo LGA. Several subspecies exist – label stock by subspecies and provenance."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, after flowering, once the new growth has firmed. Dec and May are workable. Avoid Jun – Nov (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm, as for <i>Melaleuca<\/i>."],["Selecting material","Non-flowering side shoots. Keep subspecies and forms separate."],["Pre-treatment","• Strip the needle-like leaves from the lower half to two-thirds.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Expected to behave like related melaleucas, but untested here. Seed is easy and is the main method.","problems":[["Cuttings brown off","Too dry or too soft. Use firmer material and keep humidity up until rooted."],["Callus, no roots","Trim and re-set; try a lower hormone strength."],["Slow in winter","Use bottom heat, or wait for the Jan – Apr window."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Melaleuca genus page (75–100 mm cuttings, strip, wound, hormone)","url":"anpsa.org.au/genera/melaleuca/"}]},"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (39 tests) and WA community-nursery method available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","26%"],["Seed per 100 plants","0.2 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Erect, compact or spreading shrub, usually 0.9–2 m."],["Flowering","Jun – Dec (red, one-sided brushes)."],["Habitat","Wide variety of soils and habitats."],["Local note","Recorded in the Wanneroo LGA. Several subspecies exist – label stock by subspecies and provenance."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Woody capsules stay on the older stems for years. Collect capsules from <b>older wood<\/b> (at least a year old) at any time of year."],["Extraction & cleaning","Place capsules in an open tray or paper bag in a warm spot; fine seed is released in a few days. No need to separate seed from chaff."],["Seed quality","Very fine seed mixed with chaff – a cut-test and count gives seeds per gram."],["Storage life","<b>Long<\/b> if kept dry and cool (typical of capsule-fruited Myrtaceae)."],["Typical germination","About <b>26%<\/b> (untreated, Alcoa nursery average). About <b>572 seedlings per gram<\/b> – a pinch goes a long way."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b> (15–25°C). Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix with a smooth surface."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix seed with dry, sterile yellow sand and sprinkle from a spice jar. <b>Sow on the surface<\/b> and press in lightly; don't bury."],["After sowing","Water in with smoke water (Geraldton method) using a very fine spray, or water from below (bog method) so seed isn't washed away."],["Germination time","About <b>7–10 days<\/b> (Geraldton nursery)."],["Pricking out","When the <b>second pair of leaves<\/b> appears (about 2 cm). Seedlings are tiny – handle by the leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings too crowded","Sown too thickly. Dilute seed well with sand."],["Seed washed into clumps","Overhead watering too coarse. Use a fine mist or bottom watering."],["Damping off","Crowding and wet mix. Thin sowing, airflow, sterile mix."]],"other":"Cuttings are worth trialling if a particular form is wanted (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Presumed to strike like related melaleucas (provisional).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Easy from seed held in old capsules.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"carpobrotus-virescens","sci":"Carpobrotus virescens","common":"Coastal Pigface","family":"Aizoaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"Method from published advice for the closely related <i>C. glaucescens<\/i>; pigface is widely grown from stem pieces.","facts":[["Wood type","Succulent stem pieces"],["Best months","Sep – Nov; Mar – Apr"],["Cutting length","10–15 cm (tubes)"],["Hormone (IBA)","Not needed"]],"length_mm":[100.0,150.0],"calendar":["P","P","B","B","P","-","-","P","B","B","B","P"],"snapshot":[["Habit","Prostrate succulent groundcover, 0.1–0.3 m high and 0.5–3 m wide, rooting along the stems."],["Flowering","Jun – Dec or Jan (purple-pink, sometimes white), followed by fleshy fruit."],["Habitat","Coastal limestone and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Collect only from plants you are sure are native – the introduced Hottentot Fig (<i>C. edulis<\/i>) is naturalised on some coasts."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Sep – Nov<\/b> and <b>Mar – Apr<\/b>, when plants are actively growing. Aug, Dec – Feb and May are workable. Avoid Jun – Jul (slow growth; cuttings rot in cold, wet mix)."],["Wood type","<b>Succulent stem (runner) pieces<\/b> – not woody cuttings. Use firm stems with plump leaves."],["Cutting size","<b>Tubes:<\/b> 10–15 cm pieces with 2–3 leaf pairs.<br/><b>Direct planting / layering:<\/b> about 30 cm, with at least 5 cm left above the sand (ANBG, <i>C. glaucescens<\/i>)."],["Selecting material","Healthy runners. Pieces that have already rooted at the nodes are ideal. Avoid shrivelled or damaged stems."],["Pre-treatment","• Remove the leaves from the lowest 1–2 nodes.<br/>• Leave the cut ends to dry in the shade for a day or two before setting – this reduces rot.<br/>• No hormone needed."],["Rooting hormone","Not needed – stems root readily at the nodes."],["Propagation mix","Coarse washed sand or a very sandy, free-draining mix."],["Environment","Open bench in bright light or light shade. <b>No mist and no humid frame<\/b> – succulent leaves rot. Water sparingly until rooted."],["Expected strike time","Not documented, but usually quick – check from about 3 weeks."],["Post-treatment / aftercare","• Grow on in full sun.<br/>• Pot on or plant out once roots hold the mix together.<br/>• Water sparingly – overwatering is the main cause of losses."]]}],"difficulty_note":"<b>Easy.<\/b> Pigface roots readily from stem pieces, and rooted runners can simply be cut off and potted up.","problems":[["Stems go soft and rot","Too wet or humid. Dry the cut ends first, water less, move out of the humid frame."],["Leaves shrivel","Too dry for too long. Water lightly once set."],["Pale, stretched growth","Not enough light. Move to full sun."]],"other":"Layering – pin a runner onto a pot of sand beside the parent and cut it free once rooted.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Carpobrotus glaucescens (layering, 30 cm stem pieces, division)","url":"anbg.gov.au/gnp/interns-2005/carpobrotus-glaucescens.html"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (9 tests) and a WA community-nursery method are available.","facts":[["Pre-treatment","Ferment fruit; smoke water"],["Best sowing","Mar – May"],["Sowing depth","Surface"],["Typical germination","21%"],["Seed per 100 plants","0.2 g"]],"calendar":["-","P","B","B","B","P","-","-","P","P","-","-"],"snapshot":[["Habit","Prostrate succulent groundcover, 0.1–0.3 m high and 0.5–3 m wide."],["Flowering","Jun – Dec or Jan (purple-pink, sometimes white), followed by fleshy fruit."],["Habitat","Coastal limestone and sand dunes."],["Local note","Recorded in the Wanneroo LGA. Collect only from plants you are sure are native – the introduced Hottentot Fig (<i>C. edulis<\/i>) is naturalised on some coasts."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect the fleshy fruits when soft and fully ripe, after flowering."],["Extraction & cleaning","<b>Ferment:<\/b> soak the crushed fruit in water for 4–5 days, then wash the tiny seeds out through a fine sieve and dry them."],["Seed quality","Seed is very fine – each fruit holds many seeds."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","About <b>21%<\/b> after a dry-heat treatment (Alcoa nursery average, 9 tests). About <b>454 seedlings per gram<\/b> – roughly 0.2 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Feb, Jun and Sep – Oct are workable. Avoid the coldest and hottest months."],["Seed mix","Standard sterile native seed mix, extra free-draining."],["Pre-treatment","Ferment and wash the seed (above). Alcoa used a dry-heat pulse instead. Water in with smoke water after sowing."],["Sowing depth & method","<b>Surface-sow.<\/b> Mix the fine seed with dry yellow sand in a spice jar and shake it evenly over the tray (Geraldton method). Press in lightly."],["After sowing","Water in with smoke water using a fine mist; keep just moist – succulent seedlings rot if wet."],["Germination time","About <b>6–8 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have two pairs of leaves and can be handled."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings rot","Too wet. Water less, improve drainage and airflow."],["Seed washed into clumps","Use bottom watering or a fine mist."],["Poor germination","Fruit not fully ripe, or seed not cleaned. Collect soft, ripe fruit and ferment fully."]],"other":"Stem cuttings are quicker and very reliable (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Carpobrotus glaucescens (grown from seed or cuttings)","url":"anbg.gov.au/gnp/interns-2005/carpobrotus-glaucescens.html"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Stem pieces root very easily; rooted runners can be lifted.","guide":"cuttings"},{"method":"Seed","suitability":"Good","note":"Ferment fruit, sow fine seed on the surface; 6–8 days.","guide":"seed"},{"method":"Division","suitability":"Possible","note":"Lift stems that have rooted – treat as cuttings.","guide":null}]},{"id":"corymbia-calophylla","sci":"Corymbia calophylla","common":"Marri","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (66 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","About 5 mm"],["Typical germination","60%"],["Seed per 100 plants","5.3 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree to 40 m (rarely a mallee), with rough, tessellated bark."],["Flowering","Dec or Jan – May (white or pink)."],["Habitat","Wide range: clay loam, sandy clay, gravel, grey sand over limestone, granite and laterite."],["Local note","Recorded in the Wanneroo LGA. Large urn-shaped gumnuts (‘honky nuts’)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown, woody gumnuts when the valves look ready to open."],["Extraction & cleaning","Keep gumnuts warm and dry in a tray or paper bag until the large winged seed is released."],["Seed quality","Large seed – easy to check by cutting a few open."],["Storage life","<b>Long<\/b> if stored cool and dry (eucalypt seed keeps its viability a long time)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>19 seedlings per gram<\/b> – roughly 5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> A dip in dilute bleach (10%) to surface-sterilise the seed can help."],["Sowing depth & method","Large seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube (preferred) or space out in trays."],["After sowing","Water in; keep moist."],["Germination time","Usually within about <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, avoid crowding."],["Leggy seedlings","Too much shade. Move to brighter light once up."],["Roots circling","Kept too long in tubes. Plant out or pot on sooner."]],"other":"Fast-growing – time sowings so trees aren't held in tubes too long.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Eucalypts are very difficult from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 60% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"daviesia-divaricata","sci":"Daviesia divaricata","common":"Marno","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data from 12 tests; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","28%"],["Seed per 100 plants","9.2 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Shrub, 0.4–2 m."],["Flowering","Aug – Nov (pea flowers)."],["Habitat","Sand, limestone and laterite."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in late spring–summer and <b>release seed as soon as they are ripe<\/b>. Tie fine mesh or stocking bags over developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow to remove debris."],["Seed quality","Hard-seeded: fresh seed stays dormant until the coat is treated. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps for many years when dry."],["Typical germination","About <b>28%<\/b> after boiling-water treatment (Alcoa nursery average, 12 tests). About <b>11 seedlings per gram<\/b> – roughly 9 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop seed into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over the seed (10:1) and soak overnight. Sow the swollen seed; re-treat the rest."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet. Don't let swollen seed dry out."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage – early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Mix too wet, or boiled too long. Keep to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Boiling water scalds – use tongs, a strainer and heat-proof containers.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"daviesia-nudiflora","sci":"Daviesia nudiflora","common":"","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data available (small number of tests); method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","22%"],["Seed per 100 plants","1.8 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Shrub, 0.3–1.5 m."],["Flowering","Jun – Sep (orange-yellow and red-brown pea flowers)."],["Habitat","Sandy and clayey soils and laterite; low rises and flats."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and <b>release seed as soon as they are ripe<\/b>. Tie nylon stockings or muslin bags over developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow to remove debris."],["Seed quality","Hard-seeded: nearly all fresh seed is dormant until the seed coat is treated. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Hard-coated pea-family seed keeps for many years when dry (related <i>Acacia<\/i> seed has stayed viable 50+ years)."],["Typical germination","About <b>22%<\/b> after boiling-water treatment (Alcoa nursery average, few tests). About <b>57 seedlings per gram<\/b> – roughly 1.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan (heat stress, damping off)."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop seed into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over seed (at least 10 parts water to 1 part seed) and leave to soak overnight. <b>Sow seed that has swollen<\/b>; re-treat seed that hasn't."],["Sowing depth & method","Cover to about twice the seed's thickness, roughly <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin, or sow in trays."],["After sowing","Water in; keep moist, not wet. Sow soon after treatment – don't let swollen seed dry out."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage – early, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very low germination","Seed coat not broken. Re-treat unswollen seed; try a dry-heat pulse (80–120°C) on the next batch."],["Swollen seed rots","Mix too wet or seed damaged by overlong boiling. Keep boiling to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow, avoid crowding."]],"other":"Treat with care: boiling water scalds – use tongs, a strainer and heat-proof containers.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"daviesia-triflora","sci":"Daviesia triflora","common":"","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data available (2 tests); method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","26%"],["Seed per 100 plants","9.2 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Broom-like, almost leafless shrub, 0.25–0.6 m."],["Flowering","May – Sep (pea flowers)."],["Habitat","White or grey sand and laterite."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in late spring–summer and shed seed as soon as ripe. Bag developing pods with fine mesh and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats."],["Storage life","<b>Long.<\/b> Many years when dry."],["Typical germination","About <b>26%<\/b> after boiling-water treatment (Alcoa nursery average, 2 tests). About <b>11 seedlings per gram<\/b> – roughly 9 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or a near-boiling overnight soak. Sow the swollen seed; re-treat the rest."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Very low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Too wet or over-boiled."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Small, slender plant – grow in deep tubes and avoid overpotting.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"dianella-revoluta","sci":"Dianella revoluta","common":"Blueberry Lily / Flax Lily","family":"Asphodelaceae (Hemerocallidoideae)","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and dormancy research available; nursery results vary widely.","facts":[["Pre-treatment","GA 24 h + smoke water 24 h"],["Best sowing","Mar – Apr"],["Sowing depth","3–5 mm"],["Typical germination","<1% untreated"]],"calendar":["-","P","B","B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.3–1.5 m."],["Flowering","Sep – Dec (blue-purple), followed by blue berries."],["Habitat","White or yellow sand, sandy clay, laterite, loam and clay."],["Local note","Recorded in Joondalup and Wanneroo (var. <i>divaricata<\/i> is common on the coast)."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect ripe, deep-blue berries in summer after flowering."],["Extraction & cleaning","Soak berries in water for a few days, then rub and wash off the pulp in a sieve. Dry the shiny black seed before storing."],["Seed quality","Seed is dormant (morphophysiological dormancy): untreated seed gave under 1% in Alcoa tests."],["Storage life","Not well documented. Store cleaned, dried seed sealed and cool."],["Typical germination","Untreated: <b>under 1%<\/b> (Alcoa, 19 tests). Treated seed does much better – record your own results."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> – seed experiences warm conditions, then germinates as the weather cools (Geraldton: not until late April). Feb and May workable."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Gibberellic acid<\/b> (1 part per thousand) for 24 hours, then <b>smoke water<\/b> (1:9) for 24 hours (Geraldton method). Research shows warm stratification followed by smoke also breaks dormancy."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Sow in trays or direct into tubes."],["After sowing","Keep moist and be patient – don't discard trays too early."],["Germination time","About <b>58–75 days<\/b> (Geraldton nursery)."],["Pricking out","When seedlings have 2–3 leaves and are large enough to handle."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 5–7 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Nothing after 6 weeks","Normal – germination takes 8–11 weeks. Keep trays moist."],["No germination at all","Seed still dormant. Use GA + smoke water, or keep trays for a second season."],["Pulp left on seed goes mouldy","Clean seed thoroughly before drying and storing."]],"other":"Division of established clumps is a quicker way to produce plants.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":{"difficulty":"Easy","provisional":false,"confidence":"Medium","confidence_note":"ANPSA lists <i>Dianella<\/i> among the grass-like clumps suited to division; details follow the general method.","facts":[["Division type","Rhizome clump division"],["Best months","Mar – May"],["Division size","3–4 shoots with rhizome"],["Time to establish","4–6 weeks"]],"calendar":["-","P","B","B","B","P","-","P","P","P","-","-"],"snapshot":[["Habit","Rhizomatous, tufted perennial herb, 0.3–1.5 m."],["Flowering","Sep – Dec (blue-purple), followed by blue berries."],["Habitat","White or yellow sand, sandy clay, laterite, loam and clay."],["Local note","Recorded in Joondalup and Wanneroo. Division is much quicker than seed, which is slow and erratic."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Mar – May<\/b>, so divisions root before winter. Feb, Jun and Aug – Oct are workable. Avoid Nov – Jan (heat) and Jul (cold)."],["Division type","<b>Rhizome clump division<\/b>."],["Division size","<b>Three or four leaf shoots<\/b> with a good section of rhizome and healthy roots (ANPSA). Single shoots need a humid house."],["Selecting stock","Vigorous clumps with plenty of shoots. Keep forms and provenances separate."],["Preparation","• Water the stock plant the day before.<br/>• Lift the clump and shake or wash off the mix.<br/>• Cut the rhizome into pieces with a clean, sharp knife.<br/>• Trim damaged roots and cut leaves back by about one-third to one-half."],["Potting","Pot into a free-draining native mix at the original depth. Water in."],["Environment","Sheltered, shaded spot (humid house for small pieces) until new growth starts."],["Time to establish","About <b>4–6 weeks<\/b> in autumn."],["Aftercare","• Harden off gradually – about a week with nights exposed, then a sheltered week.<br/>• Pot on once roots fill the pot."]]}],"difficulty_note":"<b>Easy.<\/b> Clump-forming lilies divide readily, and this is the quickest way to produce plants.","problems":[["Divisions wilt","Leaves not trimmed or too few roots. Trim harder; use bigger pieces."],["Rhizome rots","Too wet or planted too deep. Water less; pot at the original level."],["Slow to re-shoot","Divided in cold weather. Divide in autumn or spring."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Clumping herb.","guide":null},{"method":"Seed","suitability":"Difficult","note":"GA + smoke water; 8–11 weeks.","guide":"seed"},{"method":"Division","suitability":"Main method","note":"The quickest way to produce plants.","guide":"division"}]},{"id":"eremophila-glabra","sci":"Eremophila glabra","common":"Tar Bush / Common Emu Bush","family":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree most forms strike readily from cuttings.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"calendar":["B","B","B","B","P","-","-","-","-","-","P","P"],"snapshot":[["Habit","Very variable, from prostrate to 3 m. Perth coastal plants are mostly subsp. <i>albicans<\/i>: low, spreading, to about 0.4 m high and 2 m wide, with grey, felty leaves."],["Flowering","Species: Mar – Dec. Subsp. <i>albicans<\/i>: May – Jan. Tubular flowers, yellow, orange, red or green."],["Habitat","Sand and limestone; dunes, sandplains and winter-wet flats, sometimes saline."],["Local note","Recorded in the Wanneroo LGA and along the Perth coast. Several subspecies and many forms – label stock by subspecies and form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, using hardened current season's growth while the weather is warm and plants are mostly out of flower. Nov – Dec and May are workable. Avoid Jun – Oct (cool weather, flowering)."],["Wood type","<b>Semi-hardwood<\/b> – hardened current season's growth."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips or side shoots. On grey-leaved forms pick clean foliage with no sign of mould."],["Pre-treatment","• Carefully remove leaves from the lower two-thirds.<br/>• Wound: remove a thin sliver of bark from the base.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, e.g. <b>Clonex Purple (3 g/L IBA)<\/b>."],["Propagation mix","Very free-draining, sand-based mix."],["Environment","<b>Grey, felty-leaved forms rot under heavy mist or high humidity<\/b> – keep foliage as dry as possible, water the mix, give good airflow. Green-leaved forms tolerate normal misting. Bottom heat speeds rooting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix and grow on in full sun.<br/>• Keep water off grey foliage; water in the morning."]]}],"difficulty_note":"<b>Easy.<\/b> Most forms of <i>E. glabra<\/i> strike readily from cuttings.","problems":[["Leaves blacken or grow grey mould","Too humid. Cut back misting, open the frame, remove affected leaves."],["Base rotting","Mix too wet. Water less often and use a sandier mix."],["Cuttings flower instead of rooting","Use non-flowering shoots and pinch off buds."]],"other":"Seed – unreliable in <i>Eremophila<\/i> (hard fruits, slow and erratic germination). Grafting is used for difficult eremophilas but isn't needed for this species.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra, Rhagodia baccata","url":"cottesloecoastcare.org"},{"title":"ANPSA – Eremophila glabra plant profile","url":"anpsa.org.au/plant_profiles/eremophila-glabra/"},{"title":"Australian Bushfoods – The Eremophila Page (cutting length, wounding, hormone)","url":"ausbushfoods.com/bushfoodsonline/reports/Plants/EREMO.TXT"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null,"division":null,"options":[{"method":"Cuttings","suitability":"Main method","note":"Most forms strike readily from semi-hardwood cuttings.","guide":"cuttings"},{"method":"Seed","suitability":"Difficult","note":"Unreliable – hard fruits; slow, erratic germination.","guide":null},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}]},{"id":"eucalyptus-decipiens","sci":"Eucalyptus decipiens","common":"Redheart / Redheart Moit","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (7 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","1–2 mm"],["Typical germination","46%"],["Seed per 100 plants","0.2 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Mallee or tree, 1.5–15 m, with rough, flaky or ribbony bark. Forms a lignotuber."],["Flowering","Aug – Dec or Jan (white)."],["Habitat","White, yellow or grey sand, sandy clay, gravelly loam and laterite; sandplains, hills, swamp margins."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect unopened capsules once the valves look as if they are beginning to open. Ripe seed has a white, firm inside and a brown to black coat."],["Extraction & cleaning","Keep capsules warm and dry for a day to several weeks until they release the seed; sieve out large chaff."],["Seed quality","Seed comes mixed with chaff – that's normal. Cut-test a sample."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>46%<\/b> (untreated, Alcoa nursery average, 7 tests). About <b>481 seedlings per gram<\/b> of seed-and-chaff – roughly 0.2 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach can help (WA eucalypt seed notes)."],["Sowing depth & method","Mix the fine seed with dry sand, sow thinly and cover lightly, about <b>1–2 mm<\/b>. Or sow a pinch per tube and thin."],["After sowing","Water in (smoke water optional); keep moist."],["Germination time","About <b>1–2 weeks<\/b> (typical for WA eucalypts)."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sow thinly; sterile mix; avoid crowding."],["Trays too crowded","Seed is very fine. Dilute it with dry sand before sowing."],["Roots circling","Held too long in tubes."]],"other":"Cuttings are very difficult for eucalypts – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Eucalypts are very difficult from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 46% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"eucalyptus-gomphocephala","sci":"Eucalyptus gomphocephala","common":"Tuart","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data (16 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","1–2 mm"],["Typical germination","42%"],["Seed per 100 plants","0.4 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree, 10–40 m."],["Flowering","Jan – Apr (white)."],["Habitat","Sand over limestone on the coastal plain."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown capsules when the valves are just starting to open; many trees hold seed for a year."],["Extraction & cleaning","Keep capsules warm and dry from a day to several weeks until seed drops. Seed is mixed with chaff."],["Seed quality","A cut-test and count on seed and chaff estimates seeds per gram."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>42%<\/b> (untreated, Alcoa nursery average). About <b>228 seedlings per gram<\/b> – under 0.5 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach (10%) can help."],["Sowing depth & method","Mix with dry sand and sprinkle thinly; cover very lightly (about <b>1–2 mm<\/b>)."],["After sowing","Water in with a fine spray (smoke water optional); keep moist."],["Germination time","About <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Thin sowing, sterile mix, airflow."],["Uneven germination","Chaff clumps. Mix seed well with sand."],["Roots circling","Held too long in tubes. Time sowings to planting."]],"other":"Local coastal-plain provenance matters for revegetation – record seed source.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Eucalypts are very difficult from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; 1–2 weeks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"eucalyptus-marginata","sci":"Eucalyptus marginata","common":"Jarrah","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (67 tests) and WA eucalypt seed notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","2–3 mm"],["Typical germination","31%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Tree to 40 m."],["Flowering","Jun – Dec or Jan (white-cream to pink)."],["Habitat","Grey sand, clay or sandy loam and laterite; hills and rises."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Fruit takes about a year to mature. Collect brown capsules when the valves look ready to open."],["Extraction & cleaning","Keep capsules warm and dry until seed is released; sieve out large debris."],["Seed quality","Cut-test a sample; seed is mixed with chaff."],["Storage life","<b>Long<\/b> if stored cool and dry."],["Typical germination","About <b>31%<\/b> (untreated, Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b> Surface-sterilising in dilute bleach (10%) can help."],["Sowing depth & method","Cover lightly, about <b>2–3 mm<\/b>. Direct sow a few seeds per tube and thin, or sow thinly in trays."],["After sowing","Water in; keep moist."],["Germination time","About <b>1–2 weeks<\/b>."],["Pricking out","When seedlings have two pairs of true leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, avoid crowding."],["Low germination","Old or immature seed. Collect mature capsules; cut-test."],["Roots circling","Held too long in tubes."]],"other":"Jarrah seedlings develop a lignotuber early – a good sign of healthy stock.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 6 – Eucalyptus. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01993.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Eucalypts are very difficult from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; 1–2 weeks.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}]},{"id":"gastrolobium-capitatum","sci":"Gastrolobium capitatum","common":"Bacon and Eggs","family":"Fabaceae","alt":"Previously <i>Nemcia capitata<\/i> / <i>Oxylobium capitatum<\/i>","cuttings":null,"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA genus seed notes available; no nursery germination data for this species.","facts":[["Pre-treatment","Hot water or dry heat"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","Not recorded"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Prostrate to low, bushy shrub, to 1 m."],["Flowering","Jun – Sep (orange-yellow)."],["Habitat","Sandy to loamy soils, laterite, granite; slopes, outcrops, swampy areas and plains."],["Local note","Recorded in the Wanneroo LGA. Many <i>Gastrolobium<\/i> (poison peas) contain fluoroacetate, which is toxic to stock and people. No data were found for this species – wear gloves and keep seed away from pets and stock."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed is usually shed in summer. Tie nylon stockings or muslin bags over developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats. A seed supplier lists about 250 seeds per gram."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","Not recorded for this species."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Choose one (WA <i>Gastrolobium<\/i> seed notes):<br/>• <b>Hot water:<\/b> soak for up to 24 hours in warm to hot water (pour near-boiling water over and let it cool).<br/>• <b>Dry heat:<\/b> 80–120°C in an oven for 10 minutes to 1 hour.<br/>• <b>Nick<\/b> or file a small piece of the seed coat.<br/>Sow the seed that has swollen."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Not recorded – check from about one week after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat, or try the dry-heat method."],["Swollen seed rots","Mix too wet. Water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Treat as a trial and record germination so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"},{"title":"Friends of Queens Park Bushland – Gastrolobium capitatum (Bacon and Eggs)","url":"friendsofqueensparkbushland.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Hot water or dry heat (trial).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"gastrolobium-nervosum","sci":"Gastrolobium nervosum","common":"","family":"Fabaceae","alt":"Previously <i>Nemcia reticulata<\/i> / <i>Oxylobium nervosum<\/i>","cuttings":null,"seed":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"WA genus seed notes available; no nursery germination data for this species.","facts":[["Pre-treatment","Hot water or dry heat"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","Not recorded"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Small shrub, to 0.5 m."],["Flowering","Aug – Oct (yellow, red and purple)."],["Habitat","Yellow, white or grey sand, sandy clay, laterite gravel and limestone; coastal plains and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Many <i>Gastrolobium<\/i> (poison peas) contain fluoroacetate, which is toxic to stock and people. No data were found for this species – wear gloves and keep seed away from pets and stock."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed is usually shed in summer. Tie nylon stockings or muslin bags over developing pods and collect once they split."],["Extraction & cleaning","Rub pods and sieve or winnow."],["Seed quality","Hard-seeded. Float test: discard seed that floats. A seed supplier lists about 175 seeds per gram."],["Storage life","<b>Long.<\/b> Hard-coated pea seed keeps many years when dry."],["Typical germination","Not recorded for this species."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct are workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Choose one (WA <i>Gastrolobium<\/i> seed notes):<br/>• <b>Hot water:<\/b> soak for up to 24 hours in warm to hot water.<br/>• <b>Dry heat:<\/b> 80–120°C in an oven for 10 minutes to 1 hour.<br/>• <b>Nick<\/b> or file a small piece of the seed coat.<br/>Sow the seed that has swollen."],["Sowing depth & method","Cover about <b>2–3 mm<\/b>. Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Not recorded – check from about one week after treatment."],["Pricking out","Early, at the cotyledon to first true leaf stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat, or try the dry-heat method."],["Swollen seed rots","Mix too wet. Water less."],["Seedlings collapse","Damping off. Sterile mix, good airflow."]],"other":"Treat as a trial and record germination so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Nindethana Australian Seed – species seed pages (treatment advice, seeds per gram)","url":"nindethana.net.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Hot water or dry heat (trial).","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"gompholobium-tomentosum","sci":"Gompholobium tomentosum","common":"Hairy Yellow Pea","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data and WA hard-seed guidance available for this species.","facts":[["Pre-treatment","Dry heat or hot water"],["Best sowing","Mar – May"],["Sowing depth","3–4 mm"],["Typical germination","34%"],["Seed per 100 plants","0.8 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, often spindly shrub, 0.15–1 m."],["Flowering","Jul – Jan (yellow pea flowers)."],["Habitat","White, grey or yellow sand, sandy clay and lateritic sand; coastal limestone, dunes and plains."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and shed seed when ripe. <b>Bag developing pods<\/b> with stockings or muslin and collect once split."],["Extraction & cleaning","Rub and sieve out the small seed."],["Seed quality","Hard-seeded – almost all fresh seed is dormant until the coat is treated."],["Storage life","<b>Long.<\/b> Keeps for many years when dry (typical of hard-coated pea-family seed)."],["Typical germination","About <b>34%<\/b> after heat treatment (Alcoa nursery average). About <b>125 seedlings per gram<\/b> – roughly 0.8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Either:<br/>• <b>Dry heat shock:<\/b> oven at 80–120°C for 10 min to 1 hour (Alcoa used a dry-heat pulse for this species); or<br/>• <b>Hot water:<\/b> pour near-boiling water over the seed and let it cool in the water (easiest method). Sow seed that has swollen; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>3–4 mm<\/b>. Direct sow a few seeds per tube and thin, or sow thinly in trays."],["After sowing","Water in; keep moist, not wet. Sow promptly after hot-water treatment."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed or switch between heat and hot-water methods."],["Seed rots after sowing","Too wet. Water less and improve drainage."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Spindly habit – tip-pruning young plants can give a fuller tube.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Dry heat or hot water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}]},{"id":"grevillea-crithmifolia","sci":"Grevillea crithmifolia","common":"","family":"Proteaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Grown commercially from cuttings but reported slow to root; size and treatment
