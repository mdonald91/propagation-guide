asily from seed, but seedlings are not identical to the parent. Grafting onto <i>G. robusta<\/i> is used on the humid east coast; not needed locally.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"ANPSA – Grevillea vestita plant profile","url":"anpsa.org.au/plant_profiles/grevillea-vestita/"},{"title":"Australian Plants Society NSW – Grevillea vestita","url":"resources.austplants.com.au/plant/grevillea-vestita/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Minimalist Gardener – Propagating Australian natives from cuttings (grevillea strike times, sap irritant)","url":"minimalistgardener.com.au"},{"title":"CompleteGrow – How to propagate Grevillea (low-phosphorus feeding)","url":"completegrow.com.au"}]},"seed":null},{"id":"hibbertia-hypericoides","sci":"Hibbertia hypericoides","common":"Yellow Buttercups","family":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Difficult","provisional":false,"confidence":"Low","confidence_note":"Its difficulty is well documented (DBCA; specialist WA nurseries), but no detailed cutting protocol is published. Treat the method below as a trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Dec – Feb"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA (trial range)"]],"calendar":["B","B","P","-","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Spreading shrub, 0.3–0.8 m. Densely hairy branches; small leaves with rolled edges and white-hairy undersides."],["Flowering","Apr – Nov (bright yellow, notched petals)."],["Habitat","Sandy soils in Banksia woodland and shrubland; one of the most common understorey plants between Perth and Albany. Resprouts from its rootstock after fire."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Feb<\/b>, after flowering finishes and once the new flush has started to firm. Nov and Mar are workable. Avoid Apr – Oct (flowering period)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that is just firming. Soft tips wilt quickly; old wood rarely roots."],["Cutting size","50–75 mm."],["Selecting material","Vigorous <b>non-flowering<\/b> shoots. Well-watered, actively growing stock plants (e.g. nursery-held stock) usually give better material than stressed bushland plants."],["Pre-treatment","• Strip lower leaves by cutting, not pulling.<br/>• Light wound on the firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Start with 3 g/L IBA (<b>Clonex Purple<\/b>). Because results are unreliable, split trial batches across 1.5, 3 and 8 g/L (Green, Purple, Red) and record which works best."],["Propagation mix","Very free-draining, fresh, clean mix. Strict hygiene – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bottom heat, bright shade. Mist lightly – the hairy leaf undersides hold water. Good airflow."],["Expected strike time","Slow and variable – allow <b>8–16 weeks<\/b>. Leave cuttings in as long as they stay green and healthy."],["Post-treatment / aftercare","• Harden off slowly (extend each stage if cuttings wilt).<br/>• Pot on gently, disturbing roots as little as possible.<br/>• Avoid overwatering; keep benches clean."]]}],"difficulty_note":"<b>Difficult.<\/b> DBCA notes it is difficult to grow from seed or cuttings, and specialist Perth nurseries describe it as a species other producers often fail with. Set large batches and keep detailed records.","problems":[["Cuttings stay green but don't root","Leave longer; check for heavy callus and trim it; try a different hormone strength."],["Cuttings collapse or rot","Too wet or root rot. Improve drainage and hygiene; remove affected cuttings."],["Rooted cuttings die after potting on","Roots damaged or hardening too fast. Use single tubes and harden off more slowly."]],"other":"Seed – also difficult: WA <i>Hibbertia<\/i> seed has complex dormancy, and treatments are still the subject of research. If numbers are needed quickly, consider buying in tubestock from a specialist grower.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"},{"title":"Natural Area Nursery – WA native plant propagation (H. hypericoides difficult to propagate)","url":"naturalarea.com.au/revegetation-plant-production/wa-native-plant-propagation/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"},{"title":"PMC – Sympatric species of Hibbertia vary in dormancy break and germination requirements","url":"pmc.ncbi.nlm.nih.gov/articles/PMC3336950"}]},"seed":null},{"id":"hibbertia-racemosa","sci":"Hibbertia racemosa","common":"Stalked Guinea Flower","family":"Dilleniaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on how the genus behaves and this species' growth cycle.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["B","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Small erect or ascending, spreading shrub, 0.1–0.75 m."],["Flowering","Jul – Dec (yellow, on long stalks)."],["Habitat","Grey, white or yellow sand in coastal areas: dunes, plains and limestone."],["Local note","Recorded in the City of Joondalup. Grey-leaved and prostrate forms are sold in the trade – keep forms separate and labelled."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, after flowering finishes and new growth has begun to firm. Dec and May are workable. Avoid Jun – Nov (cool weather, then flowering)."],["Wood type","<b>Semi-hardwood<\/b> – new growth that has started to harden. Firm tip cuttings also work."],["Cutting size","50–75 mm long. Stems are fine and leaves small, so keep cuttings short."],["Selecting material","<b>Non-flowering<\/b> side shoots from healthy plants. Snip off any flower stalks or buds."],["Pre-treatment","• Strip leaves from the lower half (cut rather than pull on fine stems).<br/>• Wounding not needed on fine stems; a light wound is optional on firmer material.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength (3 g/L IBA, e.g. <b>Clonex Purple<\/b>). For softer tips use softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>)."],["Propagation mix","Very free-draining, sand-based mix. Use fresh, clean mix and clean tubes – hibbertias are prone to <i>Phytophthora<\/i> root rot."],["Environment","Humid frame, bright shade, bottom heat. Keep the mix moist but never wet; good airflow."],["Expected strike time","Roughly <b>4–8 weeks<\/b> in warm weather; may be slower. Record your results."],["Post-treatment / aftercare","• Standard hardening off (2 weeks closed by day/open at night, then 2 weeks shade).<br/>• Pot on into a free-draining native mix; avoid overwatering.<br/>• Keep good hygiene on benches to limit root rot."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Hibbertias are generally easy from cuttings, but some WA species (e.g. <i>H. hypericoides<\/i>) are known to be difficult. Set larger batches until your own strike rate is known.","problems":[["Cuttings collapse at the base","Too wet, or root rot. Improve drainage, use clean mix, remove affected cuttings."],["Few roots, cuttings flower","Material was taken from flowering shoots. Use non-flowering side shoots."],["Slow to strike in winter","Use bottom heat, or wait for the Jan – Apr window."]],"other":"Seed – generally unreliable in <i>Hibbertia<\/i> (complex dormancy). Layering – several hibbertias root where stems touch the ground; check low stems on prostrate forms and pot up any rooted pieces.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Hibbertia vestita profile (genus note: easy from cuttings, seed unreliable)","url":"anpsa.org.au/plant_profiles/hibbertia-vestita/"},{"title":"Australian National Botanic Gardens – Hibbertia pedunculata and H. empetrifolia (cutting timing, root rot)","url":"anbg.gov.au/gnp/gnp11/hibbertia-pedunculata.html"},{"title":"Trees and Shrubs Online – Hibbertia (nodal cuttings while in growth; seed dormancy)","url":"treesandshrubsonline.org/articles/hibbertia/"},{"title":"DBCA Library – wildflower booklet: H. hypericoides difficult from seed or cuttings","url":"library.dbca.wa.gov.au/FullTextFiles/072542.pdf"}]},"seed":null},{"id":"hovea-pungens","sci":"Hovea pungens","common":"Devil's Pins","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data available for this species; method follows WA hard-seed guidance.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","4–6 mm"],["Typical germination","41%"],["Seed per 100 plants","3.0 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect, prickly, broom-like shrub, 0.2–1.8 m."],["Flowering","May – Nov (blue-purple)."],["Habitat","Wide range: shallow soils on rock, sand, laterite, gravel, clay and loam; granite outcrops, coastal limestone and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Sharp leaves – wear gloves when collecting."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in late spring to summer and <b>eject seed when ripe<\/b>. Bag developing pods with stockings or muslin."],["Extraction & cleaning","Collect seed from the bags; sieve out pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps for many years when dry (typical of hard-coated pea-family seed)."],["Typical germination","About <b>41%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water:<\/b> drop into boiling water for <b>30 seconds<\/b> (Alcoa method), then cool; or pour near-boiling water over the seed and soak overnight. Sow swollen seed; re-treat any that haven't swollen."],["Sowing depth & method","Larger seed – cover about <b>4–6 mm<\/b> (roughly twice its thickness). Direct sow 2–3 seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","If tray-sown, prick out at the cotyledon stage – early, as the taproot grows fast."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or mix too wet. Keep to 30 s; water less."],["Taproot damage at pricking out","Pricked out too late. Direct sow into tubes instead."]],"other":"Wear gloves – the pungent (sharp) leaves make handling seedlings and stock plants prickly.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]}},{"id":"kennedia-prostrata","sci":"Kennedia prostrata","common":"Scarlet Runner / Running Postman","family":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data, WA community-nursery method and ANPSA notes agree.","facts":[["Pre-treatment","Hot water + smoke water"],["Best sowing","Mar – May"],["Sowing depth","About 5 mm"],["Typical germination","30%"],["Seed per 100 plants","8.3 g"]],"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Prostrate or twining groundcover, spreading to about 2.5 m."],["Flowering","Apr – Nov (red pea flowers)."],["Habitat","Usually sandy, gravelly soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods (about 50 mm) ripen in late spring to summer and split when ripe – bag them or collect as they turn brown."],["Extraction & cleaning","Dry pods in paper bags and collect the seed."],["Seed quality","Impervious seed coat – dormant until treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Seed maintains viability for extended periods."],["Typical germination","About <b>30%<\/b> after dry heat (100°C, 3 h; Alcoa). About <b>12 seedlings per gram<\/b> – roughly 8 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water:<\/b> simmer water at 95°C for 2 minutes, pour over the seed (at least 10:1 water to seed) and soak 24 hours, then soak 24 hours in smoke water (Geraldton method). Alternatives: boiling water, abrasion, or dry heat 100°C for 3 hours."],["Sowing depth & method","Larger seed – cover about <b>5 mm<\/b>. Direct sow 1–2 seeds per tube."],["After sowing","Water in; keep moist, not wet."],["Germination time","About <b>8 days<\/b> (Geraldton nursery)."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Runners tangle in the nursery","Space tubes out; trim runners before dispatch."],["Seedlings collapse","Damping off. Sterile mix, airflow."]],"other":"Cuttings of firm current season's growth also strike well.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"ANPSA – Kennedia prostrata profile","url":"anpsa.org.au/plant_profiles/kennedia-prostrata/"}]}},{"id":"lechenaultia-linarioides","sci":"Lechenaultia linarioides","common":"Yellow Leschenaultia","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species-specific cutting data found. Based on the genus, whose cuttings strike very easily.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Sprawling, open shrub to 1.5 m, with narrow, linear leaves."],["Flowering","Can flower in any month. Flowers yellow with red or pink tones, sometimes cream."],["Habitat","Sand (often over limestone) and sandy clay; sandplains, low dunes, ridges and winter-wet flats."],["Local note","Recorded in the Wanneroo LGA."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> (late summer to autumn) while it is warm. One grower reports roots in 4–6 weeks from late-February leschenaultia cuttings. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> tips. This species can flower in any month, so check each cutting and remove buds."],["Pre-treatment","• Strip leaves from the lower half (narrow leaves strip easily).<br/>• No wounding needed.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Very free-draining – leschenaultias dislike wet roots."],["Environment","Humid frame, bottom heat, bright shade. Keep the mix moist, never wet."],["Expected strike time","About <b>4–6 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; water sparingly.<br/>• Tip-prune to counter the sprawling habit."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Lechenaultia<\/i> cuttings generally strike very easily; seed is difficult.","problems":[["Base rotting","Overwatering. Water less often; add coarse sand or perlite to the mix."],["Wilting in the frame","Material too soft or humidity too low. Use slightly firmer tips; keep the frame closed."],["Cuttings flowering","Remove buds; pick vegetative shoots."]],"other":"Seed – slow and unreliable. The Geraldton community nursery soaked seed in smoke water, saw germination at about 46 days, and kept trays for a second year. Division – some leschenaultias sucker; pot up rooted suckers.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Lechenaultia biloba profile (cuttings strike very easily; seed difficult)","url":"anpsa.org.au/plant_profiles/lechenaultia-biloba/"},{"title":"Better Homes and Gardens – fastest and easiest native plants to propagate (leschenaultia timing)","url":"bhg.com.au/how-to-propagate-natives"}]},"seed":null},{"id":"melaleuca-huegelii","sci":"Melaleuca huegelii","common":"Chenille Honeymyrtle","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Nursery data, WA community-nursery method and ANPSA genus notes agree.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","58%"],["Seed per 100 plants","0.1 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Shrub or small tree, 0.5–5 m."],["Flowering","Sep – Dec or Jan (pink, white or pink-purple)."],["Habitat","Sand; limestone cliffs, coastal plains and dunes."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed stays in the woody capsules indefinitely, so capsules can be collected at any time. Use capsules <b>at least 12 months old<\/b>."],["Extraction & cleaning","Place capsules in an open container somewhere warm; fine seed is released in 2–3 days."],["Seed quality","Extremely fine seed with chaff; no need to separate."],["Storage life","<b>Long<\/b> if kept dry and cool; seed also keeps on the plant in closed capsules."],["Typical germination","About <b>58%<\/b> (untreated, Alcoa nursery average). About <b>775 seedlings per gram<\/b> – a pinch is plenty."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix with dry, sterile yellow sand and sprinkle from a spice jar. <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist (Geraldton), or stand pots in a saucer of water until germination (bog method)."],["Germination time","About <b>9 days<\/b> at Geraldton; 14–30 days is typical for the genus."],["Pricking out","When the second pair of leaves appears. Handle tiny seedlings by the leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings too crowded","Dilute seed more with sand."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix. Thin sowing, airflow."]],"other":"Cuttings are also reliable if a particular form is wanted.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]}},{"id":"melaleuca-systena","sci":"Melaleuca systena","common":"Coastal Honeymyrtle","family":"Myrtaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Few nursery tests (3); WA community-nursery method and ANPSA genus notes available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","14%"],["Seed per 100 plants","0.3 g"]],"calendar":["-","P","B","B","P","P","P","P","B","B","P","-"],"snapshot":[["Habit","Erect to spreading shrub, usually 0.5–2 m."],["Flowering","Feb – Mar or Aug – Dec (yellow-cream)."],["Habitat","Sand over laterite or limestone; stabilised coastal dunes and rocky limestone."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect capsules at least 12 months old from older stems at any time; seed is retained in closed capsules."],["Extraction & cleaning","Place capsules somewhere warm in an open container; seed is released in 2–3 days."],["Seed quality","Fine seed with chaff. Germination in nursery tests was low – sow generously."],["Storage life","<b>Long<\/b> if kept dry and cool."],["Typical germination","About <b>14%<\/b> (untreated, Alcoa average of only 3 tests). About <b>301 seedlings per gram<\/b>."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – Apr<\/b> and <b>Sep – Oct<\/b>. Feb, May – Aug and Nov workable. Avoid Dec – Jan."],["Seed mix","Fine-textured, sterile native seed mix."],["Pre-treatment","<b>None needed.<\/b>"],["Sowing depth & method","Mix with dry sand and sprinkle from a spice jar. <b>Sow on the surface<\/b>; don't cover."],["After sowing","Water in with smoke water using a fine mist, or use the bog method."],["Germination time","About <b>7 days<\/b> at Geraldton; allow up to 4 weeks."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Empty or old seed. Use older capsules (12+ months) from vigorous plants; sow more."],["Seed washed away","Use bottom watering or a very fine mist."],["Damping off","Crowding and wet mix."]],"other":"Cuttings are a reliable alternative for this genus.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"ANPSA – Melaleuca genus page (seed from old capsules, no pre-treatment, bog method, 14–30 days)","url":"anpsa.org.au/genera/melaleuca/"}]}},{"id":"myoporum-insulare","sci":"Myoporum insulare","common":"Blueberry Tree / Common Boobialla","family":"Scrophulariaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Published sources agree it strikes readily from firm young growth.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"calendar":["P","B","B","B","P","-","-","-","-","P","P","P"],"snapshot":[["Habit","Dense, low spreading to erect shrub or small tree, 0.25–5 m, with thick, fleshy leaves."],["Flowering","Jul – Dec, also Jan – Feb (white, purple-spotted), followed by purple berries."],["Habitat","White or grey sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo. Forms range from prostrate to tree-like – take cuttings from a plant with the form you want."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the main flowering. Oct – Jan and May are workable. Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b> – firm young growth."],["Cutting size","75–100 mm."],["Selecting material","Firm, <b>non-flowering<\/b> young shoots from a stock plant with the growth form you need (prostrate for groundcover, erect for screening)."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Reduce the remaining thick leaves by about one-third.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>). Strikes readily without it, but hormone gives faster, more even rooting."],["Propagation mix","Standard sand/coir cutting mix."],["Environment","Standard humid frame with bottom heat. Hairless leaves tolerate normal misting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Fast-growing – pot on promptly before roots circle.<br/>• Tip-prune for a bushier plant."]]}],"difficulty_note":"<b>Easy.<\/b> Firm young growth roots readily; even branchlets placed straight into soil can strike.","problems":[["Leaf drop in the frame","Too dark or too wet. Give brighter shade and water less."],["Roots circling in tubes","Pot on sooner – it grows quickly."],["Plants not the expected shape","Seed-grown or mixed stock. Propagate from a known-form stock plant."]],"other":"Seed – the Geraldton community nursery ferments ripe (darkest purple) berries for 4–5 days, washes off the pulp and soaks in smoke water; germination took 15–30 days. Seedlings vary in form.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Australian National Botanic Gardens – Myoporum insulare","url":"anbg.gov.au/gnp/interns-2010/myoporum-insulare.html"}]},"seed":null},{"id":"olearia-axillaris","sci":"Olearia axillaris","common":"Coastal Daisybush","family":"Asteraceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery data and a detailed WA community-nursery method available.","facts":[["Pre-treatment","Air-dry 3 months; smoke water"],["Best sowing","Aug – Sep"],["Sowing depth","Surface"],["Typical germination","21%"],["Seed per 100 plants","1.4 g"]],"calendar":["-","-","P","P","P","P","P","B","B","P","-","-"],"snapshot":[["Habit","Erect, much-branched grey shrub, 0.2–3 m."],["Flowering","Jan – Jul or Nov – Dec (small white to yellow daisies)."],["Habitat","White, grey or red sand and loam; coastal limestone, sand dunes and rocky hillsides."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed usually ripens around <b>April – May<\/b>, but plants can set seed about <b>6 weeks after a big rain<\/b>, so watch for opportunistic crops (e.g. after summer storms)."],["Extraction & cleaning","Collect the fluffy seed heads into paper bags."],["Seed quality","Germination in nursery tests was moderate (about 21%)."],["Storage life","<b>Short – needs fresh seed each year.<\/b> Seed must be <b>aired for about 3 months<\/b> before storing or sowing."],["Typical germination","About <b>21%<\/b> (untreated, Alcoa nursery average). About <b>73 seedlings per gram<\/b> – roughly 1.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Aug – Sep<\/b> – about 3 months after an autumn collection. Mar – Jul and Oct workable depending on when seed was collected. Avoid Nov – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","Air the seed for about 3 months after collection. Water trays with smoke water after sowing (Geraldton method)."],["Sowing depth & method","<b>Sow on the surface<\/b> and press in lightly – daisy-family seed often needs light to germinate."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>7–16 days<\/b> (Geraldton nursery)."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination","Old seed or not aired. Use this season's seed, aired for 3 months."],["Seed buried too deep","Needs light. Surface sow."],["Leggy seedlings","Too much shade. Move to full sun sooner."]],"other":"Also strikes readily from cuttings.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]}},{"id":"petrophile-linearis","sci":"Petrophile linearis","common":"Pixie Mops","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":false,"confidence":"Medium","confidence_note":"Nursery tests show very low untreated germination; method follows WA Petrophile seed notes.","facts":[["Pre-treatment","Remove hairs, nick coat; smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","<1% untreated"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect shrub, 0.2–1 m."],["Flowering","Aug – Dec (pink and white ‘mops’)."],["Habitat","White, grey or yellow sand, often over laterite; sandplains."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones are usually ripe about <b>six months after flowering<\/b>, when they turn grey to grey-brown and lose their old floral parts."],["Extraction & cleaning","Seed does not come out easily in <i>Petrophile<\/i> – you may need to pull the hairy nuts out of the cone with forceps."],["Seed quality","Very low germination untreated (0.17% in Alcoa tests). Many nuts may be empty – cut-test."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Untreated: <b>under 1%<\/b> (Alcoa, 6 tests). Treated seed should do much better – record your results."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (cool autumn). Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>Remove the hairs and nick a small section of the seed coat<\/b> to reveal the white seed (without damaging it). Smoke water (24 h soak) may also help."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes to avoid root damage."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","Can take <b>several months<\/b> – keep trays going."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–8 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not nicked, or empty seed. Nick carefully; cut-test."],["Seed damaged by nicking","Cut too deep. Remove just enough coat to see white seed."],["Seedlings die in pots","Phosphorus toxicity or root rot. Low-P mix and fertiliser."]],"other":"A slow, fiddly species from seed – set larger batches and keep good records.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 18 – Isopogon and Petrophile. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02005.pdf"}]}},{"id":"petrophile-macrostachya","sci":"Petrophile macrostachya","common":"","family":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Difficult","provisional":true,"confidence":"Low","confidence_note":"No species data found. Method based on WA Petrophile seed notes and <i>P. linearis<\/i> results – trial protocol.","facts":[["Pre-treatment","Remove hairs, nick coat; smoke"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","Not recorded"]],"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Erect, compact or spreading, prickly shrub, 0.3–1.2 m."],["Flowering","Jul – Nov (yellow-cream)."],["Habitat","White or yellow-brown sand and gravel; sandplains."],["Local note","Recorded in the Wanneroo LGA. Prickly – wear gloves."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Cones are usually ripe about six months after flowering, when grey to grey-brown and the old floral parts have gone."],["Extraction & cleaning","Pull the hairy nuts from the cones with forceps."],["Seed quality","Cut-test a sample – expect many empty nuts."],["Storage life","Not well documented. Store dry and cool."],["Typical germination","Not recorded. Expect low germination unless the seed coat is treated."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, low-phosphorus mix."],["Pre-treatment","Remove the hairs and nick a small section of the seed coat; smoke water may also help."],["Sowing depth & method","Cover about <b>3–5 mm<\/b>. Direct sow into tubes."],["After sowing","Keep moist, not wet; strict hygiene."],["Germination time","Can take <b>several months<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 6–8 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not nicked, or empty seed."],["Seed damaged by nicking","Cut less deeply."],["Seedlings die in pots","Phosphorus toxicity or root rot."]],"other":"Treat as a trial – record results so this page can be updated.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 18 – Isopogon and Petrophile. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02005.pdf"}]}},{"id":"phyllanthus-calycinus","sci":"Phyllanthus calycinus","common":"False Boronia","family":"Phyllanthaceae","alt":"Current WA Herbarium name: <i>Lysiandra calycina<\/i>","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Treat as a trial protocol and record results.","facts":[["Wood type","Semi-hardwood"],["Best months","Feb – Apr"],["Cutting length","50–75 mm"],["Hormone (IBA)","3 g/L IBA"]],"calendar":["P","B","B","B","P","-","-","-","-","-","-","-"],"snapshot":[["Habit","Small erect shrub, 0.2–1.2 m, with smooth branchlets."],["Flowering","Jun – Dec or Jan (white-cream to pink). Sepals enlarge to enclose the fruit."],["Habitat","Usually sandy soils, including coastal alkaline sands."],["Name note","FloraBase now lists this plant as <i>Lysiandra calycina<\/i>; many nurseries still sell it as <i>Phyllanthus calycinus<\/i>. Kept under <i>Phyllanthus<\/i> here to match your plant list."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Feb – Apr<\/b> – warm, and after the long flowering season ends. Jan and May are workable. Avoid Jun – Dec (flowering, and cool in winter)."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering<\/b> shoots from healthy plants."],["Pre-treatment","• Strip leaves from the lower half.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>); trial 1.5 g/L (<b>Clonex Green<\/b>) on softer tips."],["Propagation mix","Free-draining sand-based mix."],["Environment","Standard humid frame, bottom heat, bright shade."],["Expected strike time","Not documented – start checking from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> No cutting data found for this species; the rating is a cautious starting point.","problems":[["No roots after 10+ weeks","Try a different hormone strength or timing on the next batch; record what you tried."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering shoots only."]],"other":"Seed – the method most guides mention; use fresh seed. Few published details on pre-treatment.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"Geographe Community Landcare Nursery – Phyllanthus calycinus (Lysiandra calycina)","url":"gcln.org.au/product/phyllanthus-calycinus/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null},{"id":"scaevola-canescens","sci":"Scaevola canescens","common":"Grey Scaevola","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus (strikes readily) plus this species' hairy foliage.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Nov – Jan"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["B","P","P","P","P","-","-","-","-","P","B","B"],"snapshot":[["Habit","Prostrate to ascending shrub, 0.1–0.5 m. Densely hairy grey leaves; stems are brittle."],["Flowering","Mar – Oct (white to white-purple), in spikes in the leaf axils."],["Habitat","Sand, often with lateritic gravel or limestone."],["Local note","Recorded in the northern Perth area (Wanneroo and Stirling LGAs)."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Nov – Jan<\/b>, on new growth after flowering ends, while it is warm. Oct and Feb – May are workable if you choose shoots without flower spikes. Avoid Jun – Sep (cool, peak flowering)."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm tips."],["Selecting material","Vigorous <b>non-flowering<\/b> tips. Flowers form in the leaf axils along the stem, so check the whole cutting and pinch off any spikes."],["Pre-treatment","• Handle gently – stems snap easily. Carry in a rigid tray or box.<br/>• Strip lower leaves by cutting, not tearing.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, e.g. <b>Clonex Green<\/b>) for soft tips; semi-hardwood strength (3 g/L, <b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Extra free-draining: standard sand/coir mix with extra coarse sand or perlite."],["Environment","<b>Keep foliage as dry as possible.<\/b> Dense hairy leaves rot under heavy mist. Water the mix rather than the leaves, give good airflow, and use bottom heat (root zone about 21–24°C)."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix; keep water off the foliage.<br/>• Remove any leaves showing grey mould promptly."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily; the hairy foliage makes rot the main risk.","problems":[["Grey fuzz or blackened leaves","Too humid/wet. Cut back misting, remove affected material, improve airflow."],["Snapped stems","Brittle stems – transport in rigid containers and use a dibber when setting."],["Cuttings flowering, not rooting","Take shoots without axillary flower spikes."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if a plant has suckered or rooted along its stems.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null},{"id":"scaevola-crassifolia","sci":"Scaevola crassifolia","common":"Thick-leaved Fan-flower","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Cuttings are the standard method in WA nurseries (e.g. Geraldton community nursery).","facts":[["Wood type","Semi-hardwood"],["Best months","Mar – May"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"calendar":["P","P","B","B","B","-","-","-","-","P","P","P"],"snapshot":[["Habit","Erect or spreading shrub, 0.1–1.5 m and up to 3 m wide. Young growth is sticky; thick, toothed, egg-shaped to round leaves."],["Flowering","Jul – Dec, also Jan – Feb (blue, mauve or white fans)."],["Habitat","Sand on coastal dunes, plains and limestone cliffs."],["Local note","Recorded in Joondalup and Wanneroo. Flower colour and habit vary – cuttings keep the parent's form."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b> – warm, and outside the main flowering period. Oct – Feb is workable with non-flowering shoots (shade well in summer). Avoid Jun – Sep."],["Wood type","<b>Semi-hardwood<\/b>."],["Cutting size","75–100 mm."],["Selecting material","<b>Non-flowering<\/b> tips. Flower spikes carry leafy bracts – check closely and pinch them off."],["Pre-treatment","• New growth is sticky – wipe the blade often.<br/>• Strip lower leaves; cut the large remaining leaves back by a third to a half.<br/>• Dip the base in rooting hormone."],["Rooting hormone","3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Standard humid frame with bottom heat, bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining mix.<br/>• Tip-prune young plants for dense growth."]]}],"difficulty_note":"<b>Easy.<\/b> Semi-hardwood cuttings in the warmer months are the standard method.","problems":[["Wilting in the first week","Too much leaf area. Trim leaves harder; keep the frame closed."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering","Use non-flowering tips or wait for the Mar – May window."]],"other":"Seed – large seeds are produced and sometimes germinate naturally; cuttings are preferred to keep flower colour and habit.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"Nurseries Online – Scaevola crassifolia (semi-hardwood cuttings in warmer months)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/scaevola-crassifolia/"},{"title":"Wikipedia – Hibbertia hypericoides, Eremophila glabra subsp. albicans, Phyllanthus calycinus, Scaevola crassifolia","url":"en.wikipedia.org"}]},"seed":null},{"id":"scaevola-globulifera","sci":"Scaevola globulifera","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"No species-specific data found. Based on the genus, which strikes readily from cuttings.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["B","B","B","B","P","-","-","-","-","-","P","P"],"snapshot":[["Habit","Spreading, low-lying to ascending shrub, 0.2–1.2 m. Hairless."],["Flowering","Aug – Dec (blue to white)."],["Habitat","Sand, sandhills and limestone ridges."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b> – warm, and after flowering finishes in Dec. Nov – Dec and May are workable. Avoid Jun – Oct."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm."],["Selecting material","<b>Non-flowering<\/b> tips; pinch off any buds."],["Pre-treatment","• Strip lower leaves.<br/>• Trim larger leaves by about one-third.<br/>• Dip the base in rooting hormone."],["Rooting hormone","1.5 g/L IBA (<b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Humid frame, bottom heat, bright shade. Hairless leaves tolerate normal misting."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix.<br/>• Pinch tips to encourage branching."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily.","problems":[["Wilting","Low humidity or too much leaf. Trim leaves; keep the frame closed."],["Rotting","Mix too wet. Water less often."],["Cuttings flowering","Use non-flowering tips, or wait for the Jan – Apr window."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – check stock plants for rooted stems.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"}]},"seed":null},{"id":"scaevola-repens","sci":"Scaevola repens","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus, which strikes readily from cuttings.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Mar – May"],["Cutting length","50–80 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Prostrate to ascending or erect shrub, 0.05–1 m; trailing branches to about 50 cm."],["Flowering","Jun – Dec, sometimes Jan – Feb (white or cream, occasionally blue-purple; golden hairs on the outside of the flower)."],["Habitat","Sand dunes and plains on sand, gravel, laterite or limestone."],["Local note","Recorded in the City of Joondalup. A variable species with informal subspecies – use local provenance and keep it labelled."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b> – warm autumn weather, mostly outside the main flowering period. Sep – Feb is workable using non-flowering shoots (shade well in summer). Avoid Jun – Aug."],["Wood type","<b>Softwood to semi-hardwood<\/b> tip cuttings."],["Cutting size","50–80 mm tips from the trailing stems."],["Selecting material","<b>Non-flowering<\/b> tips. Flower spikes sit in the leaf axils – pinch off any you find."],["Pre-treatment","• Strip lower leaves.<br/>• Leaves can be long (up to 90 mm) – trim remaining leaves by about one-third to cut water loss.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) for soft tips; 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Humid frame with bottom heat, bright shade. Keep the mix moist but on the drier side rather than wet."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix.<br/>• Pinch tips once growing to encourage branching."]]}],"difficulty_note":"<b>Easy (provisional).<\/b> <i>Scaevola<\/i> cuttings generally strike very readily.","problems":[["Wilting in the first week","Too much leaf area or low humidity. Trim leaves harder; keep the frame closed."],["Rotting","Mix too wet. Water less often; improve drainage."],["Cuttings flowering, not rooting","Take non-flowering tips, or wait for the Mar – May window."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – some scaevolas sucker; check stock plants for rooted pieces.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null},{"id":"scaevola-thesioides","sci":"Scaevola thesioides","common":"","family":"Goodeniaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"Little species-specific data published. Based on the genus plus this species' fine, slender growth.","facts":[["Wood type","Softwood – semi-hardwood"],["Best months","Apr – May"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5–3 g/L IBA"]],"calendar":["P","P","P","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Spreading subshrub or perennial herb, 0.15–1 m. Mostly hairless; thread-like to narrow leaves; ribbed stems."],["Flowering","Aug – Dec and Jan – Mar (pale blue to white), in spikes at the ends of branches."],["Habitat","Coastal sand and limestone."],["Local note","The coastal Perth plant is subsp. <i>thesioides<\/i>; recorded in the Wanneroo LGA."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Apr – May<\/b> – warm autumn weather between flowering periods. Sep – Mar is workable using non-flowering side shoots. Avoid Jun – Aug."],["Wood type","<b>Softwood to semi-hardwood<\/b> – firm but still green tip or side-shoot cuttings."],["Cutting size","50–75 mm."],["Selecting material","<b>Non-flowering side shoots.<\/b> Flowers form at the branch tips, so main tips often carry buds."],["Pre-treatment","• Strip leaves from the lower half; leaves are narrow so little trimming is needed.<br/>• Stems are slender – always use a dibber hole.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>); 3 g/L (<b>Clonex Purple<\/b>) for firmer material."],["Propagation mix","Free-draining sand/coir mix."],["Environment","Hairless leaves tolerate misting better than <i>S. canescens<\/i>, but fine stems collapse quickly if the mix is waterlogged or dries out. Keep evenly moist, with bottom heat and bright shade."],["Expected strike time","About <b>4–8 weeks<\/b> in warm weather."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on gently – fine roots break easily. Single cuttings per tube make this easier.<br/>• Pinch tips once growing to encourage branching."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> The genus strikes readily; the fine stems are less forgiving of watering errors.","problems":[["Fine stems wilt or collapse","Mix drying out or waterlogged. Keep evenly moist; check daily."],["Cuttings flower instead of rooting","Pinch off terminal flower buds; use side shoots."],["Root damage when potting on","Strike one cutting per tube instead of community pots."]],"other":"Seed – <i>Scaevola<\/i> seed is generally difficult. Division – possible if stock plants have suckered.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – Scaevola ramosissima profile (genus note: cuttings strike very readily, seed difficult)","url":"anpsa.org.au/plant_profiles/scaevola-ramosissima/"},{"title":"Sustainable Gardening Australia – Fan Flower: take cuttings during the growing season","url":"sgaonline.org.au/fan-flower-fabulous-native-ground-cover/"},{"title":"Greenhouse Product News – Scaevola propagation (IBA rates, flower-free cuttings, bottom heat)","url":"gpnmag.com/article/scaevola-outback-fan-flower/"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"EverydayWits – Propagating Scaevola (small-nursery practice, seasonal success rates)","url":"everydaywits.com/propagate-scaevola/"},{"title":"Wikipedia – Scaevola canescens, S. repens, S. thesioides (descriptions)","url":"en.wikipedia.org"}]},"seed":null},{"id":"spinifex-hirsutus","sci":"Spinifex hirsutus","common":"Hairy Spinifex","family":"Poaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Method based on published trials with the closely related <i>S. sericeus<\/i> and general spinifex practice.","facts":[["Wood type","Runner (stolon) sections"],["Best months","Mar – May"],["Cutting length","10–15 cm, 1–2 nodes"],["Hormone (IBA)","Optional (1.5 g/L)"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–0.9 m, sending long runners across the sand. Broad, flat, silvery leaves, hairy on both sides."],["Flowering","Oct – Jan. Male and female flowers are on separate plants; female heads are large spiky balls that roll in the wind."],["Habitat","White sand on coastal dunes; an important stabiliser at the toe of unstable dunes."],["Local note","Recorded in the City of Joondalup. Less common than <i>S. longifolius<\/i> on the Cottesloe foreshore."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, when runners are young, green and actively growing, giving plants ready for winter planting. Sep – Feb is workable. Avoid Jun – Aug (slow growth)."],["Wood type","<b>Runner (stolon) sections<\/b> – not woody cuttings. Use young, green runners, not old brown ones."],["Cutting size","<b>Nursery tubes:<\/b> 10–15 cm sections with at least one (ideally two) nodes.<br/><b>Direct planting on site:<\/b> 40–50 cm runners, buried about halfway in damp sand."],["Selecting material","Actively growing runners from the dune edge. Plants are male or female, so collect from several plants if you want seed-producing plantings later."],["Pre-treatment","• Keep runners moist and shaded after collecting – they dry out fast.<br/>• Cut just below a node; trim leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. The hairy leaves of this species can hold water, so mist lightly."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery advises collecting from female plants growing near males. <i>S. sericeus<\/i> research found seed germinates far better in darkness (56%) than light (14%), so cover seed. Division of tussocks also works but survived less well than rooted cuttings in trials (31% vs 40%).","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra","url":"cottesloecoastcare.org"}]},"seed":null},{"id":"spinifex-longifolius","sci":"Spinifex longifolius","common":"Beach Spinifex","family":"Poaceae","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Medium","confidence_note":"Method based on published trials with the closely related <i>S. sericeus<\/i> and general spinifex practice.","facts":[["Wood type","Runner (stolon) sections"],["Best months","Mar – May"],["Cutting length","10–15 cm, 1–2 nodes"],["Hormone (IBA)","Optional (1.5 g/L)"]],"calendar":["P","P","B","B","B","-","-","-","P","P","P","P"],"snapshot":[["Habit","Rhizomatous, tussock-forming grass, 0.3–1 m high and up to 2 m wide, with long runners through the sand."],["Flowering","Apr – Dec or Jan (green-brown). Male and female plants are separate; female heads up to 250 mm across roll in the wind."],["Habitat","White sand on coastal dunes; a key foredune stabiliser."],["Local note","Recorded in the Wanneroo LGA; the more common of the two spinifex species on the Cottesloe foreshore."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Mar – May<\/b>, when runners are young, green and actively growing, giving plants ready for winter planting. Sep – Feb is workable. Avoid Jun – Aug (slow growth)."],["Wood type","<b>Runner (stolon) sections<\/b> – not woody cuttings. Use young, green runners, not old brown ones."],["Cutting size","<b>Nursery tubes:<\/b> 10–15 cm sections with at least one (ideally two) nodes.<br/><b>Direct planting on site:<\/b> 40–50 cm runners, buried about halfway in damp sand."],["Selecting material","Actively growing runners from the dune edge. Plants are male or female, so collect from several plants if you want seed-producing plantings later."],["Pre-treatment","• Keep runners moist and shaded after collecting – they dry out fast.<br/>• Cut just below a node; trim leaves back by about half.<br/>• Hormone optional – roots form naturally at the nodes."],["Rooting hormone","Optional. If used, softwood strength (1.5 g/L IBA, <b>Clonex Green<\/b>) on the node."],["Propagation mix","Coarse washed sand or a very sandy mix. Deep tubes suit the root system."],["Environment","Bottom heat and misting gave good rooting at the nodes in <i>S. sericeus<\/i> trials. Keep the sand moist, not wet."],["Expected strike time","Nodes root readily, but plants are <b>slow to reach planting size<\/b> – in one trial about 80% of cuttings were ready to plant within 18 months."],["Post-treatment / aftercare","• Harden off, then grow on in full sun.<br/>• Pot on into deep tubes or larger pots.<br/>• Plant out in late autumn or winter when rain is reliable."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Runner sections root well under bottom heat and mist, but it's labour-intensive and slow. Seed is the more common nursery method.","problems":[["Runners dry out before setting","Carry in damp bags in an esky; set the same day."],["Nodes rot","Mix too wet or too much mist. Use coarser sand; mist less."],["Slow growth after rooting","Normal for spinifex – allow time; feed lightly and give full sun."]],"other":"Seed – the usual nursery method. The Geraldton community nursery collects from female plants growing close to males, separates the seed, cuts off the awns and sows en masse with smoke water (about 10 days to germinate). <i>S. sericeus<\/i> research found seed germinates far better in darkness, so cover seed. Division of tussocks also works.","sources":[{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"NZ Department of Conservation – Rehabilitation of coastal foredunes using indigenous sand-binding species (Spinifex sericeus stolon cuttings, seed)","url":"doc.govt.nz/Documents/science-and-technical/sfc122.pdf"},{"title":"ABC Gardening Australia – Spinifex (40–50 cm runner cuttings)","url":"abc.net.au/gardening/how-to/spinifex/9432152"},{"title":"Cottesloe Coastcare Association – plant pages: Spinifex longifolius, S. hirsutus, Eremophila glabra","url":"cottesloecoastcare.org"}]},"seed":null},{"id":"spyridium-globulosum","sci":"Spyridium globulosum","common":"Basket Bush","family":"Rhamnaceae","alt":"","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"High","confidence_note":"Species-specific dormancy research and nursery data available.","facts":[["Pre-treatment","Hot water (or dry heat)"],["Best sowing","Apr – Jun"],["Sowing depth","2–3 mm (needs dark)"],["Typical germination","41%"],["Seed per 100 plants","0.5 g"]],"calendar":["-","-","P","B","B","B","P","P","-","-","-","-"],"snapshot":[["Habit","Erect shrub, usually 0.6–5 m."],["Flowering","Jun – Nov (white, in woolly heads)."],["Habitat","Sand on coastal dunes and limestone."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect fruit as it ripens in late spring–summer; bag branches to catch shed seed."],["Extraction & cleaning","Rub and sieve the small seed from the woolly flower heads."],["Seed quality","Water-impervious seed coat (physical dormancy) – seed won't take up water until treated."],["Storage life","Not well documented; hard-coated seed is usually long-lived when dry."],["Typical germination","About <b>41%<\/b> after heat treatment (Alcoa, only 2 tests). About <b>205 seedlings per gram<\/b>. Research recorded high germination after hot water at cool (7/18°C) temperatures."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Apr – Jun<\/b> – germinates best at winter-like temperatures (7/18°C); warmth suppresses it. Mar, Jul – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Hot water<\/b> (about 90–95°C) breaks the seed-coat dormancy – keep it short, as over-long treatment can kill seed. Alcoa used a dry-heat pulse instead."],["Sowing depth & method","Cover about <b>2–3 mm<\/b> – germination is suppressed by light, so keep the seed covered and trays shaded."],["After sowing","Water in; keep moist in a cool, shaded spot."],["Germination time","Not well documented – allow several weeks and record results."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed coat not broken, or trays too warm or too light. Re-treat; cover seed; sow in cooler months."],["Seed killed by treatment","Hot water too long. Shorten the soak."],["Damping off","Wet, crowded trays. Thin sowing, airflow."]],"other":"One of the few coastal shrubs here that needs cool temperatures <i>and<\/i> darkness to germinate.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1800, 1834, 2299, 2301, 3710, 3824, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 11636, 17104, 17240, 18598","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Science Research – Physical dormancy in seeds of six genera of Australian Rhamnaceae (incl. Spyridium globulosum)","url":"cambridge.org (Seed Science Research)"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]}},{"id":"threlkeldia-diffusa","sci":"Threlkeldia diffusa","common":"Coast Bonefruit","family":"Amaranthaceae (chenopods)","alt":"","cuttings":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"No published cutting data found. Seed is the documented method; cuttings are a trial.","facts":[["Wood type","Softwood tips"],["Best months","Dec – Mar"],["Cutting length","50–75 mm"],["Hormone (IBA)","1.5 g/L IBA"]],"calendar":["B","B","B","P","-","-","-","-","-","-","P","B"],"snapshot":[["Habit","Much-branched, prostrate to erect perennial, 0.1–0.4 m, forming a spreading mat. Semi-succulent leaves."],["Flowering","Oct – Nov (tiny, green), followed by small red to black fruits."],["Habitat","White or grey sand over limestone, coastal areas and saline flats. Salt- and drought-tolerant."],["Local note","Recorded in the City of Joondalup."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Dec – Mar<\/b> – warm, with plants actively growing after flowering. Nov and Apr are workable. Avoid May – Oct."],["Wood type","<b>Softwood tip cuttings<\/b> of the semi-succulent stems."],["Cutting size","50–75 mm."],["Selecting material","Healthy tips without developing fruit."],["Pre-treatment","• Strip lower leaves.<br/>• No wounding.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Softwood strength, 1.5 g/L IBA (<b>Clonex Green<\/b>)."],["Propagation mix","Very free-draining sandy mix."],["Environment","Semi-succulent leaves rot if kept wet – mist very little, keep the mix on the dry side, give good airflow and bright light."],["Expected strike time","Not documented – start checking from about 4 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Grow on in full sun; water sparingly."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> No cutting data found; seed is the proven method (see Other methods).","problems":[["Cuttings turn soft and rot","Too wet or humid. Water less, mist less, improve airflow."],["Weak, stretched growth","Not enough light. Move to a brighter position."],["No roots","Try firmer tips or the seed method."]],"other":"Seed – the documented method. The Geraldton community nursery soaks seed in smoke water (1:9) for 24 hours; germination takes 10–15 days and happens in cooler weather, so sow in autumn.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 5162, 7603, 12585, 12824, 13152","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019)","url":"cgg.wa.gov.au"},{"title":"APACE WA – Threlkeldia diffusa","url":"apacewa.org.au/plant/threlkeldia-diffusa/"}]},"seed":null}],"methods":{"cuttings":[{"title":"Wood types and the bend test","level":2,"blocks":[{"type":"table","rows":[["Wood type","What it looks like","Bend test","Use"],["<b>Softwood<\/b>","Soft, flexible, bright new growth from the current flush.","Flops or stays bent.","Roots fast but wilts and rots easily. Suits soft-stemmed plants such as <i>Scaevola<\/i>."],["<b>Semi-hardwood<\/b>","Current season's growth that has begun to firm; bark starting to colour.","Bends about 60° and springs back.","The standard for most WA native shrubs. More forgiving than softwood."],["<b>Hardwood<\/b>","Fully mature, woody stems from previous seasons.","Stiff; snaps rather than bends.","Slow to root. Rarely needed for the species in this guide."]]}]},{"title":"Difficulty ratings","level":2,"blocks":[{"type":"table","rows":[["Rating","Meaning"],["<b>Easy<\/b>","Strikes reliably with the standard method."],["<b>Easy–Moderate<\/b>","Usually strikes; one factor (e.g. moisture, fragile stems) needs extra care."],["<b>Moderate<\/b>","Strikes, but results depend on timing, material and moisture control. Set extra cuttings."],["<b>Moderate–Difficult<\/b>","Low or variable strike; needs careful timing and good facilities."],["<b>Difficult<\/b>","Low or erratic strike; specialist techniques or alternative methods usually needed."]]},{"type":"p","html":"<b>* Provisional<\/b> – rating is based on how the genus generally behaves because little species-specific data is published. Replace it with the nursery's own figure once a few batches have been recorded.","small":true}]},{"title":"Confidence","level":2,"blocks":[{"type":"table","rows":[["Level","Meaning"],["<b>High<\/b>","Species-specific propagation information is published and consistent."],["<b>Medium<\/b>","Built from genus-level information plus the species' own traits (habit, leaf type, flowering time). Sound starting point – verify with trials."],["<b>Low<\/b>","Little information available; treat as a trial protocol."]]}]},{"title":"Standard cutting method","level":1,"blocks":[{"type":"p","html":"Species pages refer back to these steps and only note where a species differs.","small":false},{"type":"table","rows":[["Step","What to do"],["<b>1. Collect<\/b>","Take material early in the morning from healthy, pest-free, well-watered, <b>non-flowering<\/b> stock. Seal in a moist plastic bag and keep in an esky out of the sun. Process the same day."],["<b>2. Prepare<\/b>","Use a sharp, clean blade (wipe with alcohol between stock plants). Cut just below a node. Strip leaves from the lower half to two-thirds without tearing the bark. Reduce large leaves by about one-third. Remove flowers and buds."],["<b>3. Wound (optional)<\/b>","On firmer stems, remove a thin sliver of bark from the bottom 15–20 mm to expose more rooting area."],["<b>4. Hormone<\/b>","Decant a small amount into a clean container, dip the base to about 1 cm, and discard what's left. Store hormone in the fridge – it has a limited shelf life."],["<b>5. Set<\/b>","Make a hole with a dibber so the hormone isn't wiped off, insert to the bottom of the hole, and firm the mix. Single tubes
