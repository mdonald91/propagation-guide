03, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (ventilate, avoid mist on cuttings)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (15 cm terminal cuttings in spring)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"},{"title":"Applied Sciences (MDPI, 2025) – Propagation of Atriplex halimus by unrooted cuttings","url":"mdpi.com/2076-3417/15/13/7027"}]},"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data (3 tests) and a WA community-nursery method are available.","facts":[["Pre-treatment","Soak 4 days; smoke water"],["Best sowing","Mar – May"],["Sowing depth","1–2 mm"],["Typical germination","22%"],["Seed per 100 plants","6.7 g"]],"check":[11,20],"stats":{"germ_pct":22,"per_gram":15},"grow":[3.0,4.0],"storage":{"kind":"unknown","months":24,"text":"Not well documented – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","P","-","-"],"snapshot":[["Habit","Grey-leaved, spreading shrub, 0.5–2.5 m. Male and female flowers on the same plant."],["Flowering","Mainly Mar – Jun."],["Habitat","White sand on coastal dunes."],["Local note","Recorded in the Wanneroo LGA. Very salt- and wind-tolerant."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Each seed is enclosed in a pair of papery bracts. Collect the fruiting bracts when they turn dry and straw-coloured and come away easily."],["Extraction & cleaning","Rub off stems and leaves and sieve. Sow the seed still inside its bracts."],["Seed quality","Soaking or washing removes germination inhibitors (salts) from the bracts – the reason for the long soak below."],["Storage life","Not well documented. Store dry and cool. Soaked seed can be dried again and stored until needed (Geraldton community nursery)."],["Typical germination","About <b>22%<\/b> (untreated, Alcoa nursery average, 3 tests). About <b>15 seedlings per gram<\/b> – roughly 6.5 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Oct is workable (autumn, early winter and spring suit saltbush). Avoid Nov – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Soak for 4 days, changing the water 3 times a day<\/b>, then water in with smoke water (Geraldton method). Presoaked seed germinates faster."],["Sowing depth & method","Cover about <b>1–2 mm<\/b>. Sow thinly in trays, or 2–3 bracts per tube and thin."],["After sowing","Water in with smoke water; keep moist, not wet."],["Germination time","About <b>11–20 days<\/b> (Geraldton nursery). Germinates best in cool conditions."],["Pricking out","When the second pair of leaves appears."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor, patchy germination","Inhibitors not washed out. Soak the full 4 days with regular water changes."],["Seedlings collapse","Damping off. Thinner sowing, sterile mix, good airflow."],["Leaf spots on young plants","Foliage kept wet. Water the mix, not the leaves; improve airflow."]],"other":"Tip cuttings are a workable alternative (see the Cuttings Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Australian National Botanic Gardens – Atriplex nummularia (wash or soak fruits; sow autumn, early winter or spring)","url":"anbg.gov.au/gnp/interns-2007/atriplex-nummularia.html"},{"title":"Nurseries Online – Atriplex nummularia (seed soaked, sown 1–2 mm deep)","url":"nurseriesonline.com.au/plant-index/australian-native-plants/atriplex-nummularia/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Good","note":"Saltbush cuttings are generally reliable (provisional for this species).","guide":"cuttings"},{"method":"Seed","suitability":"Main method","note":"Soak 4 days in changed water, then smoke water.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Woody shrub.","guide":null}],"collect":{"cal":["-","-","-","-","P","P","P","P","P","-","-","-"],"basis":"estimate","any":false,"note":"Collect bracts when dry, straw-coloured and they come away easily."},"conservation":"","seedid":{"unit":"Fruiting bracteoles (seed inside) – sown whole","look":"Hard, broadly triangular bracteoles, thick and domed in the centre with 2–4 warty bumps; the round seed sits inside.","size":"4–8 mm long and wide","tell":"No cleaning needed if only fruits are collected. Keep the hard bracteoles; leaf scales and stems are debris (related species).","level":"species","d":{"shape":"bracteole","L":6,"W":6,"col":"lightbrown"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":false}},{"id":"austrostipa-elegantissima","sci":"Austrostipa elegantissima","common":"Feather Speargrass","family":"Poaceae","fam":"Poaceae","alt":"Previously <i>Stipa elegantissima<\/i>","cuttings":null,"seed":{"difficulty":"Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method available; genus after-ripening well documented. The only nursery test (fresh, untreated) gave 0%.","facts":[["Pre-treatment","Aged seed; smoke-water soak"],["Best sowing","Mar – May"],["Sowing depth","Just covered"],["Typical germination","Better with 1–2 yr old seed"]],"check":[5,10],"stats":{"germ_pct":null,"per_gram":null},"grow":[3.0,4.0],"storage":{"kind":"ripen","months":12,"text":"Improves with 1–2 years' storage"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Rhizomatous, tufted, often sprawling perennial grass, 0.35–2 (–3) m."],["Flowering","Aug – Dec or Jan (fluffy, feathery green heads)."],["Habitat","Sand, loam, clay and granite, occasionally saline."],["Local note","Recorded around Perth (Cottesloe, Cambridge, Cockburn); FloraBase has no Joondalup or Wanneroo specimens."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Collect Oct – Feb. Gently strip seed that is turning brown – mature seed comes off easily."],["Extraction & cleaning","Rub gently and sieve out the chaff."],["Seed quality","Viability varies – one stored lot was 35% viable. Cut-test a sample."],["Storage life","<b>Keep it 1–2 years before sowing<\/b> – older seed germinates better (Geraldton). Many <i>Austrostipa<\/i> need 2–24 months of after-ripening. Store dry and airtight with a desiccant."],["Typical germination","Not recorded with treatment. Fresh untreated seed gave 0% in the only Alcoa test."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Soak in smoke water (1:9) for 24 hours<\/b> (Geraldton method). If only fresh seed is available, add gibberellic acid (GA) as well as smoke water."],["Sowing depth & method","Just cover the seed, in trays or a few seeds per tube."],["After sowing","Keep moist, not wet."],["Germination time","About <b>5 days<\/b> for aged, smoke-treated seed at Geraldton; 3–10 weeks is typical for the genus."],["Pricking out","When seedlings have 2–3 leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["No germination","Seed too fresh. Store 1–2 years, or add GA to the smoke soak."],["Seedlings collapse","Damping off. Sow thinly; airflow."],["Floppy, tangled plants","Normal habit – give tubes space."]],"other":"Established clumps can also be divided (see the Division Guide).","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seeds of South Australia – Frankenia pauciflora (var. gunnii, var. fruticulosa) and Austrostipa elegantissima: collection, germination, storage","url":"seedsofsa.au (read via syzygium.xyz mirror)"},{"title":"Australian National Botanic Gardens – Austrostipa ramosissima (after-ripening 2–24 months; 3–10 weeks; division)","url":"anbg.gov.au/gnp/trainees-2016/austrostipa-ramosissima.html"}]},"division":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Medium","confidence_note":"No species method published. ANBG reports high success from division of <i>Austrostipa<\/i> in late winter – early spring.","facts":[["Division type","Rhizome / tussock division"],["Best months","Aug – Sep"],["Division size","Clumps of 3–5 tillers"],["Time to establish","4–6 weeks"]],"check":[28,42],"calendar":["-","-","P","P","P","P","P","B","B","P","-","-"],"snapshot":[["Habit","Rhizomatous, tufted, often sprawling perennial grass, 0.35–2 (–3) m."],["Flowering","Aug – Dec or Jan (fluffy, feathery green heads)."],["Habitat","Sand, loam, clay and granite, occasionally saline."],["Local note","Recorded around Perth (Cottesloe, Cambridge, Cockburn); FloraBase has no Joondalup or Wanneroo specimens."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Aug – Sep<\/b> – late winter to early spring gives high success for <i>Austrostipa<\/i>. Mar – Jul and Oct are workable. Avoid Nov – Feb (heat)."],["Division type","<b>Rhizome / tussock division<\/b> – split the clump into pieces of shoots (tillers), each with roots."],["Division size","Clumps of <b>3–5 tillers<\/b> with a good root mass. Very small pieces establish poorly."],["Selecting stock","Healthy, established pot-grown clumps that are actively growing."],["Preparation","• Water the stock plant the day before.<br/>• Knock the clump out and cut it apart with a sharp knife or spade.<br/>• Cut the stems and leaves back to about 15 cm to reduce water loss."],["Potting","Pot into a free-draining mix at the original depth. Firm in and water well."],["Environment","Shade house until new leaves appear. Keep the mix moist, not wet."],["Time to establish","Roughly <b>4–6 weeks<\/b>. Record your results."],["Aftercare","• Move gradually to full sun once new growth shows.<br/>• Give tubes room – plants sprawl."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Division works well in the genus; untested for this species.","problems":[["Divisions brown off","Too small, or roots dried out. Keep 3–5 tillers per piece; work in the shade."],["Base rots","Too wet or planted too deep."],["No new growth","Divided in summer. Divide in late winter – early spring."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"},{"title":"Australian National Botanic Gardens – Austrostipa ramosissima (division in late winter – early spring has high success)","url":"anbg.gov.au/gnp/trainees-2016/austrostipa-ramosissima.html"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Grasses are not grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"1–2 year old seed; smoke-water soak.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Late winter – early spring (genus).","guide":"division"}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","P","B","B"],"basis":"guide","any":false,"note":"Strip seed that is turning brown – ripe seed comes off easily."},"conservation":"","seedid":{"unit":"Floret with awn (grain inside)","look":"Black to dark-brown lemma at maturity with a short, white-hairy callus at the base (0.5–0.8 mm) and an awn bent once. The yellow-brown grain inside is up to 5 mm long.","size":"Floret 4.5–10 mm; awn 20–50 mm","tell":"Strip lemmas that are turning brown to black – ripe ones come off easily. No further cleaning is needed. White callus hairs and one bend in the awn tell it from A. flavescens.","level":"species","d":{"shape":"floret","L":7,"W":1.0,"col":"black","awn":35,"bends":1,"callus":"white"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[],"sosa":true}},{"id":"austrostipa-flavescens","sci":"Austrostipa flavescens","common":"Coast Speargrass","family":"Poaceae","fam":"Poaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"WA community-nursery method and genus-level dormancy research; no Alcoa data for this species.","facts":[["Pre-treatment","Smoke water; aged seed"],["Best sowing","Mar – May"],["Sowing depth","0–2 mm"],["Typical germination","Not recorded"]],"check":[21,42],"stats":{"germ_pct":null,"per_gram":null},"grow":[3.0,4.0],"storage":{"kind":"ripen","months":12,"text":"Improves with 1–2 years dry storage"},"calendar":["-","P","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Tufted perennial grass, 0.2–1.2 m."],["Flowering","Sep – Oct."],["Habitat","Grey, red or calcareous sand, sandy loam and limestone; sand dunes."],["Local note","Coastal species. Collect from local-provenance stands and record the source."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed ripens in late spring to early summer after flowering. Collect when seed heads turn straw-coloured and seed pulls away easily; it sheds quickly once ripe."],["Extraction & cleaning","Strip seed by hand and dry in paper bags. Long awns can be trimmed to make sowing easier."],["Seed quality","Fresh seed is often dormant (after-ripening needed)."],["Storage life","Store dry at room temperature. <b>Older seed (1–2 years) gives higher germination<\/b> in <i>Austrostipa<\/i> (Geraldton community nursery)."],["Typical germination","No Alcoa data for this species. A related speargrass (<i>A. caespitosa<\/i>) gave 73% after aerosol smoke."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (autumn). Feb and Jun – Aug workable. Avoid Sep – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","• Use seed stored for a year or more, <b>or<\/b><br/>• Water trays with smoke water after sowing (Geraldton method).<br/>• With fresh seed only, gibberellic acid plus smoke water can lift germination."],["Sowing depth & method","<b>Sow very shallowly<\/b> – on or just below the surface (0–2 mm), pressed in lightly. Seed needs light to germinate."],["After sowing","Water in with smoke water; keep moist."],["Germination time","About <b>21 days<\/b> (Geraldton nursery)."],["Pricking out","Prick out or divide small clumps when seedlings are 3–5 cm with several leaves."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–4 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Poor germination from fresh seed","Dormant. Store seed a year, or use smoke water (and GA if available)."],["Seed buried too deep","Needs light. Sow on the surface and press in."],["Seedlings rot","Overwatering. Keep moist, not wet."]],"other":"Can also be multiplied by dividing established clumps.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Florabank Guidelines Module 11 – Seed germination and dormancy. Australian Network for Plant Conservation","url":"anpc.asn.au/wp-content/uploads/2025/08/11.-Seed-Germination-and-Dormancy.pdf"}]},"division":{"difficulty":"Moderate","provisional":true,"confidence":"Low","confidence_note":"Division of established clumps works for this grass, but no species-specific method is published. Follows general tussock-grass practice – trial protocol.","facts":[["Division type","Tussock division"],["Best months","Apr – Jun"],["Division size","Small clumps, 3–5 tillers"],["Time to establish","4–6 weeks"]],"check":[28,42],"calendar":["-","-","P","B","B","B","P","-","-","-","-","-"],"snapshot":[["Habit","Tufted perennial grass, 0.2–1.2 m."],["Flowering","Sep – Oct."],["Habitat","Grey, red or calcareous sand, sandy loam and limestone; sand dunes."],["Local note","Coastal species. Use nursery stock plants rather than digging from bushland."]],"sections":[{"title":"Division method","rows":[["Best time to divide","<b>Apr – Jun<\/b>, as autumn rain restarts growth. Mar and Jul are workable. Avoid Aug – Feb (flowering, seed set and summer heat)."],["Division type","<b>Tussock division<\/b> – a clump is split into smaller clumps of shoots (tillers), each with roots."],["Division size","Small clumps of <b>3–5 tillers<\/b> with a good root mass. Very small pieces establish poorly."],["Selecting stock","Healthy, established pot-grown clumps that are actively growing."],["Preparation","• Water the stock plant the day before.<br/>• Knock the clump out and tease or cut it apart with a sharp knife or spade.<br/>• Trim damaged roots.<br/>• Cut the leaves back to about 10–15 cm to reduce water loss."],["Potting","Pot into a free-draining mix at the original depth. Firm in and water well."],["Environment","Shade house until new leaves appear. Keep the mix moist, not wet."],["Time to establish","Roughly <b>4–6 weeks<\/b> in autumn. Record your results."],["Aftercare","• Move gradually to full sun once new growth shows.<br/>• Pot on or plant out in winter."]]}],"difficulty_note":"<b>Moderate (provisional).<\/b> Grass clumps usually divide readily, but this species hasn't been tested here. Seed is the main method.","problems":[["Divisions brown off","Too small, or roots dried out. Keep 3–5 tillers per piece; work quickly in the shade."],["Base rots","Too wet or planted too deep. Pot at the original level; water less."],["No new growth","Divided in the wrong season. Divide as autumn growth starts."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: division and layering (grass-like clumps, suckers, self-layering plants; division size, timing, hardening off)","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles (descriptions, flowering, habitat, local records)","url":"florabase.dbca.wa.gov.au"}]},"options":[{"method":"Cuttings","suitability":"Not used","note":"Tufted grass.","guide":null},{"method":"Seed","suitability":"Main method","note":"Aged seed and smoke water; sow shallow.","guide":"seed"},{"method":"Division","suitability":"Good","note":"Divide established tussocks into small clumps.","guide":"division"}],"collect":{"cal":["P","-","-","-","-","-","-","-","-","P","B","B"],"basis":"guide","any":false,"note":"Sheds quickly once ripe – collect when heads turn straw-coloured."},"conservation":"","seedid":{"unit":"Floret with awn (grain inside)","look":"Dark-brown lemma with golden hairs, a fine callus 1.6–3 mm long and an awn with a hairy lower column, bent twice.","size":"Floret 5.5–9 mm; awn 40–70 mm","tell":"Collect lemmas as they turn golden; strip by hand. No further cleaning is needed.","level":"species","d":{"shape":"floret","L":7,"W":1.0,"col":"darkbrown","awn":55,"bends":2,"callus":"gold"},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"]],"photos":[{"id":"67da3819-2a18-435c-9c28-dc9591ae9ecf","nsb":447,"by":"B. Clinton"},{"id":"a055cfd5-1c8d-473c-a085-52a0099db642","nsb":448,"by":"B. Clinton"}],"sosa":true}},{"id":"banksia-attenuata","sci":"Banksia attenuata","common":"Slender Banksia / Candle Banksia","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","60%"],["Seed per 100 plants","6.7 g"]],"check":[16,49],"stats":{"germ_pct":60,"per_gram":15},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once extracted – keep in cone or dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Lignotuberous tree or shrub, usually 2–4 m (up to 10 m). Resprouts after fire."],["Flowering","Oct – Feb (yellow candles)."],["Habitat","White, yellow, brown or pale red sand, sometimes over laterite; sand dunes and sandplains."],["Local note","Recorded in Joondalup and Wanneroo. Highly susceptible to <i>Phytophthora<\/i> dieback – strict hygiene."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles can take a year or more to mature. Collect <b>old, dry, dark grey-brown cones<\/b> with closed follicles. Cones hold seed for some time, so collection isn't tied to one month."],["Extraction & cleaning","Open follicles with heat: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat then soak in water for several hours and dry in a warm oven. Separate the winged black seed from the woody separator. Good seed is white and firm inside. Never microwave cones."],["Seed quality","Seed from older cones tends to have lower viability than from younger cones – favour recent cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Best kept in the cone until the sowing season; extracted seed can remain viable for some years sealed, dry and cool (10–25°C, 40–60% RH)."],["Typical germination","About <b>60%<\/b> (untreated, Alcoa nursery average). About <b>15 seedlings per gram<\/b> – roughly 7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Sep workable. Avoid Oct – Feb (heat raises damping-off losses)."],["Seed mix","Free-draining, <b>pathogen-free, low-phosphorus<\/b> mix (pasteurise home-made mix at 60°C for 30 min). Slightly acid (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or sow thinly in deep trays. <b>Just cover<\/b> with fine mix or vermiculite (about 3–5 mm)."],["After sowing","Water in with a fine spray. This species is <b>highly vulnerable to damping off<\/b> – water from below (capillary bed) if possible, or use a registered fungicide at germination (e.g. furalaxyl or captan, as per label)."],["Germination time","About <b>16–49 days<\/b>."],["Pricking out","If tray-sown, prick out <b>at the cotyledon stage, no later than a few weeks after germination<\/b>, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, fungicide at germination, less crowding."],["Yellowing, dying seedlings in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Use very low-P fertiliser; keep pots off the ground."],["Few seeds from cones","Immature or old cones. Collect ripe, recent cones; check follicles have developed."]],"other":"Feed only with half-strength, very low-phosphorus fertiliser once established (Proteaceae are P-sensitive).","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Banksias are rarely grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Extract from cones; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree / shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect old, dry, grey-brown cones with closed follicles."},"conservation":"","seedid":{"unit":"Winged seed (from the follicles)","look":"Obovate seed with a papery wing; the wedge-shaped seed body is smooth on one face and rough on the other. Seed coat dark brown to black (genus).","size":"22–26 mm long; seed body 12–14 × 13–14 mm","tell":"Each follicle holds 1–2 seeds and a brown, two-winged woody separator of similar shape – the separator has no seed body and is chaff. Good seed is firm and white inside; discard seed with holes or frass (Seed Notes 8).","level":"species","d":{"shape":"winged","L":24,"W":13.5,"col":"darkbrown","body":0.55},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 8 – Banksia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"]],"photos":[],"sosa":false}},{"id":"banksia-dallanneyi","sci":"Banksia dallanneyi","common":"Couch Honeypot","family":"Proteaceae","fam":"Proteaceae","alt":"Previously <i>Dryandra lindleyana<\/i>","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (23 tests) and WA <i>Dryandra<\/i> seed notes available.","facts":[["Pre-treatment","None (warm fruit to release)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","37%"],["Seed per 100 plants","3.0 g"]],"check":[21,120],"stats":{"germ_pct":37,"per_gram":33},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Low, lignotuberous shrub to 0.5 m, often prostrate and spreading by underground stems."],["Flowering","May – Oct (cream, yellow-brown or pink honeypot heads at ground level)."],["Habitat","Sand or sandy loam, laterite, granite, limestone; flats and rises."],["Local note","Recorded in the Wanneroo LGA (subsp. <i>dallanneyi<\/i> var. <i>dallanneyi<\/i> on the Swan Coastal Plain). Label seed by subspecies – there are five."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Follicles turn dark brown or black when ripe. Collect whole heads, checking for insect and bird damage."],["Extraction & cleaning","Warm the heads in a paper bag – a low oven (<b>no more than 60°C<\/b>) or a car dashboard – until the follicles open. Separate the winged seed from the woody separators."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Long<\/b> – seed stays viable for many years stored dry and cool."],["Typical germination","About <b>37%<\/b> (Alcoa nursery average, 23 tests, fruit warmed to release seed). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings. Many dryandras can reach close to 100% with good seed."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>. Jun – Sep workable. Avoid Oct – Feb (heat and damping off)."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> once the seed is out of the follicle."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in; keep moist, not wet. Water from below if you can – damping off is the main risk."],["Germination time","Several weeks to several months – keep trays going."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, good airflow."],["Yellowing seedlings","Phosphorus toxicity or <i>Phytophthora<\/i>. Very low-P feed; pots off the ground."],["Few seeds from heads","Insect-damaged or immature heads. Collect dark, ripe follicles."]],"other":"One of the more reliable dryandras in cultivation. ANPSA notes cuttings are also successful.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"Seed Notes 13 – Dryandra (now Banksia). Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"},{"title":"ANPSA – Banksia dallanneyi (syn. Dryandra lindleyana) profile","url":"anpsa.org.au/plant_profiles/banksia-dallanneyi-syn-dryandra-lindleyana/"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Possible","note":"ANPSA reports cuttings are successful; no details.","guide":null},{"method":"Seed","suitability":"Main method","note":"Warm heads to release seed; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Spreads by underground stems; not documented as a method.","guide":null}],"collect":{"cal":["P","P","P","P","-","-","-","-","-","-","-","P"],"basis":"estimate","any":false,"note":"Follicles turn dark brown or black when ripe; check for insect damage."},"conservation":"","seedid":{"unit":"Winged seed (from the follicles)","look":"Winged seed from small follicles that are often buried deep in the old flower heads. Seed coat black when mature, with a firm white seed inside (Dryandra genus).","size":"Not published (follicles 7–13 mm)","tell":"One or both seeds are often insect-damaged – discard seed with holes. Warm follicles (no more than 60 °C) to open them (Seed Notes 13).","level":"genus","d":{"shape":"winged","L":null,"W":null,"col":"black","body":0.5},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 13 – Dryandra (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"]],"photos":[],"sosa":false}},{"id":"banksia-grandis","sci":"Banksia grandis","common":"Bull Banksia","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (54 tests) and Banksia seed-handling guidance available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","78%"],["Seed per 100 plants","7.4 g"]],"check":[21,42],"stats":{"germ_pct":78,"per_gram":13.6},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once extracted – dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree, 1.5–10 m (a shrub on the south coast), with huge, deeply lobed leaves."],["Flowering","Sep – Dec or Jan (yellow-green spikes)."],["Habitat","White or grey sand and laterite."],["Local note","Recorded in the Wanneroo LGA. <b>Very phosphorus-sensitive<\/b> and susceptible to <i>Phytophthora<\/i> dieback."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Unlike many banksias, the follicles <b>open as they mature<\/b> without fire. Tie old stockings or muslin over maturing cones, or collect cones just before the follicles split."],["Extraction & cleaning","Dry cones in a warm spot; if follicles stay shut, oven at <b>120–130°C for 1 hour<\/b>. Separate the winged seed from the separators."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool."],["Typical germination","About <b>78%<\/b> (untreated, Alcoa nursery average, 54 tests). About <b>14 seedlings per gram<\/b> – roughly 7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (about 20–25°C). Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> – reliable without treatment (ANPSA)."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in. Water from below if possible; watch closely for damping off."],["Germination time","About <b>3–6 weeks<\/b> (22–42 days reported)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing. Slow to flower – many years from seed."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or dieback. No P in feed; strict hygiene; pots off the ground."],["Empty follicles","Cones collected too early. Wait until follicles are fully developed."]],"other":"Cuttings are slow and unreliable – seed is the method.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles 1411, 1728, 1732, 1733, 1800, 1834, 2299, 2301, 2463, 2718, 2742, 2798, 3710, 3824, 3845, 3957, 3966, 4044, 4828, 5426, 5659, 5708, 5920, 8127, 8184, 8282, 11341, 11636, 16449, 17104, 17240, 17657, 18119, 18560, 18598; 2401, 3409, 3502, 3584, 3961, 3968, 4012, 4027, 4029, 4256, 5615, 11611, 15481, 20475, 20482, 1819, 1842, 2175, 2197, 2214, 2316, 32576, 32580, 933, 955, 992, 1208, 1418, 2356, 7353, 10765, 10804, 11513, 18255, 20216, 50549, 51773, 577, 1256, 1409, 1427, 2286, 3262, 5011, 5209, 5541, 11434, 11597, 14104, 17237, 20368, 3805, 6427, 5887, 19942, 1468, 1550; and those cited in the Cuttings Guide","url":"florabase.dbca.wa.gov.au"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"ANPSA – Banksia grandis profile (reliable from seed; slow cuttings; slow to flower)","url":"anpsa.org.au/plant_profiles/banksia-grandis/"},{"title":"Wikipedia – Banksia grandis and Banksia prionotes (seed release, germination times)","url":"en.wikipedia.org"},{"title":"Lambers H. et al. (2013) Conservation Physiology – phosphorus sensitivity and Phytophthora in Banksia grandis","url":"academic.oup.com/conphys/article/1/1/cot010/361663"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Slow to strike, well under 100% success.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; about 78% germination.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree.","guide":null}],"collect":{"cal":["P","P","P","P","-","-","-","-","-","-","-","-"],"basis":"estimate","any":false,"note":"Follicles open as they mature – bag cones or pick just before they split."},"conservation":"","seedid":{"unit":"Winged seed (from the follicles)","look":"Long seed with a papery wing; seed body smooth on the inner face, somewhat rough outside. Seed coat dark brown to black (genus).","size":"32–38 mm long; seed body 12–16 × 7–9 mm","tell":"Each follicle holds 1–2 seeds and a brown, two-winged woody separator of similar shape – the separator has no seed body and is chaff. Good seed is firm and white inside; discard seed with holes or frass (Seed Notes 8).","level":"species","d":{"shape":"winged","L":35,"W":8.5,"col":"darkbrown","body":0.4},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 8 – Banksia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"]],"photos":[],"sosa":false}},{"id":"banksia-menziesii","sci":"Banksia menziesii","common":"Firewood Banksia","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Published nursery test data and Banksia seed-handling guidance are available.","facts":[["Pre-treatment","None (extract from cones)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","56%"],["Seed per 100 plants","3.7 g"]],"check":[26,40],"stats":{"germ_pct":56,"per_gram":27},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once extracted – keep in cone or dry & cool"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree or shrub, 1.3–7 m, from a lignotuber. Resprouts after fire."],["Flowering","Feb – Oct, peaking May – Jul (pink, red or yellow)."],["Habitat","White, grey or yellow sand."],["Local note","Recorded in Joondalup and Wanneroo. Medium to high susceptibility to <i>Phytophthora<\/i> dieback."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Up to 25 follicles per cone, each with 1–2 seeds. Follicles open mainly after fire (or release seed after about two years), so collect <b>mature, closed cones<\/b>."],["Extraction & cleaning","Heat cones to open follicles: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 min), or briefly heat, soak for several hours, then dry in a warm oven. Separate seed from the woody separators."],["Seed quality","Good seed is white and firm with a dark coat. Recent cones generally give better viability than old cones."],["Storage life","<b>Short-lived once extracted<\/b> unless stored dry and cool. Keep in the cone until needed where possible."],["Typical germination","About <b>56%<\/b> (untreated, Alcoa nursery average). About <b>27 seedlings per gram<\/b> – roughly 3.7 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b>, once the weather cools. Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix (about pH 6)."],["Pre-treatment","<b>None needed<\/b> once seed is out of the follicle."],["Sowing depth & method","<b>Direct sow 1–2 seeds per deep tube<\/b> (preferred), or thinly in deep trays. Just cover (about 3–5 mm)."],["After sowing","Water in with a fine spray; bottom watering where possible. Watch for damping off; fungicide at germination if needed (as per label)."],["Germination time","About <b>26–40 days<\/b>."],["Pricking out","If tray-sown, prick out at the cotyledon stage within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> under shade cloth after pricking out, then harden off gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse soon after emerging","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or <i>Phytophthora<\/i>. Very low-P feed; strict hygiene; pots off the ground."],["Follicles won't open","Not enough heat. Repeat heating, or heat then soak and re-dry."]],"other":"Takes about five to seven years to flower from seed.","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: seed mix, pre-treatments, pricking out, growing on","url":"anpsa.org.au/plant-propagation/"},{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"ANPSA – The Propagation of Banksia (extraction, mix, damping off, low-P feeding, hardening)","url":"anpsa.org.au/the-propagation-of-banksia/"},{"title":"Seed Notes 8 – Banksia. Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"},{"title":"Wikipedia – Banksia attenuata and Banksia menziesii (germination times, damping off, serotiny)","url":"en.wikipedia.org"},{"title":"Crawford A.D. – Seed storage and longevity of Australian plant species (PhD thesis; Banksia cone age and viability)","url":"library.dbca.wa.gov.au/static/FullTextFiles/924221.pdf"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Difficult","note":"Banksias are rarely grown from cuttings.","guide":null},{"method":"Seed","suitability":"Main method","note":"Extract from cones; no pre-treatment.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Tree / shrub.","guide":null}],"collect":{"cal":["P","P","P","P","P","P","P","P","P","P","P","P"],"basis":"guide","any":true,"note":"Collect mature, closed cones."},"conservation":"","seedid":{"unit":"Winged seed (from the follicles)","look":"Winged seed whose colour varies between plants – pale, dark grey or black. Seed body pitted near the edge.","size":"23–30 mm long; seed body 10–11 × 11–14 mm","tell":"Each follicle holds 1–2 seeds and a brown, two-winged woody separator of similar shape – the separator has no seed body and is chaff. Good seed is firm and white inside; discard seed with holes or frass (Seed Notes 8). Pale seed is normal on some plants – it isn't a sign of bad seed.","level":"species","d":{"shape":"winged","L":26.5,"W":12.5,"col":"greybrown","body":0.4},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 8 – Banksia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"]],"photos":[],"sosa":false}},{"id":"banksia-prionotes","sci":"Banksia prionotes","common":"Acorn Banksia","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"Medium","confidence_note":"Nursery germination data from 3 tests plus Banksia seed-handling guidance.","facts":[["Pre-treatment","None (heat cones to open)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","57%"],["Seed per 100 plants","3.4 g"]],"check":[21,35],"stats":{"germ_pct":57,"per_gram":29},"grow":[4.0,6.0],"storage":{"kind":"extracted","months":12,"text":"Short once extracted – keep in cone"},"calendar":["-","-","B","B","B","P","P","P","P","-","-","-"],"snapshot":[["Habit","Tree or shrub to 10 m. No lignotuber – killed by fire and regenerates only from seed."],["Flowering","Feb – Aug (cream and orange ‘acorn’ spikes)."],["Habitat","Sand, sandy loam, clay, laterite and granite; sandplains, dunes and slopes."],["Local note","Recorded in the Wanneroo LGA. Highly susceptible to <i>Phytophthora<\/i> dieback. Good cut flower."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Seed is mostly held in the cone until fire, releasing only slowly otherwise. Collect cones <b>at least 12 months old<\/b>, with closed follicles."],["Extraction & cleaning","Open follicles with heat: oven at <b>120–130°C for 1 hour<\/b> (or 200°C for 10 minutes), or pass over a burner, soak for several hours and dry in a warm oven; repeat if needed. Never microwave cones."],["Seed quality","Cut-test a sample – good seed is white and firm inside."],["Storage life","<b>Short-lived once extracted<\/b> – keep seed in the cone until the sowing season."],["Typical germination","About <b>57%<\/b> (untreated, Alcoa, 3 tests). About <b>29 seedlings per gram<\/b> – roughly 3.4 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> (about 20–25°C). Jun – Sep workable. Avoid Oct – Feb."],["Seed mix","Free-draining, pathogen-free, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed<\/b> once the seed is out of the follicle."],["Sowing depth & method","Direct sow 1–2 seeds per deep tube, just covered (about <b>3–5 mm<\/b>)."],["After sowing","Water in. Water from below if possible; watch for damping off."],["Germination time","About <b>3–5 weeks<\/b> (21–35 days reported)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Sterile mix, bottom watering, less crowding."],["Yellowing or dying in pots","Phosphorus toxicity or dieback. Very low-P feed; strict hygiene."],["Follicles won't open","Not enough heat. Repeat the heat-and-soak cycle."]],"other":"Cuttings are difficult; grafting onto <i>B. integrifolia<\/i> or <i>B. serrata<\/i> has been used for humid climates.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"l ize":"16–19 mm long; seed body 8–10 × 5–6 mm","tell":"A weevil eats some seed – discard holed seed. The brownish woody separator is chaff. Good seed is firm and white inside (Seed Notes 8).","level":"species","d":{"shape":"winged","L":17.5,"W":5.5,"col":"black","body":0.5},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 8 – Banksia (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM01995.pdf"]],"photos":[],"sosa":false}},{"id":"banksia-sessilis","sci":"Banksia sessilis","common":"Parrot Bush","family":"Proteaceae","fam":"Proteaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery test data (as <i>Dryandra sessilis<\/i>) and WA seed-handling notes available.","facts":[["Pre-treatment","None (smoke water optional)"],["Best sowing","Mar – May"],["Sowing depth","3–5 mm"],["Typical germination","42%"],["Seed per 100 plants","3.0 g"]],"check":[14,42],"stats":{"germ_pct":42,"per_gram":33},"grow":[4.0,6.0],"storage":{"kind":"unknown","months":24,"text":"Store dry & cool"},"calendar":["-","-","B","B","B","P","P","P","-","-","-","-"],"snapshot":[["Habit","Upright, prickly shrub or small tree to 6 m. Killed by fire and regrows from seed."],["Flowering","Mainly Jul – Nov (cream-yellow domes)."],["Habitat","Sandy soils over laterite or limestone."],["Local note","The Swan Coastal Plain form is var. <i>cygnorum<\/i>. Formerly <i>Dryandra sessilis<\/i>."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Not serotinous: most seed is <b>released in autumn<\/b> even without fire. Collect ripe heads in summer, before release."],["Extraction & cleaning","Put heads in a paper bag in a warm place or a low oven (<b>no hotter than 60°C<\/b>) until the follicles open; cut stubborn follicles with secateurs."],["Seed quality","Good seed is firm and white inside."],["Storage life","Seed in the soil is short-lived, but cleaned seed keeps well <b>stored dry and cool<\/b>."],["Typical germination","About <b>42%<\/b> (untreated, Alcoa nursery average). About <b>33 seedlings per gram<\/b> – roughly 3 g of seed per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> – sow once the weather cools after March. Jun – Aug workable. Avoid Sep – Feb."],["Seed mix","Free-draining, sterile, <b>low-phosphorus<\/b> mix."],["Pre-treatment","<b>None needed.<\/b> Geraldton soaks seed in smoke water (1:9) for 24 hours."],["Sowing depth & method","Direct sow 1–2 seeds per tube, just covered (about 3–5 mm)."],["After sowing","Water in; avoid excess water – damping off can be a problem."],["Germination time","About <b>2–6 weeks<\/b> (14 days at Geraldton)."],["Pricking out","If tray-sown, prick out at the cotyledon stage, within a few weeks of germination."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 4–6 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Seedlings collapse","Damping off. Water less, sterile mix, good airflow."],["Few seeds in heads","Collected too late – seed already released in autumn. Collect in summer."],["Yellowing seedlings","Phosphorus toxicity. Use very low-P fertiliser."]],"other":"Cuttings have proved virtually impossible – seed is the only practical method. Flowers within about two years.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 13 – Dryandra (now Banksia). Wildflower Society of WA / DEC (2007)","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"},{"title":"Wikipedia – Banksia sessilis (seed release, fire response, cuttings)","url":"en.wikipedia.org/wiki/Banksia_sessilis"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Cuttings have proved virtually impossible.","guide":null},{"method":"Seed","suitability":"Main method","note":"No pre-treatment; sow as it cools after March.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"Shrub.","guide":null}],"collect":{"cal":["B","B","P","-","-","-","-","-","-","-","-","B"],"basis":"guide","any":false,"note":"Seed is released in autumn – collect ripe heads in summer, before release."},"conservation":"","seedid":{"unit":"Winged seed (from the follicles)","look":"Up to two winged seeds and a woody separator in each follicle. Seed coat black when mature (Dryandra genus).","size":"Not published (follicles 10–15 mm)","tell":"Good seed is firm and white inside; check for insect damage. The woody separator is chaff.","level":"genus","d":{"shape":"winged","L":null,"W":null,"col":"black","body":0.5},"sources":[["Flora of Australia online – species and genus profiles (fruit and seed descriptions)","https://profiles.ala.org.au/opus/foa/"],["Seed Notes 13 – Dryandra (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02000.pdf"]],"photos":[],"sosa":false}},{"id":"bossiaea-eriocarpa","sci":"Bossiaea eriocarpa","common":"Common Brown Pea","family":"Fabaceae","fam":"Fabaceae","alt":"","cuttings":null,"seed":{"difficulty":"Easy-Moderate","provisional":false,"confidence":"High","confidence_note":"Nursery germination data (40 tests) and WA hard-seed guidance available.","facts":[["Pre-treatment","Boiling water 30 s"],["Best sowing","Mar – May"],["Sowing depth","2–3 mm"],["Typical germination","44%"],["Seed per 100 plants","0.4 g"]],"check":[7,14],"stats":{"germ_pct":44,"per_gram":229},"grow":[3.0,5.0],"storage":{"kind":"long","months":null,"text":"Long – many years dry"},"calendar":["-","P","B","B","B","P","P","P","B","P","-","-"],"snapshot":[["Habit","Erect or straggly, spreading shrub, 0.2–1 m."],["Flowering","Jul – Nov (yellow and brown-red pea flowers)."],["Habitat","Usually sandy soils."],["Local note","Recorded in Joondalup and Wanneroo."]],"sections":[{"title":"Seed collection & storage","rows":[["Seed collection","Pods ripen in summer and shed seed when ripe. <b>Bag developing pods<\/b> with stockings or muslin."],["Extraction & cleaning","Rub and sieve the small seed from pod fragments."],["Seed quality","Hard-seeded – fresh seed is dormant until the coat is treated. Float test to remove damaged seed."],["Storage life","<b>Long.<\/b> Keeps many years when dry (typical of hard-coated pea seed)."],["Typical germination","About <b>44%<\/b> after boiling-water treatment (Alcoa nursery average). About <b>229 seedlings per gram<\/b> – under 0.5 g per 100 seedlings."]]},{"title":"Sowing & growing on","rows":[["Best sowing time","<b>Mar – May<\/b> and <b>Sep<\/b>. Feb, Jun – Aug and Oct workable. Avoid Nov – Jan."],["Seed mix","Standard sterile native seed mix."],["Pre-treatment","<b>Boiling water for 30 seconds<\/b> (Alcoa method), or pour near-boiling water over and soak overnight. Sow swollen seed; re-treat the rest."],["Sowing depth & method","Small seed – cover about <b>2–3 mm<\/b>. Direct sow a few seeds per tube and thin."],["After sowing","Water in; keep moist, not wet."],["Germination time","Can start about <b>one week<\/b> after treatment."],["Pricking out","At the cotyledon to first true leaf stage, before the taproot lengthens."],["Shade house & hardening","About <b>2 weeks<\/b> in the shade house after pricking out, then move gradually to full sun over 2–4 weeks."],["Time to planting size","Est. 3–5 months from sowing (record your own)."]]}],"difficulty_note":"","problems":[["Low germination","Seed coat not broken. Re-treat unswollen seed."],["Swollen seed rots","Over-boiled or too wet. Keep to 30 s; water less."],["Seedlings collapse","Damping off. Sterile mix, airflow, avoid crowding."]],"other":"Very small seed for a pea – a little goes a long way.","sources":[{"title":"Cromer E.L. (2007) Seed Germination and Research Records from Alcoa's Marrinup Nursery. Alcoa World Alumina Australia","url":"library.dbca.wa.gov.au/static/FullTextFiles/924754.pdf"},{"title":"City of Greater Geraldton Community Nursery – Native Plant Propagation Guide (2019): seed treatments, smoke water, damping off","url":"cgg.wa.gov.au"},{"title":"Seed Notes 15 – Hard seed: Chorizema, Daviesia, Gastrolobium and Gompholobium. Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"},{"title":"Seed Notes 9 – Acacia (hard-seed longevity, float test). Wildflower Society of WA / DEC","url":"library.dbca.wa.gov.au/FullTextFiles/PAM01996.pdf"},{"title":"Auld T.D. (1996) Ecology of the Fabaceae: fire, ants and the soil seedbank. Cunninghamia 4(4)","url":"botanicgardens.org.au"}]},"division":null,"options":[{"method":"Cuttings","suitability":"Not used","note":"Not documented.","guide":null},{"method":"Seed","suitability":"Main method","note":"Boiling water 30 s.","guide":"seed"},{"method":"Division","suitability":"Not used","note":"","guide":null}],"collect":{"cal":["B","P","-","-","-","-","-","-","-","-","P","B"],"basis":"guide","any":false,"note":"Bag developing pods/fruit with stockings or fine mesh – they split and shed seed quickly."},"conservation":"","seedid":{"unit":"Seed (aril left on)","look":"Usually elliptic seed with a pale, persistent aril (genus).","size":"Not published (pods 12–30 mm)","tell":"Rub pods gently to free the seed, then sieve (related species). Discard seed with holes (insect damage) or that is shrivelled. In water with a drop of detergent, good seed sinks and bad seed floats (Seed Notes 15).","level":"genus","d":{"shape":"oval","L":null,"W":null,"col":"brown","aril":"cream"},"sources":[["Legume seed identification tool (idtools.org) – genus seed descriptions","https://idtools.org/fabaceae/"],["Seeds of South Australia – SA Seed Conservation Centre (seed descriptions, collection and cleaning)","https://spapps.environment.sa.gov.au/SeedsOfSA/"],["Seed Notes 15 – Chorizema, Daviesia, Gastrolobium, Gompholobium (Wildflower Society of WA / DEC 2007)","https://library.dbca.wa.gov.au/FullTextFiles/PAM02002.pdf"]],"photos":[],"sosa":false}},{"id":"calothamnus-quadrifidus","sci":"Calothamnus quadrifidus","common":"One-sided Bottlebrush","family":"Myrtaceae","fam":"Myrtaceae","alt":"","cuttings":{"difficulty":"Easy-Moderate","provisional":true,"confidence":"Low","confidence_note":"ANPSA notes the genus is ‘presumably’ grown from cuttings. Method follows related melaleucas – trial protocol.","facts":[["Wood type","Semi-hardwood"],["Best months","Jan – Apr"],["Cutting length","75–100 mm"],["Hormone (IBA)","3 g/L IBA"]],"length_mm":[75.0,100.0],"check":[42,63],"calendar":["B","B","B","B","P","-","-","-","-","-","-","P"],"snapshot":[["Habit","Erect, compact or spreading shrub, usually 0.9–2 m."],["Flowering","Jun – Dec (red, one-sided brushes)."],["Habitat","Wide variety of soils and habitats."],["Local note","Recorded in the Wanneroo LGA. Several subspecies exist – label stock by subspecies and provenance."]],"sections":[{"title":"Propagation method","rows":[["Best time to take cuttings","<b>Jan – Apr<\/b>, after flowering, once the new growth has firmed. Dec and May are workable. Avoid Jun – Nov (flowering)."],["Wood type","<b>Semi-hardwood<\/b> – firm current season's growth."],["Cutting size","75–100 mm, as for <i>Melaleuca<\/i>."],["Selecting material","Non-flowering side shoots. Keep subspecies and forms separate."],["Pre-treatment","• Strip the needle-like leaves from the lower half to two-thirds.<br/>• Light wound on firmer stems.<br/>• Dip the base in rooting hormone."],["Rooting hormone","Semi-hardwood strength, 3 g/L IBA (<b>Clonex Purple<\/b>)."],["Propagation mix","Standard free-draining cutting mix."],["Environment","Humid frame, bright shade, bottom heat."],["Expected strike time","Not documented – check from about 6 weeks and record the result."],["Post-treatment / aftercare","• Standard hardening off.<br/>• Pot on into a free-draining native mix."]]}],"difficulty_note":"<b>Easy–Moderate (provisional).<\/b> Expected to behave like related melaleucas, but untested here. Seed is easy and is the main method.","problems":[["Cuttings brown off","Too dry or too soft. Use firmer material and keep humidity up until rooted."],["Callus, no roots","Trim and re-set; try a lower hormone strength."],["Slow in winter","Use bottom heat, or wait for the Jan – Apr window."]],"other":"","sources":[{"title":"Australian Native Plants Society (ANPSA) – Plant Propagation: cuttings, hormones, mixes, hardening off","url":"anpsa.org.au/plant-propagation/"},{"title":"FloraBase, WA Herbarium (DBCA) – species profiles for every species in this guide (e.g. 2463, 2798, 5117, 5162, 7603, 11341, 12585, 12824, 13152, 16449, 42281, 3961, 4256, 5105, 6839, 1982, 5825, 8839, 5237, 6949, 7289, 5011, 5171, 5268, 7626, 49637, 6427, 5887, 49808; others as cited in the Seed Sowing Guide)","url":"florabase.dbca.wa.gov.au"},{"title":"Growth Technology – Clonex rooting gel strengths (Green 1.5, Purple 3, Red 8 g/L IBA)","url":"growthtechnology.com.au"},{"title":"ANPSA – Melaleuca genus page (75–100 mm cuttings, strip, wound, hormone)","url":"anpsa.org.au/genera/melaleuca/"}]},"seed":{"difficulty":"Easy","provisional":false,"confidence":"High","confidence_note":"Large nursery data set (39 tests) and WA community-nursery method available.","facts":[["Pre-treatment","None"],["Best sowing","Mar – Apr, Sep – Oct"],["Sowing depth","Surface"],["Typical germination","26%"],["Seed per 100 plants","0.2 g"]],"check":[7,14],"stats":{"germ_pct":26,"per_gram":572},"grow":[4.0,6.0],"storage":{"kind":"long","months":null,"text":"Long – dry & cool"},"calendar":["-","P","B","B",
